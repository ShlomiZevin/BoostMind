<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<!-- The link preview of shlomiverse.com/dr-naomi/ (1200x630). Shot by scripts/releases/naomi/logo/shoot.mjs, then
     compressed to public/dr-naomi/img/og.jpg (< 300 KB; img/ is git-ignored - her face). -->
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Heebo:wght@400;500;700;800&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#FBF4EE;font-family:Heebo,sans-serif;position:relative}
.blob{position:absolute;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle,#F1D9D0,rgba(241,217,208,0) 66%);top:-180px;right:-160px}
.band{position:absolute;bottom:0;left:0;right:0;height:16px;background:linear-gradient(90deg,#4A0B18,#6B1023,#84182F)}
.pic{position:absolute;top:58px;right:70px;width:380px;height:500px}
.pic .f{position:absolute;inset:0;border-radius:200px 200px 28px 28px;overflow:hidden;background:#d9d6d3;box-shadow:0 18px 40px rgba(74,11,24,.18)}
.pic .f img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.pic::before{content:"";position:absolute;inset:-14px -14px 14px 14px;border:2px solid #B8862F;border-radius:200px 200px 28px 28px}
.seal{position:absolute;bottom:-18px;left:-22px;width:104px;height:104px;border-radius:50%;background:#fff;box-shadow:0 10px 26px rgba(74,11,24,.16);display:grid;place-items:center}
.seal img{width:66px}
.txt{position:absolute;top:62px;right:520px;left:60px}
.logo{height:78px}
.name{font-family:'Suez One',serif;color:#6B1023;font-size:44px;line-height:1.15;margin-top:30px}
.role{font-size:21px;color:#6F5A5D;margin-top:10px;line-height:1.4}
.tag{font-family:'Suez One',serif;color:#2A1A1C;font-size:54px;line-height:1.1;margin-top:26px}
.tag em{font-style:normal;color:#6B1023}
.line{font-size:22px;color:#2A1A1C;margin-top:16px;line-height:1.45}
.cta{position:absolute;bottom:52px;right:520px;display:flex;align-items:center;gap:16px}
.cta b{background:#6B1023;color:#fff;font-weight:700;font-size:22px;border-radius:99px;padding:12px 26px}
.cta span{font-size:19px;color:#6F5A5D;direction:ltr}
</style></head><body>
<div class="blob"></div>
<div class="pic"><div class="f"><img src="../../../../public/dr-naomi/img/naomi.jpg"></div><div class="seal"><img src="../../../../public/dr-naomi/brand/mark.svg"></div></div>
<div class="txt">
  <img class="logo" src="../../../../public/dr-naomi/brand/logo.svg">
  <div class="name">ד״ר נעמי־ציפורה<br>בן־נון־פרידמן־שטרנבך</div>
  <div class="role">פסיכיאטרית, פסיכותרפיסטית אינטגרטיבית ודולה מוסמכת של רגשות</div>
  <div class="tag">לכל רגש יש <em>תאריך לידה</em></div>
  <div class="line">לפעמים המחוג לא זז כי הרגש עדיין מחכה שיילדו אותו.</div>
</div>
<div class="cta"><b>לקביעת מפגש רגשי ראשון</b><span>shlomiverse.com/dr-naomi</span></div>
<div class="band"></div>
</body></html>
