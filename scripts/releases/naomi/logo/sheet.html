<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<!-- The logo options sheet (A/B/C) - shot by shoot.mjs to scripts/releases/naomi/private/logo-options.jpg (2400x1500). -->
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=block" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1600px;height:780px;background:#efe7df;font-family:Heebo,sans-serif;color:#2a1a1c}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding:28px}
  .col{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 6px 24px rgba(60,20,25,.08);display:flex;flex-direction:column}
  .head{display:flex;align-items:center;gap:16px;padding:18px 22px 6px}
  .L{font:800 92px/1 Heebo;color:#6B1023;width:84px;text-align:center}
  .head b{font-size:28px}.head small{display:block;font-size:17px;color:#7a6266;font-weight:400;margin-top:2px}
  .light{height:250px;display:grid;place-items:center;padding:20px 26px;background:#fbf6f1}
  .light img{max-width:100%;max-height:150px}
  .dark{height:170px;display:grid;place-items:center;padding:20px 30px;background:#6B1023}
  .dark img{max-width:100%;max-height:105px}
  .row{display:flex;align-items:center;justify-content:space-around;padding:18px 16px 22px;gap:10px}
  .row img{display:block}
  .chip{width:72px;height:72px;border-radius:18px;background:#6B1023;display:grid;place-items:center}
  .chip img{width:46px}
  .note{font-size:15px;color:#7a6266;padding:0 22px 18px;line-height:1.45}
  .pick{outline:4px solid #B8862F;outline-offset:-4px}
  .pick .head b::after{content:"  ·  הבחירה";color:#B8862F}
</style></head><body>
<div class="grid">
  <div class="col" id="A">
    <div class="head"><div class="L">A</div><div><b>הקו הנקי</b><small>לב בקו מעוגל, 5 שנתות = 5 שלבי השיטה, מחוג אדום</small></div></div>
    <div class="light"><img src="out/A-logo.svg"></div>
    <div class="dark"><img src="out/A-logo-white.svg"></div>
    <div class="row"><img src="out/A-mark.svg" width="96"><img src="out/A-mark.svg" width="48"><img src="out/A-mark.svg" width="24"><div class="chip"><img src="out/A-mark-white.svg"></div></div>
    <div class="note">Suez One (כמו על הספר) + Heebo</div>
  </div>
  <div class="col" id="B">
    <div class="head"><div class="L">B</div><div><b>החותם</b><small>לב בורדו מלא, חוגה בתוכו, מחוג אדום כמו בכריכה</small></div></div>
    <div class="light"><img src="out/B-logo.svg"></div>
    <div class="dark"><img src="out/B-logo-white.svg"></div>
    <div class="row"><img src="out/B-mark.svg" width="96"><img src="out/B-mark.svg" width="48"><img src="out/B-mark.svg" width="24"><div class="chip"><img src="out/B-mark-white.svg"></div></div>
    <div class="note">Suez One (כמו על הספר) + Heebo</div>
  </div>
  <div class="col" id="C">
    <div class="head"><div class="L">C</div><div><b>המד</b><small>לב בקו דק, חצי חוגה בזהב, מחוג בורדו</small></div></div>
    <div class="light"><img src="out/C-logo.svg"></div>
    <div class="dark"><img src="out/C-logo-white.svg"></div>
    <div class="row"><img src="out/C-mark.svg" width="96"><img src="out/C-mark.svg" width="48"><img src="out/C-mark.svg" width="24"><div class="chip"><img src="out/C-mark-white.svg"></div></div>
    <div class="note">Frank Ruhl Libre (סריף ספרותי)</div>
  </div>
</div>
<script>const p = new URLSearchParams(location.search).get('pick'); if (p) document.getElementById(p).classList.add('pick');</script>
</body></html>
