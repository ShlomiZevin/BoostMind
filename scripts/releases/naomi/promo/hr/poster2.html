<!doctype html><html><head><meta charset="utf-8"><style>
/* Naomi - HR release-day story + video cover, round 2 (2026-11-24). The method: GPT Image designed it free from the
   content alone (free/free-story.jpg, free/free-cover.jpg), rebuilt here in the end poster's look (endcard-9) with every
   word in code and HER REAL FRAME from the new video (cut/naomi-163.png, t=163.5 s, untouched).
   Variant by the hash: #story-A|B|C, #cover-A|B|C; "-verse" = without the link-sticker box. */
@font-face{font-family:A;src:url(../../../../../zoomcut/fonts/Assistant.ttf)}
:root{--bur:#7a1630;--bur2:#9b2340;--rose:#c0566b;--coral:#e0705e;--peach:#f8d9cc;--cream:#fdf3ee}
html,body{margin:0;width:1080px;height:1920px;overflow:clip;font-family:A;background:var(--cream)}
body{contain:paint;position:relative}
.bg{position:absolute;inset:0;background:linear-gradient(170deg,#fff8f4 0%,#fbeae2 55%,#f6dcd2 100%)}
.wave{position:absolute;border-radius:50%}
.w1{width:900px;height:520px;top:-300px;left:-420px;background:rgba(224,112,94,.16)}
.w2{width:1400px;height:600px;bottom:-400px;left:-200px;background:rgba(155,35,64,.18)}
.w3{width:1300px;height:520px;bottom:-420px;right:-500px;background:rgba(224,112,94,.22)}
.rtl{direction:rtl}
.abs{position:absolute}
.logo{position:absolute;left:50%;transform:translateX(-50%);height:104px}
.to{position:absolute;left:60px;right:60px;height:150px;border-radius:75px;background:linear-gradient(90deg,var(--bur2),var(--bur));box-shadow:0 14px 34px rgba(122,22,48,.3);display:flex;align-items:center;padding:0 46px 0 30px;gap:26px}
.to .t{flex:1;text-align:center;color:#fff;direction:rtl}
.to .t b{display:block;font-weight:800;font-size:60px;line-height:1.05}
.to .t small{display:flex;align-items:center;justify-content:center;gap:16px;font-weight:600;font-size:28px;color:rgba(255,255,255,.85);margin-top:8px;direction:ltr;letter-spacing:.5px}
.to .t small:before,.to .t small:after{content:"";width:60px;height:2px;background:rgba(255,255,255,.5)}
.to .ic{flex:none;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center}
.to .ic svg{width:60px;height:60px;fill:#fff}
/* her real frame: flush left (the frame's own left edge is cut), faded out at the bottom and toward the text */
.her{position:absolute;left:-40px;filter:drop-shadow(0 18px 30px rgba(122,22,48,.16));
  -webkit-mask-image:linear-gradient(180deg,#000 62%,transparent 88%),linear-gradient(270deg,transparent 0%,#000 22%);
  -webkit-mask-composite:source-in;mask-composite:intersect}
.col{position:absolute;right:56px;text-align:right;direction:rtl}
.hook div{font-weight:800;color:var(--bur);line-height:1.04}
.hook .z{color:var(--coral)}
.hl{display:inline;background:linear-gradient(transparent 55%,rgba(248,190,170,.65) 55%);padding:0 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.brush{display:block;margin:14px 0 0 auto;height:22px}
.tag{display:inline-flex;align-items:center;gap:18px;border-radius:40px;background:linear-gradient(90deg,var(--bur2),var(--bur));color:#fff;padding:18px 34px 20px;box-shadow:0 12px 28px rgba(122,22,48,.28);transform:rotate(-2deg)}
.tag b{font-weight:800;font-size:54px;line-height:1}
.tag svg{width:54px;height:54px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
.name b{display:block;font-weight:800;font-size:46px;line-height:1.18;color:var(--bur)}
.name small{display:flex;align-items:center;justify-content:flex-start;gap:14px;font-weight:600;font-size:32px;color:#6b4a50;margin-top:10px}
.name small:after{content:"";width:70px;height:2px;background:var(--rose)}
.card{background:rgba(255,255,255,.88);border-radius:34px;padding:26px 34px;box-shadow:0 12px 30px rgba(122,22,48,.14)}
.link{position:absolute;left:50%;transform:translateX(-50%);width:680px;height:140px;border:5px dashed rgba(122,22,48,.45);border-radius:70px;background:rgba(255,255,255,.55)}
.verse .link,.verse .lk{display:none}
.spark{position:absolute;width:70px;height:70px}
.spark path{stroke:var(--coral);stroke-width:5;stroke-linecap:round;fill:none}
.stripe{display:inline-block;padding:6px 30px 12px;font-weight:800;line-height:1.05}
.s1{background:var(--peach);color:var(--bur);transform:rotate(-2deg)}
.s2{background:linear-gradient(90deg,var(--bur2),var(--bur));color:#fff;transform:rotate(-2deg);box-shadow:0 12px 28px rgba(122,22,48,.28)}
.wavebar{display:flex;align-items:center;gap:8px;justify-content:center}
.wavebar svg{display:block;width:64px;height:64px;fill:none;stroke:var(--bur);stroke-width:2;stroke-linecap:round}
.wavebar i{display:block;width:6px;border-radius:3px;background:var(--rose);opacity:.7}
section{display:none}
</style></head><body>
<div class="bg"></div><div class="wave w1"></div><div class="wave w2"></div><div class="wave w3"></div>

<template id="people"><svg viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="3.4"/><path d="M5.5 20c.6-4 3.2-6.4 6.5-6.4s5.9 2.4 6.5 6.4z"/><circle cx="5" cy="9" r="2.4"/><path d="M.8 18.5c.4-2.8 2-4.4 4.2-4.6-.9 1.3-1.5 2.8-1.8 4.6z"/><circle cx="19" cy="9" r="2.4"/><path d="M23.2 18.5c-.4-2.8-2-4.4-4.2-4.6.9 1.3 1.5 2.8 1.8 4.6z"/></svg></template>
<template id="mic"><svg viewBox="0 0 24 24"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 10.5a6.5 6.5 0 0 0 13 0M12 17v4.5M8.5 21.5h7"/></svg></template>

<!-- STORY A + B: the free story concept - HR pill, her frame left, the hook right, "the full interview" tag, the sticker spot -->
<section id="story-A" class="story-col" data-hook="z"></section>
<section id="story-B" class="story-col" data-hook="ob"></section>
<!-- STORY C: the free cover concept's composition (the hook as big stripes across the top, her frame big below) + the sticker spot -->
<section id="story-C" class="story-stripes" data-hook="z"></section>
<!-- COVER A + B: the free cover concept - HR pill, the hook as two stripes, her frame big, the name card -->
<section id="cover-A" class="cover-stripes" data-hook="ob"></section>
<section id="cover-B" class="cover-stripes" data-hook="z"></section>
<!-- COVER C: the story concept's column layout, without the sticker spot -->
<section id="cover-C" class="cover-col" data-hook="ob"></section>

<script>
const LOGO = '../../../../../zoomcut/episodes/_assets/naomi/logo/logo.png', HER = 'cut/naomi-163.png';
const svg = (id) => document.getElementById(id).innerHTML;
const pill = (top) => `<div class="to" style="top:${top}px"><div class="t"><b>למנהלות ולמנהלי משאבי אנוש</b><small>HR · VP HR · VP People</small></div><div class="ic">${svg('people')}</div></div>`;
const NAME = `<b>ד״ר נעמי־ציפורה<br>בן־נון־פרידמן־שטרנבך</b><small>דולה מוסמכת של רגשות</small>`;
const brush = (w) => `<svg class="brush" style="width:${w}px" viewBox="0 0 360 22" preserveAspectRatio="none"><path d="M4 14 C 90 4, 220 2, 356 9 C 260 12, 140 16, 30 20 Z" fill="#e0705e" opacity=".85"/></svg>`;
const spark = (st, flip) => `<svg class="spark" style="${st}${flip ? ';transform:scaleX(-1)' : ''}" viewBox="0 0 70 70"><path d="M10 40 L28 46 M18 18 L32 34 M42 8 L42 28"/></svg>`;
const wavebar = () => `<div class="wavebar">${[14,26,40,22,48,30,16].map((h) => `<i style="height:${h}px"></i>`).join('')}<div style="margin:0 10px">${svg('mic')}</div>${[16,30,48,22,40,26,14].map((h) => `<i style="height:${h}px"></i>`).join('')}</div>`;
// the hooks, word by word, as lines (column = 4 short lines; stripes = 2 lines)
const COL = { z: [`דור ה־<span class="z">Z</span>`, 'עוזב לכם', 'אחרי שלושה', 'שבועות?'], ob: ['אונבורדינג יש.', 'בונדינג אין.'] };
const STR = { z: [`דור ה־<span class="z" style="color:var(--coral)">Z</span> עוזב לכם`, 'אחרי שלושה שבועות?'], ob: ['אונבורדינג יש.', 'בונדינג אין.'] };
const hookCol = (k, top, size) => `<div class="col hook" style="top:${top}px;width:540px">${COL[k].map((l) => `<div style="font-size:${size}px"><span class="hl">${l}</span></div>`).join('')}${brush(360)}</div>`;
const hookStr = (k, top, size) => `<div class="abs rtl" style="top:${top}px;right:50px;left:50px;text-align:right">
  <div><span class="stripe s1" style="font-size:${size}px">${STR[k][0]}</span></div>
  <div style="margin-top:14px"><span class="stripe s2" style="font-size:${size}px">${STR[k][1]}</span></div></div>`;
const LINK = (top) => `<div class="link" style="top:${top}px"></div><svg class="spark lk" style="top:${top + 34}px;left:118px;transform:rotate(-90deg)" viewBox="0 0 70 70"><path d="M10 40 L28 46 M18 18 L32 34 M42 8 L42 28"/></svg><svg class="spark lk" style="top:${top + 34}px;right:118px;transform:rotate(90deg) scaleY(-1)" viewBox="0 0 70 70"><path d="M10 40 L28 46 M18 18 L32 34 M42 8 L42 28"/></svg>`;

const B = {
  'story-col': (k) => `<img class="logo" src="${LOGO}" style="top:262px">${pill(392)}
    <img class="her" src="${HER}" style="top:560px;width:700px;-webkit-mask-image:linear-gradient(180deg,#000 46%,transparent 68%),linear-gradient(270deg,transparent 0%,#000 22%)">
    ${hookCol(k, k === 'z' ? 600 : 640, k === 'z' ? 88 : 78)}
    <div class="col" style="top:${k === 'z' ? 1050 : 900}px"><span class="tag"><b>הראיון המלא – עכשיו</b>${svg('mic')}</span></div>
    <div class="col name" style="top:${k === 'z' ? 1170 : 1030}px">${NAME}</div>
    ${spark('top:575px;right:600px')}
    ${LINK(1415)}`,
  'story-stripes': (k) => `<img class="logo" src="${LOGO}" style="top:262px">${pill(392)}
    ${hookStr(k, 580, 84)}
    <img class="her" src="${HER}" style="top:690px;width:620px;-webkit-mask-image:linear-gradient(180deg,#000 50%,transparent 66%),linear-gradient(270deg,transparent 0%,#000 22%)">
    <div class="col" style="top:850px"><span class="tag"><b>הראיון המלא – עכשיו</b>${svg('mic')}</span></div>
    <div class="col name card" style="top:1000px;padding:22px 30px">${NAME}</div>
    ${LINK(1415)}`,
  'cover-stripes': (k) => `<img class="logo" src="${LOGO}" style="top:250px">${pill(380)}
    ${spark('top:330px;left:40px;transform:rotate(-20deg)')}
    <img class="her" src="${HER}" style="top:640px;width:900px;-webkit-mask-image:linear-gradient(180deg,#000 70%,transparent 96%)">
    ${hookStr(k, 600, k === 'z' ? 80 : 104)}
    <div class="abs" style="top:1180px;right:60px">${wavebar()}</div>
    <div class="col name card" style="top:1290px">${NAME}</div>`,
  'cover-col': (k) => `<img class="logo" src="${LOGO}" style="top:250px">${pill(380)}
    <img class="her" src="${HER}" style="top:560px;width:760px">
    ${hookCol(k, 640, 80)}
    <div class="abs" style="top:1130px;right:90px">${wavebar()}</div>
    <div class="col name" style="top:1260px">${NAME}</div>
    ${spark('top:575px;right:610px')}`,
};
const id = location.hash.slice(1) || 'story-A', kind = id.replace(/-verse$/, '');
const sec = document.getElementById(kind);
sec.innerHTML = B[sec.className](sec.dataset.hook);
sec.style.display = 'block';
if (id.endsWith('-verse')) document.body.classList.add('verse');
</script>
</body></html>
