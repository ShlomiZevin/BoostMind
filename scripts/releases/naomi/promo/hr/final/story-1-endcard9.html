<!doctype html><html dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:A;src:url(../../../fonts/Assistant.ttf)}
:root{--bur:#7a1630;--bur2:#9b2340;--rose:#c0566b;--coral:#e0705e;--peach:#f8d9cc;--cream:#fdf3ee}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;font-family:A;background:var(--cream)}
.bg{position:absolute;inset:0;background:linear-gradient(170deg,#fff8f4 0%,#fbeae2 55%,#f6dcd2 100%)}
.wave{position:absolute;border-radius:50%}
.w1{width:900px;height:520px;top:-300px;left:-420px;background:rgba(224,112,94,.16)}
.w2{width:1400px;height:600px;bottom:-380px;left:-200px;background:rgba(155,35,64,.18)}
.w3{width:1300px;height:520px;bottom:-400px;right:-500px;background:rgba(224,112,94,.22)}
.logo{position:absolute;top:150px;left:50%;transform:translateX(-50%);height:118px}
.to{position:absolute;top:300px;left:60px;right:60px;height:150px;border-radius:75px;background:linear-gradient(90deg,var(--bur2),var(--bur));box-shadow:0 14px 34px rgba(122,22,48,.3);display:flex;align-items:center;padding:0 46px 0 30px;gap:26px}
.to .t{flex:1;text-align:center;color:#fff}
.to .t b{display:block;font-weight:800;font-size:60px;line-height:1.05}
.to .t small{display:flex;align-items:center;justify-content:center;gap:16px;font-weight:600;font-size:28px;color:rgba(255,255,255,.85);margin-top:8px;direction:ltr;letter-spacing:.5px}
.to .t small:before,.to .t small:after{content:"";width:60px;height:2px;background:rgba(255,255,255,.5)}
.to .ic{flex:none;order:2;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center}
.to .ic svg{width:60px;height:60px;fill:#fff}
.photo{position:absolute;left:-90px;top:560px;width:760px;height:auto;filter:drop-shadow(0 18px 30px rgba(122,22,48,.18))}
.col{position:absolute;right:60px;width:520px;text-align:right}
.h{top:560px}
.h div{font-weight:800;font-size:92px;line-height:1.04;color:var(--bur)}
.h .z{color:var(--coral)}
.h .hl{display:inline;background:linear-gradient(transparent 55%,rgba(248,190,170,.6) 55%);padding:0 6px}
.brush{display:block;margin:14px 0 0 auto;width:360px;height:22px}
.offer{position:absolute;top:1010px;right:40px;width:640px}
.tag{border-radius:40px 40px 40px 40px;background:linear-gradient(90deg,var(--bur2),var(--bur));color:#fff;padding:22px 36px 24px;box-shadow:0 12px 28px rgba(122,22,48,.28);text-align:right;transform:rotate(-2deg)}
.tag b{font-weight:800;font-size:66px;line-height:1}
.sub{margin:-8px 40px 0 30px;background:var(--peach);border-radius:30px;padding:16px 26px;text-align:center;font-weight:700;font-size:36px;color:var(--bur);transform:rotate(-2deg);box-shadow:0 6px 14px rgba(122,22,48,.12)}
.name{top:1300px}
.name b{display:block;font-weight:800;font-size:46px;line-height:1.18;color:var(--bur)}
.name small{display:flex;align-items:center;justify-content:flex-end;gap:14px;font-weight:600;font-size:32px;color:#6b4a50;margin-top:10px}
.name small:before{content:"";width:70px;height:2px;background:var(--rose)}
.cta{position:absolute;top:1495px;left:70px;right:70px;height:130px;border-radius:65px;background:linear-gradient(90deg,var(--rose),var(--bur));box-shadow:0 16px 34px rgba(122,22,48,.32);display:flex;align-items:center;justify-content:center;gap:24px;color:#fff}
.cta b{font-weight:800;font-size:62px}
.cta svg{width:66px;height:66px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.url{position:absolute;top:1648px;left:50%;transform:translateX(-50%);background:#fff;border-radius:40px;padding:12px 44px;direction:ltr;font-weight:700;font-size:46px;color:var(--bur);box-shadow:0 8px 20px rgba(122,22,48,.15);white-space:nowrap}
.spark{position:absolute;width:70px;height:70px}
.spark path{stroke:var(--coral);stroke-width:5;stroke-linecap:round;fill:none}
</style></head><body><div class="bg"></div><div class="wave w1"></div><div class="wave w2"></div><div class="wave w3"></div>
