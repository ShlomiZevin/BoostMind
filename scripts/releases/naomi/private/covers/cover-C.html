<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<!-- Cover C - type-led, one emblem. 800x1200 CSS px; render.mjs shoots it at any scale (x2 = 1600x2400). -->
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@400;500;700&display=block" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:800px;height:1200px;overflow:hidden;background:#a9d2d0}
  .cover{position:relative;width:800px;height:1200px;background:url(art-C.jpg) center bottom/cover no-repeat}
  .kicker{position:absolute;top:62px;right:0;left:0;text-align:center;font:500 26px/1 'Rubik',sans-serif;color:#1f4a52;letter-spacing:1px}
  .title{position:absolute;top:118px;right:56px;left:56px;text-align:right;font:400 196px/0.9 'Secular One',sans-serif;color:#5e0f22}
  .sub{position:absolute;top:500px;right:60px;font:500 38px/1.2 'Rubik',sans-serif;color:#1f3d44}
  .sub::before{content:"";display:block;width:84px;height:5px;background:#5e0f22;margin-bottom:18px}
  .bottom{position:absolute;bottom:54px;right:0;left:0;text-align:center}
  .author{font:700 37px/1.15 'Rubik',sans-serif;color:#5e0f22}
  .seal{position:absolute;left:72px;top:318px;width:136px;height:136px;border-radius:50%;border:3px solid #5e0f22;color:#5e0f22;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transform:rotate(10deg);background:rgba(255,255,255,.35)}
  .seal b{font:400 30px/1 'Secular One',sans-serif}
  .seal span{font:500 17px/1.15 'Rubik',sans-serif;margin-top:6px}
</style></head><body>
<div class="cover">
  <div class="kicker">לכל רגש יש תאריך לידה</div>
  <div class="title">המחוג<br>שבלב</div>
  <div class="seal"><b>רב־מכר</b><span>מהדורה<br>שלישית</span></div>
  <div class="sub">איך לכוון את<br>המחוג הפנימי</div>
  <div class="bottom">
    <div class="author">ד״ר נעמי־ציפורה בן־נון־פרידמן־שטרנבך</div>
  </div>
</div>
</body></html>
