<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<!-- Cover B - the heart with the inner needle. 800x1200 CSS px; render.mjs shoots it at any scale (x2 = 1600x2400). -->
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Heebo:wght@400;500;700;800&display=block" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:800px;height:1200px;overflow:hidden;background:#f6e3cf}
  .cover{position:relative;width:800px;height:1200px;background:url(art-B.jpg) center/cover no-repeat}
  .ribbon{position:absolute;top:0;right:64px;width:132px;padding:26px 0 34px;background:#7a1428;color:#fff;text-align:center;
    clip-path:polygon(0 0,100% 0,100% 100%,50% 86%,0 100%);box-shadow:0 4px 14px rgba(80,10,25,.3)}
  .ribbon b{display:block;font:800 30px/1 'Heebo',sans-serif}
  .ribbon span{display:block;margin-top:8px;font:500 17px/1.2 'Heebo',sans-serif}
  .top{position:absolute;top:150px;right:0;left:0;text-align:center}
  .title{font:400 138px/1 'Suez One',serif;color:#6b1023;text-shadow:0 2px 0 rgba(255,255,255,.35)}
  .rule{width:120px;height:3px;background:#b8862f;margin:22px auto 20px}
  .sub{font:500 40px/1.2 'Heebo',sans-serif;color:#4a0c18}
  .bottom{position:absolute;bottom:52px;right:0;left:0;text-align:center}
  .author{font:700 38px/1.15 'Heebo',sans-serif;color:#4a0c18}
  .author small{display:block;font:400 21px/1.3 'Heebo',sans-serif;color:#6b3b2a;margin-top:8px}
</style></head><body>
<div class="cover">
  <div class="ribbon"><b>רב־מכר</b><span>הרגשי<br>של השנה</span></div>
  <div class="top">
    <div class="title">המחוג שבלב</div>
    <div class="rule"></div>
    <div class="sub">איך לכוון את המחוג הפנימי</div>
  </div>
  <div class="bottom">
    <div class="author">ד״ר נעמי־ציפורה בן־נון־פרידמן־שטרנבך<small>מפתחת שיטת המחוג הפנימי</small></div>
  </div>
</div>
</body></html>
