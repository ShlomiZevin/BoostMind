<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:Rubik,sans-serif;background:#0b1220;position:relative}
/* the poster (title, Yotam, his line, the short line) is painted by GPT image; only the link box + Shlomiverse are ours */
.art{position:absolute;left:0;top:0;width:1080px;height:1924px}
/* the link sticker's place: its centre ~25% from the bottom, where the story's viewer still sees it */
.link{position:absolute;top:1432px;left:50%;transform:translateX(-50%);width:600px;height:104px;border:4px dashed #ffffffaa;border-radius:28px}
.brand{position:absolute;top:1598px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:10px}
.kick{color:#e2e8f0;font-size:34px;font-weight:700}
.row{display:flex;align-items:center;gap:16px}
.row img{width:100px;height:auto;filter:drop-shadow(0 0 14px #ff6a1f66)}
.t{display:flex;flex-direction:column;align-items:flex-start;line-height:1}
.wm{font-weight:900;color:#fff;letter-spacing:-.02em;font-size:50px}.wm b{color:#ff6a1f;font-weight:900}
.t small{color:#e2e8f0;font-size:25px;font-weight:700;margin-top:7px;direction:ltr;letter-spacing:.5px}
</style></head><body>
<img class="art" src="poster-b.jpg">
<div class="link"></div>
<div class="brand"><div class="kick">משחק חדש ב-</div><div class="row"><img src="logo.png" alt=""><div class="t"><span class="wm">שלומי<b>וורס</b></span><small>shlomiverse.com</small></div></div></div>
</body></html>
