<!doctype html><html dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#1b2a4a;font-family:Rubik}
.pic{position:absolute;left:0;top:260px;width:1080px;height:1620px;background:url(story-a.png) center/cover}
.fadeT{position:absolute;left:0;top:0;width:1080px;height:520px;background:linear-gradient(#1b2a4a 0,#1b2a4a 260px,rgba(27,42,74,0) 520px)}
.fadeB{position:absolute;left:0;bottom:0;width:1080px;height:520px;background:linear-gradient(rgba(27,42,74,0),rgba(27,42,74,.92) 70%)}
.title{position:absolute;left:50%;top:150px;width:700px;transform:translateX(-50%);filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
.bub{position:absolute;left:34px;top:560px;background:#fff;color:#1b2a4a;font-weight:900;font-size:50px;line-height:1.12;padding:22px 30px;border-radius:40px;text-align:center;box-shadow:0 8px 0 rgba(10,16,34,.35)}
.bub:after{content:"";position:absolute;right:-26px;top:46px;border:22px solid transparent;border-left:34px solid #fff;border-right:0}
.card{position:absolute;left:70px;right:70px;top:1450px;background:#1b2a4a;border:6px solid #fff;border-radius:44px;color:#ffd23f;font-weight:900;font-size:64px;line-height:1.15;text-align:center;padding:26px 20px;box-shadow:0 10px 0 rgba(10,16,34,.45)}
.cta{position:absolute;left:50%;top:1660px;transform:translateX(-50%);background:#ff8fb1;color:#fff;font-weight:900;font-size:46px;padding:16px 46px;border-radius:999px;white-space:nowrap;box-shadow:0 8px 0 #d9467a}
</style></head><body>
<div class="pic"></div><div class="fadeT"></div><div class="fadeB"></div>
<img class="title" src="title.webp">
<div class="bub">אני מגייסת<br>על ספרינט.</div>
<div class="card">הביאו הכול לפני<br>שהמועמד נעלם</div>
<div class="cta">משחק חדש בשלומיוורס</div>
</body></html>
