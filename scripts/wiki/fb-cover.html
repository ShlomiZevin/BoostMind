<!DOCTYPE html>
<!-- Facebook cover, 1640x624: render with `node scripts/wiki/fb-cover.mjs` (real portraits from public/wiki/img/c).
     Facebook crops the sides on phones and puts the profile photo over a bottom corner - the words stay in the middle. -->
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1640px; height: 624px; overflow: hidden; background: #0b0b0e; font-family: 'Heebo', sans-serif; position: relative; }
  .light { position: absolute; left: 50%; top: -260px; width: 1100px; height: 700px; margin-left: -550px; border-radius: 50%; background: #1a1a22; filter: blur(80px); }
  .fan { position: absolute; left: 0; right: 0; top: 34px; height: 400px; }
  .card { position: absolute; top: 0; left: 50%; width: 196px; height: 262px; margin-left: -98px; border-radius: 16px; overflow: hidden; border: 2px solid rgba(255,255,255,.18); background: #1d1d23; box-shadow: 0 18px 40px rgba(0,0,0,.55); transform-origin: 50% 160%; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .words { position: absolute; left: 0; right: 0; bottom: 58px; text-align: center; }
  .words h1 { font-size: 146px; font-weight: 900; letter-spacing: -.045em; line-height: .9; color: #fff; text-shadow: 0 8px 40px rgba(0,0,0,.8); }
  .words h1 b { color: #ff5b3a; font-weight: 900; }
  .words p { margin-top: 14px; font-size: 30px; font-weight: 700; color: #d6d3dc; display: inline-flex; align-items: center; gap: 18px; }
  .words p::before, .words p::after { content: ''; width: 46px; height: 3px; border-radius: 3px; background: #ff5b3a; }
</style>
</head>
<body>
<div class="light"></div>
<div class="fan" id="fan"></div>
<div class="words"><h1>שלומי<b>וורס</b></h1><p>מערכונים קומיים קצרים</p></div>
<script>
  const ids = ['osnat', 'daniel', 'genz', 'yotam', 'news-anchor', 'ayelet', 'demokratovich', 'nahor', 'gym-guy', 'yuval', 'vova'];
  const n = ids.length, mid = (n - 1) / 2;
  document.getElementById('fan').innerHTML = ids.map((id, i) => {
    const k = i - mid;
    return `<div class="card" style="transform: translateX(${k * 138}px) translateY(${Math.abs(k) * Math.abs(k) * 6}px) rotate(${k * 4.2}deg); z-index:${20 - Math.abs(Math.round(k))}"><img src="../../public/wiki/img/c/${id}.jpg"></div>`;
  }).join('');
</script>
</body>
</html>
