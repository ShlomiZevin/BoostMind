<!doctype html><html dir="rtl" lang="he"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{background:#222;font-family:Heebo,sans-serif;color:#f4efe9}
.ph{width:390px;height:844px;background:#0b0b0e;position:relative;overflow:hidden;display:inline-block;vertical-align:top;margin:0}
.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #222}
.brand{font-weight:900;font-size:20px}.brand i{font-style:normal;color:#fc7211}
.chip{font-size:12px;border:1px solid #fc7211;color:#fc7211;border-radius:999px;padding:3px 10px;font-weight:700}
.hero{position:relative;height:420px}.hero img{width:100%;height:100%;object-fit:cover;object-position:center 35%}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(#0b0b0e00 55%,#0b0b0e 100%)}
.score{position:absolute;top:14px;left:14px;z-index:2;background:#0b0b0ecc;border:1px solid #fc721188;border-radius:16px;padding:6px 14px;text-align:center}
.score b{display:block;font-size:34px;font-weight:900;color:#fc7211;line-height:1}.score small{font-size:11px;color:#bbb}
.body{padding:0 18px;margin-top:-40px;position:relative;z-index:2}
.k{font-size:13px;color:#fc7211;font-weight:700}.t{font-size:28px;font-weight:900;line-height:1.15;margin:2px 0 10px}
.v{font-size:16px;line-height:1.45;color:#ddd}
.faces{display:flex;gap:14px;margin:16px 0}.faces div{text-align:center;font-size:11px;color:#bbb;width:64px}
.faces img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid #fc7211;display:block;margin:0 auto 4px}
.btn{display:block;text-align:center;border-radius:14px;padding:13px;font-weight:800;font-size:16px;margin-top:10px}
.main{background:#fc7211;color:#fff}.sec{border:1px solid #444;color:#eee}
/* share card */
.card{width:390px;height:693px;position:relative;overflow:hidden;display:inline-block;vertical-align:top;margin-right:30px;border-radius:0}
.card img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .tp{position:absolute;top:0;left:0;right:0;padding:26px 22px 60px;background:linear-gradient(#000d,#0000)}
.card .bt{position:absolute;bottom:0;left:0;right:0;padding:70px 22px 22px;background:linear-gradient(#0000,#000e 45%)}
.card .n{font-size:64px;font-weight:900;color:#fc7211;line-height:.9}
.card .l1{font-size:22px;font-weight:800;margin-top:6px}.card .l2{font-size:15px;color:#ddd;margin-top:4px}
.card .q{font-size:20px;font-weight:800}.card .u{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:#ccc}
</style></head><body>
<div class="ph" id="q5">
  <div class="top"><span class="brand">שלומי<i>וורס</i></span><span class="chip">תושב</span></div>
  <div class="hero"><img src="mix-low-2.jpg"><div class="score"><b>17</b><small>הציון שלכם</small></div></div>
  <div class="body">
    <div class="k">הסימולציה שלכם</div>
    <div class="t">מבחן פתע אצל השכן</div>
    <div class="v">אתם מוקפים באנשים שמסבירים הכול.<br>חבל שאף אחד לא מסביר מה קורה פה.</div>
    <div class="faces"><div><img src="p-yotam.jpg">יותם</div><div><img src="p-rosenblum.jpg">המורה רוזנבלום</div><div><img src="p-neighbor.jpg">השכן המציק</div></div>
    <a class="btn main">שתפו את הסימולציה</a><a class="btn sec">פגשו את השכנים</a>
  </div>
</div>
<div class="card" id="q6"><img class="bg" src="mix-low-2.jpg">
  <div class="tp"><div class="n">17</div><div class="l1">מבחן פתע אצל השכן</div><div class="l2">קיבלתי סימולציה עם מכתב תלונה.</div></div>
  <div class="bt"><div class="q">מי אצלכם?</div><div class="u"><span class="brand" style="font-size:22px">שלומי<i>וורס</i></span><span dir="ltr">shlomiverse.com/simulation</span></div></div>
</div>
</body></html>
