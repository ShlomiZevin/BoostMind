<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<style>
  /* the "collaboration" story poster: מאפיית ברכת השפע x Hani - super modest, so she is not in it at all;
     her husband holds the box for her (a real Haredi ad never prints a woman's picture). 1080x1920,
     words stay out of the top 240 / bottom 300 */
  @import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Suez+One&family=Heebo:wght@500;700;800;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { background: #f4ecdc; font-family: 'Heebo', sans-serif; color: #3a1d0e; position: relative; }
  .frame { position: absolute; inset: 26px; border: 4px solid #8a1c14; }
  .frame::after { content: ''; position: absolute; inset: 10px; border: 1.5px solid #8a1c14; }
  .bsd { position: absolute; top: 250px; right: 70px; font-family: 'Frank Ruhl Libre', serif; font-weight: 700; font-size: 30px; }
  .kicker { position: absolute; top: 262px; left: 0; right: 0; text-align: center; font-family: 'Frank Ruhl Libre', serif;
    font-weight: 700; font-size: 38px; letter-spacing: 1px; }
  h1 { position: absolute; top: 310px; left: 0; right: 0; text-align: center; font-family: 'Suez One', serif;
    font-size: 116px; line-height: 1; color: #8a1c14; }
  .who { position: absolute; top: 450px; left: 60px; right: 60px; display: flex; align-items: center; justify-content: center; gap: 26px;
    font-family: 'Frank Ruhl Libre', serif; font-weight: 900; font-size: 46px; }
  .who .x { font-family: 'Heebo'; font-weight: 500; font-size: 40px; color: #8a1c14; }
  .who small { font-size: 34px; font-weight: 700; }
  .photo { position: absolute; top: 540px; left: 50%; width: 760px; height: 900px; margin-left: -380px; overflow: hidden;
    border: 3px solid #3a1d0e; background: #efe7d6; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 6%; }
  .cap { position: absolute; top: 1452px; left: 110px; right: 110px; text-align: center; font-weight: 700; font-size: 29px; line-height: 1.35; }
  .quote { position: absolute; top: 1548px; left: 70px; right: 70px; text-align: center; font-family: 'Frank Ruhl Libre', serif;
    font-weight: 900; font-size: 52px; line-height: 1.15; color: #8a1c14; }
  .quote span { display: block; font-family: 'Heebo'; font-weight: 700; font-size: 28px; color: #3a1d0e; margin-top: 6px; }
  .note { position: absolute; top: 1700px; left: 60px; right: 60px; text-align: center; font-weight: 500; font-size: 21px; opacity: .8; }
</style></head>
<body>
  <div class="frame"></div>
  <div class="bsd">בס״ד</div>
  <div class="kicker">בשעה טובה ומוצלחת</div>
  <h1>שיתוף פעולה</h1>
  <div class="who"><span>מאפיית ברכת השפע</span><span class="x">×</span><span>מרת ח. פרידמן <small>תחי׳</small></span></div>
  <div class="photo"><img src="am-box.jpg"></div>
  <div class="cap">בתמונה: בעלה, הרב אברהם משה פרידמן שליט״א,<br>מחזיק את העיגוליות בשמה*</div>
  <div class="quote">״אה, זה בכלל פרווה!״<span>— מרת ח. פ., בני ברק</span></div>
  <div class="note">*מטעמי צניעות תמונת הגב׳ אינה מתפרסמת · המודעה אושרה ע״י ועדת הצניעות</div>
</body></html>
