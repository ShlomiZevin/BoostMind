<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="news.css">
<style>
  /* the end card of both story clips: "הכל בחוברת ההנחות של שפע עד" - the same plain newspaper ad, the booklet itself */
  h1 { top: 270px; font-size: 112px; line-height: 1.08; }
  h1 mark { background: #ffd400; color: #d8141c; padding: 0 16px 8px; border-radius: 10px; display: inline-block; transform: rotate(-2deg); }
  .booklet { position: absolute; top: 575px; left: 50%; width: 740px; height: 760px; margin-left: -370px; background: #fff;
    border: 3px solid #14204a; transform: rotate(3deg); box-shadow: 0 14px 30px rgba(0, 0, 0, 0.22); overflow: hidden; }
  .booklet .bh { background: #d8141c; color: #fff; text-align: center; padding: 18px 10px 20px; }
  .booklet .bh b { display: block; font-family: 'Suez One', serif; font-size: 46px; line-height: 1; }
  .booklet .bh span { font-family: 'Secular One', sans-serif; font-size: 34px; }
  .booklet .row { display: flex; border-bottom: 3px solid #14204a; height: 390px; }
  .booklet .cell { flex: 1; position: relative; border-left: 3px solid #14204a; }
  .booklet .cell:last-child { border-left: 0; }
  .booklet .cell img { position: absolute; top: 10px; left: 10px; right: 10px; width: calc(100% - 20px); height: 300px; object-fit: contain; }
  .booklet .cell .p { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; font-family: 'Secular One', sans-serif; font-size: 40px; color: #d8141c; }
  .booklet .cell .p i { font-style: normal; font-family: 'Heebo', sans-serif; font-weight: 900; }
  .booklet .more { padding: 22px 20px; font-weight: 800; font-size: 34px; line-height: 1.35; color: #14204a; text-align: center; }
  .site { position: absolute; top: 1450px; left: 30px; right: 30px; text-align: center; font-family: 'Secular One', sans-serif; font-size: 52px; color: #d8141c; }
  .branches { top: 1520px; }
</style></head>
<body>
  <div class="top"></div><div class="bot"></div><div class="frame"></div>
  <h1>הכל <mark>בחוברת ההנחות</mark><br>של שפע עד</h1>
  <div class="booklet">
    <div class="bh"><b>שפע עד</b><span>חוברת ההנחות · השבוע</span></div>
    <div class="row">
      <div class="cell"><img src="avnei-box2.jpg"><div class="p">29.90 <i>₪</i></div></div>
      <div class="cell"><img src="igulyot-box.jpg"><div class="p">2 ב־18 <i>₪</i></div></div>
    </div>
    <div class="more">שקיות אקסטרה גדולות · פלאפון כשר<br>גבס לרגל, מידה לילדים · נרות חנוכה<br>ועוד 200 מבצעים</div>
  </div>
  <div class="site">כל המבצעים באתר שלנו</div>
  <div class="branches">בני ברק · ירושלים · בית שמש · מודיעין עילית · אלעד</div>
</body></html>
