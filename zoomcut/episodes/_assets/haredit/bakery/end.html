<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<style>
  /* the end card of the collab video: the bakery, its products, "sold at שפע עד", the site. 1080x1920,
     words out of the top 240 / bottom 300 */
  @import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Suez+One&family=Heebo:wght@500;700;800;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { background: #f4ecdc; font-family: 'Heebo', sans-serif; color: #3a1d0e; position: relative; }
  .frame { position: absolute; inset: 26px; border: 4px solid #8a1c14; }
  .frame::after { content: ''; position: absolute; inset: 10px; border: 1.5px solid #8a1c14; }
  .bsd { position: absolute; top: 250px; right: 70px; font-family: 'Frank Ruhl Libre', serif; font-weight: 700; font-size: 30px; }
  .logo { position: absolute; top: 270px; left: 50%; transform: translateX(-50%); text-align: center; background: #3a1d0e; color: #f4ecdc;
    border: 4px solid #c8962e; border-radius: 120px / 60px; padding: 14px 70px 20px; line-height: 1; white-space: nowrap; }
  .logo small { display: block; font-family: 'Frank Ruhl Libre', serif; font-weight: 700; font-size: 38px; color: #c8962e; margin-bottom: 6px; }
  .logo b { font-family: 'Suez One', serif; font-weight: 400; font-size: 84px; }
  h1 { position: absolute; top: 500px; left: 0; right: 0; text-align: center; font-family: 'Frank Ruhl Libre', serif; font-weight: 900; font-size: 54px; }
  .grid { position: absolute; top: 600px; left: 80px; right: 80px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .grid img { width: 100%; height: 300px; object-fit: contain; }
  .grid img.big { grid-column: span 2; grid-row: span 1; }
  .shop { position: absolute; top: 1290px; left: 0; right: 0; text-align: center; }
  .shop span { display: inline-block; font-family: 'Frank Ruhl Libre', serif; font-weight: 900; font-size: 50px; }
  .shop b { display: inline-block; background: #d8141c; color: #fff; font-family: 'Suez One', serif; font-weight: 400; font-size: 64px;
    padding: 0 26px 8px; border-radius: 12px; margin-right: 14px; transform: rotate(-2deg); }
  .url { position: absolute; top: 1440px; left: 60px; right: 60px; text-align: center; direction: ltr; font-weight: 800; font-size: 44px; color: #8a1c14; }
  .url small { display: block; direction: rtl; font-weight: 700; font-size: 32px; color: #3a1d0e; margin-bottom: 6px; }
</style></head>
<body>
  <div class="frame"></div>
  <div class="bsd">בס״ד</div>
  <div class="logo"><small>מאפיית</small><b>ברכת השפע</b></div>
  <h1>עיגוליות · גלגליות · חלות · עוגות</h1>
  <div class="grid">
    <img src="igulyot.jpg"><img src="galgaliyot.jpg"><img src="shmarim.jpg"><img src="challah.jpg">
    <img src="dvash.jpg"><img src="tchina.jpg"><img src="beigale.jpg"><img src="../ads/cookies.jpg" style="object-fit:contain;mix-blend-mode:multiply">
  </div>
  <div class="shop"><span>נמכר בכל סניפי</span><b>שפע עד</b></div>
  <div class="url"><small>כל המוצרים באתר שלנו</small>boostmind-b052c.web.app/birkat-hashefa</div>
</body></html>
