<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Suez+One&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { background: #f7f1e1; font-family: 'Frank Ruhl Libre', serif; color: #1c2742; position: relative; }
  /* the family is the invitation: the photo fills the top, only the empty backdrop at the sides is trimmed */
  .photo { display: block; width: 1080px; height: 1215px; object-fit: cover; object-position: 47% 50%; }
  .gold { height: 10px; background: #b4913a; border-bottom: 3px solid #f7f1e1; outline: 2px solid #b4913a; }
  .card { position: absolute; top: 1252px; left: 60px; right: 60px; bottom: 54px; border: 3px solid #b4913a;
    outline: 1px solid #b4913a; outline-offset: -12px; padding: 34px 50px; text-align: center; }
  .bsd { position: absolute; top: 22px; right: 32px; font-size: 26px; font-weight: 700; }
  .open { font-size: 38px; font-weight: 500; line-height: 1.35; margin-top: 14px; }
  .open b { font-weight: 700; }
  .name { font-family: 'Suez One', serif; font-size: 120px; line-height: 1.05; color: #8a6a1e; margin: 8px 0 8px; }
  .when { font-size: 40px; font-weight: 700; line-height: 1.35; }
  .notes { font-size: 33px; font-weight: 500; line-height: 1.45; margin-top: 18px; }
  .notes b { font-weight: 900; }
  .parents { font-family: 'Suez One', serif; font-size: 50px; margin-top: 22px; }
</style>
</head>
<body>
<img class="photo" src="../family-0.5.jpg" alt="">
<div class="gold"></div>
<div class="card">
  <div class="bsd">בס״ד</div>
  <div class="open">בשמחה ובהודיה להשי״ת <b>הננו מתכבדים להזמינכם</b><br>לשמחת בת המצווה של בתנו היקרה</div>
  <div class="name">שטערני תחי׳</div>
  <div class="when">כ״ח במרחשוון, 19:00 · אולם ״כתר הרימון״, בני ברק</div>
  <div class="notes"><b>הסעה ממשרדי טקי-טק</b> בשעה 18:15 · אישור הגעה <b>במייל בלבד</b></div>
  <div class="parents">חני והרב אברהם משה פרידמן הי״ו</div>
</div>
</body>
</html>
