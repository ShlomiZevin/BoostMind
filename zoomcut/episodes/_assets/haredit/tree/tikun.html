<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><style>
/* the tree re-posted with Hani's correction notice on top (a Haredi-paper "תיקון טעות" box) */
@import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1024px; height:2336px; overflow:hidden; background:#f1e4c3; font-family:'Frank Ruhl Libre',serif; color:#2a1c10; }
.band { position:relative; height:350px; padding:58px 46px 0; }
.bsd { position:absolute; top:22px; right:30px; font-weight:700; font-size:20px; }
.hide { position:absolute; top:368px; right:20px; width:90px; height:36px; background:#f1e4c3; }
.box { border:5px double #2a1c10; background:#fbf3df; padding:18px 30px 20px; }
.box h1 { text-align:center; font-weight:900; font-size:46px; line-height:1.1; border-bottom:1px solid rgba(42,28,16,0.35); padding-bottom:10px; margin-bottom:12px; }
.box p { text-align:center; font-weight:500; font-size:24px; line-height:1.45; }
.box p + p { margin-top:6px; }
.box ul { list-style:none; margin:6px 0 8px; }
.box li { font-weight:700; font-size:23px; line-height:1.45; padding-right:22px; position:relative; }
.box li::before { content:''; position:absolute; right:4px; top:15px; width:8px; height:8px; background:#2a1c10; transform:rotate(45deg); }
.box .sig { text-align:left; font-weight:900; font-size:24px; margin-top:4px; }
img { display:block; width:1024px; height:1986px; }
</style></head><body>
<div class="band"><div class="bsd">בס״ד</div><div class="box">
  <h1>תיקון טעות</h1>
  <p>בטעות נדפס שם התינוק „מוישי”, כשם אביו שיבדל לחיים ארוכים.<br>שמו שלוימי שיחי׳. כמו כן תוקנו התמונות של ברכי ושטערני שתחיינה.<br>הגרסה המתוקנת עלתה גם באתר.</p>
  <div class="sig">חני פרידמן</div>
</div></div>
<img src="poster.jpg"><div class="hide"></div>
</body></html>
