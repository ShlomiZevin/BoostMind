<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><style>
/* the תיקון טעות re-post as a 1080x1920 story: Hani's notice on top (below the apps' top bar), the painted tree below */
@import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1920px; overflow:hidden; background:#f1e4c3; font-family:'Frank Ruhl Libre',serif; color:#2a1c10; }
.bsd { position:absolute; top:138px; right:44px; font-weight:700; font-size:24px; }
.box { position:absolute; top:176px; left:40px; right:40px; border:5px double #2a1c10; background:#fbf3df; padding:14px 26px 14px; }
.box h1 { text-align:center; font-weight:900; font-size:50px; line-height:1.1; border-bottom:1px solid rgba(42,28,16,0.35); padding-bottom:8px; margin-bottom:10px; }
.box p { text-align:center; font-weight:500; font-size:27px; line-height:1.45; }
.box .sig { text-align:left; font-weight:900; font-size:27px; margin-top:6px; }
.tree { position:absolute; left:50%; transform:translateX(-50%); top:468px; width:887px; height:1300px;
  background:url('poster.jpg') no-repeat; background-size:887px 1721px; background-position:0 -260px;
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 7%, #000 93%, transparent 100%), linear-gradient(to bottom, transparent 0, #000 5%, #000 95%, transparent 100%);
  -webkit-mask-composite: source-in; mask-composite: intersect; }
</style></head><body>
<div class="bsd">בס״ד</div>
<div class="box">
  <h1>תיקון טעות</h1>
  <p>בטעות נדפס שם התינוק „מוישי”, כשם אביו שיבדל לחיים ארוכים.<br>שמו שלוימי שיחי׳. כמו כן תוקנו התמונות של ברכי ושטערני שתחיינה.<br>הגרסה המתוקנת עלתה גם באתר.</p>
  <div class="sig">חני פרידמן</div>
</div>
<div class="tree"></div>
</body></html>
