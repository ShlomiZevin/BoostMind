<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><style>
/* the תיקון טעות story, painted as one page: Leonardo's illuminated page (page.jpg) carries the note in its
   cartouche, the verse on its ribbon and the family tree in its open field */
@import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&display=swap');
@font-face { font-family: 'Stam Ashkenaz'; src: url('file:///C:/workspace/BoostMind/public/friedman/fonts/StamAshkenazCLM.ttf'); }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1920px; overflow:hidden; background:rgb(249,222,155); font-family:'Frank Ruhl Libre',serif; color:#3a2410; }
.page { position:absolute; left:0; top:0px; width:1080px; height:1920px; background:url('page.jpg') no-repeat 0 0 / 1080px 1920px; }
.bsd { position:absolute; top:236px; right:150px; font-weight:700; font-size:19px; color:#5a3d18; }
.note { position:absolute; left:150px; right:150px; top:240px; text-align:center; }
.note h1 { font-weight:900; font-size:40px; line-height:1.05; color:#2a1808; }
.note .sub { font-weight:700; font-size:21px; color:#7a5626; margin:4px 0 10px; }
.note p { font-weight:500; font-size:22px; line-height:1.42; }
.note .sig { font-weight:900; font-size:21px; margin-top:6px; color:#2a1808; }
.pasuk { position:absolute; left:120px; right:120px; top:556px; text-align:center; font-family:'Stam Ashkenaz',serif; font-size:44px; line-height:1.08; color:#1c1006; white-space:nowrap; }
.src { position:absolute; left:0; right:0; top:676px; text-align:center; font-weight:700; font-size:20px; color:#7a5626; }
.tree { position:absolute; left:50%; transform:translateX(-50%); top:708px; width:786px; height:1090px;
  background:url('poster.jpg') no-repeat; background-size:786px 1524px; background-position:0 -230px;
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 7%, #000 93%, transparent 100%), linear-gradient(to bottom, transparent 0, #000 7%, #000 95%, transparent 100%), radial-gradient(ellipse 68% 68% at 50% 50%, #000 84%, transparent 100%);
  -webkit-mask-composite: source-in, source-in; }
</style></head><body>
<div class="page"></div>
<div class="bsd">בס״ד</div>
<div class="note">
  <h1>תיקון טעות</h1>
  <div class="sub">עבודת השורשים של שטערני שתחי׳ לקראת בת המצווה</div>
  <p>בטעות נדפס שם התינוק „מוישי”, כשם אביו שיבדל לחיים ארוכים.<br>שמו שלוימי שיחי׳. כמו כן תוקנו התמונות של ברכי ושטערני שתחיינה.<br>הגרסה המתוקנת עלתה גם באתר.</p>
  <div class="sig">חני פרידמן</div>
</div>
<div class="pasuk">והיה כעץ שתול על פלגי מים<br>אשר פריו יתן בעתו</div>
<div class="src">תהלים א׳ ג׳</div>
<div class="tree"></div>
</body></html>
