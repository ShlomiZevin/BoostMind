<!DOCTYPE html><html dir="rtl" lang="he"><head><meta charset="utf-8"><style>
@font-face{font-family:A;src:url('../../../fonts/Assistant.ttf')}
html,body{margin:0;width:1080px;height:1920px;background:#000;font-family:A,sans-serif;color:#fff;overflow:hidden}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.logo{display:flex;align-items:center;gap:22px;direction:ltr;margin-bottom:70px}
.mark{font-weight:800;font-size:96px;letter-spacing:-6px;color:#3b8cf0}
.name{display:flex;flex-direction:column;line-height:1}
.name b{font-size:76px;font-weight:800}.name small{font-size:30px;color:#9fb6d6;letter-spacing:1px;margin-top:6px}
.card{width:820px;background:#0b2545;border-radius:36px;padding:44px 0 40px;display:flex;flex-direction:column;align-items:center;box-shadow:0 0 0 3px #13315c}
.card img{width:380px;height:380px;border-radius:50%;object-fit:cover;object-position:50% 30%;border:8px solid #0a5cc2}
.who{font-size:58px;font-weight:800;margin-top:26px}
.role{font-size:36px;color:#9fb6d6;margin-top:4px}
.since{font-size:30px;color:#6fa8f0;margin-top:10px}
h1{font-size:104px;font-weight:800;margin:70px 0 0;line-height:1}
.sub{font-size:46px;color:#cfd9e8;margin-top:22px;font-weight:600}
.url{margin-top:56px;font-size:74px;font-weight:800;direction:ltr;background:#0a5cc2;padding:18px 48px;border-radius:24px}
.bio{margin-top:30px;font-size:44px;color:#9fb6d6;font-weight:700}
</style></head><body><div class="wrap">
<div class="logo"><span class="mark">&lt;/&gt;</span><span class="name"><b>Techy-Tech</b><small>Enterprise Solutions</small></span></div>
<div class="card"><img src="headshot.jpg"><div class="who">צביקה גרינברג</div><div class="role">ראש צוות Core Platform</div><div class="since">בטקי-טק מאז 1999</div></div>
<h1>טקי-טק מגייסת</h1>
<div class="sub">מחפשים מפתחים שלא ממהרים</div>
<div class="url">techytech.web.app</div>
<div class="bio">הלינק בביו</div>
</div></body></html>
