<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;600;800;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: transparent; }
  .t { display: inline-block; font-family: 'Heebo', sans-serif; white-space: nowrap; }
  /* the logo's own lettering: heavy, tight, "שלומי" warm white + "וורס" orange (colours sampled from logo-512.png), on the
     dark ring with its glowing orange edge */
  .wm { font-weight: 900; font-size: 196px; line-height: 1; letter-spacing: -4px; padding: 26px 70px 34px; }
  .wm .a { color: #fdf6ef; } .wm .b { color: #fc7211; }
  #t1 { border-radius: 999px; background: linear-gradient(180deg, #120a06, #050302 60%, #120804);
    box-shadow: inset 0 0 0 7px #ff7a1c, inset 0 0 26px 10px rgba(255, 106, 31, .5); }   /* the outer glow is the compositor's */
  #m1 { color: #fff; }
  #t2 { font-weight: 600; font-size: 66px; letter-spacing: 26px; color: #fff; padding: 14px 40px 14px 14px; }
</style></head><body>
<div id="w1" style="display:inline-block;padding:70px"><span class="t wm" id="t1"><span class="a">שלומי</span><span class="b">וורס</span></span></div><br>
<div id="w2" style="display:inline-block;padding:70px"><span class="t wm" id="m1">שלומיוורס</span></div>
<div><span class="t" id="t2">מציגים</span></div>
</body></html>
