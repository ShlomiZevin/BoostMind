<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;600;800;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: transparent; }
  .t { display: inline-block; font-family: 'Heebo', sans-serif; white-space: nowrap; }
  /* the trailer title: metallic orange, the brand's colour, a bevel line and a dark edge so it holds on bright space */
  #t1 { font-weight: 900; font-size: 184px; line-height: 1.15; padding: 30px 50px; letter-spacing: -2px;
    background: linear-gradient(180deg, #fff8e6 0%, #ffe0a8 22%, #ffa04a 48%, #ff6a1f 66%, #d84a0c 80%, #ffb36b 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #6e2405) drop-shadow(0 0 2px rgba(0,0,0,.5)); }
  #t2 { font-weight: 600; font-size: 66px; letter-spacing: 26px; color: #fff; padding: 14px 40px 14px 14px; }
  #m1 { font-weight: 900; font-size: 184px; line-height: 1.15; padding: 30px 50px; letter-spacing: -2px; color: #fff; }
</style></head><body>
<div><span class="t" id="t1">שלומיוורס</span></div>
<div><span class="t" id="m1">שלומיוורס</span></div>
<div><span class="t" id="t2">מציגים</span></div>
</body></html>
