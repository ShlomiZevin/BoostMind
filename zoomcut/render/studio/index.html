<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch Studio</title>
<style>
/* Sketch Studio shell: one rail that never reloads, the tools live beside it (each keeps its state). */
:root { --app: #131211; --panel: #1a1918; --panel-3: #2a2826; --edge: rgba(255,255,255,0.07); --text: #f2f0ed; --dim: #aaa59f; --faint: #78736d; --accent: #ff6b57; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--app); color: var(--text); font: 600 11px/1.2 Inter, "Segoe UI", system-ui, sans-serif; }
.shell { display: grid; grid-template-columns: 72px 1fr; height: 100%; }
.rail { background: var(--panel); border-right: 1px solid var(--edge); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 6px; }
.mark { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: #fff; display: grid; place-items: center; font: 800 18px Inter, sans-serif; margin-bottom: 14px; }
.tool { position: relative; width: 60px; padding: 9px 0 7px; border-radius: 10px; border: 0; background: transparent; color: var(--dim); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 5px; font: inherit; transition: background .15s, color .15s; }
.tool svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.tool:hover { background: var(--panel-3); color: var(--text); }
.tool.on { background: var(--panel-3); color: var(--text); }
.tool.on svg { stroke: var(--accent); }
.tool.on::before { content: ""; position: absolute; left: -6px; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--accent); }
.grow { flex: 1; }
.ver { color: var(--faint); font-weight: 500; font-size: 10px; }
main { position: relative; }
iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--app); display: none; }
iframe.on { display: block; }
/* the job queue: every project's build / export, whatever project or tool is open */
.jobs-btn .badge { position: absolute; top: 4px; right: 8px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--accent);
  color: #fff; font: 800 10px/16px Inter, sans-serif; text-align: center; }
.jobs-btn.busy svg { animation: jspin 1.6s linear infinite; }
@keyframes jspin { to { transform: rotate(360deg); } }
.jobs-pop { position: fixed; left: 80px; bottom: 12px; z-index: 50; width: 420px; max-height: 70vh; overflow: auto; background: var(--panel);
  border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; box-shadow: 0 16px 40px rgba(0,0,0,0.45); padding: 8px; font: 500 13px Inter, "Segoe UI", sans-serif; display: none; }
.jobs-pop.on { display: block; }
.jobs-h { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 10px; font: 700 13px Inter, sans-serif; }
.jobs-h span { color: var(--faint); font-weight: 600; font-size: 11px; }
.jobs-sec { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: 10px 8px 4px; }
.job { padding: 9px 8px; border-top: 1px solid var(--edge); cursor: pointer; border-radius: 4px; }
.job:hover { background: #211f1e; }
.job-top { display: flex; align-items: center; gap: 8px; }
.job-name { font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job-kind { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; background: var(--panel-3); color: var(--dim); }
.job-kind.export { color: #ffb3a8; }
.job-st { font-size: 12px; color: var(--dim); }
.job-st.ok { color: #7fd29a; } .job-st.err { color: #ff8a7a; }
.job-line { margin-top: 5px; color: var(--faint); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job-bar { margin-top: 6px; height: 3px; background: var(--panel-3); border-radius: 2px; overflow: hidden; }
.job-bar div { height: 100%; background: var(--accent); transition: width .4s; }
.jobs-empty { padding: 14px 8px; color: var(--faint); }
</style>
</head>
<body>
<div class="shell">
  <nav class="rail" id="rail">
    <div class="mark" title="Sketch Studio">S</div>
  </nav>
  <main id="main"></main>
</div>
<script>
// tools: each opens once and stays alive while you switch (a playing reader / a karaoke take keeps its place)
const TOOLS = [
  { id: 'video', label: 'Editor', src: '/editor.html', icon: '<rect x="3" y="5" width="13" height="14" rx="2"/><path d="M16 10l5-3v10l-5-3"/>' },
  { id: 'karaoke', label: 'Karaoke', src: '/karaoke/', icon: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4"/>' },
  { id: 'reader', label: 'Reader', src: '/reader/', icon: '<path d="M4 5h11a3 3 0 0 1 3 3v11H7a3 3 0 0 1-3-3z"/><path d="M8 9h6M8 13h6"/>' },
];
const rail = document.getElementById('rail'), main = document.getElementById('main');
const frames = {};
for (const t of TOOLS) {
  const b = document.createElement('button');
  b.className = 'tool'; b.dataset.id = t.id; b.title = t.label;
  b.innerHTML = `<svg viewBox="0 0 24 24">${t.icon}</svg>${t.label}`;
  b.onclick = () => { location.hash = t.id; };
  rail.appendChild(b);
}
rail.insertAdjacentHTML('beforeend', '<div class="grow"></div>'
  + '<button class="tool jobs-btn" id="jobsBtn" title="Jobs - every project"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>Jobs</button>'
  + '<div class="ver">studio</div>');
document.body.insertAdjacentHTML('beforeend', '<div class="jobs-pop" id="jobsPop"></div>');
function show() {
  const id = (location.hash.slice(1) || 'video');
  const t = TOOLS.find((x) => x.id === id) || TOOLS[0];
  if (!frames[t.id]) {
    const f = document.createElement('iframe');
    f.src = t.src; f.allow = 'microphone; camera; autoplay; fullscreen; speaker-selection';
    main.appendChild(f); frames[t.id] = f;
  }
  for (const [k, f] of Object.entries(frames)) f.classList.toggle('on', k === t.id);
  rail.querySelectorAll('.tool').forEach((b) => b.classList.toggle('on', b.dataset.id === t.id));
  document.title = `${t.label} · Sketch Studio`;
  frames[t.id].focus();
}
addEventListener('hashchange', show);
show();

// ---- the job queue: every project's build / export, from the server's own job records (it keeps them per project) ----
const jobsBtn = document.getElementById('jobsBtn'), jobsPop = document.getElementById('jobsPop');
const esc = (x) => String(x ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let eps = [], jobs = {}, lastFull = 0;
const progress = (log) => {  // the last "Rendered n/total" line, and what step it is
  for (let i = (log || []).length - 1; i >= 0; i--) {
    const m = /Rendered (\d+)\/(\d+)(.*)/.exec(log[i]);
    if (m) return { pct: Math.min(100, Math.round(+m[1] / Math.max(1, +m[2]) * 100)), step: m[3].trim().replace(/[()]/g, '') };
  }
  return null;
};
const lastLine = (log) => [...(log || [])].reverse().find((l) => l && !/^W0000|InitGoogle|^Rendered/.test(l)) || '';
async function poll() {
  try {
    if (Date.now() - lastFull > 15000 || !eps.length) { eps = await (await fetch('/api/episodes')).json(); lastFull = Date.now(); }
    const ids = eps.map((e) => e.id);
    const res = await Promise.all(ids.map((id) => fetch(`/api/ep/${id}/job`).then((r) => r.json()).catch(() => null)));
    ids.forEach((id, i) => { if (res[i]) jobs[id] = res[i]; });
  } catch {}
  draw();
}
function draw() {
  const title = (id) => (eps.find((e) => e.id === id) || {}).title || id;
  const all = Object.entries(jobs).filter(([, j]) => j && j.kind);
  const run = all.filter(([, j]) => j.running), fin = all.filter(([, j]) => !j.running);
  jobsBtn.classList.toggle('busy', run.length > 0);
  jobsBtn.querySelector('.badge')?.remove();
  if (run.length) jobsBtn.insertAdjacentHTML('beforeend', `<span class="badge">${run.length}</span>`);
  if (!jobsPop.classList.contains('on')) return;
  const row = ([id, j]) => {
    const p = j.running ? progress(j.log) : null;
    const st = j.running ? (p ? `${p.pct}%` : 'working') : j.code === 0 ? 'done' : 'failed';
    return `<div class="job" data-id="${esc(id)}">
      <div class="job-top"><span class="job-name">${esc(id)}</span><span class="job-kind ${j.kind}">${j.kind === 'export' ? 'Export' : 'Build'}</span>
        <span class="job-st ${j.running ? '' : j.code === 0 ? 'ok' : 'err'}">${st}</span></div>
      <div class="job-line" dir="auto">${esc(title(id))}${p && p.step ? ' · ' + esc(p.step) : ''} · ${esc(lastLine(j.log))}</div>
      ${j.running ? `<div class="job-bar"><div style="width:${p ? p.pct : 8}%"></div></div>` : ''}
    </div>`;
  };
  jobsPop.innerHTML = `<div class="jobs-h">Jobs <span>every project · click one to open it</span></div>`
    + (run.length ? `<div class="jobs-sec">Running · ${run.length}</div>` + run.map(row).join('') : '')
    + (fin.length ? `<div class="jobs-sec">Finished · ${fin.length}</div>` + fin.map(row).join('') : '')
    + (all.length ? '' : '<div class="jobs-empty">No jobs since the studio started.</div>');
}
jobsBtn.onclick = (e) => { e.stopPropagation(); jobsPop.classList.toggle('on'); draw(); };
jobsPop.onclick = (e) => {
  e.stopPropagation();
  const r = e.target.closest('.job'); if (!r) return;
  try { sessionStorage.setItem('zc-ep', r.dataset.id); localStorage.setItem('zc-ep', r.dataset.id); } catch {}  // the editor follows (one project, every tool)
  location.hash = 'video'; jobsPop.classList.remove('on');
};
document.addEventListener('click', () => jobsPop.classList.remove('on'));
poll();
setInterval(poll, 3000);
</script>
</body>
</html>
