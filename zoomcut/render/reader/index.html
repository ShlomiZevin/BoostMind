<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Script Reader</title>
<script src="/studio/bar.js"></script>
<style>
/* Sketch Studio's look: warm off-black, one coral accent. Built for reading while filming yourself. */
@font-face { font-family: "Assistant"; src: url("/fonts/Assistant.ttf"); font-weight: 200 800; }
:root {
  --app: #131211; --panel: #1a1918; --panel-2: #211f1e; --panel-3: #2a2826; --hover: #302d2b;
  --edge: rgba(255,255,255,0.07); --edge-2: rgba(255,255,255,0.12);
  --text: #f2f0ed; --dim: #aaa59f; --faint: #78736d; --accent: #ff6b57; --accent-soft: rgba(255,107,87,0.12);
  --r: 8px; --fs: 30px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--app); color: var(--text); font: 14px/1.45 Inter, Assistant, system-ui, sans-serif; }
button, select, textarea { font: inherit; color: inherit; }
.hdr { position: sticky; top: 0; z-index: 5; }
.top { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--edge); background: var(--panel); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; }
.mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; }
.apps { display: flex; gap: 4px; margin-left: 6px; }
.apps a { color: var(--dim); text-decoration: none; padding: 6px 11px; border-radius: 7px; border: 1px solid transparent; font-weight: 600; font-size: 13px; }
.apps a.on { color: var(--text); background: var(--panel-3); border-color: var(--edge-2); }
.apps a:hover { color: var(--text); }
.vsep { width: 1px; height: 22px; background: var(--edge-2); }
select { background: transparent; border: 0; font-size: 14px; font-weight: 600; cursor: pointer; outline: none; }
select option { background: var(--panel); color: var(--text); }
.grow { flex: 1; }
.btn { height: 32px; padding: 0 12px; border-radius: var(--r); border: 1px solid var(--edge-2); background: var(--panel-2); cursor: pointer; font-weight: 600; font-size: 13px; transition: background .15s; }
.btn:hover { background: var(--hover); }
.btn.on { border-color: var(--accent); background: var(--accent-soft); }
.roles { display: flex; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--edge); background: var(--panel); flex-wrap: wrap; align-items: center; direction: rtl; }
.roles .lbl { color: var(--dim); font-weight: 600; margin-left: 4px; }
.role { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--edge-2); background: var(--panel-2); cursor: pointer; font-size: 17px; font-weight: 700; transition: background .15s, border-color .15s; }
.role .dot { width: 12px; height: 12px; border-radius: 50%; }
.role small { color: var(--faint); font-weight: 600; font-size: 12px; }
.role kbd { font: 11px Inter, sans-serif; color: var(--faint); border: 1px solid var(--edge-2); border-radius: 4px; padding: 0 5px; }
.role.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 18%, transparent); }
.rolewrap { display: inline-flex; align-items: center; gap: 4px; }
.rp { width: 56px; height: 40px; padding: 0 4px; text-align: center; color: var(--text); background: var(--panel-2); border: 1px solid var(--edge-2); border-radius: 10px; font: 600 13px Inter, sans-serif; font-variant-numeric: tabular-nums; }
.rp::placeholder { color: var(--faint); }
/* measuring a pace: a small popup under the Measure button */
.meas { position: fixed; z-index: 60; display: none; flex-direction: column; gap: 10px; width: 320px; padding: 14px;
  background: var(--panel); border: 1px solid var(--accent); border-radius: 6px; box-shadow: 0 10px 28px rgba(0,0,0,.45); direction: ltr; }
.meas.on { display: flex; }
.meas-who { font-weight: 800; font-size: 15px; }
.meas-who:empty { display: none; }
.meas-t { color: var(--dim); font-size: 14px; font-variant-numeric: tabular-nums; }
.meas-b { display: flex; gap: 8px; }
.meas-b .btn { flex: 1; }
.meas.run .meas-t { color: var(--text); font-size: 22px; font-weight: 700; }
.rp:focus { outline: none; border-color: var(--accent); }
.script { max-width: 980px; margin: 0 auto; padding: 30vh 20px 60vh; direction: rtl; }
.ln { display: grid; grid-template-columns: 1fr; gap: 2px; padding: 12px 18px; margin: 4px 0; border-radius: 12px; border: 2px solid transparent; cursor: pointer; transition: opacity .15s, background .15s; }
.ln .who { font-size: calc(var(--fs) * 0.48); font-weight: 700; color: var(--faint); }
.ln .t { font-size: calc(var(--fs) * 0.82); color: var(--dim); font-weight: 500; }
.ln.other { opacity: 0.55; }
.ln.mine { background: color-mix(in srgb, var(--c) 16%, transparent); border-right: 6px solid var(--c); opacity: 1; }
.ln.mine .who { color: var(--c); font-size: calc(var(--fs) * 0.55); }
.ln.mine .t { font-size: var(--fs); color: var(--text); font-weight: 700; line-height: 1.35; }
.ln.cur { border-color: var(--accent); opacity: 1; }
.ln.ckpt { box-shadow: inset 0 0 0 2px #ffd60a; opacity: 1; }
.ln .flag { position: absolute; left: 10px; top: 8px; display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; color: #1a1400;
  background: #ffd60a; border-radius: 4px; padding: 2px 9px; cursor: pointer; border: 0; }
.ln .flag:hover { background: #ffe34d; }
.ln .pin { position: absolute; left: 10px; top: 8px; width: 28px; height: 28px; display: none; align-items: center; justify-content: center;
  border-radius: 4px; border: 1px solid rgba(255,255,255,.18); background: rgba(0,0,0,.35); color: #e8e4de; cursor: pointer; }
.ln:hover .pin { display: inline-flex; }
.ln .pin:hover { color: #1a1400; background: #ffd60a; border-color: #ffd60a; }
.btn.ck { display: inline-flex; align-items: center; gap: 6px; }
.btn.ck.on { color: #ffd60a; border-color: #ffd60a; }
.ln.cur.other .t { color: var(--text); }
.ln.dir { padding: 6px 18px; }
.ln.past { opacity: 0.28; }
.solo .ln .who { display: none; }
.solo .ln.mine { --c: #ff6b57; }
dialog input { width: 100%; height: 38px; margin-bottom: 10px; background: var(--panel-2); border: 1px solid var(--edge-2); border-radius: 8px; padding: 0 12px; direction: rtl; font-size: 15px; }
.ln.dir .t { font-size: calc(var(--fs) * 0.55); color: var(--faint); font-style: italic; }
.btn.play { min-width: 92px; background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.play:hover { background: #ff8270; }
.pace { display: flex; align-items: center; gap: 6px; color: var(--dim); font-weight: 600; font-size: 13px; }
.pace input { width: 96px; accent-color: var(--accent); }
.pace input:disabled { opacity: .45; }
.pace #paceN { width: 62px; height: 28px; padding: 0 6px; text-align: center; color: var(--text); background: var(--panel-2); border: 1px solid var(--edge-2); border-radius: 6px; font: inherit; font-variant-numeric: tabular-nums; }
.pace #paceN:focus { outline: none; border-color: var(--accent); }
.pace .unit { color: var(--dim); }
.btn.lock.on { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
.ln { position: relative; overflow: hidden; }
.ln .bar { position: absolute; right: 0; bottom: 0; height: 4px; background: var(--accent); width: 0; }
.ln .bar.run { transition: width linear; }
.count { position: fixed; inset: 0; display: none; place-items: center; z-index: 50; background: rgba(19,18,17,0.55); pointer-events: none; }
.count.on { display: grid; }
.count b { font: 800 34vh/1 Inter, Assistant, sans-serif; color: #ff6b57; text-shadow: 0 10px 40px rgba(0,0,0,0.5); animation: pop .9s ease-out; }
@keyframes pop { from { transform: scale(1.25); opacity: .2; } to { transform: scale(1); opacity: 1; } }
.badge { display: inline-block; margin-top: 6px; font-size: calc(var(--fs) * 0.42); font-weight: 700; color: #1a1300; background: #f0b44c; border-radius: 6px; padding: 1px 8px; width: max-content; }
.cue { margin-top: 26px; }
.foot { position: fixed; bottom: 0; left: 0; right: 0; display: flex; gap: 18px; align-items: center; justify-content: center; padding: 10px 16px; background: rgba(26,25,24,0.92); border-top: 1px solid var(--edge); color: var(--dim); font-weight: 600; direction: rtl; }
.foot b { color: var(--text); }
.keys { color: var(--faint); font-size: 12px; direction: ltr; }
.empty { text-align: center; color: var(--faint); padding: 80px 20px; font-size: 18px; }
.ln .t.editing { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 6px; background: var(--panel-2); cursor: text; }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--edge-2); border-radius: 12px; width: min(760px, 92vw); padding: 18px; }
dialog::backdrop { background: rgba(0,0,0,0.6); }
dialog textarea { display: block; width: 100%; height: 50vh; background: var(--panel-2); border: 1px solid var(--edge-2); border-radius: 8px; padding: 12px; direction: rtl; font-size: 16px; line-height: 1.6; resize: none; }
/* a dark page: native scrollbars dark too (Windows drew a white one inside the paste box), slim like the editor's */
:root { color-scheme: dark; }
dialog textarea::-webkit-scrollbar { width: 10px; }
dialog textarea::-webkit-scrollbar-thumb { background: var(--panel-3, #3a3836); border-radius: 10px; border: 2px solid var(--panel-2); }
dialog textarea::-webkit-scrollbar-track { background: transparent; margin: 6px 0; }
@media (max-width: 640px) { .script { padding: 20vh 10px 60vh; } }
</style>
</head>
<body>
<header class="hdr">
<div class="top studio-top">
  <studio-nav app="reader"></studio-nav>
  <select id="ep" title="Project" data-picker="project" data-label="Project"></select>
  <button class="btn" id="paste" title="Paste a script">Paste</button>
  <button class="btn" id="copy" title="Copy the whole script (names and lines, as written)">Copy</button>
  <div class="grow"></div>
  <button class="btn play" id="play" title="Play / pause (Space)">▶ Play</button>
  <select id="cd" title="Countdown before it starts"><option value="0">⏱ No countdown</option><option value="3">⏱ 3 s</option><option value="5">⏱ 5 s</option><option value="10">⏱ 10 s</option></select>
  <button class="btn" id="restart" title="From the start: back to the first line and play">⏮</button>
  <button class="btn ck" id="mark" title="Checkpoint: mark the current line to start again from (M). Or hover any line and click its bookmark."><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span>Checkpoint</span></button>
  <button class="btn ck" id="tomark" title="Back to the checkpoint and play (B)" disabled><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14l-4-4 4-4"/><path d="M5 10h9a5 5 0 0 1 0 10h-2"/></svg></button>
  <label class="pace" title="Reading pace in words per minute">Pace <input type="range" id="pace" min="120" max="500" step="5"><input type="number" id="paceN" min="60" max="600" step="5" title="Type the pace (words per minute) - Enter to apply"><span class="unit">wpm</span></label>
  <button class="btn lock" id="lock" title="Keep this pace for this script">🔓 Lock</button>
  <button class="btn" id="measure" title="Measure a pace: pick a long line, press when you start saying it and when you finish - its speaker's pace is set from it">⏱ Measure</button>
  <button class="btn" id="cues" title="My lines + cues: only your lines, each with the line before it">Cues</button>
  <button class="btn" id="smaller" title="Smaller text">A−</button>
  <button class="btn" id="bigger" title="Bigger text">A+</button>
</div>
<div class="roles" id="roles"></div>
<div class="meas" id="meas">
  <div class="meas-who" id="measWho"></div>
  <div class="meas-t" id="measT">Press Space (or Start) the moment you start saying the highlighted line</div>
  <div class="meas-b"><button class="btn play" id="measGo">Start</button><button class="btn" id="measAgain" hidden>Measure again</button><button class="btn" id="measX">Cancel</button></div>
</div>
</header>
<div class="script" id="script"><div class="empty">Pick a project - its script shows here.</div></div>
<div class="foot" id="foot"></div>
<div class="count" id="count"><b id="countN"></b></div>

<dialog id="dlg">
  <div style="font-weight:700;margin-bottom:4px">Paste a script</div>
  <div style="color:var(--dim);margin-bottom:10px;font-size:13px">A dialogue ("Name: text") or a monologue (just the text, one line each — it becomes a prompter). Give it a name to keep it in the list.</div>
  <input id="nm" placeholder="Name (optional) — e.g. תודעה גבוהה">
  <textarea id="txt" placeholder="אמיר: טוב, דניאל, קודם כול...&#10;עופר: חד משמעית.&#10;&#10;— or just the text of a monologue, one line each"></textarea>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">
    <button class="btn" id="cancel">Cancel</button><button class="btn on" id="use">Use this script</button>
  </div>
</dialog>

<script>
// Reader for filming: the whole script in order, the character you're playing lit up, a cursor that keeps
// your place. Keys: 1-9 pick the character · Space/↓ next line · ↑ back · → your next line · ← your previous line.
const KNOWN = { 'אמיר': '#4a86e8', 'עופר': '#8a5cd6', 'דניאל': '#45a86a' };
const PALETTE = ['#4a86e8', '#8a5cd6', '#45a86a', '#d9822b', '#c2507a', '#2bb3c0', '#b8b23a'];
const tabEp = () => { try { return sessionStorage.getItem('zc-ep') || localStorage.getItem('zc-ep') || ''; } catch { return ''; } };
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const $ = (id) => document.getElementById(id);
let lines = [], chars = [], me = null, cur = 0, src = '', cues = false, solo = false, raw = '';
let mark = null;  // the checkpoint line (per script)
let paces = {};  // a character's own pace (wpm) in this script - when you play, each line waits at its speaker's pace
let fs = +(store.get('reader-fs') || 30);

// Splits a pasted script into speakers and lines. Understands "Name: text", "**Name:** text", lines that
// wrap onto the next line, [stage directions], and screenplay layout (the name alone on a line, the text under it).
function parse(text) {
  // a monologue (no "Name:" anywhere): every line is its own bubble - the reader becomes a prompter
  const rows = text.split(/\r?\n/).map((r) => r.trim()).filter((r) => r && !r.startsWith('#'));
  const named = rows.filter((r) => { const m = r.replace(/\*\*/g, '').match(/^([^:：]{1,24})[:：]/); return m && m[1].trim().split(/\s+/).length <= 3; });
  if (rows.length && named.length === 0)
    return rows.map((r) => (/^\[.*\]$/.test(r) ? { dir: true, text: r.slice(1, -1) } : { who: '', text: r, solo: true }));
  const out = [];
  let pending = null;  // a name standing alone on its line, waiting for its text
  for (let raw of text.split(/\r?\n/)) {
    raw = raw.trim();
    if (!raw || raw.startsWith('#')) { continue; }
    if (/^\[.*\]$/.test(raw) || /^\(.*\)$/.test(raw)) { out.push({ dir: true, text: raw.slice(1, -1) }); continue; }
    const clean = raw.replace(/\*\*/g, '');
    const m = clean.match(/^([^:：]{1,24})[:：]\s*(.*)$/);
    if (m && m[1].trim().split(/\s+/).length <= 3) {
      if (m[2].trim()) { out.push({ who: m[1].trim(), text: m[2].trim() }); pending = null; }
      else pending = m[1].trim();  // "Name:" alone - the text comes next
      continue;
    }
    if (pending) { out.push({ who: pending, text: clean }); pending = null; continue; }
    const words = clean.split(/\s+/);
    if (words.length <= 2 && !/[.!?,—–-]$/.test(clean) && clean.length <= 18) { pending = clean; continue; }  // screenplay name
    if (out.length && !out[out.length - 1].dir) out[out.length - 1].text += ' ' + clean;  // a wrapped line
  }
  return out;
}

function load(text, key) {
  src = key;
  raw = text;
  lines = parse(text);
  solo = lines.some((l) => l.solo);
  chars = solo ? [] : [...new Set(lines.filter((l) => !l.dir).map((l) => l.who))];
  const saved = JSON.parse(store.get('reader-' + src) || '{}');
  me = chars.includes(saved.me) ? saved.me : null;
  cur = Math.min(saved.cur || 0, Math.max(0, lines.length - 1));
  locked = !!saved.locked;
  paces = saved.paces || {};
  mark = Number.isInteger(saved.mark) && saved.mark < lines.length ? saved.mark : null;  // the checkpoint
  wpm = saved.locked && saved.wpm ? saved.wpm : (saved.wpm || +(store.get('reader-wpm') || DEFAULT_WPM));
  setPlay(false);
  showPace();
  render();
}

const color = (who) => KNOWN[who] || PALETTE[chars.indexOf(who) % PALETTE.length];
const save = () => { store.set('reader-' + src, JSON.stringify({ me, cur, wpm, locked, paces, mark })); if (!locked) store.set('reader-wpm', wpm); };
const hash = (t) => { let h = 0; for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };

function render() {
  const roles = $('roles');
  roles.innerHTML = chars.length ? '<span class="lbl">אני משחק את:</span>' : solo ? `<span class="lbl">פרומפטר · ${lines.length} שורות</span>` : '';
  document.body.classList.toggle('solo', solo);
  chars.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'role' + (me === c ? ' on' : '');
    b.style.setProperty('--c', color(c));
    const n = lines.filter((l) => l.who === c).length;
    b.innerHTML = `<span class="dot" style="background:${color(c)}"></span>${c} <small>${n} שורות</small>${i < 9 ? `<kbd>${i + 1}</kbd>` : ''}`;
    b.onclick = () => pick(c);
    const wrap = document.createElement('span');
    wrap.className = 'rolewrap';
    const pi = document.createElement('input');
    pi.type = 'number'; pi.min = 60; pi.max = 600; pi.step = 5; pi.className = 'rp';
    pi.value = paces[c] || ''; pi.placeholder = wpm;  // (empty: his default, else the general pace)
    pi.title = `${c}'s pace (words per minute) - empty = the general pace`;
    pi.onchange = () => {
      const v = Math.round(+pi.value);
      if (v) paces[c] = Math.max(60, Math.min(600, v)); else delete paces[c];
      pi.value = paces[c] || '';
      save(); foot(); if (playing) schedule();
    };
    pi.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); pi.blur(); } };
    wrap.append(b, pi);
    roles.appendChild(wrap);
  });
  const box = $('script');
  if (!lines.length) { box.innerHTML = '<div class="empty">Pick a project - its script shows here.</div>'; foot(); return; }
  box.innerHTML = '';
  lines.forEach((l, i) => {
    if (cues && me) {  // only my lines, each with the line before it as the cue
      const mine = l.who === me, nextMine = lines[i + 1] && lines[i + 1].who === me;
      if (!mine && !nextMine) return;
    }
    const d = document.createElement('div');
    const mine = solo ? i === cur && !l.dir : !l.dir && me && l.who === me;
    const cls = solo ? (i < cur ? ' past' : i === cur ? ' mine' : ' other') : l.dir ? ' dir' : mine ? ' mine' : me ? ' other' : '';
    d.className = 'ln' + (l.dir ? ' dir' : '') + cls + (i === cur ? ' cur' : '') + (i === mark ? ' ckpt' : '')  /* (not 'mark': that is the logo square's class) */ + (cues && !mine && !solo ? ' cue' : '');
    d.dataset.i = i;
    if (!l.dir && l.who) d.style.setProperty('--c', color(l.who));  // (a script with no characters: the solo colour)
    const cut = /[—–-]\s*$/.test(l.text);
    d.innerHTML = l.dir ? `<div class="t">[${esc(l.text)}]</div>`
      : `<div class="who">${esc(l.who)}</div><div class="t">${esc(l.text)}</div>${mine && cut ? '<span class="badge">נקטע כאן — תמשיך לדבר</span>' : ''}`;
    d.insertAdjacentHTML('beforeend', '<div class="bar"></div>' + (i === mark
      ? `<button class="flag" title="Back here and play"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>נקודת התחלה</button>`
      : `<button class="pin" title="Checkpoint here - start again from this line"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>`));
    const fl = d.querySelector('.flag'), pin = d.querySelector('.pin');  // the mouse: set it on this line, or go back to it
    if (fl) fl.onclick = (e) => { e.stopPropagation(); toMark(); };
    if (pin) pin.onclick = (e) => { e.stopPropagation(); mark = i; save(); render(); };
    d.onclick = () => { if (!String(window.getSelection() || '').trim()) go(i); };  // selecting text to copy is not a jump
    d.ondblclick = (e) => { e.preventDefault(); editLine(i); };
    box.appendChild(d);
  });
  document.documentElement.style.setProperty('--fs', fs + 'px');
  $('tomark').disabled = mark == null;
  $('mark').classList.toggle('on', mark != null && mark === cur);
  $('cues').classList.toggle('on', cues);
  center();
  foot();
}

function foot() {
  const f = $('foot');
  if (!lines.length) { f.innerHTML = ''; return; }
  if (solo) {
    const left = lines.slice(cur).reduce((t, l) => t + lineSeconds(l), 0);
    f.innerHTML = `<span>שורה <b>${cur + 1}</b> מתוך ${lines.length}</span><span>עוד ~${Math.max(1, Math.round(left / 60))} דק׳</span>` +
      `<span class="keys">Space play/pause · ${mark != null ? 'Home checkpoint (again: start)' : 'Home start'} · ↓ next · ↑ back</span>`;
    return;
  }
  const mineIdx = lines.map((l, i) => (l.who === me ? i : -1)).filter((i) => i >= 0);
  const done = mineIdx.filter((i) => i < cur).length;
  const next = mineIdx.find((i) => i >= cur);
  f.innerHTML = `<span>שורה <b>${cur + 1}</b> מתוך ${lines.length}</span>` +
    (me ? `<span>${me}: <b>${Math.min(done + 1, mineIdx.length)}</b> מתוך ${mineIdx.length}</span>` +
      `<span>${next == null ? 'סיימת את השורות שלך 🎬' : next === cur ? '<b>עכשיו את/ה</b>' : `עוד ${next - cur} שורות עד שלך`}</span>` : '<span>בחר/י דמות למעלה (1-9)</span>') +
    `<span class="keys">Space play/pause · ${mark != null ? 'Home checkpoint (again: start)' : 'Home start'} · ↓ next · ← my next line · → my previous · ↑ back</span>`;
}

function center() {
  const el = document.querySelector(`.ln[data-i="${cur}"]`) || [...document.querySelectorAll('.ln')].find((x) => +x.dataset.i > cur);
  if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
function go(i) { cur = Math.max(0, Math.min(lines.length - 1, i)); save(); render(); if (playing) schedule(); }

// Play: moves from bubble to bubble at the script's pace (words per minute) plus a short beat; a stage
// direction a moment, your own lines a little longer (room to act).
// pace = words per minute (a general measure, not "1x of something"); each script can lock its own
const DEFAULT_WPM = 270;
let playing = false, timer = null, wpm = DEFAULT_WPM, locked = false;

// measure a character's pace: pick the character, Measure, Start when you start saying his line, Stop when you
// finish - Save sets his pace (the player's own formula, lineSeconds, backwards). A script without characters: the pace.
let meas = null;  // {i, who, t0, raf, pace, secs}
const wordsOf = (l) => l.text.split(/\s+/).filter(Boolean).length;
function measureOpen() {
  if (playing) setPlay(false);
  cancelCd();
  let i = cur;
  if (me && lines[i]?.who !== me) {  // the picked character's line: the next one from here (else his first)
    const n = lines.findIndex((l, k) => k >= cur && l.who === me);
    i = n >= 0 ? n : lines.findIndex((l) => l.who === me);
    if (i >= 0) go(i);
  }
  const l = lines[i];
  if (!l || l.dir) return;
  if (meas?.raf) cancelAnimationFrame(meas.raf);
  meas = { i, who: l.who || null, t0: 0, pace: null };
  $('measWho').textContent = `⏱ ${meas.who || 'Pace'}`;
  $('measT').textContent = `Read the marked line (${wordsOf(l)} words) - Start when you start, Stop when you finish.`;
  $('measGo').textContent = 'Start';
  $('measAgain').hidden = true;
  $('meas').classList.add('on'); $('meas').classList.remove('run');
  placeMeas();
}
function placeMeas() {  // right under the Measure button, inside the window
  const r = $('measure').getBoundingClientRect(), m = $('meas');
  m.style.top = `${Math.round(r.bottom + 8)}px`;
  m.style.left = `${Math.round(Math.max(8, Math.min(innerWidth - 328, r.left + r.width / 2 - 160)))}px`;
}
addEventListener('resize', () => { if ($('meas').classList.contains('on')) placeMeas(); });
function measureClose() { if (meas?.raf) cancelAnimationFrame(meas.raf); meas = null; $('meas').classList.remove('on', 'run'); }
function measureStep() {  // Start -> Stop -> Save
  if (!meas) return;
  if (meas.pace != null) {  // Save
    if (meas.who) paces[meas.who] = meas.pace; else { wpm = meas.pace; showPace(); }
    save(); render(); foot();
    if (playing) schedule();
    measureClose();
    return;
  }
  if (!meas.t0) {  // Start: the clock runs on screen
    meas.t0 = performance.now();
    $('meas').classList.add('run'); $('measGo').textContent = 'Stop';
    const tick = () => { if (!meas?.t0 || meas.pace != null) return; $('measT').textContent = `${((performance.now() - meas.t0) / 1000).toFixed(1)} s`; meas.raf = requestAnimationFrame(tick); };
    tick();
    return;
  }
  // Stop: the pace that makes this line last exactly that long (your own lines get 10% + 0.15 s more, every line 0.3 s)
  const secs = (performance.now() - meas.t0) / 1000, l = lines[meas.i], words = wordsOf(l);
  const speak = (l.who && l.who === me ? (secs - 0.15) / 1.1 : secs) - 0.3;
  meas.pace = Math.max(60, Math.min(600, Math.round((words * 60) / Math.max(0.3, speak) / 5) * 5));
  $('meas').classList.remove('run');
  $('measWho').textContent = `${meas.who || 'Pace'}: ${meas.pace} wpm`;
  $('measT').textContent = `${words} words in ${secs.toFixed(1)} s`;
  $('measGo').textContent = 'Save';
  $('measAgain').hidden = false;
}
$('measure').onclick = measureOpen;
$('measGo').onclick = measureStep;
$('measAgain').onclick = measureOpen;
$('measX').onclick = measureClose;
document.addEventListener('keydown', (e) => {  // (first: while measuring, Space is the stopwatch - not Play; Enter saves)
  if (!meas) return;
  if (e.code === 'Space' && meas.pace == null) { e.preventDefault(); e.stopImmediatePropagation(); measureStep(); }
  else if (e.key === 'Enter') { e.preventDefault(); e.stopImmediatePropagation(); measureStep(); }
  else if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); measureClose(); }
  else if (e.code === 'Space') { e.preventDefault(); e.stopImmediatePropagation(); }
}, true);

function lineSeconds(l) {
  if (l.dir) return 0.8;
  const words = l.text.split(/\s+/).filter(Boolean).length;
  const base = 0.3 + words / (((l.who && paces[l.who]) || wpm) / 60);  // the speaker's own pace, if set
  return l.who === me ? base * 1.1 + 0.15 : base;
}
function schedule() {
  clearTimeout(timer);
  if (!playing || !lines.length) return;
  const secs = lineSeconds(lines[cur]);
  const bar = document.querySelector(`.ln[data-i="${cur}"] .bar`);
  if (bar) {  // fill the current bubble's bar over its time
    bar.classList.remove('run'); bar.style.transitionDuration = '0s'; bar.style.width = '0';
    requestAnimationFrame(() => requestAnimationFrame(() => { bar.classList.add('run'); bar.style.transitionDuration = secs + 's'; bar.style.width = '100%'; }));
  }
  timer = setTimeout(() => {
    if (cur >= lines.length - 1) return setPlay(false);
    let n = cur + 1;
    if (cues && me) while (n < lines.length - 1 && lines[n].who !== me && lines[n + 1]?.who !== me) n++;  // cue mode skips hidden lines
    go(n);
  }, secs * 1000);
}
// a countdown before it starts (off / 3 / 5 / 10 s) - time to get into position; Space again cancels it
let cdSecs = +(store.get('reader-cd') ?? 3), cdTimer = null;
function showCd() { $('cd').value = String(cdSecs); }  // the studio picker follows the select by itself
function cancelCd() { clearInterval(cdTimer); cdTimer = null; $('count').classList.remove('on'); }
function startWithCountdown() {
  if (!cdSecs) return setPlay(true);
  let n = cdSecs;
  const tick = () => {
    if (n <= 0) { cancelCd(); return setPlay(true); }
    $('countN').textContent = n; $('countN').style.animation = 'none'; void $('countN').offsetWidth; $('countN').style.animation = '';
    $('count').classList.add('on'); n--;
  };
  tick(); cdTimer = setInterval(tick, 1000);
  $('play').textContent = '✕ Cancel';
}
function toggle() { if (cdTimer) { cancelCd(); setPlay(false); } else if (playing) setPlay(false); else startWithCountdown(); }
function setPlay(on) {
  playing = on;
  $('play').textContent = on ? '❚❚ Pause' : '▶ Play';
  if (on) { schedule(); return; }
  clearTimeout(timer);
  // a stop: the line is ready again from its start (he records a line whole) - the bar is empty at once, never sliding back
  document.querySelectorAll('.ln .bar').forEach((b) => { b.classList.remove('run'); b.style.transitionDuration = '0s'; b.style.width = '0'; });
}
function pick(c) { me = me === c ? null : c; save(); render(); }
function myStep(d) {
  for (let i = cur + d; i >= 0 && i < lines.length; i += d) if (lines[i].who === me) return go(i);
}
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

document.addEventListener('keydown', (e) => {
  if ($('dlg').open || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable || (e.target.tagName === 'INPUT' && e.target.type !== 'range')) return;  // typing: no shortcuts
  if ((e.key === 'e' || e.key === 'E' || e.key === 'ק') && lines[cur]) { e.preventDefault(); return editLine(cur); }
  if (/^[1-9]$/.test(e.key) && chars[+e.key - 1]) return pick(chars[+e.key - 1]);
  if (e.code === 'KeyM') { e.preventDefault(); return setMark(); }
  if (e.code === 'KeyB') { e.preventDefault(); return toMark(); }
  if (e.key === 'Enter') { e.preventDefault(); return toggle(); }
  if (e.code === 'Space') { e.preventDefault(); return toggle(); }  // Space = play (after the countdown) / pause; Home first = from the start
  if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); go(cur + 1); }
  else if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); go(cur - 1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); me ? myStep(-1) : go(cur - 1); }  // RTL: right = back
  else if (e.key === 'ArrowLeft') { e.preventDefault(); me ? myStep(1) : go(cur + 1); }
  else if (e.key === 'Home') { e.preventDefault(); go(mark != null && cur !== mark ? mark : 0); }  // the checkpoint first; on it, Home again = the start
  else if (e.key === 'End') { e.preventDefault(); go(lines.length - 1); }
});
$('bigger').onclick = () => { fs = Math.min(64, fs + 3); store.set('reader-fs', fs); render(); };
$('smaller').onclick = () => { fs = Math.max(16, fs - 3); store.set('reader-fs', fs); render(); };
$('cues').onclick = () => { cues = !cues; render(); if (playing) schedule(); };
$('play').onclick = () => toggle();
$('cd').onchange = () => { cdSecs = +$('cd').value; store.set('reader-cd', cdSecs); $('cd').blur(); };
showCd();
function showPace() {
  document.querySelectorAll('.rp').forEach((x) => (x.placeholder = wpm));
  $('pace').value = wpm;
  if (document.activeElement !== $('paceN')) $('paceN').value = wpm;  // not while you're typing in it
  $('pace').disabled = $('paceN').disabled = locked;
  $('lock').classList.toggle('on', locked);
  $('lock').textContent = locked ? '🔒' : '🔓';
  $('lock').title = locked ? `Locked: this script reads at ${wpm} words/min — click to unlock` : 'Lock this pace (words per minute) for this script';
}
$('pace').oninput = (e) => { wpm = +e.target.value; showPace(); save(); if (playing) schedule(); };
// the pace typed as a number: applied on Enter or when you click away (60-600 words per minute)
const typedPace = () => {
  const v = Math.round(+$('paceN').value);
  if (v) { wpm = Math.max(60, Math.min(600, v)); save(); if (playing) schedule(); }
  $('paceN').value = wpm; showPace();
};
$('paceN').onchange = typedPace;
showPace();  // the number is there before any script is picked
$('paceN').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); typedPace(); $('paceN').blur(); } if (e.key === 'Escape') { $('paceN').value = wpm; $('paceN').blur(); } };
$('lock').onclick = () => { locked = !locked; save(); showPace(); };
$('restart').onclick = () => { cancelCd(); setPlay(false); go(0); startWithCountdown(); };
// ---- the checkpoint: a line to start again from when you stop ----
function setMark() { mark = mark === cur ? null : cur; save(); render(); }
function toMark() { if (mark == null) return; cancelCd(); setPlay(false); go(mark); startWithCountdown(); }
$('mark').onclick = setMark;
$('tomark').onclick = toMark;
$('paste').onclick = () => { $('txt').value = store.get('reader-pasted') || ''; $('nm').value = ''; $('dlg').showModal(); };
$('cancel').onclick = () => $('dlg').close();
// Copy: the whole script as it is written (names, lines, notes) - or the lines as shown if there is no source text
$('copy').onclick = async () => {
  const text = raw || lines.map((l) => (l.dir ? `[${l.text}]` : l.who ? `${l.who}: ${l.text}` : l.text)).join('\n');
  if (!text.trim()) return;
  try { await navigator.clipboard.writeText(text); }
  catch { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  $('copy').textContent = '✓ Copied';
  setTimeout(() => ($('copy').textContent = 'Copy'), 1500);
};
$('use').onclick = async () => {
  const t = $('txt').value, name = $('nm').value.trim();
  $('dlg').close();
  const cur = $('ep').value;
  if (cur && !cur.startsWith('script:')) {  // the current project's script (one project, every tool)
    await fetch(`/api/ep/${encodeURIComponent(cur)}/script`, { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text: t }) });
    store.set('reader-src', cur); load(t, cur);
    return;
  }
  if (name) {  // keep it: it shows up in the project list from now on
    const r = await fetch('/api/scripts', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name, text: t }) });
    const { id } = await r.json();
    await fillPicker();
    $('ep').value = 'script:' + id; store.set('reader-src', 'script:' + id); load(t, 'script:' + id);
    return;
  }
  store.set('reader-pasted', t);
  $('ep').value = ''; store.set('reader-src', 'pasted'); load(t, 'pasted:' + hash(t));
};
$('ep').addEventListener('studio-done', async (e) => {  // the menu's ✓ - the same flag the video editor shows
  await fetch(`/api/ep/${encodeURIComponent(e.detail.value)}/done`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ done: e.detail.done }) });
});
$('ep').onchange = async () => {
  const id = $('ep').value;
  if (!id) return;
  store.set('reader-src', id);
  if (!id.startsWith('script:')) { try { sessionStorage.setItem('zc-ep', id); localStorage.setItem('zc-ep', id); } catch {} }  // this tab's project, for its tools
  const r = await fetch(id.startsWith('script:') ? `/api/scripts/${encodeURIComponent(id.slice(7))}` : `/api/ep/${id}/script`);
  load(r.ok ? await r.text() : '', id);
  if (!r.ok) $('script').innerHTML = '<div class="empty">This project has no script yet - press Paste to add it.</div>';
};
addEventListener('storage', (e) => {  // a project picked in the editor or Karaoke: its script here
  if (e.key === 'zc-ep' && e.newValue && e.storageArea === sessionStorage && e.newValue !== $('ep').value) { $('ep').value = e.newValue; $('ep').onchange(); }
});

// ---- edit a line: double-click it (or E for the current one), Enter saves, Esc cancels --------------------------
function editLine(i) {
  if (!lines[i] || document.querySelector('.t.editing')) return;
  setPlay(false);
  cancelCd();
  if (cur !== i) go(i);  // go() redraws the script - so the line is picked up after it
  const el = document.querySelector(`.ln[data-i="${i}"] .t`);
  if (!el) return;
  const before = lines[i].text;
  el.textContent = before;  // without the [ ] of a stage direction
  el.contentEditable = 'plaintext-only';
  el.classList.add('editing');
  el.focus();
  document.getSelection().selectAllChildren(el);
  let done = false;
  const finish = async (keep) => {
    if (done) return;
    done = true;
    el.contentEditable = 'false';
    const after = el.textContent.replace(/\s+/g, ' ').trim();
    if (keep && after && after !== before) await saveLine(i, before, after);
    render();
  };
  el.onkeydown = (e) => {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  };
  el.onblur = () => finish(true);
}

async function saveLine(i, before, after) {
  // the line in the original text: the n-th raw line holding this text (n = how many lines before it say the same)
  const nth = lines.slice(0, i).filter((l) => l.text === before).length;
  const rows = raw.split(/\r?\n/);
  let seen = 0, at = -1;
  for (let r = 0; r < rows.length; r++) {
    if (rows[r].trim().startsWith('#') || !rows[r].includes(before)) continue;
    if (seen++ === nth) { at = r; break; }
  }
  let next;
  if (at >= 0) {
    rows[at] = rows[at].replace(before, after);
    next = rows.join('\n');
  } else {  // the line was wrapped over several rows in the file: write the script out again, line by line
    lines[i].text = after;
    const head = raw.split(/\r?\n/).filter((r) => r.trim().startsWith('#'));
    next = [...head, ...lines.map((l) => (l.dir ? `[${l.text}]` : l.solo || !l.who ? l.text : `${l.who}: ${l.text}`))].join('\n');
  }
  lines[i].text = after;
  raw = next;
  try {
    if (src.startsWith('script:')) {
      await fetch(`/api/scripts/${encodeURIComponent(src.slice(7))}`, { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text: next }) });
    } else if (src.startsWith('pasted:')) {
      const key = 'pasted:' + hash(next);  // the pasted script's state (character, place, pace) moves with it
      store.set('reader-' + key, store.get('reader-' + src) || '{}');
      store.set('reader-pasted', next);
      src = key;
    } else if (src) {
      await fetch(`/api/ep/${src}/script`, { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text: next }) });
    }
  } catch {}
}

let known = [];
async function fillPicker() {  // episodes (their script.txt) and saved scripts (prompter texts, pasted dialogues)
  const eps = await fetch('/api/episodes').then((r) => r.json()).catch(() => []);
  const scripts = await fetch('/api/scripts').then((r) => r.json()).catch(() => []);
  known = [...eps.filter((e) => !e.id.endsWith('-test')).map((e) => e.id), ...scripts.map((x) => 'script:' + x.id)];
  const esc = (x) => String(x ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const day = (ms) => (ms ? new Date(ms).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '');
  $('ep').innerHTML = '<option value="">—</option>' +   // the same projects as the video editor (studio/bar.js): one project, every tool
    eps.filter((e) => !e.id.endsWith('-test')).map((e) => `<option value="${esc(e.id)}" data-sub="${esc(e.title)}" data-done="${e.done ? 1 : 0}" data-meta="${esc(e.template || '')} · ${day(e.created)}">${esc(e.id)}</option>`).join('');
}
(async () => {
  await fillPicker();
  const last = store.get('reader-src');
  if (last === 'pasted') { const t = store.get('reader-pasted') || ''; load(t, 'pasted:' + hash(t)); }
  else if (tabEp() && known.includes(tabEp())) { $('ep').value = tabEp(); $('ep').onchange(); }  // this tab's project
  else if (last && known.includes(last)) { $('ep').value = last; $('ep').onchange(); }
})();
// the right arrow goes back in a right-to-left script, the left arrow goes forward (like turning pages)
</script>
</body>
</html>
