<!-- shlomiverse.com/ serves this page itself (firebase.json), no hop through another page: the address becomes /wiki/
     before anything relative loads. wholos.com shares this site until it moves: its home is /wholos/. -->
<script>
  if (/(^|\.)wholos\.com$/.test(location.hostname)) location.replace('/wholos/' + location.search + location.hash);
  // real addresses (2026-11-03): shlomiverse.com/c/hani, /play/<game>, /v/<video>. An old link - /wiki/..., #/c/hani
  // (shared before, a push, a story, a chat card) - lands on the same page under its new address
  else {
    const old = location.hash.startsWith('#/') ? location.hash.slice(1) : null;
    const p = location.pathname.replace(/^\/wiki(\/index\.html|\/)?/, '/') || '/';
    if (old || p !== location.pathname) {
      const [op, oq] = (old || '').split('?');
      const qs = [location.search.slice(1), oq].filter(Boolean).join('&');
      history.replaceState(null, '', (old ? op : p) + (qs ? '?' + qs : ''));
    }
  }
  // a new visit opens at the top (the browser was bringing back the old scroll, hiding the top bar)
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
</script>

<style>
  :root {
    --bg: #0b0b0e; --card: #15151a; --card2: #1d1d23; --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.16);
    --text: #f5f4f1; --dim: #a6a3ad; --faint: #6f6c77; --accent: #ff6a1f; --on-accent: #fff; --shade: rgba(0,0,0,.62);
    --r: 16px; color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f5f3ef; --card: #ffffff; --card2: #ece9e3; --line: rgba(0,0,0,.08); --line2: rgba(0,0,0,.16);
    --text: #17161a; --dim: #5d5a64; --faint: #8b8892; --shade: rgba(20,18,16,.5); color-scheme: light;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  /* the end of the verse (pages.notFound) */
  .eov { position: relative; min-height: calc(100svh - 64px); display: flex; flex-direction: column; justify-content: flex-end; align-items: center; text-align: center;
    padding: 0 20px 12vh; background: #050506 url('/verse/end-of-verse.jpg?v=3') center 30% / cover no-repeat; overflow: hidden; }
  .eov::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 35%, rgba(5, 5, 6, .55) 62%, #050506 96%); pointer-events: none; }
  .eov > * { position: relative; z-index: 1; }
  .eov h1 { font-size: clamp(2rem, 7vw, 3.4rem); font-weight: 900; line-height: 1.1; color: #fff; letter-spacing: -.01em; text-shadow: 0 2px 30px rgba(0, 0, 0, .8); }
  .eov p { margin-top: 12px; color: rgba(255, 255, 255, .72); font-size: 1.08rem; max-width: 420px; }
  .eov .eov-home { margin-top: 26px; display: inline-flex; align-items: center; gap: 0; height: 56px; padding: 0 28px; border-radius: 99px; background: #141418; color: #fff; border: 1.5px solid #ff6a1f;
    font-weight: 900; font-size: 1.08rem; box-shadow: 0 0 32px rgba(255, 106, 31, .45); text-decoration: none; }
  .eov .eov-wm { font-weight: 900; letter-spacing: -.03em; font-size: 1.2em; } .eov .eov-wm b { color: #ff6a1f; font-weight: inherit; }
  @media (max-width: 700px) { .eov { background-size: 165% auto; background-position: 10% top; } }
  body { background: var(--bg); color: var(--text); font-family: 'Heebo', sans-serif; line-height: 1.55; min-height: 100svh; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  img, video { display: block; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 24px; }

  /* ---------- top bar ---------- */
  .top { position: fixed; top: 0; inset-inline: 0; z-index: 30; transition: background .2s, border-color .2s; border-bottom: 1px solid transparent; }
  .top.solid, body:not(.at-home) .top { background: var(--bg); border-color: var(--line); }
  .top .wrap { display: flex; align-items: center; gap: 22px; height: 64px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 1.45rem; letter-spacing: -.02em; }
  .brand .pill { font-size: .7rem; font-weight: 800; background: var(--accent); color: var(--on-accent); padding: 2px 8px; border-radius: 99px; letter-spacing: 0; }
  .nav { display: flex; gap: 2px; }
  .nav a { padding: 8px 12px; border-radius: 9px; color: var(--dim); font-weight: 500; transition: color .15s, background .15s; }
  .nav a:hover { color: var(--text); }
  .nav a.on { color: var(--text); }
  .nav a.on::after { content: ''; display: block; height: 2px; background: var(--accent); border-radius: 2px; margin-top: 4px; }
  .search { position: relative; width: 300px; margin-inline-start: auto; }
  .search input { width: 100%; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; padding: 0 38px 0 12px; outline: none; transition: border-color .15s; }
  .search input:focus { border-color: var(--line2); }
  .search > svg { position: absolute; right: 12px; top: 11px; width: 18px; height: 18px; color: var(--faint); pointer-events: none; }
  .results { position: absolute; top: 46px; inset-inline: 0; background: var(--card); border: 1px solid var(--line2); border-radius: 12px; padding: 6px; display: none; max-height: 70vh; overflow: auto; box-shadow: 0 16px 40px rgba(0,0,0,.35); }
  .results.open { display: block; }
  .results a { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; }
  .results a:hover { background: var(--card2); }
  .results img, .results .ph { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; flex: none; font-size: .9rem; }
  .results .k { color: var(--faint); font-size: .78rem; margin-inline-start: auto; }
  .icon-btn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); display: grid; place-items: center; flex: none; transition: border-color .15s; }
  .icon-btn:hover { border-color: var(--line2); }
  .icon-btn svg { width: 18px; height: 18px; }

  /* ---------- hero: the wall of faces ---------- */
  .hero { position: relative; height: max(640px, min(94svh, 900px)); overflow: hidden; perspective: 1100px; display: grid; place-items: center; }
  .wall { position: absolute; top: -30%; bottom: -30%; width: 44%; display: flex; gap: 14px; transform-style: preserve-3d; opacity: .62; pointer-events: none; }
  .wall.r { right: -6%; transform: rotateY(-34deg); transform-origin: right center; -webkit-mask-image: linear-gradient(to left, #000 35%, transparent 96%); mask-image: linear-gradient(to left, #000 35%, transparent 96%); }
  .wall.l { left: -6%; transform: rotateY(34deg); transform-origin: left center; -webkit-mask-image: linear-gradient(to right, #000 35%, transparent 96%); mask-image: linear-gradient(to right, #000 35%, transparent 96%); }
  .col { flex: 1; display: flex; flex-direction: column; gap: 14px; animation: drift 90s linear infinite; }
  .col:nth-child(2) { animation-duration: 110s; animation-direction: reverse; }
  .col:nth-child(3) { animation-duration: 130s; }
  @keyframes drift { from { transform: translateY(0); } to { transform: translateY(-50%); } }
  .tile { aspect-ratio: 4 / 5; border-radius: 14px; overflow: hidden; position: relative; background: var(--card2); flex: none; }
  .tile img { width: 100%; height: 100%; object-fit: cover; }
  .tile span { position: absolute; bottom: 0; inset-inline: 0; padding: 22px 12px 10px; font-weight: 800; font-size: .95rem; color: #fff; background: rgba(0,0,0,.45); }
  .hero-in { position: relative; z-index: 2; width: min(720px, 92vw); text-align: center; padding-top: 40px; }
  .brand b, .wordmark b { color: var(--accent); font-weight: inherit; }  /* the wordmark: שלומי in the text colour, וורס in orange - everywhere */
  .wordmark { font-size: clamp(3.4rem, 10vw, 7.4rem); font-weight: 900; letter-spacing: -.045em; line-height: .9; }
  .wordmark small { display: block; font-size: clamp(1rem, 1.7vw, 1.45rem); letter-spacing: 0; font-weight: 700; color: var(--dim); margin-top: 16px; line-height: 1.3; }
  .ask { margin-top: 30px; display: flex; align-items: center; gap: 10px; background: var(--card); border: 2px solid var(--accent); border-radius: 18px; padding: 8px; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
  .ask, .composer { position: relative; }
  /* the @ list: one character per line above the box (like WhatsApp / Instagram); its buttons must not take the send
     button's look, hence the !important resets */
  .at-box { position: absolute; bottom: calc(100% + 8px); inset-inline: 0; z-index: 30; display: flex; flex-direction: column; gap: 2px; max-height: 270px; overflow-y: auto;
            padding: 6px; background: rgba(24, 23, 28, .98); border: 1px solid var(--line2); border-radius: 18px; box-shadow: 0 14px 36px rgba(0, 0, 0, .55); text-align: start; }
  .at-box[hidden] { display: none; }
  .ask .at-box { top: calc(100% + 8px); bottom: auto; }   /* the home's box: the list opens under it; the chat's box sits at the bottom, so its list opens above */
  .at-box button.at-i { display: flex !important; align-items: center; gap: 12px; width: 100% !important; height: auto !important; min-height: 52px; padding: 6px 8px !important;
                        border-radius: 12px !important; background: transparent !important; border: 0 !important; color: var(--text) !important; text-align: start; transform: none !important; }
  .at-box button.at-i:hover, .at-box button.at-i:active { background: rgba(255, 255, 255, .08) !important; }
  .at-box .av { width: 38px; height: 38px; border-radius: 50%; overflow: hidden; flex: none; background: var(--card2); }
  .at-box .av img, .at-box .av .ph { width: 100%; height: 100%; object-fit: cover; }
  .at-box .n { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
  .at-box .n b { font-size: .98rem; font-weight: 800; }
  .at-box .n small { font-size: .8rem; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ask .spark { width: 40px; height: 40px; display: grid; place-items: center; color: var(--accent); flex: none; }
  .ask .spark svg { width: 22px; height: 22px; }
  .ask input { flex: 1; min-width: 0; height: 48px; background: none; border: 0; outline: none; color: var(--text); font: inherit; font-size: 1.12rem; }
  .ask button { width: 50px; height: 50px; border-radius: 13px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; transition: transform .15s; }
  .ask button:hover { transform: scale(1.04); }
  .ask button svg { width: 20px; height: 20px; transform: scaleX(-1); }
  .who { margin-top: 18px; display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
  .who-l { width: 100%; color: var(--dim); font-size: .88rem; margin-bottom: -4px; }
  .who button { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 66px; font-size: .78rem; color: var(--dim); line-height: 1.2; transition: color .15s; }
  .who button .av { width: 54px; height: 54px; border-radius: 50%; overflow: hidden; outline: 2px solid transparent; outline-offset: 2px; transition: outline-color .15s, transform .15s; background: var(--card2); }
  .who button .av img, .who button .av .ph { width: 100%; height: 100%; object-fit: cover; }
  .who button:hover .av { transform: translateY(-2px); }
  .who button.on { color: var(--text); font-weight: 700; }
  .who button.on .av { outline-color: var(--c, var(--accent)); }
  .scroll-hint { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); color: var(--faint); font-size: .85rem; z-index: 2; white-space: nowrap; }

  /* ---------- sections ---------- */
  main { min-height: 70svh; }
  body:not(.at-home) main { padding-top: 64px; }
  .sec { margin-top: 56px; }
  .sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .sec-h h2 { font-size: 1.7rem; font-weight: 900; letter-spacing: -.02em; }
  .sec-h a { color: var(--dim); font-size: .95rem; transition: color .15s; }
  .sec-h a:hover { color: var(--accent); }
  .page-h { padding: 40px 0 6px; }
  .page-h h1 { font-size: clamp(2.2rem, 5vw, 3.2rem); font-weight: 900; letter-spacing: -.03em; line-height: 1.05; }
  .page-h p { color: var(--dim); margin-top: 8px; font-size: 1.05rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 22px; }
  .chip { height: 36px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--line); color: var(--dim); font-size: .92rem; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; transition: border-color .15s, color .15s; }
  .chip:hover { color: var(--text); border-color: var(--line2); }
  .chip.on { color: var(--text); border-color: var(--text); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
  .ph { display: grid; place-items: center; color: var(--pc, var(--dim)); background: var(--card2); width: 100%; height: 100%; }
  .ph svg { width: 46%; height: 46%; opacity: .55; }

  /* character poster cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; transition: border-color .15s, transform .2s; position: relative; }
  .card:hover { border-color: var(--c, var(--line2)); transform: translateY(-3px); }
  .card .pic { aspect-ratio: 4 / 5; background: var(--card2); overflow: hidden; display: block; }
  .card .pic img { width: 100%; height: 100%; object-fit: cover; transition: transform .3s; }
  .card:hover .pic img { transform: scale(1.04); }
  .card .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .card .name { font-weight: 900; font-size: 1.12rem; line-height: 1.2; }
  .card .tag-line { color: var(--dim); font-size: .88rem; line-height: 1.35; }
  .card .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 10px; }
  .stag { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 700; color: var(--dim); }
  .talk-mini { display: inline-flex; align-items: center; gap: 5px; font-size: .82rem; font-weight: 800; color: var(--c, var(--accent)); padding: 5px 10px; border-radius: 99px; border: 1px solid var(--line2); transition: background .15s, color .15s, border-color .15s; flex: none; }
  .talk-mini:hover { background: var(--c, var(--accent)); color: #111; border-color: transparent; }
  .talk-mini svg { width: 14px; height: 14px; }

  /* videos */
  .row { display: grid; grid-auto-flow: column; grid-auto-columns: 178px; gap: 14px; overflow-x: auto; padding-bottom: 10px; scroll-snap-type: x mandatory; scrollbar-width: thin; }
  .vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 16px; }
  .vid { scroll-snap-align: start; display: flex; flex-direction: column; gap: 8px; text-align: right; }
  .vid .thumb { position: relative; aspect-ratio: 9 / 16; border-radius: 14px; overflow: hidden; background: var(--card2); border: 1px solid var(--line); width: 100%; }
  .vid .thumb img, .vid .thumb video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .vid .play { position: absolute; inset: 0; display: grid; place-items: center; transition: opacity .2s; z-index: 1; }
  .vid .play span { width: 48px; height: 48px; border-radius: 50%; background: rgba(0,0,0,.55); display: grid; place-items: center; }
  .vid .play svg { width: 18px; height: 18px; fill: #fff; margin-inline-end: -3px; }
  .vid.previewing .play { opacity: 0; }
  .vid .t { font-weight: 800; font-size: 1rem; line-height: 1.3; }
  .vid .who { color: var(--dim); font-size: .84rem; }
  .vid .ext { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.6); color: #fff; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; z-index: 2; }

  /* series */
  .sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
  /* the characters' sites: a swipe row on the home, a grid on #/sites - each tile its site's own picture */
  .sec-sub { color: var(--dim); font-size: .92rem; margin-top: 4px; }
  .srow { display: grid; grid-auto-flow: column; grid-auto-columns: 270px; gap: 14px; overflow-x: auto; padding-bottom: 10px; scroll-snap-type: x mandatory; scrollbar-width: thin; }
  .srow > * { scroll-snap-align: start; }
  .sitegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
  .site-t { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; transition: border-color .15s; min-width: 0; }
  .site-t:hover { border-color: var(--line2); }
  .st-pic { display: block; aspect-ratio: 1.91 / 1; background: var(--card2); overflow: hidden; }
  .st-pic img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
  .site-t:hover .st-pic img { transform: scale(1.03); }
  .st-body { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px 0; color: inherit; min-width: 0; }

  .st-body small { color: var(--dim); font-size: .84rem; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .st-games span { color: var(--faint); font-size: .74rem; flex: none; margin-inline-end: 2px; }
  .st-games a { flex: none; width: 44px; height: 44px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line2); background: var(--card2); }
  .st-games img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .st-ft { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px 14px; }
  .st-own { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; border: 1.5px solid var(--line2); display: block; flex: none; }
  .st-own img, .st-own .ph { width: 100%; height: 100%; object-fit: cover; display: block; }
  .st-go { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--line2); background: var(--card2); color: var(--text); font-weight: 800; font-size: .86rem; transition: border-color .15s, color .15s; }
  .st-go svg { width: 15px; height: 15px; }
  .st-go:hover { border-color: var(--accent); color: var(--accent); }
  .site-g .sec-h h2 { display: flex; align-items: center; gap: 10px; font-size: 1.35rem; }
  .site-g .sec-h h2 .dot { width: 10px; height: 10px; }
  .topic-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 18px -2px 0; padding: 2px; }
  .topic-chips::-webkit-scrollbar { display: none; }
  .topic-chips button { flex: none; display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--line2); background: var(--card); color: var(--text); font: inherit; font-weight: 700; font-size: .9rem; cursor: pointer; transition: border-color .15s; }

<script>
const t = (e, x) => window.track && window.track(e, x);
const API = location.hostname === 'localhost' ? '/api/wikiChat' : 'https://europe-west1-boostmind-b052c.cloudfunctions.net/wikiChat';
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ICON = {
  play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  talk: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12a8 8 0 0 1-11.7 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
  send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  spark: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.6L21 11l-6.8 2.4L12 20l-2.2-6.6L3 11l6.8-2.4z"/></svg>',
  newChat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12a8.5 8.5 0 0 1-12.4 7.5L3.5 20.5l1.1-4.3A8.5 8.5 0 1 1 20.5 12z"/><path d="M12 8.5v7M8.5 12h7"/></svg>',
  // the logo's planet without its word (same mark as /verse/ui.js I.planet): the guide's face, the chat's "thinking"
  planet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" class="pl"><g transform="rotate(-16 12 12)"><path d="M1.5 12.6A10.5 4.3 0 0 1 22.5 12.6" stroke-width="2.4"/><circle cx="12" cy="12" r="7.6" fill="var(--pl-fill, #141218)" stroke-width="2"/><path d="M1.5 12.6A10.5 4.3 0 0 0 22.5 12.6" stroke-width="2.8"/></g></svg>',
  person: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 21c.8-4.4 4.2-7 8.5-7s7.7 2.6 8.5 7z"/></svg>',
  out: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7 7 17M8 7h9v9"/></svg>',
};
let W, C = {}, S = {}, V = {};
const GUIDE = { id: 'guide', name: 'שלומיוורס', tagline: 'מכיר את כולם, מוצא כל סרטון', color: '#ff6a1f' };
// the social layer (/verse/*.js) fills these in: accounts, the video page, stories, the bell, the guide's contact card
const HOOK = {};

// ---------- pieces ----------
const color = (c) => (c && c.color) || '#ff6a1f';
const face = (c) => c && c.id === 'guide' ? `<span class="gmark"><img src="/verse/logo-160.png" alt="שלומיוורס"></span>`
  : c && c.img ? `<img src="${c.img}" alt="${esc(c.name)}" loading="lazy">`
  : `<span class="ph" style="--pc:${color(c)}" title="${esc(c?.name)}">${ICON.person}</span>`;
const seriesColor = (s) => color(C[(s && s.characters.find((id) => C[id]?.img)) || s?.characters[0]]);
const stag = (sid) => S[sid] ? `<span class="stag"><span class="dot" style="background:${seriesColor(S[sid])}"></span>${esc(S[sid].title)}</span>` : '';
const talkBtn = (c) => `<button class="talk-mini" data-talk="${c.id}" style="--c:${color(c)}">${ICON.talk}שיחה</button>`;
const card = (c) => `<div class="card" style="--c:${color(c)}">
  <a class="pic" href="/c/${c.id}">${face(c)}</a>
  <div class="body"><a class="name" href="/c/${c.id}">${esc(c.name)}</a><span class="tag-line">${esc(c.tagline || c.role)}</span>
  <div class="foot">${stag(c.series)}${talkBtn(c)}</div></div></div>`;
// the home page is for what he makes now: his old Instagram reels (archive) sit at their own date, never in 'latest'
const fresh = () => W.videos.filter((v) => !v.archive);
// characters with the newest videos first (W.videos is newest first), the rest in the canon's order
const byNewest = (list) => list.map((c, k) => [c, fresh().findIndex((v) => v.cast.includes(c.id)), k])
  .sort((a, b) => ((a[1] < 0 ? 1e9 : a[1]) - (b[1] < 0 ? 1e9 : b[1])) || a[2] - b[2]).map((x) => x[0]);
const vcard = (v) => `<button class="vid" data-video="${v.id}">
  <div class="thumb">${v.poster ? `<img src="${v.poster}" alt="" loading="lazy">` : ''}<div class="play"><span>${ICON.play}</span></div>${v.url ? '<span class="ext">TikTok</span>' : ''}</div>
  <span class="t">${esc(v.title)}</span><span class="cast">${v.cast.filter((id) => C[id]).slice(0, 3).map((id) => `<span class="cast-c" data-char-link="${id}" role="link" tabindex="0">${C[id].img ? `<img src="${C[id].img}" alt="" loading="lazy">` : ''}${esc(C[id].name)}</span>`).join('')}</span></button>`;
const scard = (s) => `<a class="series" href="/s/${s.id}">
  <h3><span class="dot" style="background:${seriesColor(s)}"></span>${esc(s.title)}</h3>
  <p>${esc(s.blurb)}</p>
  <div class="faces">${s.characters.slice(0, 8).map((id) => face(C[id])).join('')}</div>
  <span class="meta">${s.characters.length} דמויות · ${s.videos.length} סרטונים</span></a>`;
const filterChips = (active, base) => `<div class="chips">
  <a class="chip ${active ? '' : 'on'}" href="${base}">הכול</a>
  ${W.series.map((s) => `<a class="chip ${active === s.id ? 'on' : ''}" href="${base}?s=${s.id}"><span class="dot" style="background:${seriesColor(s)}"></span>${esc(s.title)}</a>`).join('')}</div>`;

// ---------- the characters' own sites (W.site_list, built by scripts/wiki/build.py: every site once; a game inside a
// site carries `in` = that site's id). The bio link points here since 2026-11-01, so this is where people find them all.
// Designed with GPT Image (scripts/v2-design/sites-panel.mjs): a swipe row on the home, a page grouped by world.
const sitesTop = () => (W.site_list || []).filter((s) => !s.in);
// ---------- games: build.py games() - every live game, newest first, each with its characters (his ask 2026-11-03: games
// per character are part of the infrastructure; designs scripts/v2-design/games.mjs G-home / G-page / G-char). A game
// can have a site of its own too (Hani's playhouse) or live only here (Yaniv's) - either way it opens inside the verse.
const GT = { row: 'משחקים חדשים', all: 'לכל המשחקים', fresh: 'חדש', play: 'שחקו', title: 'המשחקים של השלומיוורס',
  sub: 'נגיעה אחת, והכול מתחיל לזוז.', allChip: 'כולם', of: (n) => `המשחקים של ${n}`, count: (n) => (n === 1 ? 'משחק אחד' : `${n} משחקים`) };   // Terra
const gamesOf = (id) => (W.games || []).filter((g) => (g.chars || []).includes(id));
const gOwner = (g) => C[(g.chars || []).find((id) => C[id])];
const gNew = (g) => g === (W.games || [])[0] && g.date && Date.now() - Date.parse(g.date) < 14 * 864e5;   // "new" = the newest one only, for two weeks
const gpic = (g) => `<span class="g-pic">${g.img ? `<img src="${esc(g.img)}" alt="" loading="lazy">` : ''}${gNew(g) ? `<em class="g-new">${GT.fresh}</em>` : ''}</span>`;
const gcard = (g, who = true) => { const o = who && gOwner(g); return `<a class="gcard" href="/play/${g.id}">${gpic(g)}
  <span class="g-body"><b>${esc(g.title)}</b>${g.tagline ? `<small>${esc(g.tagline)}</small>` : ''}</span>${o ? `<span class="g-own">${face(o)}</span>` : ''}</a>`; };
const gfeat = (g) => { const o = gOwner(g); return `<a class="gfeat" href="/play/${g.id}">${gpic(g)}
  <span class="g-body"><b>${esc(g.title)}</b>${g.tagline ? `<small>${esc(g.tagline)}</small>` : ''}
  ${o ? `<span class="g-who">${face(o)}${esc(o.name)}</span>` : ''}<span class="g-play">${ICON.play}${GT.play}</span></span></a>`; };
// a character's games on their page: the newest wide with "play", the rest a swipeable row
const charGamesSec = (c) => { const g = gamesOf(c.id); return g.length ? `<section class="sec gsec"><div class="sec-h"><div><h2>${esc(GT.of(c.name))}</h2><p class="sec-sub">${GT.count(g.length)}</p></div></div>
  ${gfeat(g[0])}${g.length > 1 ? `<div class="grow">${g.slice(1).map((x) => gcard(x, false)).join('')}</div>` : ''}</section>` : ''; };
// a group heading on the games page: the character's games site's own name when there is one ("המשחקייה של חני")
const gGroupTitle = (id, list) => { const site = (W.site_list || []).find((s) => !s.in && s.id === list[0].site && (s.whose || []).includes(id)); return site ? site.title : GT.of(C[id].name); };
const siteGames = (s) => (W.site_list || []).filter((g) => g.in === s.id);
// whose = [series ids first when a world owns it, then residents]: a company / world site shows no face, a person's does
const siteOwner = (s) => { const w = s.whose || []; return S[w[0]] ? null : w.map((id) => C[id]).find((c) => c && c.img); };
// the subjects (Terra picks one per site in build.py - scripts/wiki/site_topics.json), in the page's order
const SITE_TOPICS = [
  ['shop', 'חנויות', 'חנויות', '<path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>'],
  ['games', 'משחקים', 'משחקים', '<rect x="2.5" y="7" width="19" height="11" rx="5"/><path d="M7.5 10.5v4M5.5 12.5h4"/><circle cx="15.5" cy="11.5" r=".9" fill="currentColor"/><circle cx="17.5" cy="13.8" r=".9" fill="currentColor"/>'],
  ['spirit', 'רוחניות ותחזיות', 'רוחניות', '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M18.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/>'],
  ['community', 'קהילה ודת', 'קהילה ודת', '<path d="M4 20V10l8-5.5L20 10v10"/><path d="M9.5 20v-5a2.5 2.5 0 0 1 5 0v5M3 20h18"/>'],
  ['business', 'עסקים והייטק', 'עסקים', '<rect x="3" y="7.5" width="18" height="12" rx="2.5"/><path d="M9 7.5V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1.5M3 12.5h18"/>'],
  ['culture', 'ספרים, משפחה ותרבות', 'תרבות', '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/>'],
];
const topicIcon = (paths) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
const siteTile = (s, wide) => {   // wide: 'odd' = the odd one out of two phone columns, 'solo' = alone in its subject
  const o = siteOwner(s), games = siteGames(s);
  return `<div class="site-t${wide ? ' wide ' + wide : ''}">
    <a class="st-pic" href="${esc(s.url)}" target="_blank" rel="noopener" data-site-out="${s.id}">${s.img ? `<img src="${esc(s.img)}" alt="" loading="lazy">` : ''}</a>
    <a class="st-body" href="${esc(s.url)}" target="_blank" rel="noopener" data-site-out="${s.id}"><b>${esc(s.title)}</b><small>${esc(s.tagline || s.about)}</small></a>
    ${games.length ? `<div class="st-games"><span>המשחקים</span>${games.map((g) => `<a href="${esc(g.url)}" target="_blank" rel="noopener" data-site-out="${g.id}" title="${esc(g.title)}">${g.img ? `<img src="${esc(g.img)}" alt="${esc(g.title)}" loading="lazy">` : esc(g.title)}</a>`).join('')}</div>` : ''}
    <div class="st-ft">${o ? `<a class="st-own" href="/c/${o.id}" title="${esc(o.name)}">${face(o)}</a>` : '<span></span>'}<a class="st-go" href="${esc(s.url)}" target="_blank" rel="noopener" data-site-out="${s.id}">לאתר${ICON.out}</a></div></div>`;
};

// the hero shows his own characters, not his impressions of real people (Shlomi's list; they keep their wiki pages)
const NOT_IN_HERO = new Set(['omer-koli', 'oded', 'yotam-zamri', 'bennett', 'naor-zion', 'alex-daniel', 'techytech']); // techytech: a logo, not a face
const heroFaces = () => W.characters.filter((c) => c.img && !NOT_IN_HERO.has(c.id));
// the hero's two drifting walls of faces (each column holds its tiles twice, so the loop is seamless)
function wall() {
  const people = heroFaces();
  const cols = [[], [], [], [], [], []];
  people.forEach((c, i) => cols[i % 6].push(c));
  const col = (list) => { const t = list.map((c) => `<div class="tile">${face(c)}<span>${esc(c.name)}</span></div>`).join(''); return `<div class="col">${t}${t}</div>`; };
  return `<div class="wall r">${cols.slice(0, 3).map(col).join('')}</div><div class="wall l">${cols.slice(3).map(col).join('')}</div>`;
}

// under the hero's logo: the tagline, or "בוקר טוב, <name>" for someone signed in - the one difference between the two
// heroes. Before the account code loads, the name comes from the last visit (the same "vx-me" note), so nothing flips.
function heroLine() {
  let hi = HOOK.heroHi ? HOOK.heroHi() : null;
  if (!HOOK.heroHi) { try { const me = JSON.parse(localStorage.getItem('vx-me') || 'null'); if (me && me.nick) hi = dayHi(me.nick); } catch (e) {} }
  return hi ? `<small class="hero-hi">${esc(hi)}</small>` : '<small>כל הדמויות. כל הסרטונים. ואפשר לדבר עם כולן.</small>';
}
// the same words as /verse/copy.js T.hi (Terra)
const dayHi = (n) => { const h = new Date().getHours(); return `${h < 5 ? 'לילה טוב' : h < 12 ? 'בוקר טוב' : h < 17 ? 'צהריים טובים' : h < 21 ? 'ערב טוב' : 'לילה טוב'}, ${n}`; };

// ---------- pages ----------
let heroWho = 'guide';
const pages = {
  home() {
    const who = [GUIDE, ...heroFaces().slice(0, 7)];
    const games = (W.games || []).slice(0, 12);
    const sections = `${games.length ? `<section class="sec"><div class="sec-h"><h2>${GT.row}</h2><a href="/games">${GT.all} ←</a></div>
        <div class="grow">${games.map((g) => gcard(g)).join('')}</div></section>` : ''}
      ${games.some((g) => g.record) ? '<div id="rec-slot"></div>' : ''}
      <div id="stk-slot">${HOOK.stickersSlot ? HOOK.stickersSlot() : ''}</div>

  const did = decodeURIComponent(id || '');

// ---------- an @tag stays a tag (his ask, 2026-11-01: "a special different font colour all the way, not regular text") ----------
// In what was sent: @<a character's name> in the accent colour. In a text box while typing: a text box can't colour part of
// its own text, so a mirror right behind it draws the same text with the tags coloured, and the box's own letters are
// see-through (its caret, selection and placeholder stay). Only the colour changes - same font and weight, so the
// letters line up exactly. Used by the chat box, the home box, the comments and the idea sheet (window.atMirror).

const atTags = (h, link) => {

    const names = Object.keys(atId).sort((a, b) => b.length - a.length);
    atRe = names.length ? new RegExp('@(' + names.map(reEsc).join('|') + ')', 'g') : /$^/;
  }

    'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft', 'borderTopWidth', 'borderRightWidth', 'borderBottomWidth', 'borderLeftWidth',

  player.innerHTML = `<video src="${v.src}" poster="${v.poster || ''}" controls autoplay playsinline></video>
    <div class="info"><button class="icon-btn close" data-close-video aria-label="סגירה">${ICON.x}</button>
      ${stag(v.series)}<h2>${esc(v.title)}</h2>${v.teaser ? `<p>${esc(v.teaser)}</p>` : ''}
      <div class="cast">${v.cast.filter((id) => C[id]).map((id) => `<div><span class="av">${face(C[id])}</span><a class="n" href="/c/${id}">${esc(C[id].name)}</a>${talkBtn(C[id])}</div>`).join('')}</div></div>`;
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeVideo() { modal.classList.remove('open'); player.innerHTML = ''; document.body.style.overflow = ''; }
modal.onclick = (e) => { if (e.target === modal || e.target.closest('[data-close-video]') || e.target.closest('.cast a')) closeVideo(); };
if (matchMedia('(hover: hover)').matches) {
  document.addEventListener('mouseover', (e) => {
    const card = e.target.closest('.vid');
    if (!card || card.classList.contains('previewing') || !V[card.dataset.video]?.src) return;
    card.classList.add('previewing');
    const vd = document.createElement('video');
    Object.assign(vd, { src: V[card.dataset.video].src + '#t=2', muted: true, loop: true, playsInline: true, autoplay: true });
    $('.thumb', card).appendChild(vd);
    card.addEventListener('mouseleave', () => { vd.remove(); card.classList.remove('previewing'); }, { once: true });
  });
}

document.addEventListener('click', (e) => {
  const ic = e.target.closest('[data-inv-copy]');
  if (ic) { navigator.clipboard?.writeText(ic.dataset.invCopy).then(() => { ic.textContent = 'הועתק'; setTimeout(() => { ic.textContent = 'העתקת הקישור'; }, 1500); }); t('invite_copy', cxMode); return; }
  if (e.target.closest('.minv .wa')) t('invite_share', cxMode);
  const sw = e.target.closest('[data-switch]');
  if (sw) { switchChat(sw.dataset.switch); return; }
  const vid = e.target.closest('[data-video]');
  if (vid) { e.preventDefault(); openVideo(vid.dataset.video); return; }
  const si = e.target.closest('[data-chat-signin]');
  if (si) {
    // signed in from the chat: their question goes out again by itself - the one in the box (a refused question), or the
    // one the character answered with "sign in" (that exchange is dropped first)
    HOOK.chatSignIn().then((ok) => {
      if (!ok) return;
      quota = null; peekLeft();   // now the account's own count (10)
      if (si.dataset.chatSignin !== 'again') return send($('textarea', cx).value);
      drawMsgs(); send('המשך', true);   // the story goes on from the word it stopped at
    });
    return;
  }
  if (e.target.closest('.m a.atag, .mc a, .mfaces a')) closeChat();   // a tag or a character card (face, name, page button) opens the character's page under the chat
  const tj = e.target.closest('[data-topic-jump]');
  if (tj) { document.getElementById('topic-' + tj.dataset.topicJump)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  const out = e.target.closest('[data-site-out]');
  if (out) t('site', out.dataset.siteOut);   // a visit to a character's site (/stats/ 'מעברים לאתרי הדמויות')
  const talk = e.target.closest('[data-talk]');
  if (talk) { e.preventDefault(); closeVideo(); openChat(talk.dataset.talk); return; }
  if (e.target.closest('[data-close-chat]') || e.target.closest('.cx-head a.pg')) closeChat();
  // start over: say first that this conversation goes away (only when there is one), then clear just this character's
  if (e.target.closest('[data-new-chat]') && !busy) {
    if (!(threads[cxMode] || []).some((m) => m.role === 'user')) return;
    if ($('.nc-ask', cx)) { $('.nc-ask', cx).remove(); return; }
    cx.insertAdjacentHTML('beforeend', `<div class="nc-ask"><div class="nc-card" role="dialog" aria-modal="true">
      <span class="nc-face">${face(who(cxMode))}</span><b>להתחיל שיחה חדשה?</b><p>השיחה הזאת עם ${esc(who(cxMode).name)} תימחק, ואי אפשר להחזיר אותה.</p>
      <button class="nc-yes" data-nc-yes>שיחה חדשה</button><button class="nc-no">ביטול</button></div></div>`);
  }
  if (e.target.matches('.nc-ask') || e.target.closest('.nc-no')) $('.nc-ask', cx)?.remove();   // ביטול, or a tap outside the card
  if (e.target.closest('[data-nc-yes]') && !busy) { threads[cxMode] = []; try { sessionStorage.removeItem('wiki-chat-' + cxMode); } catch (x) {} t('chat_new', cxMode); openChat(cxMode); }
  if (!e.target.closest('.search')) { $('#results').classList.remove('open'); $('.search').classList.remove('s-open'); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeVideo(); closeChat(); } });

document.addEventListener('play', (e) => { const id = e.target.dataset && e.target.dataset.vid; if (id && !e.target.dataset.counted) { e.target.dataset.counted = 1; t('video', id); } }, true);

// ---------- search ----------
const norm = (s) => String(s || '').toLowerCase().replace(/[״"׳'\-–.,]/g, '').replace(/\s+/g, ' ');
function search(q) {
  const n = norm(q).trim(), box = $('#results');
  if (!n) { box.classList.remove('open'); return; }
  const hits = [];
  for (const c of W.characters) if (norm([c.name, ...c.aka, c.role, c.tagline].join(' ')).includes(n)) hits.push({ s: norm(c.name).startsWith(n) ? 0 : 1, h: `<a href="/c/${c.id}">${face(c)}<span>${esc(c.name)}</span><span class="k">דמות</span></a>` });
  for (const s of W.series) if (norm(s.title + ' ' + s.blurb).includes(n)) hits.push({ s: 2, h: `<a href="/s/${s.id}"><span class="dot" style="background:${seriesColor(s)};width:12px;height:12px;margin:0 11px"></span><span>${esc(s.title)}</span><span class="k">סדרה</span></a>` });
  for (const v of W.videos) if (norm(v.title + ' ' + v.teaser).includes(n)) hits.push({ s: 3, h: `<a href="#" data-video="${v.id}">${v.poster ? `<img src="${v.poster}" alt="">` : ''}<span>${esc(v.title)}</span><span class="k">סרטון</span></a>` });
  hits.sort((a, b) => a.s - b.s);
  box.innerHTML = hits.slice(0, 10).map((x) => x.h).join('') +
    `<a href="#" data-ask="${esc(q)}"><span class="gmark" style="width:34px;height:34px;border-radius:8px;flex:none"><img src="/verse/logo-160.png" alt=""></span><span>לשאול את השלומיוורס: "${esc(q)}"</span></a>`;
  box.classList.add('open');
}
// on a phone the search is an icon that opens over the top bar (verse.css .s-open)
$('#q').addEventListener('focus', () => $('.search').classList.add('s-open'));
let searchTimer;
$('#q').addEventListener('input', (e) => { search(e.target.value); clearTimeout(searchTimer); const v = e.target.value.trim(); if (v.length > 1) searchTimer = setTimeout(() => t('search', v), 1500); });
$('#q').addEventListener('focus', (e) => e.target.value && search(e.target.value));
$('#results').addEventListener('click', (e) => {
  const a = e.target.closest('a');
  if (!a) return;
  $('#results').classList.remove('open');
  if (a.dataset.ask) { e.preventDefault(); openChat('guide', a.dataset.ask); }
  $('#q').value = '';
});

// the characters under a video card: their page, not the video
document.addEventListener('click', (e) => { const c = e.target.closest('[data-char-link]'); if (c) { e.preventDefault(); e.stopPropagation(); nav('/c/' + c.dataset.charLink); } }, true);
// ---------- theme ----------
$('#theme').onclick = () => {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('wiki-theme', next); } catch (e) {}
};

// ---------- boot ----------
// the content lives in the Shlomiverse's bucket (scripts/wiki/push.cjs), so a new video is live without a deploy;
// the site's own copy is the fallback, and what a local preview (localhost) shows
const DATA = /^(localhost|127\.)/.test(location.hostname) ? 'data/wiki.json' : 'https://storage.googleapis.com/shlomiverse-media/wiki/data/wiki.json';
fetch(DATA, { cache: 'no-cache' }).then((r) => (r.ok ? r.json() : Promise.reject())).catch(() => fetch('data/wiki.json').then((r) => r.json())).then((data) => {
  W = data;
  W.characters.forEach((c) => (C[c.id] = c));
  W.series.forEach((s) => (S[s.id] = s));
  W.videos.forEach((v) => (V[v.id] = v));
  $('#fab-faces').innerHTML = W.characters.filter((c) => c.img).slice(0, 3).map(face).join('');
  addEventListener('popstate', route);
  // an old #/ link clicked inside the page (a story's link, a chat card): to its real address
  addEventListener('hashchange', () => { if (location.hash.startsWith('#/')) { history.replaceState(null, '', location.hash.slice(1)); route(); } });
  route();
  window.WIKI_READY = true;
  dispatchEvent(new Event('wiki-ready'));
});
</script>
<script type="module" src="/verse/main.js"></script>
</body>
</html>
