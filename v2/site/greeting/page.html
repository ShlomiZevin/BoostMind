<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ברכה · שלומיוורס</title>
<meta name="description" content="ברכה אישית מתושב בשלומיוורס">
<meta name="robots" content="noindex">
<meta property="og:title" content="ברכה · שלומיוורס">
<meta property="og:description" content="ברכה אישית מתושב בשלומיוורס">
<meta property="og:url" content="https://shlomiverse.com/">
<meta property="og:image" content="https://shlomiverse.com/verse/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/verse/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<!-- A personal greeting's page (his ask, 2026-11-19, plan greeting-send): /greeting/<id>, open only to whoever has the link.
     techietech-api/page.js (versePage) serves this file with the greeting's data in #g-data and its WhatsApp preview; the video
     streams from the private bucket through the same function. A greeting is not a video of the resident's life - it is not in
     the verse's videos, the brain or the chat. Words: the Shlomiverse is a real world and its people are real (words.md). -->
<style>
  :root { --bg: #0b0b0e; --card: #15151a; --line: rgba(255,255,255,.12); --dim: rgba(255,255,255,.62); --acc: #ff6a1f; --acc2: #ff8a3d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: hidden; }
  body { background: radial-gradient(900px 520px at 50% -8%, rgba(255,106,31,.22), transparent 70%), var(--bg); color: #fff; font-family: Heebo, Arial, sans-serif; line-height: 1.55; min-height: 100svh; }
  .wrap { max-width: 520px; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top)) 14px calc(40px + env(safe-area-inset-bottom)); }
  /* one compact header (his note 2026-11-19: the top wasted too much room) - the video + the two buttons fit the first screen */
  .top { display: flex; align-items: center; gap: 10px; height: 52px; }
  .top a { display: block; flex: none; } .top img { height: 40px; display: block; }
  .top .ht { min-width: 0; }
  h1 { font: 900 1.18rem/1.15 Heebo; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .from { color: var(--dim); font-weight: 600; font-size: .85rem; margin: 1px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .from b { color: #fff; }
  .player { position: relative; border-radius: 20px; overflow: hidden; border: 1.5px solid rgba(255,138,61,.45); box-shadow: 0 0 40px rgba(255,106,31,.22); background: #000; aspect-ratio: 9 / 16;
    width: min(100%, calc((100svh - 150px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 9 / 16)); margin: 8px auto 0; }
  .player video { width: 100%; height: 100%; display: block; object-fit: contain; background: #000; }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0 8px; }
  .acts a { display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; border-radius: 999px; border: 1.5px solid rgba(255,138,61,.55); color: #fff; text-decoration: none; font-weight: 700; }
  .acts svg { width: 20px; height: 20px; }
  .share { text-align: center; font-weight: 700; margin: 10px 0 2px; }
  .share a { color: var(--acc2); text-decoration: none; direction: ltr; unicode-bidi: isolate; }
  .note { text-align: center; color: var(--dim); font-size: .88rem; margin: 6px 0 22px; }
  .given { background: var(--card); border: 1px solid rgba(255,138,61,.45); border-radius: 18px; padding: 18px 16px; text-align: center; margin: 0 0 16px; }
  .given p { margin: 0 0 6px; font-weight: 800; font-size: 1.05rem; } .given small { display: block; color: var(--dim); margin: 0 0 12px; }
  .given button { display: inline-flex; align-items: center; gap: 8px; height: 50px; padding: 0 26px; border-radius: 999px; border: 0; background: var(--acc); color: #fff; font: 800 1rem Heebo; cursor: pointer; }
  .given button svg { width: 20px; height: 20px; } .given button:disabled { opacity: .6; }
  .given.done { padding: 12px 14px; border-color: rgba(107,214,138,.35); display: flex; align-items: center; gap: 10px; text-align: start; }
  .given.done i { flex: none; width: 30px; height: 30px; border-radius: 50%; background: rgba(107,214,138,.16); color: #8ee6a6; display: grid; place-items: center; }
  .given.done i svg { width: 18px; height: 18px; }
  .given.done p { color: #8ee6a6; font-size: .95rem; margin: 0; } .given.done small { margin: 0; font-size: .82rem; }
  .ask { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px 16px; text-align: center; }
  .ask p { margin: 0 0 12px; font-weight: 700; font-size: 1.05rem; }
  .ask a { display: inline-flex; align-items: center; height: 50px; padding: 0 28px; border-radius: 999px; background: var(--acc); color: #fff; text-decoration: none; font-weight: 800; }
  .meet { display: flex; align-items: center; gap: 12px; margin: 16px 0 0; padding: 12px 14px; border-radius: 16px; border: 1px solid var(--line); color: #fff; text-decoration: none; }
  .meet img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; object-position: 50% 18%; border: 2px solid var(--acc); }
  .meet span { flex: 1; } .meet small { display: block; color: var(--dim); }
  .home { display: block; text-align: center; margin: 18px 0 0; color: var(--dim); font-weight: 600; text-decoration: none; }
  .home b { color: var(--acc2); }
  .missing { text-align: center; padding: 60px 10px; color: var(--dim); }
  .missing h1 { color: #fff; font-size: 1.6rem; white-space: normal; margin: 0 0 8px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script id="g-data" type="application/json">null</script>
<script src="/t.js" data-site="greeting" data-no-view></script>
<script>
(function () {
  var g = null; try { g = JSON.parse(document.getElementById('g-data').textContent); } catch (e) {}
  var esc = function (s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); };
  var t = function (e, x) { try { window.track && window.track(e, x); } catch (er) {} };
  var app = document.getElementById('app');
  var head = function (title, sub) { return '<div class="top"><a href="/"><img src="/verse/logo-512.png" alt="שלומיוורס"></a><div class="ht"><h1>' + title + '</h1>' + (sub ? '<p class="from">' + sub + '</p>' : '') + '</div></div>'; };
  var top = head('שלומיוורס', '');
  if (!g) {
    app.innerHTML = top + '<div class="missing"><h1>הברכה לא נמצאה</h1><p>אולי הקישור נקטע בדרך. נסו לפתוח אותו שוב מהמייל.</p><a class="home" href="/">לשלומיוורס</a></div>';
    return;
  }
  var first = String(g.charName || '').split(' ')[0];
  // "the greeting was shown" (his ask 2026-11-19): we post a greeting to our story only after the person it's for has seen it
  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
  var wasShown = g.shown; try { wasShown = wasShown || localStorage.getItem('greet-shown-' + g.id) === '1'; } catch (e) {}
  function givenBox() {
    // once pressed it is done for everyone who opens the link (shownAt from the server; this browser's own press as the fallback)
    var when = g.shownAt ? new Date(g.shownAt).toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric', timeZone: 'Asia/Jerusalem' }) : '';
    return wasShown ? '<div class="given done" id="given"><i>' + CHECK + '</i><div><p>הברכה נמסרה ' + esc(g.forWho.replace(/^ל?/, 'ל')) + (when ? ' · ' + when : '') + '</p><small>תודה! עכשיו נוכל לשתף אותה גם בסטורי של השלומיוורס.</small></div></div>'
      : '<div class="given" id="given"><p>הברכה כבר הגיעה ' + esc(g.forWho.replace(/^ל?/, 'ל')) + '?</p><small>ספרו לנו כשהיא נמסרה. נשמח להעלות אותה גם לסטורי שלנו, ולא נעלה אותה לפני שהיא הגיעה ליעדה.</small><button id="givenBtn">' + CHECK + 'הברכה נמסרה</button></div>';
  }
  var wa = 'https://wa.me/?text=' + encodeURIComponent('ברכה ל' + g.forWho + ' מ' + g.charName + ' בשלומיוורס ' + g.url);
  var DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>';
  var WA = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.2a9.7 9.7 0 0 0-8.4 14.6L2.3 21.7l5-1.3A9.7 9.7 0 1 0 12 2.2Zm0 17.7a8 8 0 0 1-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 19.9Zm4.4-6c-.2-.1-1.4-.7-1.7-.8-.2-.1-.4-.1-.5.1l-.8 1c-.1.2-.3.2-.5.1a6.6 6.6 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.5-.4h-.5a.9.9 0 0 0-.6.3 2.7 2.7 0 0 0-.9 2c0 1.2.9 2.4 1 2.5.1.2 1.7 2.7 4.2 3.7 1.6.7 2.2.7 3 .6.5-.1 1.4-.6 1.6-1.1.2-.6.2-1 .1-1.1l-.5-.2Z"/></svg>';
  app.innerHTML = head('ברכה ל' + esc(g.forWho), 'מאת <b>' + esc(g.charName) + '</b>' + (g.event ? ' · ' + esc(g.event) : '')) +
    '<div class="player"><video src="' + esc(g.video) + '" poster="' + esc(g.poster) + '" controls playsinline preload="metadata"></video></div>' +
    '<div class="acts"><a href="' + esc(g.download) + '" data-act="download">' + DL + 'להורדה</a><a href="' + esc(wa) + '" target="_blank" rel="noopener" data-act="whatsapp">' + WA + 'לשליחה בוואטסאפ</a></div>' +
    '<p class="share">נשמח מאוד אם תשתפו את הברכה עם העוקבים שלכם בסטורי, ובכל מקום שבא לכם, ותתייגו את <a href="https://www.instagram.com/shlomizevin/" target="_blank" rel="noopener" data-act="insta">@shlomizevin</a> באינסטגרם.</p>' +
    '<p class="note">ברכות עשויות לעלות לסטורי בשלומיוורס ובאינסטגרם.</p>' +
    givenBox() +
    '<div class="ask"><p>רוצים ברכה מתושב בשלומיוורס למישהו שאתם אוהבים?</p><a href="/community?do=personal" data-act="ask">לבקש ברכה</a></div>' +
    (g.char ? '<a class="meet" href="/c/' + esc(g.char) + '" data-act="meet">' + (g.charImg ? '<img src="' + esc(g.charImg) + '" alt="">' : '') + '<span>להכיר את ' + esc(first) + '<small>' + esc(g.world || 'השלומיוורס') + '</small></span></a>' : '') +
    '<a class="home" href="/" data-act="home">לכל התושבים ב<b>שלומיוורס</b></a>';
  t('greeting_view', { id: g.id, char: g.char });
  var v = app.querySelector('video'), played = false;
  v.addEventListener('play', function () { if (!played) { played = true; t('greeting_play', { id: g.id, char: g.char }); } });
  var gb = document.getElementById('givenBtn');
  if (gb) gb.addEventListener('click', function () {
    gb.disabled = true;
    fetch('/greeting/' + encodeURIComponent(g.id) + '/shown', { method: 'POST' }).then(function (r) { if (!r.ok) throw new Error(r.status); })
      .then(function () { wasShown = true; try { localStorage.setItem('greet-shown-' + g.id, '1'); } catch (e) {} document.getElementById('given').outerHTML = givenBox(); t('greeting_shown', { id: g.id, char: g.char }); })
      .catch(function () { gb.disabled = false; gb.lastChild.textContent = 'לא נשלח - לנסות שוב'; });
  });
  app.addEventListener('click', function (e) { var a = e.target.closest('[data-act]'); if (a) t('greeting_' + a.dataset.act, { id: g.id, char: g.char }); });
})();
</script>
</body>
</html>
