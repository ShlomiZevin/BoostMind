<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050302">
<title>הטיסה פנימה · שלומיוורס</title>
<script src="/verse/game-frame.js"></script>
<link rel="icon" href="/verse/favicon-32.png">
<link rel="preload" as="image" href="/verse/art/fly-space.webp"><link rel="preload" as="image" href="/verse/art/fly-ship.webp"><link rel="preload" as="image" href="/verse/art/fly-planet.webp">
<link rel="modulepreload" href="/verse/fly.js"><link rel="modulepreload" href="/verse/copy.js">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800;900&display=swap" rel="stylesheet">
<!-- The flight-in game (verse/fly.js) as a game of the verse - in the games list since the citizenship release (his call
     2026-11-07: "with the release of the whole new flow"), played inside /play/verse-fly. The score goes on the day's table
     (game.json "record"), the same table as the flight at the end of the citizenship journey (citizen.js flyRecords). -->
<meta property="og:image" content="https://shlomiverse.com/verse/fly/cover.jpg">
<style>
  html, body { margin: 0; height: 100%; background: #050302; overflow: hidden; font-family: 'Heebo', sans-serif; color: #fff; }
  .again { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; text-align: center; }
  .again b { font-size: 22px; } .again small { color: #c9b8a8; font-size: 14px; }
  .again button { height: 50px; padding: 0 28px; border-radius: 99px; border: 0; background: #ff6a1f; color: #fff; font: inherit; font-weight: 800; font-size: 18px; }
</style>
</head>
<body>
<script type="module">
import { play } from '/verse/fly.js';
// the characters as the site has them (the bucket's wiki.json; a local preview reads the site's own copy)
const DATA = /^(localhost|127\.)/.test(location.hostname) ? '/wiki/data/wiki.json' : 'https://storage.googleapis.com/shlomiverse-media/wiki/data/wiki.json';
const chars = fetch(DATA, { cache: 'no-cache' }).then((r) => r.json()).then((w) => w.characters).catch(() => []);   // the game starts without waiting for it
const qs = new URLSearchParams(location.search), seed = qs.get('seed');
const quickEnd = qs.get('end') === '1';   // ?end=1: one tap and you are at the landing (his ask: see only the ending, quickly)
function start() {
  document.body.innerHTML = '';
  const end = (what) => (s) => {
    document.body.innerHTML = `<div class="again"><b>${what}</b><small>${s.score} נקודות · ${s.time} שניות · ${s.stars} כוכבים · ${s.shot} פיצוצים · ${s.shields} מגנים · ניסיון ${s.tries}</small><button>שוב</button></div>`;
    document.querySelector('.again button').onclick = start;
    window.FLY_RESULT = { what, ...s };
  };
  const landed = end('נחתתם');
  play(document.body, { chars, quickEnd, seed: seed != null ? Number(seed) : undefined, onDone: (s) => { window.VerseFrame && VerseFrame.score(s.score); landed(s); }, onSkip: end('דילגתם') });
}
start();
</script>
</body>
</html>
