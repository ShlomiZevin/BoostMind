<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Chat — Veyra</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Veyra">
<meta property="og:title" content="Veyra — Meet your queen">
<meta property="og:description" content="Choose your queen. Chat with her tonight.">
<meta property="og:url" content="https://veyra-queens.web.app/">
<meta property="og:image" content="https://veyra-queens.web.app/og/home.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://veyra-queens.web.app/og/home.jpg">
<meta name="theme-color" content="#0b0b0d">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/veyra.css">
<script src="js/queens.js"></script>
<script src="js/app.js"></script>
</head>
<body>
  <div class="chat-app">
    <aside class="chat-side">
      <div class="brand">
        <a href="index.html" class="wordmark" aria-label="Veyra — all queens">Veyrλ</a>
        <span id="theme-slot"></span>
      </div>
      <h3 id="queens-title"></h3>
      <nav class="queen-list" id="queen-list" aria-labelledby="queens-title"></nav>
    </aside>

    <main class="chat-main">
      <header class="chat-head" id="chat-head"></header>
      <div class="messages" id="messages" aria-live="polite"></div>
      <form class="composer" id="composer" autocomplete="off">
        <button class="quick-tribute" id="quick-tribute" type="button" aria-label="Send a tribute"></button>
        <input id="input" type="text" placeholder="Type a message…" aria-label="Message" maxlength="1000">
        <button class="send" id="send" type="submit" aria-label="Send" disabled></button>
      </form>
      <p class="ai-note">Replies are AI-generated.</p>
    </main>

    <aside class="chat-info" id="chat-info"></aside>
  </div>

<script src="js/chat.js"></script>
</body>
</html>
