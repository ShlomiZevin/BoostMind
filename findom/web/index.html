<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veyra — Meet your queen</title>
<meta name="description" content="Choose your queen. Chat with her tonight. 18+.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Veyra">
<meta property="og:title" content="Veyra — Meet your queen">
<meta property="og:description" content="Choose your queen. Chat with her tonight.">
<meta property="og:url" content="https://veyra-queens.web.app/">
<meta property="og:image" content="https://veyra-queens.web.app/og/home.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://veyra-queens.web.app/og/home.jpg">
<meta name="theme-color" content="#0b0b0d">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/veyra.css">
<script src="js/queens.js"></script>
<script src="js/app.js"></script>
</head>
<body>
  <header class="wrap topbar" id="top"></header>

  <main class="wrap">
    <section class="home-hero">
      <h1 class="wordmark wordmark--xl" aria-label="Veyra">Veyrλ</h1>
      <p class="eyebrow">Meet your queen</p>
      <p class="sub">Choose your queen. Chat with her tonight.</p>
    </section>

    <section class="queen-grid" id="queens" aria-label="Queens"></section>
  </main>

  <div id="foot"></div>

<script>
  const { icon, esc, themeButton, footer } = Veyra;

  document.getElementById('top').innerHTML = `
    ${themeButton()}
    <nav class="nav">
      <a href="index.html" aria-current="page">Queens</a>
      <a href="chat.html">Chat</a>
    </nav>`;

  document.getElementById('queens').innerHTML = QUEENS.map(q => `
    <a class="queen-card" href="${q.id}.html">
      <img src="${q.images.card}" alt="${esc(q.name)}" loading="lazy">
      <div class="meta">
        <h2>${esc(q.name)}</h2>
        <p class="traits">${esc(q.traits)}</p>
        <div class="arrow">${icon.arrow}</div>
      </div>
    </a>`).join('');

  document.getElementById('foot').outerHTML = footer();
</script>
</body>
</html>
