</head>
<body>
  <div class="topbar--ruled">
    <header class="wrap topbar">
      <a href="index.html" class="wordmark" aria-label="Veyra — all queens">Veyrλ</a>
      <nav class="nav" id="nav"></nav>
    </header>
  </div>

  <main id="page"></main>
  <div id="foot"></div>

<script>
  const { icon, esc, param, queen, tgUrl, themeButton, tributeSheet, lightbox, footer } = Veyra;
  const q = queen(window.QUEEN_ID || param('q')) || QUEENS[0];
  document.title = `${q.name} — Veyra`;

  const shareUrl = `https://veyra-queens.web.app/${q.id}`;
  const waShare = 'https://wa.me/?text=' + encodeURIComponent(`${q.name} — ${q.tagline}
${shareUrl}`);
  document.getElementById('nav').innerHTML = `<a href="index.html">Queens</a><a class="icon-btn share-wa" href="${waShare}" target="_blank" rel="noopener" aria-label="Share ${esc(q.name)} on WhatsApp">${icon.whatsapp}</a>${themeButton()}`;

  document.getElementById('page').innerHTML = `
    <section class="wrap profile">
      <div class="profile-photo"><img src="${q.images.card}" alt="${esc(q.name)}"></div>
      <div>
        <h1>${esc(q.name)}</h1>
        <p class="tagline">${esc(q.tagline)}</p>
        <p class="bio">${esc(q.bio)}</p>
        <a class="btn btn--solid" href="chat.html?q=${q.id}">Chat with ${esc(q.name)} ${icon.arrow}</a>
        <a class="tg-link" href="${tgUrl(q.telegram)}" target="_blank" rel="noopener">
          <span class="tg-icon">${icon.telegram}</span>
          <div><strong>Join her Telegram channel</strong><span>${esc(q.telegramNote)}</span></div>
          <span class="go">${icon.arrow}</span>
        </a>
      </div>
    </section>

    <section class="wrap gallery" aria-label="Photos">
      ${q.images.gallery.map((src, i) => `<button type="button" data-src="${src}" aria-label="Open photo ${i + 1}"><img src="${src}" alt="" loading="lazy"></button>`).join('')}
    </section>

    <section class="tributes">
      <div class="wrap">
        <h2>Send a tribute</h2>
        <p>Show your appreciation. She'll notice.</p>
        <div class="tribute-grid">
          ${q.tributes.map(t => `
            <div class="tribute">
              <div class="price">$${t.price}</div>
              <div class="crown">${icon.crown}</div>
              <div class="name">${esc(t.name)}</div>
              <button class="btn btn--ghost" data-price="${t.price}">Send tribute</button>
            </div>`).join('')}
        </div>
      </div>
    </section>

    <div class="mobile-cta"><a class="btn btn--solid" href="chat.html?q=${q.id}">Chat with ${esc(q.name)} ${icon.arrow}</a></div>`;
  document.body.classList.add('has-cta');

  document.querySelectorAll('.gallery button').forEach(b =>
    b.addEventListener('click', () => lightbox(b.dataset.src, q.name)));
  // The whole card opens the sheet (on mobile the button is hidden).
  document.querySelectorAll('.tribute').forEach(card =>
    card.addEventListener('click', () => tributeSheet(q, +card.querySelector('button').dataset.price)));

  document.getElementById('foot').outerHTML = footer();
</script>
</body>
