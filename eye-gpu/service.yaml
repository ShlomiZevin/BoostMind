# Cloud Run service definition (deploy the built image with: gcloud beta run services replace service.yaml)
# The GPU runs without zonal redundancy (cheaper; the project's quota is for this kind) and scales to zero.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: eye-gpu
  labels:
    cloud.googleapis.com/location: europe-west4
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '1'
        run.googleapis.com/cpu-throttling: 'false'
        run.googleapis.com/gpu-zonal-redundancy-disabled: 'true'
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      containerConcurrency: 1
      timeoutSeconds: 3600
      nodeSelector:
        run.googleapis.com/accelerator: nvidia-l4
      containers:
      - image: europe-west4-docker.pkg.dev/boostmind-b052c/cloud-run-source-deploy/eye-gpu@sha256:5ffbd7a98d7e30e7e74058cdcdcae44d863cc388cc1e2911d340454521f0fa9a
        env:
        - name: FFMPEG  # the full ffmpeg (apt); the PyTorch image's own one has no H.264 encoder
          value: /usr/bin/ffmpeg
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: '4'
            memory: 16Gi
            nvidia.com/gpu: '1'
