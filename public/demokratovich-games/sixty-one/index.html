<style>
:root{
  --ink:#14213d; --navy:#1b2a57; --gold:#f5c542; --wood:#7a3f17; --paper:#fbf0d6;
  --safe-t:calc(env(safe-area-inset-top,0px) + var(--verse-top,0px)); --safe-b:calc(env(safe-area-inset-bottom,0px) + var(--verse-bottom,0px));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:Rubik,system-ui,sans-serif;color:var(--ink);overscroll-behavior:none;touch-action:none}
body{background:#2a170b}
[hidden]{display:none!important}
button{font-family:inherit;border:0;cursor:pointer}
#hall{position:fixed;inset:0;background:url(assets/hall.jpg) 50% 100%/auto 165% no-repeat,#3a2112}
@media (min-aspect-ratio:3/4){#hall{background-size:100% auto}}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block}

/* HUD - painted pieces, one thin row */
#hud{position:fixed;top:calc(var(--safe-t) + 6px);left:6px;right:6px;max-width:560px;margin:0 auto;display:none;align-items:center;gap:6px;z-index:3}
#hud.on{display:flex}
.ibtn{width:46px;height:46px;background:url(assets/hud-pause.webp) center/100% 100% no-repeat;flex:none;padding:0}
.ibtn:active{transform:scale(.93)}
#seatBox{flex:1;height:46px;position:relative;display:flex;align-items:center;justify-content:center}
#seatBox::before{content:'';position:absolute;inset:0;background:url(assets/hud-meter.webp) center/100% 100% no-repeat;z-index:1;pointer-events:none}
#seatTrack{position:absolute;left:5.5%;right:5.5%;top:30%;bottom:30%;border-radius:3px;overflow:hidden;background:#0d1838}
#seatBar{position:absolute;inset:0 0 0 auto;width:0;background:linear-gradient(270deg,#b8860b,#f5c542 60%,#ffe58a);transition:width .35s}
#seatBox.gov #seatBar{background:linear-gradient(270deg,#15803d,#4ade80)}
#seatGoal{position:absolute;top:26%;bottom:26%;width:3px;background:#fff;box-shadow:0 0 6px #fff;z-index:2}
#seatTxt{position:relative;z-index:3;color:#fff;font-weight:900;font-size:18px;text-shadow:0 2px 0 #0b1330,0 0 6px #0b1330,0 0 2px #000;display:flex;gap:6px;align-items:baseline}
#seatTxt small{font-size:12px;font-weight:700}
#seatTxt b{direction:ltr;unicode-bidi:isolate}
#bestBox{width:52px;height:52px;background:url(assets/hud-best.webp) center/100% 100% no-repeat;color:#fde68a;font-weight:900;flex:none;position:relative}
#bestBox span{display:none}
#bestBox b{position:absolute;left:18%;right:18%;top:44%;bottom:14%;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;text-shadow:0 1px 0 #0b1330}
/* the next party (a parchment card) + the poll ribbon, under the HUD */
#nextRow{position:fixed;top:calc(var(--safe-t) + 58px);left:6px;right:6px;max-width:560px;margin:0 auto;display:none;flex-direction:column;align-items:center;gap:2px;z-index:3;pointer-events:none}
#nextRow.on{display:flex}
#nextChip{min-width:min(70vw,250px);height:40px;padding:0 22px;background:url(assets/hud-card.webp) center/100% 100% no-repeat;color:#4a2410;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
#nextChip small{font-size:12px;font-weight:700;color:#7a4a22}
#nextChip i{width:13px;height:13px;border-radius:3px;display:inline-block;flex:none;box-shadow:0 0 0 1.5px #4a241055}
#nextChip b{direction:ltr;unicode-bidi:isolate;color:#9a3412}
#nextChip em{font-style:normal;font-size:12px;background:#4a2410;color:#fff3d0;border-radius:7px;padding:1px 7px}
#nextChip em.bad{background:#b91c1c}
#nextChip em.q{background:#6d28d9}
#pollChip{height:40px;min-width:min(76vw,290px);padding:0 30px 6px;background:url(assets/hud-ribbon.webp) center/100% 100% no-repeat;color:#fff3d0;font-weight:900;font-size:13.5px;display:flex;align-items:center;justify-content:center;text-shadow:0 2px 0 #5b0f0f;animation:ribbon 1s ease-in-out infinite alternate}
@keyframes ribbon{to{transform:scale(1.04)}}
/* the פסול! stamp button - bottom left, away from the rabbi */
#vetoBtn{position:fixed;left:max(12px,calc(50% - 300px));bottom:calc(var(--safe-b) + 16px);width:clamp(78px,22vw,104px);aspect-ratio:251/282;background:url(assets/hud-stamp.webp) center/100% 100% no-repeat;z-index:4;display:none;padding:0;color:#fff3d0;font-weight:900;font-size:clamp(17px,4.6vw,22px);text-shadow:0 2px 0 #5b0f0f,0 0 6px #5b0f0f;transform:rotate(-8deg);touch-action:none}
#vetoBtn.on{display:block}
#vetoBtn span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#vetoBtn:active{transform:rotate(-8deg) scale(.9)}
#vetoBtn.glow{animation:vglow .5s ease-in-out infinite alternate}
@keyframes vglow{from{filter:drop-shadow(0 0 4px #ff3b3b)}to{filter:drop-shadow(0 0 18px #ff3b3b) brightness(1.15);transform:rotate(-8deg) scale(1.08)}}
.stampfx{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) rotate(-12deg);color:#d61f1f;font-weight:900;font-size:min(16vw,72px);border:6px solid #d61f1f;border-radius:16px;padding:0 16px;opacity:0;animation:stamp .9s ease-out forwards;background:#fff8;text-shadow:none}
@keyframes stamp{0%{transform:translate(-50%,-50%) rotate(-12deg) scale(2.2);opacity:0}18%{transform:translate(-50%,-50%) rotate(-12deg) scale(1);opacity:1}75%{opacity:1}100%{opacity:0}}
#hint{position:fixed;left:clamp(96px,27vw,130px);right:8px;bottom:calc(var(--safe-b) + 18px);text-align:center;color:#fff;font-weight:900;font-size:18px;text-shadow:0 2px 0 #14213d,0 0 10px #000a;pointer-events:none;z-index:3;opacity:0;transition:opacity .3s}
#hint.on{opacity:1;animation:hintp 1.2s ease-in-out infinite}
@keyframes hintp{50%{transform:scale(1.06)}}

/* his words - a bubble beside his head */
#bubble{position:fixed;z-index:8;max-width:min(58vw,250px);min-width:120px;border-style:solid;border-width:14px 16px 26px 14px;border-image:url(assets/hud-bubble.webp) 60 80 110 60 fill / 14px 16px 26px 14px stretch;color:#4a2410;padding:0 2px;font-size:15px;font-weight:700;line-height:1.3;filter:drop-shadow(0 6px 10px #0007);pointer-events:none;opacity:0;transform:scale(.85);transform-origin:100% 100%;transition:opacity .18s,transform .18s}
#bubble.on{opacity:1;transform:none}
#bubble.loud{color:#991b1b;font-weight:900}
#bubble.gold{color:#7a3f17;font-weight:900}

/* effects */
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:6}
.pop{position:absolute;font-weight:900;font-size:24px;color:#fff;text-shadow:0 3px 0 #14213d,0 0 12px #000a;white-space:nowrap;animation:pop 1.1s ease-out forwards;direction:rtl}
.pop.gold{color:#fde68a;text-shadow:0 3px 0 #7a3f17,0 0 14px #f5c542;font-size:27px}
.pop.bad{color:#fecaca;text-shadow:0 3px 0 #7f1d1d,0 0 12px #ef4444}
@keyframes pop{0%{transform:translate(-50%,0) scale(.6);opacity:0}18%{transform:translate(-50%,-10px) scale(1.1);opacity:1}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
.banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;color:#fde68a;font-weight:900;font-size:min(10vw,46px);line-height:1.1;text-shadow:0 4px 0 #7a3f17,0 0 24px #000c;white-space:nowrap;animation:ban 1.8s ease-out forwards}
.banner small{display:block;font-size:.5em;color:#fff}
@keyframes ban{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}14%{transform:translate(-50%,-50%) scale(1.08);opacity:1}24%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
.flash{position:fixed;inset:0;background:#fff3;animation:flash .35s forwards}
.flash.red{background:#ef444455}
@keyframes flash{to{opacity:0}}
#turn{display:none;position:fixed;inset:0;z-index:20;background:#14213d;color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:900;font-size:22px;text-align:center;padding:16px}
#turn svg{width:64px;height:64px;animation:turn 1.6s ease-in-out infinite}
@keyframes turn{50%{transform:rotate(-90deg)}}
body.turn #turn{display:flex}
#loading{position:fixed;left:50%;bottom:calc(var(--safe-b) + 10px);transform:translateX(-50%);z-index:5;color:#fde68a;font-size:13px;font-weight:700;text-shadow:0 1px 3px #000}

/* screens */
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:8;text-align:center}
.screen.on{display:flex}
/* the start screen: the painting is the screen */
#start{justify-content:space-between;gap:8px;padding:calc(var(--safe-t) + 8px) 12px calc(var(--safe-b) + 14px);background:url(assets/start-bg.jpg) center 40%/cover no-repeat,#2a170b}
#start::after{content:'';position:absolute;inset:0;background:linear-gradient(#2a170b66,transparent 22%,transparent 56%,#1a0e06cc 84%,#1a0e06f2);pointer-events:none}
#start>*{position:relative;z-index:1}
@media (min-aspect-ratio:4/5){#start{background:url(assets/start-bg.jpg) center top/auto 100% no-repeat,radial-gradient(ellipse at 50% 40%,#5a3418,#1a0e06 70%)}}
.st-title{width:min(80vw,400px,40vh);filter:drop-shadow(0 6px 14px #000c);margin-top:clamp(0px,1vh,10px)}
.st-bottom{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vh,18px);width:100%}
.st-row{display:flex;gap:clamp(10px,3vw,18px);justify-content:center;align-items:center}
.sign{all:unset;box-sizing:border-box;position:relative;display:block;background:center/100% 100% no-repeat;cursor:pointer;color:#fff3d0;font-family:Rubik,system-ui,sans-serif;font-weight:900;line-height:1.05;text-shadow:0 2px 0 #0b1330,0 3px 8px #000b;transition:transform .12s;text-decoration:none;text-align:center}
.sign span{position:absolute;display:flex;align-items:center;justify-content:center}
.sign:active{transform:scale(.94)}
.sign:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:16px}
.sign.play{background-image:url(assets/ui-main.webp);width:min(80vw,360px,48vh);aspect-ratio:600/224;font-size:clamp(26px,5.2vh,40px);animation:breathe 2.4s ease-in-out infinite}
.sign.play span{left:9%;right:9%;top:22%;bottom:26%}
@keyframes breathe{50%{transform:scale(1.04)}}
.sign.mid{background-image:url(assets/ui-plain.webp);width:min(43vw,190px,29vh);aspect-ratio:479/197;font-size:clamp(14px,2.4vh,18px)}
.sign.mid span{left:9%;right:9%;top:20%;bottom:24%}
.sign.back{background-image:url(assets/ui-back.webp);width:min(43vw,190px,29vh);aspect-ratio:482/195;font-size:clamp(13px,2.2vh,16px)}
.sign.back span{left:35%;right:7%;top:20%;bottom:24%}
.rec{position:relative;background:url(assets/ui-plaque.webp) center/100% 100% no-repeat;width:min(56vw,230px,34vh);aspect-ratio:613/240;color:#fff3d0;font-weight:900;text-shadow:0 2px 0 #0b1330;line-height:1.05}
.rec span{position:absolute;left:10%;right:10%;top:20%;bottom:24%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.rec small{font-size:clamp(11px,1.8vh,14px);font-weight:700;opacity:.92;white-space:nowrap}
.rec b{font-size:clamp(16px,3vh,22px);color:#fde68a;white-space:nowrap}
.sign.snd{background-image:url(assets/ui-sound.webp);width:clamp(46px,8vh,60px);aspect-ratio:1;position:absolute!important;top:calc(var(--safe-t) + 10px);left:12px;z-index:2}
.sign.snd.off{filter:grayscale(.85) brightness(.75)}
.sign.snd.off::after{content:'';position:absolute;left:20%;right:20%;top:46%;height:9%;background:#ef4444;border-radius:4px;transform:rotate(-40deg);box-shadow:0 0 0 2px #0b1330}

/* inside screens - the same kit */
.screen.kit{background:radial-gradient(ellipse at 50% 45%,#14213d99,#0b1330e6 70%);z-index:9}
.panel{box-sizing:border-box;position:relative;width:min(90vw,380px);border-style:solid;border-width:clamp(30px,5vh,42px);border-image:url(assets/ui-panel.webp) 64 fill / clamp(30px,5vh,42px) stretch;
  display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.7vh,14px);padding:clamp(34px,5.6vh,48px) 4px 4px;color:#4a2410;text-align:center;filter:drop-shadow(0 14px 30px #000b)}
.sign.head{background-image:url(assets/ui-plaque.webp);position:absolute;top:calc(clamp(30px,5vh,42px) * -1 - 14px);left:50%;transform:translateX(-50%);width:min(66vw,250px);aspect-ratio:613/240;font-size:clamp(18px,3.3vh,25px);cursor:default}
.sign.head span{left:9%;right:9%;top:18%;bottom:24%;white-space:nowrap}
.sign.head:active{transform:translateX(-50%)}
.p-sub{margin:0;font-size:clamp(14px,2.3vh,17px);font-weight:700;color:#6b3a17;line-height:1.35}
.p-sub b{color:#9a3412}
.p-quote{display:flex;align-items:center;gap:10px;text-align:right}
.p-quote img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:3px solid #8a4a1c;flex:none}
.p-quote p{margin:0;font-size:clamp(14px,2.3vh,17px);font-weight:700;line-height:1.4;color:#4a2410}
.p-score{font-size:clamp(42px,8vh,60px);font-weight:900;color:#b45309;text-shadow:0 2px 0 #fff8e6,0 3px 0 #7c2d12;line-height:1}
.p-score small{display:block;font-size:clamp(12px,1.9vh,15px);color:#6b3a17;text-shadow:none;font-weight:700;margin-top:4px}
#overCoal{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;max-width:300px;font-size:13px;font-weight:700;color:#4a2410}#overCoal:empty{display:none}#overCoal span{display:flex;align-items:center;gap:4px;white-space:nowrap}#overCoal i{width:10px;height:10px;border-radius:2px;display:inline-block}#overCoal b{color:#9a3412}
.newrec{background:#15803d;color:#fff;font-size:16px;font-weight:900;padding:4px 14px;border-radius:12px;box-shadow:0 2px 0 #14532d}
.panel .sign.play{width:min(68vw,280px,40vh);font-size:clamp(22px,4vh,30px)}
.panel .sign.mid{width:min(46vw,180px,28vh)}

/* tutorial */
#tutDim{position:fixed;inset:0;display:none;pointer-events:none;z-index:7}
#tutDim.on{display:block}
#tutHole{position:absolute;border-radius:18px;box-shadow:0 0 0 200vmax #0b1330b0;border:3px solid var(--gold);transition:all .3s}
#tutCard{display:none;position:fixed;left:50%;transform:translateX(-50%);width:min(94vw,440px);z-index:8;border-style:solid;border-width:26px;border-image:url(assets/ui-panel.webp) 64 fill / 26px stretch;padding:4px 4px 0;flex-direction:column;gap:6px;filter:drop-shadow(0 8px 20px #000a)}
#tutCard.on{display:flex}
#tutText{font-size:15px;font-weight:700;line-height:1.38;color:#4a2410;text-align:right;min-height:40px}
#tutText b{color:#9a3412}
#tutText .ok{color:#15803d;font-weight:900}
#tutBar{height:7px;background:#e8d5b0;border-radius:4px;overflow:hidden}
#tutBar i{display:block;height:100%;width:0;background:linear-gradient(270deg,#b45309,#f59e0b);transition:width .3s}
#tutRow{display:flex;align-items:center;gap:8px}
#tutCount{flex:1;color:#8a5a33;font-size:13px;font-weight:700;text-align:right}
#tutSkip{background:none;color:#8a5a33;font-size:14px;font-weight:700;padding:8px}
#tutNext.sign{width:120px;aspect-ratio:479/197;font-size:17px}
#tutNext.sign:disabled{filter:grayscale(.9) brightness(.8);cursor:default}
.keyhint{font-size:11px;opacity:.75;font-weight:500;margin-inline-start:3px}
@media (hover:none){.keyhint{display:none}}
html.in-verse .verse-hide{display:none!important}
@media (max-height:520px){#over .p-quote,#paused .p-quote{display:none}.p-score{font-size:34px}#bestOver{display:none}.panel{gap:6px;padding-top:44px}.panel .sign.play{width:min(56vw,210px)}#tutText{font-size:13px}}
</style>

<body>
<div id="hall"></div>
<canvas id="cv"></canvas>

<div id="hud">
  <button class="ibtn" id="pauseBtn" aria-label="עצירה"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
  <div id="seatBox"><div id="seatTrack"><i id="seatBar"></i></div><i id="seatGoal"></i><span id="seatTxt"><small>מנדטים</small><b id="seatNum">0 / 61</b></span></div>
  <div id="bestBox"><span>שיא היום</span><b id="bestNum">0</b></div>
</div>
<div id="nextRow"><div id="nextChip"></div><div id="pollChip" hidden>הרבנית על הקו – סקר! מהר יותר</div></div>
<div id="hint">הקישו כדי להפיל</div>
<button id="vetoBtn" aria-label="פסול"><span>פסול!</span></button>
<div id="bubble"></div>
<div id="fx"></div>
<div id="loading">הרב בדרך לבית המשפט…</div>
<div id="turn"><svg viewBox="0 0 24 24" fill="none" stroke="#f5c542" stroke-width="2" stroke-linecap="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>סובבו את הטלפון לאורך<br><small style="font-size:15px;font-weight:700;opacity:.8">מגדל קואליציה בונים לגובה.</small></div>

<div class="screen on" id="start">
  <button class="sign snd sndBtn" aria-label="צליל"></button>
  <img class="st-title" src="assets/title.webp" alt="61 – רוב קואליציוני">
  <div class="st-bottom">
    <button class="sign play" id="playBtn"><span>שחקו</span></button>
    <div class="st-row">
      <button class="sign mid" id="howBtn"><span>איך משחקים</span></button>
      <a class="sign back" href="/games" target="_top" data-verse-back aria-label="חזרה למשחקים"><span>חזרה<br>למשחקים</span></a>
    </div>
    <div class="rec" id="bestStart"></div>
  </div>
</div>

<div class="screen kit" id="over">
  <div class="panel">
    <div class="sign head"><span id="overH">הולכים לבחירות!</span></div>
    <div class="p-quote"><img src="assets/face.jpg" alt=""><p id="overLine"></p></div>
    <div class="p-score" id="overScore">0<small>מנדטים</small></div>
    <div id="overCoal"></div>
    <div id="overRec"></div>
    <p class="p-sub" id="bestOver"></p>
    <button class="sign play" id="againBtn"><span>עוד סבב</span></button>
    <button class="sign mid" id="menuBtn"><span>לתפריט</span></button>
  </div>
</div>

<div class="screen kit" id="paused">
  <div class="panel">
    <div class="sign head"><span>עצרנו</span></div>
    <div class="p-quote"><img src="assets/face.jpg" alt=""><p>שב ואל תעשה – מנהג בעלמא. אבל הקואליציה מחכה.</p></div>
    <button class="sign play" id="resumeBtn"><span>ממשיכים</span></button>
    <button class="sign mid" id="quitBtn"><span>יציאה לתפריט</span></button>
  </div>
</div>

<div id="tutDim"><div id="tutHole"></div></div>
<div id="tutCard">
  <div id="tutText"></div>
