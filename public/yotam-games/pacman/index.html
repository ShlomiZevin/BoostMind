<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1d3a">
<title>פקי-טק – המשחק של יותם</title>
<meta name="description" content="יותם, ה-System Architect של טקי-טק, אוסף קונטקסט בקומה – ארז, אסנת ויניב רודפים אחריו עם בקשות, וכל פעם שהוא נתקל בחני הוא אומר ״חני״. בפעם הרביעית – משאבי אנוש.">
<meta property="og:type" content="website">
<meta property="og:locale" content="he_IL">
<meta property="og:title" content="פקי-טק – המשחק של יותם">
<meta property="og:description" content="פקמן בטקי-טק: יותם אוסף קונטקסט, כולם רודפים אחריו עם בקשות – ואסור לו להגיד ״חני״ ארבע פעמים.">
<meta property="og:url" content="https://shlomiverse.com/yotam-games/pacman/">
<meta property="og:image" content="https://shlomiverse.com/yotam-games/pacman/assets/share.jpg?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<script src="/t.js" data-site="yotam-games" defer></script>
<script src="/verse/game-frame.js"></script>
<style>
:root{
  --ink:#0f1d3a; --card:#f5f9ff; --gold:#38bdf8; --red:#ef4444; --green:#22c55e; --brown:#1e3a6b;
  --safe-t:calc(env(safe-area-inset-top,0px) + var(--verse-top,0px)); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:Rubik,system-ui,sans-serif;color:var(--ink);overscroll-behavior:none;touch-action:none}
body{background:#0f1d3a}
[hidden]{display:none!important}
button{font-family:inherit;border:0;cursor:pointer}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

/* HUD */
#hud{position:fixed;top:calc(var(--safe-t) + 8px);left:8px;right:8px;max-width:600px;margin:0 auto;display:none;align-items:center;gap:8px;z-index:3}
#hud.on{display:flex}
.ibtn{width:42px;height:42px;border-radius:14px;background:#0f1d3acc;display:grid;place-items:center;flex:none}
.ibtn svg{width:24px;height:24px;fill:#fff}
.box{height:42px;border-radius:14px;background:#0f1d3acc;color:#fff;display:flex;align-items:center;gap:6px;padding:0 12px;flex:none;font-weight:900}
#scoreBox{flex:1;justify-content:center;font-size:22px;min-width:0}
#scoreBox small{font-size:12px;opacity:.8;font-weight:700;white-space:nowrap}
#hearts{font-size:20px;letter-spacing:2px}
#hearts.hit{animation:hit .4s}
#combo{color:#facc15;font-size:15px}
@keyframes hit{30%{transform:scale(1.15);background:#b91c1ccc}}

/* Asaf's words, in their own strip under the HUD */
#strip{position:fixed;top:calc(var(--safe-t) + 58px);left:10px;right:10px;max-width:560px;margin:0 auto;display:none;justify-content:center;z-index:2;pointer-events:none}
#strip.on{display:flex}
#say{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:6px 14px;font-size:18px;font-weight:900;line-height:1.25;text-align:center;box-shadow:0 4px 0 #0f1d3a55;opacity:0;transform:scale(.9);transition:opacity .12s,transform .12s;max-width:100%}
#say.on{opacity:1;transform:none}
#say.loud{background:#fff1f1;border-color:var(--red);color:#991b1b}

/* the verb chip */
#chip{position:fixed;left:50%;bottom:calc(var(--safe-b) + 14px);transform:translateX(-50%);display:none;align-items:center;gap:8px;background:#0f1d3ae6;color:#fff;font-weight:900;font-size:17px;padding:9px 16px;border-radius:22px;white-space:nowrap;z-index:2;pointer-events:none}
#chip.on{display:flex}
#chip em{font-style:normal;background:#facc15;color:var(--ink);padding:2px 9px;border-radius:12px}

/* effects */
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:6}
.pop{position:absolute;font-weight:900;font-size:26px;color:#fff;text-shadow:0 3px 0 #7c2d12,0 0 12px #f97316;white-space:nowrap;animation:pop .9s ease-out forwards}
.pop.good{text-shadow:0 3px 0 #15803d,0 0 12px #22c55e;font-size:20px}
.pop.bad{text-shadow:0 3px 0 #991b1b,0 0 12px #ef4444}
@keyframes pop{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{transform:translate(-50%,-10px) scale(1.1);opacity:1}100%{transform:translate(-50%,-55px) scale(1);opacity:0}}
.flash{position:fixed;inset:0;background:#ef444455;animation:flash .35s forwards}
@keyframes flash{to{opacity:0}}
.banner{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;color:#fff;font-weight:900;font-size:min(10vw,48px);line-height:1.05;text-shadow:0 3px 0 var(--ink),0 0 24px #000a;white-space:nowrap;animation:ban 1.6s ease-out forwards}
@keyframes ban{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}15%{transform:translate(-50%,-50%) scale(1.08);opacity:1}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
#turn{display:none;position:fixed;inset:0;z-index:20;background:#0f1d3a;color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:900;font-size:22px;text-align:center;padding:16px}
#turn svg{width:64px;height:64px;animation:turn 1.6s ease-in-out infinite}
@keyframes turn{50%{transform:rotate(-90deg)}}
body.turn #turn{display:flex}

/* screens */
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 16px);background:linear-gradient(#0f1d3acc,#0a1430f2 50%,#0a1430fa);z-index:4;text-align:center}
.screen.on{display:flex}
.sub{color:#fff;font-size:17px;font-weight:700;max-width:390px;line-height:1.35;margin:0;text-shadow:0 1px 3px #0008}
.big{min-width:220px;padding:16px 28px;border-radius:30px;font-size:24px;font-weight:900;color:var(--ink);background:linear-gradient(#7dd3fc,#38bdf8);box-shadow:0 5px 0 #0369a1}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #0369a1}
.mid{min-width:200px;padding:12px 22px;border-radius:24px;font-size:18px;font-weight:700;color:var(--ink);background:#fff;box-shadow:0 4px 0 #b4c3dc;text-decoration:none;display:inline-block}
.best{color:#fff;font-size:16px;font-weight:700;line-height:1.5}
.best b{color:#facc15}
.over-h{font-size:28px;font-weight:900;color:#fff;margin:0}
.over-line{background:var(--card);border-radius:18px;padding:10px 16px;font-weight:700;max-width:340px;font-size:17px}
.over-score{font-size:56px;font-weight:900;color:#facc15;text-shadow:0 3px 0 var(--ink);line-height:1}
.over-score small{display:block;font-size:17px;color:#fff;text-shadow:none;margin-top:4px}
.newrec{font-size:20px;font-weight:900;color:#fff;background:var(--green);padding:4px 14px;border-radius:14px;display:inline-block}
.head{width:min(34vw,150px);aspect-ratio:1;object-fit:cover;object-position:50% 0;border-radius:50%;background:#d8ecff;border:4px solid #fff;box-shadow:0 8px 20px #0008}
.links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.links a{color:#cfe0ff;font-weight:700;font-size:15px;text-decoration:none}

#start{gap:clamp(10px,2.2vh,20px)}
#start .hero{width:min(92vw,520px,calc((100vh - 290px) * 1.333));aspect-ratio:4/3;border-radius:22px;box-shadow:0 0 0 4px #ffffff33,0 14px 40px #000a;object-fit:cover;background:#1e3a6b}
.startBtns{display:flex;flex-direction:column;align-items:center;gap:10px}
#playBtn{display:flex;align-items:center;justify-content:center;gap:10px;min-width:250px;font-size:28px;padding:16px 34px;animation:breathe 2.4s ease-in-out infinite}
#playBtn svg{width:24px;height:24px;fill:var(--ink)}
@keyframes breathe{50%{transform:scale(1.04)}}
#howBtn{min-width:0;padding:9px 22px;font-size:16px;background:#ffffff1f;color:#fff;box-shadow:none;border:2px solid #ffffff55}
.foot{display:flex;align-items:center;gap:14px}
.who{color:#9fc3ef;font-size:13px;font-weight:700;margin:0}
@media (min-width:700px) and (min-height:600px){.startBtns{flex-direction:row-reverse;gap:16px}}
@media (max-height:620px){.who{display:none}#start .sub{font-size:14px}#start .hero{width:min(84vw,calc((100vh - 330px) * 1.333))}#playBtn{font-size:24px;padding:12px 28px}#start{gap:8px}}

/* tutorial */
#tutDim{position:fixed;inset:0;display:none;pointer-events:none;z-index:7}
#tutDim.on{display:block}
#tutHole{position:absolute;border-radius:20px;box-shadow:0 0 0 200vmax #0a1430b0;border:3px solid #facc15;transition:all .3s}
#tutCard{position:fixed;left:10px;right:10px;display:none;background:var(--card);border-radius:20px;padding:12px 14px 10px;box-shadow:0 8px 24px #0009;max-width:460px;margin:0 auto;border:3px solid var(--gold);z-index:8}
#tutCard.on{display:block}
#tutText{font-size:17px;font-weight:700;line-height:1.35;min-height:46px}
#tutText .ok{color:#16a34a}
#tutBar{height:6px;background:#dde6f3;border-radius:3px;margin:9px 0 7px;overflow:hidden}
#tutBar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
#tutRow{display:flex;align-items:center;gap:10px}
#tutCount{flex:1;font-size:14px;color:#6a7899;font-weight:700}
#tutSkip{background:none;color:#6a7899;font-size:15px;font-weight:700;padding:8px}
#tutNext{padding:10px 26px;border-radius:20px;font-size:18px;font-weight:900;color:var(--ink);background:#facc15}
#tutNext:disabled{background:#c3cddd;color:#6a7899}
.keyhint{font-size:12px;color:#9aa6bd;font-weight:500}
@media (hover:none){.keyhint{display:none}}

#hud{gap:6px}
#lives{gap:1px;padding:0 6px}
#lives img{width:24px;height:24px;object-fit:contain}
#haniBox{gap:3px;padding:0 8px}
#haniBox i{width:10px;height:10px;border-radius:50%;background:#ffffff33;display:block}
#haniBox i.on{background:#f472b6;box-shadow:0 0 8px #f472b6}
#haniBox.hit{animation:hit .4s}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <button class="ibtn" id="pauseBtn" aria-label="הפסקה"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
  <div class="box" id="lives"></div>
  <div class="box" id="scoreBox"><span id="scoreTxt">0</span><small id="floorTxt"></small></div>
  <div class="box" id="haniBox" title="חני"><i></i><i></i><i></i><i></i></div>
  <button class="ibtn sndBtn" aria-label="צליל"></button>
</div>
<div id="strip"><div id="say"></div></div>
<div id="chip"></div>
<div id="fx"></div>
<div id="turn"><svg viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>סובבו את הטלפון לאורך<br><small style="font-size:15px;font-weight:700;opacity:.8">״לרוחב זה edge case. לא נתמך.״</small></div>

<div class="screen on" id="start">
  <img class="hero" src="assets/hero.jpg?v=2" alt="פקי-טק – המשחק של יותם">
  <p class="sub">פקמן בקומה של טקי-טק.<br>אספו קונטקסט, ברחו מבקשות – ואל תגידו ״חני״.</p>
  <div class="startBtns">
    <button class="big" id="playBtn"><svg viewBox="0 0 24 24"><path d="M17 4v16L4 12z"/></svg>שחקו</button>
    <button class="mid" id="howBtn">איך משחקים</button>
  </div>
  <div class="best" id="bestStart"></div>
  <div class="foot">
    <a class="links verse-hide" href="/c/yotam" target="_top" style="color:#cfe0ff;font-weight:700;font-size:15px;text-decoration:none">יותם בשלומיוורס ←</a>
    <button class="ibtn sndBtn" aria-label="צליל"></button>
  </div>
  <p class="who">יותם גולדשטיין · Senior AI &amp; Context Engineer, טקי-טק</p>
</div>

<div class="screen" id="over">
  <p class="over-h" id="overH">יותם נתקע.</p>
  <img class="head" src="assets/yotam-lap-sad.webp" alt="">
  <div class="over-line" id="overLine"></div>
  <div class="over-score" id="overScore">0<small>נקודות</small></div>
  <div id="overRec"></div>
  <div class="best" id="bestOver"></div>
  <button class="big" id="againBtn">עוד ספרינט</button>
  <div class="links"><a href="/c/yotam" target="_top">יותם בשלומיוורס ←</a> · <a href="/c/hani" target="_top">חני ←</a></div>
</div>

<div class="screen" id="paused">
  <p class="over-h">הפסקה</p>
  <div class="over-line">״זה בסדר. זה בסדר. גם ל-flow מותר לעצור.״</div>
  <button class="big" id="resumeBtn">ממשיכים</button>
  <button class="mid" id="quitBtn">יציאה לתפריט</button>
</div>

<div id="tutDim"><div id="tutHole"></div></div>
<div id="tutCard">
  <div id="tutText"></div>
  <div id="tutBar"><i></i></div>
  <div id="tutRow">
    <span id="tutCount"></span>
    <button id="tutSkip">דלגו <span class="keyhint">(Esc)</span></button>
    <button id="tutNext">הבא <span class="keyhint">(רווח)</span></button>
  </div>
</div>
<script src="game.js?v=16"></script>
</body>
</html>
