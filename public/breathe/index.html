    <script>
      // Applied before first paint so a light-theme user never sees a dark flash.
      (function () {
        try {
          var t = localStorage.getItem('breathing-theme') || 'system';
          var light = t === 'light' || (t === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
          if (light) {
            document.documentElement.classList.add('light');
            var m = document.querySelector('meta[name="theme-color"]');
