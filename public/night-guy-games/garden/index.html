<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#140d24">
<title>פסיכופת גינה – המשחק</title>
<meta name="description" content="בלילה, בגינה, הוא ניגש לזרות עם שאלה קטנה ותמימה. סגרו שטחים בגינה, סגרו עליהן את השיחה לפני שהסיפור שלו נהיה מחריד – ותיזהרו מהניידות.">
<meta property="og:type" content="website">
<meta property="og:locale" content="he_IL">
<meta property="og:title" content="פסיכופת גינה – המשחק">
<meta property="og:description" content="סליחה, אפשר לשאול אותך משהו? סגרו שטחים בגינה בלילה, לפני שהסיפור שלו נגמר – ולפני שהמשטרה חותכת לכם את השובל.">
<meta property="og:url" content="https://shlomiverse.com/night-guy-games/garden/">
<meta property="og:image" content="https://shlomiverse.com/night-guy-games/garden/assets/share.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<script src="/t.js" data-site="night-guy-games" defer></script>
<script src="/verse/game-frame.js"></script>
<style>
:root{
  --ink:#140d24; --card:#f8f5ff; --gold:#facc15; --red:#ef4444; --green:#22c55e; --purple:#8b5cf6;
  --safe-t:calc(env(safe-area-inset-top,0px) + var(--verse-top,0px)); --safe-b:calc(env(safe-area-inset-bottom,0px) + var(--verse-bottom,0px));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:Rubik,system-ui,sans-serif;color:var(--ink);overscroll-behavior:none;touch-action:none}
body{background:#140d24}
[hidden]{display:none!important}
button{font-family:inherit;border:0;cursor:pointer}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

/* HUD - one thin row */
#hud{position:fixed;top:calc(var(--safe-t) + 6px);left:6px;right:6px;max-width:600px;margin:0 auto;display:none;align-items:center;gap:6px;z-index:3}
#hud.on{display:flex}
.ibtn{width:40px;height:40px;border-radius:13px;background:#140d24cc;display:grid;place-items:center;flex:none}
.ibtn svg{width:22px;height:22px;fill:#fff}
.box{height:40px;border-radius:13px;background:#140d24cc;color:#fff;display:flex;align-items:center;gap:6px;padding:0 10px;flex:none;font-weight:900}
#pctBox{flex:1;position:relative;overflow:hidden;padding:0;justify-content:center;font-size:17px}
#pctBar{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#6d28d9,#a855f7);transition:width .3s}
#pctGoal{position:absolute;top:0;bottom:0;width:3px;background:#facc15}
#pctTxt{position:relative;direction:rtl}
#pctTxt small{font-size:12px;opacity:.85;font-weight:700}
#scoreBox{font-size:17px}
#livesBox{font-size:16px;letter-spacing:1px;color:#f87171}
#nightBox{font-size:13px;color:#c4b5fd}

/* his words - a strip at the bottom with his face */
#strip{position:fixed;left:6px;right:6px;bottom:calc(var(--safe-b) + 6px);max-width:600px;margin:0 auto;display:none;align-items:center;gap:8px;z-index:3;pointer-events:none;background:#140d24e8;border:2px solid #8b5cf6aa;border-radius:16px;padding:6px 10px 6px 8px;min-height:58px}
#strip.on{display:flex}
#strip img{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;border:2px solid #a78bfa}
#say{flex:1;color:#fff;font-size:15px;font-weight:700;line-height:1.3;transition:opacity .15s}
#say.loud{color:#fecaca;font-weight:900}
#say.reveal{color:#facc15;font-weight:900}
#pips{display:flex;gap:4px;flex:none;direction:ltr}
#pips i{width:9px;height:9px;border-radius:50%;background:#ffffff33}
#pips i.on{background:#facc15}
#pips i.last.on{background:#ef4444}

/* effects */
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:6}
.pop{position:absolute;font-weight:900;font-size:24px;color:#fff;text-shadow:0 3px 0 #140d24,0 0 12px #8b5cf6;white-space:nowrap;animation:pop 1s ease-out forwards}
.pop.gold{text-shadow:0 3px 0 #a16207,0 0 14px #facc15;font-size:28px}
.pop.bad{text-shadow:0 3px 0 #991b1b,0 0 12px #ef4444}
@keyframes pop{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{transform:translate(-50%,-10px) scale(1.1);opacity:1}100%{transform:translate(-50%,-60px) scale(1);opacity:0}}
.flash{position:fixed;inset:0;background:#ef444455;animation:flash .4s forwards}
.flash.blue{background:#3b82f655}
@keyframes flash{to{opacity:0}}
.banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;color:#fff;font-weight:900;font-size:min(11vw,50px);line-height:1.05;text-shadow:0 3px 0 var(--ink),0 0 24px #000a;white-space:nowrap;animation:ban 1.4s ease-out forwards}
.banner.count{font-size:min(24vw,110px);animation-duration:.9s}
@keyframes ban{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}15%{transform:translate(-50%,-50%) scale(1.08);opacity:1}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
#turn{display:none;position:fixed;inset:0;z-index:20;background:#140d24;color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:900;font-size:22px;text-align:center;padding:16px}
#turn svg{width:64px;height:64px;animation:turn 1.6s ease-in-out infinite}
@keyframes turn{50%{transform:rotate(-90deg)}}
body.turn #turn{display:flex}

/* screens */
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 14px);background:linear-gradient(#140d24bb,#0d0818f2 50%,#0d0818fa);z-index:4;text-align:center}
.screen.on{display:flex}
#start{background:radial-gradient(ellipse at 50% 30%,#2a1850,#0d0818 70%)}
.sub{color:#fff;font-size:16px;font-weight:700;max-width:390px;line-height:1.35;margin:0;text-shadow:0 1px 3px #0008}
.big{min-width:220px;padding:15px 28px;border-radius:30px;font-size:24px;font-weight:900;color:var(--ink);background:linear-gradient(#fde047,#eab308);box-shadow:0 5px 0 #a16207}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #a16207}
.mid{min-width:200px;padding:11px 22px;border-radius:24px;font-size:18px;font-weight:700;color:var(--ink);background:#fff;box-shadow:0 4px 0 #b9a8dc;text-decoration:none;display:inline-block}
.best{color:#fff;font-size:15px;font-weight:700;line-height:1.5}
.best b{color:#facc15}
.over-h{font-size:28px;font-weight:900;color:#fff;margin:0}
.over-line{background:var(--card);border-radius:18px;padding:10px 16px;font-weight:700;max-width:340px;font-size:16px;line-height:1.35}
.over-score{font-size:54px;font-weight:900;color:#facc15;text-shadow:0 3px 0 var(--ink);line-height:1}
.over-score small{display:block;font-size:15px;color:#fff;text-shadow:none;margin-top:4px}
.newrec{font-size:19px;font-weight:900;color:#fff;background:var(--green);padding:4px 14px;border-radius:14px;display:inline-block}
.head{height:min(24vh,170px);object-fit:contain;filter:drop-shadow(0 8px 16px #0008)}
.links a{color:#d8ccf5;font-weight:700;font-size:15px;text-decoration:none}
.night-big{font-size:min(16vw,64px);font-weight:900;color:#facc15;text-shadow:0 4px 0 var(--ink);margin:0;line-height:1}
.night-did{color:#d8ccf5;font-size:17px;font-weight:700;margin:0}
.night-goal{color:#fff;font-size:18px;font-weight:900;margin:0}

/* the start screen - design B: the painting is the screen, the buttons are signs from the night park */
#start{justify-content:space-between;gap:8px;padding:calc(var(--safe-t) + 8px) 12px calc(var(--safe-b) + 12px);background:url(assets/ui/start-bg.jpg) center 30%/cover no-repeat,#0d0818}
#start::after{content:'';position:absolute;inset:0;background:linear-gradient(#0d081870,transparent 24%,transparent 50%,#0d0818cc 86%,#0d0818f0);pointer-events:none}
#start>*{position:relative;z-index:1}
@media (min-aspect-ratio:4/5){#start{background:url(assets/ui/start-bg.jpg) center top/auto 100% no-repeat,radial-gradient(ellipse at 50% 40%,#2a1850,#0d0818 70%)}}
.st-top{display:flex;flex-direction:column;align-items:center;gap:2px}
.st-title{width:min(78vw,380px,46vh);filter:drop-shadow(0 6px 14px #000c)}
.st-bottom{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.2vh,20px);width:100%}
.st-row{display:flex;gap:clamp(10px,3vw,18px);justify-content:center;align-items:center}
.sign.st-snd{position:absolute!important;top:calc(var(--safe-t) + 10px);left:12px;z-index:2}
.sign{all:unset;box-sizing:border-box;position:relative;display:grid;place-items:center;background:center/100% 100% no-repeat;cursor:pointer;color:#fff4dc;font-family:Rubik,system-ui,sans-serif;font-weight:900;line-height:1;text-shadow:0 2px 0 #5a2a0a,0 3px 8px #000b;transition:transform .12s;-webkit-tap-highlight-color:transparent;text-decoration:none}
.sign:active{transform:scale(.94)}
.sign:focus-visible{outline:3px solid #facc15;outline-offset:3px;border-radius:20px}
.sign.play{background-image:url(assets/ui/sign-play.webp);width:min(78vw,370px,50vh);aspect-ratio:640/213;font-size:clamp(26px,5.4vh,42px);animation:breathe 2.4s ease-in-out infinite}
.sign.play span{margin-top:-4%}
.sign.mid{background-image:url(assets/ui/sign-mid.webp);width:min(42vw,190px,30vh);aspect-ratio:420/162;font-size:clamp(14px,2.4vh,18px)}
.sign.back{background-image:url(assets/ui/sign-back.webp);width:min(46vw,215px,33vh);aspect-ratio:520/161;font-size:clamp(13px,2.2vh,16px)}
.sign.back span{padding:0 33% 0 10%;text-align:center;line-height:1.05}
.sign.thin{background-image:url(assets/ui/sign-thin.webp);width:min(52vw,230px,34vh);aspect-ratio:420/115;font-size:clamp(13px,2.2vh,16px);cursor:default;margin-top:-6px}
.sign.thin:active{transform:none}
.rec{position:relative;background:url(assets/ui/badge-record.webp) center/100% 100% no-repeat;width:min(44vw,180px,27vh);aspect-ratio:420/198;color:#fff4dc;font-weight:900;text-shadow:0 2px 0 #5a2a0a;line-height:1.05}
.rec span{position:absolute;left:38%;right:11%;top:16%;bottom:16%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.rec small{font-size:clamp(11px,1.8vh,14px);font-weight:700;opacity:.92;white-space:nowrap}
.rec b{font-size:clamp(17px,3.2vh,24px);color:#fde68a}
.sign.snd{background-image:url(assets/ui/btn-sound.webp);width:clamp(48px,9vh,64px);aspect-ratio:420/344}
.sign.snd.off{filter:grayscale(.8) brightness(.75)}
.sign.snd.off::after{content:'';position:absolute;left:22%;right:22%;top:48%;height:9%;background:#ef4444;border-radius:4px;transform:rotate(-40deg);box-shadow:0 0 0 2px #5a2a0a}
html:not(.in-verse) .verse-only{display:none!important}html.in-verse .verse-hide{display:none!important}

/* tutorial */
#tutDim{position:fixed;inset:0;display:none;pointer-events:none;z-index:7}
#tutDim.on{display:block}
#tutHole{position:absolute;border-radius:20px;box-shadow:0 0 0 200vmax #0d0818b0;border:3px solid #facc15;transition:all .3s}
#tutCard{position:fixed;left:10px;right:10px;display:none;background:var(--card);border-radius:20px;padding:12px 14px 10px;box-shadow:0 8px 24px #0009;max-width:460px;margin:0 auto;border:3px solid var(--gold);z-index:8}
#tutCard.on{display:block}
#tutText{font-size:16px;font-weight:700;line-height:1.35;min-height:44px}
#tutText .ok{color:#16a34a}
#tutBar{height:6px;background:#e4dcf5;border-radius:3px;margin:9px 0 7px;overflow:hidden}
#tutBar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
#tutRow{display:flex;align-items:center;gap:10px}
#tutCount{flex:1;font-size:14px;color:#6b6280;font-weight:700}
#tutSkip{background:none;color:#6b6280;font-size:15px;font-weight:700;padding:8px}
#tutNext{padding:10px 26px;border-radius:20px;font-size:18px;font-weight:900;color:var(--ink);background:#facc15}
#tutNext:disabled{background:#ddd6ea;color:#6b6280}
.keyhint{font-size:12px;color:#94a3b8;font-weight:500}
@media (hover:none){.keyhint{display:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <button class="ibtn" id="pauseBtn" aria-label="עצירה"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
  <div class="box" id="livesBox">❤❤❤</div>
  <div class="box" id="pctBox"><i id="pctBar"></i><i id="pctGoal"></i><span id="pctTxt">0%</span></div>
  <div class="box" id="scoreBox">0</div>
  <div class="box" id="nightBox">לילה 1</div>
</div>
<div id="strip"><img src="assets/face.jpg" alt=""><div id="say"></div><div id="pips"><i></i><i></i><i></i><i class="last"></i></div></div>
<div id="fx"></div>
<div id="turn"><svg viewBox="0 0 24 24" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>סובבו את הטלפון לאורך<br><small style="font-size:15px;font-weight:700;opacity:.8">״סליחה, אפשר לשאול אותך משהו? רק לאורך.״</small></div>

<div class="screen on" id="start">
  <button class="sign snd sndBtn painted st-snd" aria-label="צליל"></button>
  <div class="st-top">
    <img class="st-title" src="assets/title.png" alt="פסיכופת גינה">
  </div>
  <div class="st-bottom">
    <button class="sign play" id="playBtn"><span>שחקו</span></button>
    <div class="st-row">
      <button class="sign mid" id="howBtn"><span>איך משחקים</span></button>
      <a class="sign back" href="/games" target="_top" data-verse-back aria-label="חזרה למשחקים"><span>חזרה<br>למשחקים</span></a>
    </div>
    <div class="rec" id="bestStart"></div>
  </div>
</div>

<div class="screen" id="night">
  <p class="night-did" id="nightDid"></p>
  <p class="night-big" id="nightBig">לילה 2</p>
  <p class="night-goal" id="nightGoal"></p>
  <button class="big" id="nightBtn">ממשיכים</button>
</div>

<div class="screen" id="over">
  <p class="over-h" id="overH">נתפסת!</p>
  <img class="head" id="overImg" src="assets/guy-caught.webp" alt="">
  <div class="over-line" id="overLine"></div>
  <div class="over-score" id="overScore">0<small>נקודות</small></div>
  <div id="overRec"></div>
  <div class="best" id="bestOver"></div>
  <button class="big" id="againBtn">עוד לילה</button>
  <button class="mid" id="menuBtn">לתפריט</button>
  <div class="links"><a href="/c/night-guy" target="_top">פסיכופת גינה בשלומיוורס ←</a></div>
</div>

<div class="screen" id="paused">
  <p class="over-h">עצרנו</p>
  <div class="over-line">״עצרנו? מעולה. אז תגידי, את אוהבת רילסים?״</div>
  <button class="big" id="resumeBtn">ממשיכים</button>
  <button class="mid" id="quitBtn">יציאה לתפריט</button>
</div>

<div id="tutDim"><div id="tutHole"></div></div>
<div id="tutCard">
  <div id="tutText"></div>
  <div id="tutBar"><i></i></div>
  <div id="tutRow">
    <span id="tutCount"></span>
    <button id="tutSkip">דלגו <span class="keyhint">(Esc)</span></button>
    <button id="tutNext">הבא <span class="keyhint">(רווח)</span></button>
  </div>
</div>
<script src="game.js?v=5"></script>
</body>
</html>
