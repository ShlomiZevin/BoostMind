<!doctype html>
<html lang="he" dir="rtl" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#120f0d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="סיציליה" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌋</text></svg>" />
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌋</text></svg>" />
<title>סיציליה · מדריך הטיול</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#120f0d; --surface:#1c1815; --surface-2:#262019; --border:rgba(255,255,255,.09);
    --text:#f2ebe2; --muted:#a1907e; --accent:#f59e0b; --accent-ink:#2b1a00;
    --sunset:#fb7185; --good:#34d399; --warn:#f87171; --radius:16px;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  html:not(.dark){
    --bg:#faf7f2; --surface:#ffffff; --surface-2:#f4efe7; --border:rgba(60,40,20,.12);
    --text:#211a12; --muted:#7a6a58; --accent:#c2410c; --accent-ink:#ffffff;
    --sunset:#be123c; --good:#059669; --warn:#dc2626;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  /* ── מעטפת אפליקציה ──────────────────────────────────────────────
     הדף עצמו לא נגלל אף פעם. המסך הוא עמודה בגובה קבוע: כותרת למעלה,
     ניווט למטה, ורק האזור באמצע גולל. ככה זה מרגיש אפליקציה ולא אתר,
     והכותרת והניווט אף פעם לא בורחים מהמסך. */
  /* position:fixed על ה-body לא כיסה את אזור ה-safe area במצב אפליקציה,
     והרקע הלבן של הדפדפן הציץ מתחת לניווט. גובה 100% על html ועל body,
     עם viewport-fit=cover, נותן לאפליקציה את כל המסך כולל האזור הזה.
     הרקע נצבע גם על html כרשת ביטחון. */
  /* dvh ולא 100% ולא vh. גובה 100% נמדד מול ה-viewport הגדול — זה שכולל
     את שורת הכתובת — אז הפס התחתון נדחף מתחת לאזור הנראה: הוא נראה במקום
     הלא נכון וגם לא ניתן ללחיצה. dvh הוא הגובה שבאמת נראה כרגע. */
  html{height:100%;background:var(--bg)}
  body{
    margin:0;padding:0;height:100vh;height:100dvh;
    overflow:hidden;overscroll-behavior:none;
    font-family:'Heebo',system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--text);
    -webkit-font-smoothing:antialiased; line-height:1.5;
  }
  #root{max-width:680px;margin:0 auto;height:100vh;height:100dvh;
    display:flex;flex-direction:column;background:var(--bg)}
  .screen{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .screen.noscroll{overflow:hidden}
  button{font-family:inherit;cursor:pointer}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--accent);color:var(--accent-ink)}

  /* header */
  .topbar{flex:none;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 16px;
    padding-top:calc(12px + var(--safe-t));display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand h1{font-size:18px;font-weight:800;margin:0;letter-spacing:-.3px}
  .brand .sub{font-size:12px;color:var(--muted);font-weight:500}
  .iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);display:grid;place-items:center;font-size:18px;flex:none}
  .iconbtn:active{transform:scale(.94)}

  /* layout */
  .view{padding:16px 16px 28px}
  .hero h2{font-size:26px;font-weight:800;margin:0 0 2px;letter-spacing:-.5px}
  .hero p{color:var(--muted);margin:0;font-size:14px}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .card.tap{transition:transform .12s ease,border-color .15s}
  .card.tap:active{transform:scale(.99);border-color:var(--accent)}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;
    padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted)}
  .pill.accent{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
  .pill.sunset{color:var(--sunset);border-color:color-mix(in srgb,var(--sunset) 40%,transparent)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  /* chips nav */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--border);
    background:var(--surface);color:var(--muted);font-weight:600;font-size:13px}
  .chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

  /* day */
  .dayhead{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
  .dayhead .dnum{width:38px;height:38px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
  .dayhead h3{margin:0;font-size:17px;font-weight:800}
  .dayhead .meta{font-size:12.5px;color:var(--muted)}
  .progress{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:12px}
  .progress > i{display:block;height:100%;background:var(--good);border-radius:999px;transition:width .3s}

  /* שורת לו״ז: שלוש עמודות קבועות — שעה, צ׳קבוקס, ומה עושים.
     בלי פס זמן ובלי נקודות: הם התחרו על אותו מקום עם הצ׳קבוקס והשעה
     והפכו את הרשימה לרועשת. קו מפריד דק בין שורות עושה את אותה עבודה. */
  .timeline{margin-top:10px}
  .ti{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
  .ti:last-child{border-bottom:none;padding-bottom:2px}
  .ti .tcol{flex:none;width:44px;text-align:start;font-variant-numeric:tabular-nums;
    font-weight:700;font-size:13px;color:var(--muted);padding-top:4px}
  .ti.done .tcol{opacity:.5}
  .ti .chk{flex:none;width:24px;height:24px;margin-top:1px;border-radius:7px;
    border:1.6px solid var(--border);background:var(--surface);display:grid;place-items:center;
    font-size:13px;color:var(--good)}
  .ti.done .chk{background:var(--good);border-color:var(--good);color:#062e22}
  .ti .tbody{flex:1;min-width:0}
  .ti .title{font-weight:600;font-size:15px;line-height:1.4}
  .ti.done .title{text-decoration:line-through;color:var(--muted)}
  .ti .note{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.45}
  .ti .linkrow{margin-top:8px}
  .tlink{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:5px 10px;border-radius:9px;border:none}

  /* place card */
  .pcard .ph{height:84px;border-radius:12px;display:flex;align-items:flex-end;padding:10px;margin-bottom:10px;
    background:var(--surface-2);position:relative;overflow:hidden}
  .pcard .ph .emoji{font-size:40px;line-height:1}
  .pcard h3{margin:0;font-size:17px;font-weight:800}
  .pcard .en{font-size:12px;color:var(--muted);font-weight:500}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:430px){.grid{grid-template-columns:1fr}}

  /* detail overlay */
  .overlay{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;
    animation:slideup .22s ease}
  @keyframes slideup{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
  .ovbar{flex:none;background:var(--bg);border-bottom:1px solid var(--border);
    padding:12px 16px;padding-top:calc(12px + var(--safe-t));display:flex;align-items:center;gap:12px}
  .ovbar h2{font-size:18px;font-weight:800;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ovscroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .ovhero{height:130px;display:grid;place-items:center;font-size:66px;background:var(--surface-2)}
  .ovbody{padding:18px 16px calc(28px + var(--safe-b));max-width:680px;margin:0 auto}
  .sec{margin:18px 0}
  .sec h4{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 8px;font-weight:700}
  .kv{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14.5px}
  .kv .k{flex:none;width:120px;color:var(--muted);font-weight:600}
  .kv .v{flex:1}
  .tips li{margin-bottom:7px;font-size:14.5px}
  .body-text{font-size:15px;line-height:1.65}

  /* action buttons */
  .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
  .abtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:13px;
    border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:700;font-size:12.5px}
  .abtn .ic{font-size:20px}
  .abtn:active{transform:scale(.96)}
  .abtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .abtn.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
  .abtn.ok{color:var(--good);border-color:var(--good)}

  /* checklist */
  .clitem{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);font-size:15px}
  .clitem:last-child{border-bottom:none}
  .clitem .cb{flex:none;width:24px;height:24px;border-radius:7px;border:1.6px solid var(--border);display:grid;place-items:center;font-size:13px;color:var(--good)}
  .clitem.on .cb{background:var(--good);border-color:var(--good);color:#062e22}
  .clitem.on span{text-decoration:line-through;color:var(--muted)}
  .clcat{font-size:13px;font-weight:800;color:var(--accent);margin:18px 0 4px;letter-spacing:.3px}

  /* chat */
  .chatpane{height:100%;display:flex;flex-direction:column}
  .chatscroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 6px}
  .msg{max-width:88%;padding:11px 14px;border-radius:16px;font-size:15px;line-height:1.6;
    margin-bottom:10px;white-space:pre-wrap;word-break:break-word}
  .msg.me{margin-inline-start:auto;background:var(--accent);color:var(--accent-ink)}
  .msg.bot{margin-inline-end:auto;background:var(--surface);border:1px solid var(--border);white-space:normal}

  /* טקסט מעוצב בתשובות: מודגש, רשימות, לינקים וטלפונים לחיצים. */
  .rp{margin:0 0 6px}
  .rp:last-child{margin-bottom:0}
  .rh{font-weight:800;font-size:14.5px;margin:11px 0 5px}
  .rh:first-child{margin-top:0}
  .rul{margin:4px 0 8px;padding-inline-start:19px}
  .rul li{margin-bottom:5px;line-height:1.55}
  .rgap{height:7px}
  .bname{font:inherit;font-weight:800;background:none;border:0;padding:0;color:inherit;
    border-bottom:1px dashed color-mix(in srgb,var(--accent) 65%,transparent)}
  .bname:active{color:var(--accent)}
  .sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;
    background:rgba(0,0,0,.45);animation:fadein .15s ease}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .sheet-in{width:100%;max-width:680px;margin:0 auto;background:var(--surface);
    border-top:1px solid var(--border);border-radius:20px 20px 0 0;
    padding:18px 16px calc(14px + var(--safe-b))}
  .sheet-in h3{margin:0;font-size:17px;font-weight:800;word-break:break-word}
  .sheet-in .actions{margin-bottom:0}
  .clink{color:var(--accent);font-weight:600;
    border-bottom:1px solid color-mix(in srgb,var(--accent) 45%,transparent);word-break:break-word}
  /* המספר הוא רצף LTR בתוך פסקה RTL — בלי בידוד מפורש הדפדפן מסדר
     מחדש את הקטעים והמספר מוצג הפוך. */
  .phone{display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);
    border:1px solid var(--border);border-radius:9px;padding:3px 9px;margin:2px 0;
    font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;
    direction:ltr;unicode-bidi:isolate}
  .phone a{color:var(--accent)}
  .phone .wa{color:#25d366}
  .msg.bot.wait{color:var(--muted)}
  .applied{margin:-4px 0 12px;padding:9px 12px;border-radius:12px;font-size:13px;font-weight:600;
    background:color-mix(in srgb,var(--good) 14%,transparent);
    border:1px solid color-mix(in srgb,var(--good) 40%,transparent);color:var(--text)}
  .applied b{display:block;font-size:11.5px;color:var(--good);margin-bottom:3px;letter-spacing:.3px}
  /* הצעה לשינוי — כלום לא נכנס לתוכנית לפני שלוחצים אישור. */
  .proposal{margin:-4px 0 12px;padding:12px 13px;border-radius:14px;font-size:13.5px;
    background:color-mix(in srgb,var(--accent) 10%,transparent);
    border:1px solid color-mix(in srgb,var(--accent) 42%,transparent);color:var(--text)}
  .proposal b{display:block;font-size:11.5px;color:var(--accent);margin-bottom:6px;letter-spacing:.3px}
  .proposal .pline{margin-bottom:4px;font-weight:600;line-height:1.5}
  .pbtns{display:flex;gap:8px;margin-top:12px}
  .pbtn{flex:1;padding:10px 8px;border-radius:11px;font-family:inherit;font-weight:700;font-size:13.5px;
    border:1px solid var(--border)}
  .pbtn.ok{background:var(--good);border-color:var(--good);color:#062e22}
  .pbtn.no{background:var(--surface);color:var(--muted)}
  .rejected{margin:-4px 0 12px;padding:0 4px;font-size:12.5px;color:var(--muted)}
  .composer{flex:none;padding:10px 16px 10px;background:var(--bg);
    border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end}
  .composer textarea{flex:1;min-height:44px;max-height:110px;resize:none;padding:11px 13px;
    border-radius:13px;border:1px solid var(--border);background:var(--surface);color:var(--text);
    font-family:inherit;font-size:16px;line-height:1.4}
  .composer textarea:focus{outline:none;border-color:var(--accent)}
  .sendbtn{flex:none;width:44px;height:44px;border-radius:13px;border:none;
    background:var(--accent);color:var(--accent-ink);font-size:19px;display:grid;place-items:center}
  .sendbtn:disabled{opacity:.4}
  .qchip{flex:none;padding:9px 13px;border-radius:999px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-weight:600;font-size:13px;text-align:start}

  /* bottom nav */
  /* צמוד לתחתית, בלי שום שריון ל-safe area. iOS מדווח 34px וכל שארית
     ממנו נראתה כמו חור במצב אפליקציה. פס ה-home מרחף מעל הקצה בשקיפות. */
  .bottomnav{flex:none;background:var(--bg);border-top:1px solid var(--border);display:flex;
    padding:7px 4px 8px}
  .nav-i{flex:1;background:none;border:none;color:var(--muted);display:flex;flex-direction:column;
    align-items:center;gap:2px;padding:3px 2px 4px;font-weight:600;font-size:10.5px;line-height:1.15}
  .nav-i .ic{font-size:20px;line-height:1}
  .nav-i.on{color:var(--accent)}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .divider{height:1px;background:var(--border);margin:16px 0}
  .warnbox{background:color-mix(in srgb,var(--sunset) 13%,transparent);border:1px solid color-mix(in srgb,var(--sunset) 35%,transparent);
    border-radius:12px;padding:11px 13px;font-size:13.5px;font-weight:600;color:var(--text);display:flex;gap:8px;align-items:flex-start}
  .notebox{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:14px}
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

/* ---------------- helpers ---------------- */
const enc = encodeURIComponent;
const gmapsDir = q => `https://www.google.com/maps/dir/?api=1&destination=${enc(q)}`;
const gmapsView = q => `https://www.google.com/maps/search/?api=1&query=${enc(q)}`;
const wazeNav = q => `https://waze.com/ul?q=${enc(q)}&navigate=yes`;
// תמונות אמיתיות של המקום, לא תוצאות Maps — Google Images ישירות.
const gimages = q => `https://www.google.com/search?tbm=isch&q=${enc(q)}`;
const gsearch = q => `https://www.google.com/search?q=${enc(q)}`;
const uid = () => Math.random().toString(36).slice(2, 8);

const BASE = {
  name:'Recanati · Giardini Naxos', he:'הדירה',
  area:'Giardini Naxos · על הים, כמה דקות דרומית לטאורמינה',
  q:'Giardini Naxos Messina',
  note:'הכתובת המדויקת נמצאת באישור ההזמנה — שווה להדביק אותה ב-Maps ברגע שנוחתים.'
};
const AIRPORT = { name:'Catania Fontanarossa · CTA', q:'Catania Fontanarossa Airport' };

/* ================================================================
   התוכנית עצמה — מבנה נתונים אחד, לא טקסט קשיח.
   לכל יום, פריט, מקום וארוחה יש מזהה יציב. זה מה שמאפשר לצ'אט
   להוסיף, לשנות ולמחוק דברים בצורה מדויקת: הוא מקבל את ה-JSON הזה
   ומחזיר פעולות שמצביעות על מזהים.
   ================================================================ */
const DEFAULT_TRIP = {
  version: 1,
  days: [
    { id:'d1', d:'ד׳', label:'הגעה + טאורמינה', date:'2.9 · רביעי',
      warn:'הטיסה ב-11:00 — בשדה ב-08:00', items:[
      {id:'a1', t:'08:00', x:'נתב״ג · צ׳ק־אין וביטחון'},
      {id:'a2', t:'11:00', x:'✈️ טיסה לקטניה', n:'~3 שעות · באיטליה שעה אחורה'},
      {id:'a3', t:'13:15', x:'נחיתה בקטניה (CTA)', n:'שעון מקומי', airport:true},
      {id:'a4', t:'14:00', x:'איסוף הרכב השכור', n:'כרטיס אשראי פיזי + רישיון'},
      {id:'a5', t:'14:45', x:'נסיעה לג׳רדיני נאקסוס', n:'~50 דק׳', base:true},

/* ---------------- persistence ---------------- */
function useStore(key, init){
  const [v,setV]=useState(()=>{ try{const s=localStorage.getItem(key);return s?JSON.parse(s):init;}catch(e){return init;} });
  useEffect(()=>{ try{localStorage.setItem(key,JSON.stringify(v));}catch(e){} },[key,v]);
  return [v,setV];
}

/* ================================================================
   עריכת התוכנית — הפעולות שהצ'אט יכול לבצע.
   כל פעולה מוחלת על עותק ומחזירה תיאור בעברית של מה שקרה, כדי
   שהאפליקציה תראה לך בדיוק מה השתנה. פעולה שנכשלת (מזהה לא קיים,
   שדה חסר) מדולגת בשקט — היא אף פעם לא שוברת את התוכנית.
   ================================================================ */
const minutesOf = t => {
  const m = /^(\d{1,2}):(\d{2})/.exec(String(t||''));
  return m ? Number(m[1])*60 + Number(m[2]) : 99999;
};

function insertByTime(items, item){
  const at = items.findIndex(x => minutesOf(x.t) > minutesOf(item.t));
  if (at < 0) items.push(item); else items.splice(at, 0, item);
  return items;
}

const ITEM_FIELDS = ['t','x','n','place','meal','base','airport','opt'];
const PLACE_FIELDS = ['emoji','cat','must','opt','sunday','name','he','tag','drive','q','web','phone','desc','why','time','best','parking','facilities','tips'];
const MEAL_FIELDS = ['emoji','day','time','he','name','area','q','web','phone','desc','look','dishes'];

function pick(src, fields){
  const out = {};
  for (const f of fields) if (src[f] !== undefined) out[f] = src[f];
  return out;
}

function applyOps(trip, ops){
  const t = JSON.parse(JSON.stringify(trip));
  const log = [];
  const dayOf = id => t.days.find(d => d.id === id);

  for (const op of (Array.isArray(ops) ? ops : [])){
    try{
      switch(op.op){
        case 'addItem': {
          const day = dayOf(op.day); if(!day || !op.x) break;
          const item = { id: uid(), ...pick(op, ITEM_FIELDS) };
          insertByTime(day.items, item);
          log.push(`נוסף ל${day.label}: ${item.t ? item.t+' · ' : ''}${item.x}`);
          break;
        }
        case 'updateItem': {
          const day = dayOf(op.day); if(!day) break;
          const it = day.items.find(x => x.id === op.item); if(!it) break;
          const before = it.x;
          Object.assign(it, pick(op, ITEM_FIELDS));
          // שינוי שעה מחייב סידור מחדש, אחרת הציר יוצא לא הגיוני
          if (op.t !== undefined){
            day.items = day.items.filter(x => x.id !== it.id);
            insertByTime(day.items, it);
          }
          log.push(`עודכן ב${day.label}: ${before}`);
          break;
        }
        case 'removeItem': {
          const day = dayOf(op.day); if(!day) break;
          const it = day.items.find(x => x.id === op.item); if(!it) break;
          day.items = day.items.filter(x => x.id !== op.item);
          log.push(`הוסר מ${day.label}: ${it.x}`);
          break;
        }
        case 'moveItem': {
          const from = dayOf(op.day), to = dayOf(op.toDay);
          if(!from || !to) break;
          const it = from.items.find(x => x.id === op.item); if(!it) break;
          from.items = from.items.filter(x => x.id !== op.item);
          if (op.t) it.t = op.t;
          insertByTime(to.items, it);
          log.push(`הועבר ל${to.label}: ${it.x}`);
          break;
        }
        case 'setWarn': {
          const day = dayOf(op.day); if(!day) break;
          day.warn = op.warn || null;
          log.push(`${day.label} — אזהרת היום עודכנה`);
          break;
        }
        case 'setDay': {
          const day = dayOf(op.day); if(!day) break;
          if (op.label) day.label = op.label;
          if (op.date) day.date = op.date;
          log.push(`${day.label} — כותרת היום עודכנה`);
          break;
        }
        case 'addPlace': {
          const id = op.id || uid(); if(!op.he && !op.name) break;
          t.places[id] = {
            emoji:'📍', cat:'city', tips:[],
            name: op.name || op.he, he: op.he || op.name,
            q: op.q || op.name || op.he,
            ...pick(op, PLACE_FIELDS),
          };
          log.push(`נוסף מקום: ${t.places[id].he}`);
          break;
        }
        case 'updatePlace': {
          const p = t.places[op.id]; if(!p) break;
          Object.assign(p, pick(op, PLACE_FIELDS));
          log.push(`עודכן מקום: ${p.he}`);
          break;
        }
        case 'removePlace': {
          const p = t.places[op.id]; if(!p) break;
          delete t.places[op.id];
          for (const d of t.days) for (const it of d.items) if (it.place === op.id) delete it.place;
          log.push(`הוסר מקום: ${p.he}`);
          break;
        }
        case 'addMeal': {
          const id = op.id || uid(); if(!op.he) break;
          const meal = { emoji:'🍽️', dishes:[], ...pick(op, MEAL_FIELDS), id };
          t.meals.push(meal);
          log.push(`נוספה לרשימת המסעדות: ${meal.he}`);
          break;
        }
        case 'updateMeal': {
          const m = t.meals.find(x => x.id === op.id); if(!m) break;
          Object.assign(m, pick(op, MEAL_FIELDS));
          log.push(`עודכנה ארוחה: ${m.he}`);
          break;
        }
        case 'removeMeal': {
          const m = t.meals.find(x => x.id === op.id); if(!m) break;
          t.meals = t.meals.filter(x => x.id !== op.id);
          for (const d of t.days) for (const it of d.items) if (it.meal === op.id) delete it.meal;
          log.push(`הוסרה ארוחה: ${m.he}`);
          break;
        }
        default: break;
      }
    }catch(e){ /* פעולה פגומה לא מפילה את השאר */ }
  }
  return { trip: t, log };
}

/* דפדפנים ישנים, ודפים שנטענו בלי הקשר מאובטח, לא נותנים clipboard API. */
function copyToClipboard(text, done){
  const fallback = () => {
    try{
      const el = document.createElement('textarea');
      el.value = text; el.setAttribute('readonly','');
      el.style.cssText = 'position:absolute;left:-9999px';
      document.body.appendChild(el); el.select();
      document.execCommand('copy'); document.body.removeChild(el);
      done();
    }catch(e){}
  };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}

function ItineraryView({trip, open, done, toggle}){

      </div>
      {trip.days.map((day,di)=>{
        const required=day.items.filter(it=>!it.opt).length || 1;
        const doneCount=day.items.reduce((a,it)=>a+((!it.opt&&done[it.id])?1:0),0);
        const pct=Math.round(doneCount/required*100);
        const isOpen=expanded===di;
        return (
          <div className="card" key={day.id}>
            <div className="dayhead" onClick={()=>setExpanded(isOpen?-1:di)}>

              </div>
              <div className="row" style={{gap:8,flexWrap:'nowrap'}}>
                {pct>=100 && <span className="pill" style={{color:'var(--good)'}}>✓</span>}
                <span style={{color:'var(--muted)',fontSize:18}}>{isOpen?'▾':'▸'}</span>
              </div>
            </div>
            <div className="progress"><i style={{width:Math.min(pct,100)+'%'}}></i></div>
            {day.warn && isOpen && <div className="warnbox" style={{marginTop:14}}>⚠️ {day.warn}</div>}
            {isOpen &&
              <div className="timeline">
                {day.items.map(it=>{
                  const isDone=!!done[it.id];
                  const place = it.place ? trip.places[it.place] : null;
                  const meal = it.meal ? trip.meals.find(m=>m.id===it.meal) : null;
                  return (
                    <div className={"ti"+(isDone?' done':'')} key={it.id}>

/* ================================================================
   הצ'אט. המפתח יושב ב-Cloud Run ולא כאן — אתר סטטי לא יכול להחזיק
   מפתח API, הוא היה גלוי לכל מי שפותח את הדף.
   השרת מקבל את התוכנית העדכנית בכל בקשה, אז הצ'אט תמיד מדבר על מה
   שבאמת רשום אצלך — כולל שינויים שהוא עצמו עשה קודם.
   ================================================================ */
const CHAT_API = 'https://workout-ai-463727469066.me-west1.run.app/api/trip/chat';

const SUGGESTIONS = [
  'מה עושים היום?',
  'תוסיף מסעדה שאנחנו רוצים בטאורמינה ליום רביעי',
  'כמה זמן נסיעה למרזממי?',
  'תזיז את שוק הדגים לשבת בבוקר',
];

const ACTION_RE = /```action\s*([\s\S]*?)```/;
// המודל לא תמיד שם את הבלוק בסוף. מסירים בלוק שלם בכל מקום, וגם בלוק
// שעדיין נכתב ברגע זה — כדי שבתצוגה החיה אף פעם לא יוצג JSON גולמי.
const stripAction = s => s.replace(ACTION_RE,'').replace(/```action[\s\S]*$/,'').trim();

function splitAction(raw){
  const m = ACTION_RE.exec(raw);
  if(!m) return { text: raw.trim(), ops: [] };
  const text = raw.replace(ACTION_RE,'').trim();
  try{
    const parsed = JSON.parse(m[1].trim());
    const ops = Array.isArray(parsed) ? parsed : (parsed.ops || []);
    return { text, ops: Array.isArray(ops) ? ops : [] };
  }catch(e){
    return { text, ops: [] };
  }
}

/* ================================================================
   עיצוב תשובות הצ'אט. אין כאן ספריית markdown — היא הייתה מוסיפה
   תלות חיצונית לאפליקציה שצריכה לעבוד אופליין. זה מטפל בדיוק במה
   שהמודל מייצר בפועל: מודגש, רשימות, כותרות, לינקים וטלפונים.
   טלפון מוצג כצ'יפ עם חיוג ו-WhatsApp — לחיצה ארוכה על המספר
   בטלפון עצמו נותנת גם "הוסף לאנשי קשר".
   ================================================================ */
/* הסדר בתוך התבנית קובע: קודם קישור markdown, אחר כך URL מלא, אחר כך
   מייל — ורק אז דומיין חשוף, כדי ש-alice.it בתוך כתובת מייל לא ייחטף.
   שתי צורות טלפון: בינלאומית (+39 …) ואיטלקית מקומית (0942 …), כי המודל
   מחזיר את שתיהן ולסמוך עליו שיקפיד זה לבקש תקלה. */
const INLINE_RE = new RegExp([
  '(\\[[^\\]\\n]+\\]\\([^)\\s]+\\))',
  '(\\*\\*[^*\\n]+\\*\\*)',
  '(https?:\\/\\/[^\\s<>"\'\\)\\]]+)',
  '([\\w.+-]+@[\\w-]+\\.[\\w.]{2,})',
  '((?:[a-z0-9][a-z0-9-]*\\.)+(?:com|it|org|net|eu|info|co\\.uk|co\\.il)(?:\\/[^\\s<>"\'\\)\\]]*)?)',
  '(\\+\\d[\\d\\s().\\-]{6,}\\d)',
  '(\\b0\\d{1,3}[\\s.\\-]?\\d{6,8}\\b)',
].join('|'), 'gi');

const shortUrl = u => u.replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,'').slice(0,42);

function phoneNode(raw, key){
  const clean = raw.trim();
  const digits = clean.replace(/[^+\d]/g,'');
  // מספר מקומי איטלקי מתחיל ב-0, ובניגוד לרוב המדינות האפס הזה נשמר גם
  // בחיוג בינלאומי — מוסיפים 39+ בלי להסיר אותו.
  const dial = digits.startsWith('+') ? digits : '+39' + digits;
  return (
    <span key={key} className="phone" dir="ltr">
      <a href={'tel:' + dial}>📞&nbsp;<bdi>{clean}</bdi></a>
      <a className="wa" href={'https://wa.me/' + dial.replace(/\D/g,'')} target="_blank" rel="noopener">💬</a>
    </span>
  );
}

function inlineNodes(text, base, onName){
  const out = [];
  let last = 0, k = 0, m;
  // עותק מקומי, לא הרג'קס המשותף: לרג'קס עם דגל g יש lastIndex משלו,
  // והקריאה הרקורסיבית מתוך טקסט מודגש הייתה מאפסת אותו באמצע הלולאה
  // החיצונית — מה שהחזיר אותה לאותו טוקן שוב ושוב ותקע את הדפדפן.
  const re = new RegExp(INLINE_RE.source, 'gi');
  while ((m = re.exec(text))){
    if (m.index > last) out.push(text.slice(last, m.index));
    const tok = m[0];
    const key = base + '-' + (k++);
    if (m[1]){
      const mm = /^\[([^\]]+)\]\(([^)]+)\)$/.exec(tok);
      out.push(<a key={key} className="clink" href={mm[2]} target="_blank" rel="noopener">{mm[1]} ↗</a>);
    } else if (m[2]){
      const inner = tok.slice(2, -2);
      // שם של מקום הוא כמעט תמיד מודגש ובאותיות לטיניות. כותרת עברית
      // ("חשוב לדעת") נשארת מודגשת רגילה, ומודגש שעוטף לינק או טלפון
      // ממשיך לרקורסיה כדי שהוא יישאר לחיץ.
      const probe = new RegExp(INLINE_RE.source, 'gi');
      const nameLike = /[A-Za-z]{3}/.test(inner) && !probe.test(inner);
      if (nameLike && onName){
        out.push(<button key={key} className="bname" onClick={()=>onName(inner)}>{inner}</button>);
      } else {
        out.push(<b key={key}>{inlineNodes(inner, key, onName)}</b>);
      }
    } else if (m[3]){
      out.push(<a key={key} className="clink" href={tok} target="_blank" rel="noopener">{shortUrl(tok)} ↗</a>);
    } else if (m[4]){
      out.push(<a key={key} className="clink" href={'mailto:' + tok}>✉️ {tok}</a>);
    } else if (m[5]){
      out.push(<a key={key} className="clink" href={'https://' + tok} target="_blank" rel="noopener">{tok} ↗</a>);
    } else {
      out.push(phoneNode(tok, key));
    }
    last = m.index + tok.length;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}

function renderRich(text, onName){
  const lines = String(text || '').split('\n');
  const blocks = [];
  let list = null;
  const flush = () => { if (list){ blocks.push({type:'ul', items:list}); list = null; } };

  for (const ln of lines){
    const li = /^\s*[-*•]\s+(.*)$/.exec(ln);
    if (li){ (list || (list = [])).push(li[1]); continue; }
    flush();
    if (!ln.trim()){ blocks.push({type:'gap'}); continue; }
    const h = /^\s*#{1,6}\s+(.*)$/.exec(ln);
    if (h){ blocks.push({type:'h', text:h[1]}); continue; }
    // שורה שכולה מודגשת מתנהגת ככותרת — ככה המודל מסמן קטגוריות
    const bold = /^\s*\*\*([^*]+)\*\*:?\s*$/.exec(ln);
    blocks.push(bold ? {type:'h', text:bold[1]} : {type:'p', text:ln});
  }
  flush();

  return blocks.map((b,i)=>{
    if (b.type === 'gap') return <div key={i} className="rgap"></div>;
    if (b.type === 'h') return <div key={i} className="rh">{inlineNodes(b.text, i, onName)}</div>;
    if (b.type === 'ul') return (
      <ul key={i} className="rul">
        {b.items.map((it,j)=><li key={j}>{inlineNodes(it, i+'-'+j, onName)}</li>)}
      </ul>
    );
    return <div key={i} className="rp">{inlineNodes(b.text, i, onName)}</div>;
  });
}

  const endRef=useRef(null);

  useEffect(()=>{ endRef.current?.scrollIntoView({behavior:'smooth',block:'end'}); },[msgs,live,busy]);

  /* הבלוק המובנה מגיע בתוך התשובה. מפרידים אותו מהטקסט ומריצים אותו
     על עותק בלבד — כדי לקבל תיאור בעברית של מה ישתנה. שום דבר לא נכנס
     לתוכנית האמיתית עד שלוחצים "אשר". */
  function finish(raw){
    const { text, ops } = splitAction(raw);
    const msg = { role:'assistant', content: text || 'הנה מה שאני מציע:' };
    if (ops.length){
      msg.ops = ops;
      msg.preview = applyOps(trip, ops).log;
      msg.status = 'pending';
    }
    setMsgs(m=>[...m, msg]);
  }

  /* האישור מריץ את הפעולות מחדש על התוכנית כפי שהיא ברגע הלחיצה,
     ולא על זו שהייתה כשההצעה נוצרה. */
  function approve(i){
    const msg = msgs[i];
    if(!msg || msg.status!=='pending') return;
    const res = applyOps(trip, msg.ops);
    setTrip(res.trip);
    setMsgs(ms=>ms.map((x,j)=> j===i ? {...x, status:'applied', log:res.log, ops:undefined, preview:undefined} : x));
  }

  function reject(i){
    setMsgs(ms=>ms.map((x,j)=> j===i && x.status==='pending'
      ? {...x, status:'rejected', ops:undefined, preview:undefined} : x));
  }

  async function ask(text){
    const q=(text||'').trim();
    if(!q||busy) return;
    const next=[...msgs,{role:'user',content:q}];
    setMsgs(next); setInput(''); setBusy(true); setLive(''); setErr('');

    let acc='';
    try{
      const r=await fetch(CHAT_API,{
        method:'POST',
        headers:{'content-type':'application/json'},
        body:JSON.stringify({
          messages: next.map(m=>({role:m.role,content:m.content})),
          trip,
        }),
      });
      if(!r.ok || !r.body) throw new Error('bad status '+r.status);

      const reader=r.body.getReader();
      const dec=new TextDecoder();
      let buf='';
      while(true){
        const {value,done}=await reader.read();
        if(done) break;
        buf+=dec.decode(value,{stream:true});
        const frames=buf.split('\n\n');
        buf=frames.pop();
        for(const f of frames){
          const ev=(f.match(/^event: (.+)$/m)||[])[1];
          const data=(f.match(/^data: (.+)$/m)||[])[1];
          if(!data) continue;
          let d; try{ d=JSON.parse(data); }catch(e){ continue; }
          if(ev==='error') throw new Error('server');
          if(ev==='delta' && d.t){ acc+=d.t; setLive(stripAction(acc)); }
        }
      }
      if(!acc) throw new Error('empty');
      finish(acc);
    }catch(e){
      if(acc) finish(acc);
      else setErr('אין חיבור לשרת. הצ׳אט הוא החלק היחיד שצריך אינטרנט.');
    }finally{
      setBusy(false); setLive('');
    }
  }

  return (
    <div className="chatpane">
      <NameSheet name={sheet} onClose={()=>setSheet(null)} />
      <div className="chatscroll">
        {msgs.length===0 && !busy &&
          <div className="card">
            <h3 style={{margin:'0 0 6px',fontSize:16}}>💬 שאל, או תגיד לי מה לשנות</h3>
            <div className="small muted" style={{lineHeight:1.7,marginBottom:14}}>
              אני מכיר את כל הטיול — הלו״ז, המקומות, זמני הנסיעה והאוכל, ויש לי
              חיפוש באינטרנט להמלצות עדכניות.
              כשתרצו לשנות משהו או להוסיף מסעדה, אני אציע ואתם תאשרו — כלום לא
              נכנס לתוכנית בלי אישור שלכם.
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {SUGGESTIONS.map((q,i)=>(
                <button key={i} className="qchip" onClick={()=>ask(q)}>{q}</button>
              ))}
            </div>
          </div>
        }

        {msgs.map((m,i)=>(
          <React.Fragment key={i}>
            <div className={'msg '+(m.role==='user'?'me':'bot')}>
              {m.role==='user' ? m.content : renderRich(m.content, setSheet)}
            </div>

            {m.status==='pending' &&
              <div className="proposal">
                <b>הצעה לשינוי — עדיין לא בוצע</b>
                {(m.preview||[]).map((l,j)=><div className="pline" key={j}>· {l}</div>)}
                <div className="pbtns">
                  <button className="pbtn ok" onClick={()=>approve(i)}>✓ אשר ועדכן</button>
                  <button className="pbtn no" onClick={()=>reject(i)}>ביטול</button>
                </div>
              </div>}

            {m.status==='applied' && m.log && m.log.length>0 &&
              <div className="applied">
                <b>✓ התוכנית עודכנה</b>
                {m.log.map((l,j)=><div key={j}>· {l}</div>)}
              </div>}

            {m.status==='rejected' &&
              <div className="rejected">✕ לא בוצע שינוי בתוכנית</div>}
          </React.Fragment>
        ))}

        {busy && <div className="msg bot wait">{live ? renderRich(live, setSheet) : 'רגע…'}</div>}
        {err && <div className="warnbox">⚠️ {err}</div>}
        <div ref={endRef}></div>
      </div>

      <div className="composer">
        <textarea
          rows={1}
          placeholder="שאל משהו, או תגיד מה לשנות…"
          value={input}
          onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); ask(input); } }}
        />
        <button className="sendbtn" onClick={()=>ask(input)} disabled={busy||!input.trim()}>↑</button>
      </div>
    </div>
  );
}

/* ---------------- app ---------------- */
function App(){
  const [tab,setTab]=useState('itin');
  const [dark,setDark]=useStore('sicilia_dark',true);
  const [done,setDone]=useStore('sicilia_done',{});
  const [packed,setPacked]=useStore('sicilia_packed',{});
  const [chat,setChat]=useStore('sicilia_chat',[]);
  const [trip,setTrip]=useStore('sicilia_trip',DEFAULT_TRIP);
  const [place,setPlace]=useState(null);
  const [meal,setMeal]=useState(null);

  useEffect(()=>{
    document.documentElement.classList.toggle('dark',dark);
    const m=document.querySelector('meta[name=theme-color]');
    if(m) m.setAttribute('content',dark?'#120f0d':'#faf7f2');
  },[dark]);

  const toggleDone=k=>setDone(d=>({...d,[k]:!d[k]}));
  const togglePack=k=>setPacked(p=>({...p,[k]:!p[k]}));
  const open={ place:setPlace, meal:setMeal };
  const mealObj = meal ? trip.meals.find(m=>m.id===meal) : null;
  const placeObj = place ? trip.places[place] : null;
  const edited = JSON.stringify(trip) !== JSON.stringify(DEFAULT_TRIP);

  const tabs=[
    ['itin','🗓️','לו״ז'],['left','📋','נשאר'],['places','📍','מקומות'],
    ['food','🍝','אוכל'],['chat','💬','צ׳אט'],['info','🎒','מידע']
  ];

  return (
    <React.Fragment>
      <div className="topbar">
        <div className="brand">
          <span style={{fontSize:24}}>🌋</span>
          <div>
            <h1>סיציליה</h1>
            <div className="sub">2–6 בספטמבר · 5 ימים</div>
          </div>
        </div>
        <div className="row" style={{gap:8,flexWrap:'nowrap'}}>
          {tab==='chat' && chat.length>0 &&
            <button className="iconbtn" title="שיחה חדשה" onClick={()=>{ if(confirm('להתחיל שיחה חדשה?')) setChat([]); }}>✎</button>}
          <button className="iconbtn" onClick={()=>setDark(!dark)}>{dark?'☀️':'🌙'}</button>
        </div>
      </div>

      <div className={'screen'+(tab==='chat'?' noscroll':'')}>
        {tab==='itin' && <ItineraryView trip={trip} open={open} done={done} toggle={toggleDone} />}
        {tab==='left' && <LeftView trip={trip} done={done} toggle={toggleDone} open={open} />}
        {tab==='places' && <PlacesView trip={trip} openPlace={setPlace} />}
        {tab==='food' && <FoodView trip={trip} openMeal={setMeal} />}
        {tab==='chat' && <ChatView trip={trip} setTrip={setTrip} msgs={chat} setMsgs={setChat} />}
        {tab==='info' && <InfoView packed={packed} togglePack={togglePack} edited={edited}
          resetTrip={()=>{ if(confirm('לשחזר את התוכנית המקורית? כל השינויים שהצ׳אט עשה יימחקו.')) setTrip(DEFAULT_TRIP); }} />}
      </div>

      {placeObj && <PlaceDetail p={placeObj} onClose={()=>setPlace(null)} />}
      {mealObj && <MealDetail m={mealObj} onClose={()=>setMeal(null)} />}

      <div className="bottomnav">
        {tabs.map(([k,ic,l])=>(
          <button key={k} className={"nav-i"+(tab===k?' on':'')} onClick={()=>setTab(k)}>
            <span className="ic">{ic}</span>{l}
          </button>
        ))}
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
