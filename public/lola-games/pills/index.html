<style>
:root{
  --ink:#3a2414; --cream:#fff8ec; --cream2:#f6e9d4; --rim:#e8cfa8; --purple:#7b3fc4; --purpleD:#5a2896; --pink:#ec5a9c; --pinkD:#b8336f; --green:#36b34a; --gold:#ffd23b;
  --safe-t:calc(env(safe-area-inset-top,0px) + var(--verse-top,0px)); --safe-b:env(safe-area-inset-bottom,0px);
  --stripH:clamp(60px,10.5vh,92px); --hudH:50px;
}
@media (max-height:640px){:root{--hudH:50px}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:Rubik,system-ui,sans-serif;color:var(--ink);overscroll-behavior:none;touch-action:none}
body{background:#5a3518 url(assets/room.jpg) center 30%/cover no-repeat}
:root{--sw:100vw}
@media (min-aspect-ratio:4/5){
  :root{--sw:calc(100vh * .5625)}
  html{background:radial-gradient(circle at 50% 40%,#6b4529,#1e120a)}
  body{width:var(--sw);margin:0 auto;transform:translateZ(0);box-shadow:0 0 0 1px #ffffff22,0 20px 60px #0009}
}
[hidden]{display:none!important}
button{font-family:inherit;border:0;cursor:pointer;color:inherit;padding:0}

/* the designer's purple glossy button */
.pb{background:linear-gradient(#9a5ee0,var(--purple) 55%,#6a32b0);border:2px solid #fff;border-radius:16px;box-shadow:0 3px 0 var(--purpleD),0 5px 8px #0004,inset 0 2px 0 #ffffff55;color:#fff;display:grid;place-items:center}
.pb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--purpleD),inset 0 2px 0 #ffffff55}
.pb svg{width:58%;height:58%;fill:#fff;filter:drop-shadow(0 1px 0 #0004)}

/* ---------- play ---------- */
#play{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--safe-t);padding-bottom:var(--safe-b)}
#strip{height:var(--stripH);flex:none;display:flex;align-items:flex-end;padding:0 6px;position:relative}
#strip img{height:100%;width:auto;flex:none;filter:drop-shadow(0 4px 6px #0005);transition:transform .25s;transform-origin:50% 100%;cursor:pointer}
#strip img.talk{transform:scale(1.05)}
#bubble{flex:1;min-width:0;align-self:center;margin:0 -4px;background:var(--cream);border-radius:22px;padding:8px 12px;font-weight:700;font-size:15px;line-height:1.2;position:relative;min-height:40px;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 4px 10px #0004;transition:opacity .25s,transform .25s;z-index:1}
#bubble.quiet{opacity:0;transform:scale(.9)}
#bubble:after{content:"";position:absolute;bottom:-8px;width:18px;height:18px;background:inherit;transform:rotate(45deg);border-radius:0 0 5px 0}
#bubble.savta:after{right:24px}
#bubble.lola:after{left:24px}
#bubble.whisper{font-style:italic;background:#f4eaff}
#bubble.tip{justify-content:flex-start;gap:8px;padding:4px 12px 4px 5px;cursor:pointer;color:#3b2068;border:2.5px solid var(--purple);text-align:right}
#bubble.tip:after{display:none}
#bHint{width:40px;height:40px;border-radius:50%;flex:none;padding:3px;animation:bulb 2.4s ease-in-out infinite}
#bHint img{width:100%;height:100%}
@keyframes bulb{0%,80%,100%{transform:scale(1)}88%{transform:scale(1.15)}}
@media (max-width:350px){#bubble{font-size:13.5px;padding:5px 8px}}

#hud{height:var(--hudH);flex:none;margin:2px 8px 3px;display:flex;align-items:center;gap:6px;padding:5px 6px;background:var(--cream);border-radius:18px;box-shadow:0 0 0 3px var(--rim),0 5px 10px #0005}
#hud .pb{height:100%;aspect-ratio:1;flex:none}
#score{height:100%;flex:none;display:flex;align-items:center;gap:4px;padding:0 12px 0 6px;border-radius:99px;background:linear-gradient(#9a5ee0,var(--purple) 55%,#6a32b0);border:2px solid #fff;box-shadow:0 3px 0 var(--purpleD);color:#fff;font-weight:900;font-size:20px;direction:ltr}
#score img{height:72%}
#hudMid{flex:1;min-width:0;height:100%;display:flex;gap:5px;justify-content:center}
.tile{height:100%;min-width:0;flex:0 1 auto;border-radius:14px;background:var(--cream2);box-shadow:inset 0 0 0 2px var(--rim);display:flex;align-items:center;justify-content:center;gap:5px;padding:0 9px;font-weight:900;font-size:19px;white-space:nowrap}
.tile small{font-size:12px;font-weight:700;color:#7a5a3c}
.tile.p{background:linear-gradient(#9a5ee0,var(--purple));color:#fff;box-shadow:0 2px 0 var(--purpleD);flex-direction:column;gap:0;line-height:1.05;padding:0 9px}
.tile.p small{color:#f2e6ff;font-size:11px}
.ord img{height:70%;width:auto;max-width:40px;object-fit:contain}
.ord.done{background:#c9f2cf;box-shadow:inset 0 0 0 2px #7fd08c}
@media (max-width:370px){.tile{padding:0 6px;font-size:17px}.ord img{max-width:30px}#score{font-size:17px;padding:0 8px 0 4px}}
#stage{flex:1;position:relative;min-height:0}
#ticket{position:absolute;top:6px;left:10px;right:10px;height:52px;display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--cream);border-radius:16px;box-shadow:0 0 0 3px var(--rim),0 5px 10px #0005;z-index:2}
#ticket b{flex:1;min-width:0;font-size:15px;font-weight:900;line-height:1.1;color:#5a2896}
#ticket .tile{flex:none;font-size:20px}
#ticket .ord{position:relative;padding-bottom:9px}
#ticket .ord em{position:absolute;bottom:1px;left:0;right:0;text-align:center;font:800 10px/1 Rubik,sans-serif;font-style:normal;color:#5a2896;white-space:nowrap}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#flash{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-weight:900;font-size:34px;color:#fff;-webkit-text-stroke:2px var(--purpleD);text-shadow:0 4px 0 var(--purpleD),0 0 18px #0007;pointer-events:none;white-space:nowrap;opacity:0}
#flash.on{animation:pop 1s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-75%)}}

/* ---------- start ---------- */
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;padding:calc(var(--safe-t) + 6px) 12px calc(var(--safe-b) + 8px);overflow:hidden}
#start{background:linear-gradient(#0000 40%,#3a1f0c66 100%);justify-content:space-between}
#titleImg{width:auto;max-width:86%;max-height:19vh;flex:none;filter:drop-shadow(0 6px 8px #0007);position:relative;z-index:2;animation:swing 4s ease-in-out infinite;transform-origin:50% 0}
@keyframes swing{50%{transform:rotate(1.2deg)}}
#hero{width:100%;max-width:460px;flex:0 1 auto;min-height:0;max-height:26vh;aspect-ratio:1200/630;object-fit:cover;object-position:50% 30%;border-radius:20px;border:4px solid var(--cream);box-shadow:0 8px 20px #0007;margin-top:-3vh}
.tag{margin:1.2vh 0;background:var(--cream);border-radius:99px;padding:8px 16px;font-weight:700;font-size:clamp(13px,3.9vw,17px);text-align:center;box-shadow:0 4px 10px #0004;flex:none;max-width:460px}
.tag b{color:var(--purple);font-size:1.15em}

#endTitle small{display:block;font-size:.55em;font-weight:700;opacity:.7;margin-top:2px}
#modes{display:flex;flex-direction:column;gap:9px;width:100%;max-width:460px;flex:1 1 auto;min-height:0;max-height:330px;justify-content:center}
.mode{flex:1 1 0;min-height:58px;max-height:100px;position:relative;display:flex;flex-direction:row;align-items:center;gap:10px;background:linear-gradient(#fffaf4,#f8e8f2);border:3px solid #c9a2ec;border-radius:20px;padding:6px 10px 6px 8px;box-shadow:0 5px 0 #a983d2,0 9px 18px #0005;text-align:right}
.mode:active{transform:translateY(3px);box-shadow:0 2px 0 #a983d2}
.mode .key{flex:none;width:46px;height:50px;border-radius:13px;background:linear-gradient(#9a5ee0,var(--purple) 60%,#6a32b0);border:2px solid #fff;box-shadow:0 3px 0 var(--purpleD);color:#fff;font:900 24px/1 Rubik,sans-serif;font-style:normal;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mode .key small{font-size:9.5px;font-weight:800;line-height:1;margin-bottom:2px;opacity:.9}
.mode .ic{flex:none;height:min(100%,17vw,74px);aspect-ratio:1;width:auto;object-fit:contain;filter:drop-shadow(0 3px 3px #0003)}
.mode .txt{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.mode b{font-size:clamp(15px,4.8vw,22px);line-height:1.1;font-weight:900;color:#4a1f86;white-space:nowrap}
.mode .txt span{font-size:clamp(12px,3.6vw,14.5px);line-height:1.2;color:#6b4a2a;font-weight:500}
.mode .rec{font-size:12px;font-weight:800;color:var(--pinkD);font-style:normal;min-height:0}
.mode .rec:empty{display:none}
.mode .how{width:40px;height:40px;border-radius:50%;font-weight:900;font-size:20px;flex:none;font-style:normal}
.foot{display:flex;gap:8px;align-items:center;width:100%;max-width:460px;margin-top:1.4vh;flex:none}
#bMusic{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:54px;background:var(--cream);border:0;border-radius:99px;padding:0 6px 0 14px;box-shadow:0 0 0 3px var(--rim),0 5px 10px #0005;color:#3b2068;text-align:right;font:inherit;cursor:pointer}
#bMusic .mi{font-size:24px;flex:none}
#bMusic .ml{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15;overflow:hidden}
#bMusic .ml small{font-size:11.5px;font-weight:700;color:#7a5a3c}
#bMusic .ml b{font-size:16px;font-weight:900;color:var(--purple);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bMusic .next{flex:none;background:linear-gradient(#9a5ee0,var(--purple));color:#fff;border-radius:99px;padding:9px 12px;font-weight:900;font-size:13.5px;box-shadow:0 2px 0 var(--purpleD);white-space:nowrap}
#bMusic:active{transform:translateY(2px)}
#bSound{width:54px;height:54px;border-radius:50%;flex:none}
#bSound.off{filter:grayscale(.85) brightness(.9)}
.lnk a{color:#fff;text-decoration:none}
.lnk{color:#fff;font-size:13px;text-decoration:none;font-weight:700;text-shadow:0 1px 3px #000;margin-top:.8vh;flex:none}
@media (max-height:600px){.mode .txt span{display:none}.tag{padding:5px 12px}.mode{min-height:52px}}
n:0 auto 6px;font-size:24px;font-weight:900;background:var(--cream2);border-radius:99px;padding:6px 16px;box-shadow:inset 0 0 0 2px var(--rim);display:inline-block}
.card .quote{margin:4px 0 10px;font-size:15px;background:#fff;border-radius:16px;padding:8px 10px;box-shadow:inset 0 0 0 2px #efe1ca}
.scoreBig{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(#9a5ee0,var(--purple) 55%,#6a32b0);color:#fff;border:3px solid #fff;border-radius:99px;padding:4px 22px 4px 12px;font-size:42px;font-weight:900;box-shadow:0 4px 0 var(--purpleD);direction:ltr}
.scoreBig img{height:44px}
.newrec{display:inline-block;margin-top:6px;background:var(--gold);color:#5a3a00;font-weight:900;font-size:16px;padding:3px 14px;border-radius:99px;box-shadow:0 2px 0 #c99a10}
.best{display:block;margin-top:6px;font-size:14px;color:#7a5a3c}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border-radius:99px;padding:12px;font-size:22px;font-weight:900;margin-top:10px}
.btn svg{width:26px;height:26px}
.btn.main{background:linear-gradient(#ff86b9,var(--pink) 60%,#d8478a);color:#fff;border:3px solid #fff;box-shadow:0 5px 0 var(--pinkD),0 8px 14px #0004}
.btn.main svg{fill:#fff}
.btn.main:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pinkD)}
.btn.quiet{background:var(--cream2);font-size:17px;padding:10px;box-shadow:inset 0 0 0 2px var(--rim)}
.btn.quiet svg{fill:#6b3f22}
.card a.char{display:inline-block;margin-top:10px;color:var(--purple);font-weight:700;font-size:14px;text-decoration:none}

#rotate{display:none}
@media (orientation:landscape) and (max-height:500px){#rotate{display:flex;position:fixed;inset:0;z-index:99;background:#2a170b;color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:22px;font-weight:900;text-align:center}#rotate img{height:40vh}}
/* ---------- tutorial ---------- */
#tut{position:fixed;inset:0;z-index:30;pointer-events:auto}
#tut.try{pointer-events:none}
#spot{position:absolute;border-radius:16px;box-shadow:0 0 0 4000px #1a0d05b8,0 0 0 4px var(--gold) inset,0 0 18px var(--gold) inset;transition:all .25s;pointer-events:none}
#tutCard{position:absolute;left:12px;right:12px;margin:0 auto;max-width:400px;background:var(--cream);border-radius:22px;padding:12px 14px;box-shadow:0 0 0 3px var(--rim),0 8px 24px #000a;pointer-events:auto;display:flex;gap:10px;align-items:flex-start}
#tutFace{width:62px;height:62px;flex:none;object-fit:cover;object-position:50% 15%;border-radius:50%;background:#f1ddc0;border:3px solid #fff;box-shadow:0 2px 6px #0004}
#tutBody{flex:1;min-width:0}
#tutCard .n{font-size:12px;font-weight:700;color:var(--purple)}
#tutCard p{margin:2px 0 8px;font-size:17px;line-height:1.3;font-weight:500}
#tutCard .row{display:flex;gap:8px;align-items:center}
#tutNext{flex:1;border-radius:99px;padding:9px 6px;font-size:clamp(14px,4.6vw,19px);font-weight:900;white-space:nowrap}
#tutSkip{background:none;color:#7a5a3c;font-size:14px;padding:8px}
#tutCard .try{color:#2a9a40;font-weight:900}
</style>
</head>
<body>
<div id="play" hidden>
  <div id="strip">
    <img id="savta" src="assets/savta-suspect.webp" alt="סבתא">
    <div id="bubble" class="quiet savta"></div>
    <img id="lola" src="assets/lola-please.webp" alt="לולה">
  </div>
  <div id="hud">
    <button class="pb" id="bHome" aria-label="לתפריט הראשי"><svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg></button>
    <div id="score"><img src="assets/star.webp" alt=""><span>0</span></div>
    <div id="hudMid"></div>
    <button class="pb" id="bUndo" aria-label="ביטול" hidden><svg viewBox="0 0 24 24"><path d="M12.5 8c-2.6 0-5 1-6.9 2.6L2 7v9h9l-3.6-3.6A8 8 0 0 1 20 15.5l2.4-.8A10.5 10.5 0 0 0 12.5 8z"/></svg></button>
    <button class="pb" id="bRestart" aria-label="מחדש"><svg viewBox="0 0 24 24"><path d="M17.7 6.3A8 8 0 1 0 20 12h-2.5a5.5 5.5 0 1 1-1.6-3.9L13 11h7V4z"/></svg></button>
  </div>
  <div id="stage"><canvas id="cv"></canvas><div id="ticket" hidden></div><div id="flash"></div></div>
</div>

<div id="start" class="screen">
  <img id="titleImg" src="assets/title.png" alt="התרופות של שמונה">
  <img id="hero" src="assets/hero.jpg?v=2" alt="לולה וסבתא">
  <div class="tag" id="qLine">📞 מקומך בתור: <b>7</b> · בחרו שלוחה</div>
  <div id="modes">
    <button class="mode" data-mode="box"><i class="key"><small>שלוחה</small>1</i><img class="ic" src="assets/mode-box.webp" alt=""><span class="txt"><b>קופסת השבוע</b><span>גררו כדורים לקופסה</span><i class="rec" data-rec="box"></i></span><i class="how pb" data-how="box">?</i></button>
    <button class="mode" data-mode="sort"><i class="key"><small>שלוחה</small>2</i><img class="ic" src="assets/mode-sort.webp" alt=""><span class="txt"><b>הבקבוקים</b><span>כל תרופה לבקבוק שלה</span><i class="rec" data-rec="sort"></i></span><i class="how pb" data-how="sort">?</i></button>
    <button class="mode" data-mode="tray"><i class="key"><small>שלוחה</small>3</i><img class="ic" src="assets/mode-tray.webp" alt=""><span class="txt"><b>המגש של סבתא</b><span>החליפו – שלושה זהים</span><i class="rec" data-rec="tray"></i></span><i class="how pb" data-how="tray">?</i></button>
  </div>
  <div class="foot">
    <button id="bMusic" aria-label="מוזיקת המתנה"><span class="mi">🎵</span><span class="ml"><small>מוזיקת המתנה</small><b></b></span><span class="next">החלפה ›</span></button>
    <button id="bSound" class="pb" aria-label="צליל"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button>
  </div>
  <div class="verse-hide lnk"><a href="/c/lola" target="_top">לולה ←</a> · <a href="/c/savta" target="_top">סבתא ←</a> <span>בשלומיוורס</span></div>
</div>

<div id="end" class="screen" hidden>
  <div class="card">
    <img class="face" id="endFace" src="assets/savta-thumbs.webp" alt="">
    <div><h2 id="endTitle"></h2></div>
    <div class="quote" id="endLine"></div>
    <div class="scoreBig"><img src="assets/star.webp" alt=""><span id="endScore">0</span></div>
    <div><span class="newrec" id="endNew">⭐ שיא חדש!</span></div>
    <span class="best" id="endBest"></span>
    <button class="btn main" id="bAgain"><svg viewBox="0 0 24 24"><path d="M17.7 6.3A8 8 0 1 0 20 12h-2.5a5.5 5.5 0 1 1-1.6-3.9L13 11h7V4z"/></svg>חיוג חוזר</button>
    <button class="btn quiet" id="bMenu"><svg viewBox="0 0 24 24"><path d="M7 6h10a5 5 0 0 1 4.9 6l-1.1 5.3a2.2 2.2 0 0 1-3.9.9L14.6 16H9.4l-2.3 2.2a2.2 2.2 0 0 1-3.9-.9L2.1 12A5 5 0 0 1 7 6zm0 3v2H5v2h2v2h2v-2h2v-2H9V9zm9 1a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zm2.5 2.5a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z"/></svg>לתפריט הראשי</button>
    <a class="char" href="/c/savta" target="_top">סבתא בשלומיוורס ←</a>
  </div>
</div>

<div id="tut" hidden><div id="spot"></div><div id="tutCard"><img id="tutFace" src="assets/lola-please.webp" alt=""><div id="tutBody"><div class="n" id="tutN"></div><p id="tutT"></p><div class="row"><button id="tutNext" class="pb">להמשך הקישו 1</button><button id="tutSkip">לדילוג #</button></div></div></div></div>

<span aria-hidden="true" style="position:fixed;left:0;top:0;pointer-events:none;font:700 12px 'Miriam Libre';opacity:0">מרשם</span><span aria-hidden="true" style="position:fixed;left:0;top:0;pointer-events:none;font:400 12px 'Miriam Libre';opacity:0">מרשם</span>
<div id="rotate"><img src="assets/lola-please.webp" alt="">סובבו את הטלפון לעמידה 📱</div>
