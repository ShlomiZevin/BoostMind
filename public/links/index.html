<style>
  :root { --bg: #0b0b0d; --card: #151518; --line: rgba(255,255,255,0.09); --text: #f4f3f0; --dim: #a3a1a8; --accent: #ff7a45; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { background: var(--bg); color: var(--text); font-family: 'Heebo', sans-serif; min-height: 100svh; display: flex; justify-content: center; padding: 28px 18px 40px; }
  .wrap { width: 100%; max-width: 440px; text-align: center; }
  .photo { width: 100%; aspect-ratio: 1 / 1; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: var(--card); }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.01em; margin-top: 18px; }
  .sub { color: var(--dim); font-size: 1.05rem; margin-top: 6px; }
  .social { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 18px; }
  .social a { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 13px; border-radius: 10px; border: 1px solid var(--line); color: var(--text); text-decoration: none; font-size: .95rem; font-weight: 500; transition: border-color .15s; }
  .social a:hover { border-color: var(--dim); }
  .social svg { width: 17px; height: 17px; fill: currentColor; }
  .links { display: flex; flex-direction: column; gap: 12px; margin-top: 22px; }
  .link { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); color: var(--text); text-decoration: none; text-align: right; transition: border-color .15s, transform .15s; }
  .link:hover { border-color: var(--accent); transform: translateY(-1px); }
  .link .ico { width: 46px; height: 46px; flex: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; background: rgba(255,255,255,0.05); overflow: hidden; }
  .link .ico img { width: 100%; height: 100%; object-fit: cover; }
  .link .txt { flex: 1; display: flex; flex-direction: column; gap: 1px; font-size: 1.08rem; font-weight: 700; }
  .link .txt small { color: var(--dim); font-size: .86rem; font-weight: 400; }
  .link .arr { color: var(--dim); font-size: 1.15rem; }
  .link.collab { flex-wrap: wrap; }
  .link.collab:hover { transform: none; border-color: var(--line); }
  .acts { display: flex; gap: 8px; width: 100%; }
  .acts a { flex: 1; justify-content: center; height: 42px; padding: 0 14px; border-radius: 9px; display: inline-flex; align-items: center; font-size: .92rem; font-weight: 700; text-decoration: none; color: var(--text); border: 1px solid var(--line); transition: border-color .15s; }
  .acts a:first-child { background: var(--accent); color: #1a0d06; border-color: var(--accent); }
  .acts a:hover { border-color: var(--accent); }
  /* a wide screen: the photo beside the links, all of it on one screen */
  @media (min-width: 900px) {
    body { align-items: center; padding: 48px 32px; }
    .wrap { max-width: 1000px; display: grid; grid-template-columns: minmax(0, 460px) minmax(0, 1fr); gap: 64px; align-items: center; text-align: right; }
    .photo { border-radius: 22px; }
    h1 { font-size: 3rem; margin-top: 0; line-height: 1.05; }
    .sub { font-size: 1.2rem; margin-top: 10px; }
    .social { justify-content: flex-start; margin-top: 22px; }
    .links { margin-top: 30px; }
    .link { padding: 16px 18px; }
    footer { text-align: right; }
  }
  footer { margin-top: 30px; color: var(--dim); font-size: .85rem; }
</style>
