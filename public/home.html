<!-- The home address "/" of this site serves two domains: shlomiverse.com (the links page is its home) and wholos.com
     (still attached here until Wholos moves to its own project - its landing page is /wholos/). firebase.json rewrites
     "/" to this file. -->
<script>
  (function () {
    var wholos = /(^|\.)wholos\.com$/.test(location.hostname);
    location.replace((wholos ? '/wholos/' : '/links/') + location.search + location.hash);
  })();
</script>
