<style>
  /* מאחורי הקלעים - Shlomi's back office, built to the mockups in Documents/shlomiverse-v2-design/backstage/ */
  :root { --bg: #0b0b0e; --card: rgba(255,255,255,.035); --card2: rgba(255,255,255,.06); --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.14);
    --text: #f5f4f1; --dim: #a6a3ad; --faint: #6f6c77; --accent: #ff6a1f; --red: #ff5a5a; color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scrollbar-gutter: stable; }
  body { background: radial-gradient(ellipse 60% 50% at 0% 100%, rgba(255,106,31,.10), transparent 70%), radial-gradient(ellipse 40% 40% at 100% 0%, rgba(255,106,31,.06), transparent 70%), var(--bg);
    background-attachment: fixed; color: var(--text); font-family: 'Heebo', sans-serif; line-height: 1.5; min-height: 100svh; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  svg { flex: none; }
  .app { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100svh; }
  /* the sidebar (desktop) */
  .side { position: sticky; top: 0; height: 100svh; display: flex; flex-direction: column; padding: 22px 14px; border-inline-start: 1px solid var(--line); background: rgba(10,10,13,.6); backdrop-filter: blur(14px); }
  .side .brand { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 22px; }
  .side .brand img { width: 150px; }
  .side .brand b { font-size: 1.15rem; font-weight: 800; }
  .nav { display: flex; flex-direction: column; gap: 4px; }
  .nav button, .nav a { display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px; border-radius: 14px; color: var(--dim); font-weight: 700; font-size: 1rem; text-align: start; width: 100%; position: relative; transition: background .15s, color .15s; }
  .nav button:hover, .nav a:hover { background: var(--card2); color: var(--text); }
  .nav .on { background: linear-gradient(to left, rgba(255,106,31,.22), rgba(255,106,31,.04)); color: var(--text); }
  .nav .on::after { content: ""; position: absolute; inset-inline-start: -14px; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--accent); }
  .nav svg { width: 21px; height: 21px; }
  .nav .on svg { color: var(--accent); }
  .nav em { margin-inline-start: auto; font-style: normal; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 99px; background: var(--accent); color: #fff; font-size: .78rem; font-weight: 800; display: grid; place-items: center; }
  .side .foot { margin-top: auto; border-top: 1px solid var(--line); padding-top: 12px; }
  /* main */
  main.main { padding: 30px 34px 60px; max-width: 1240px; width: 100%; }
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .top h1 { font-size: clamp(1.7rem, 3vw, 2.5rem); font-weight: 900; letter-spacing: -.02em; line-height: 1.1; }
  .top p { color: var(--dim); margin-top: 6px; font-size: 1.02rem; }
  .acts { display: flex; gap: 10px; flex-wrap: nowrap; }
  .btn { display: inline-flex; align-items: center; gap: 9px; height: 48px; padding: 0 20px; border-radius: 16px; font-weight: 800; font-size: .98rem; border: 1px solid var(--line2); background: var(--card2); transition: border-color .15s, background .15s; }
  .btn:hover { border-color: rgba(255,255,255,.3); }
  .btn.main { background: var(--accent); border-color: transparent; color: #fff; box-shadow: 0 10px 30px rgba(255,106,31,.35); }
  .btn svg { width: 20px; height: 20px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 20px; backdrop-filter: blur(10px); }
  .card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .card-h h2 { font-size: 1.25rem; font-weight: 900; }
  .card-h button, .card-h a { color: var(--accent); font-weight: 700; font-size: .9rem; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .card-h svg { width: 16px; height: 16px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
  .kpi { position: relative; text-align: start; width: 100%; padding: 18px 20px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); }
  .kpi span { color: var(--text); font-weight: 700; font-size: .98rem; }
  .kpi svg { position: absolute; top: 18px; inset-inline-end: 18px; width: 24px; height: 24px; color: var(--dim); }
  .kpi b { display: block; font-size: 2.6rem; font-weight: 900; color: var(--accent); line-height: 1.1; margin-top: 6px; }
  .kpi small { color: var(--dim); font-size: .85rem; }
  .cols { display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; align-items: start; }
  .rows > * { border-top: 1px solid var(--line); }
  .rows > *:first-child { border-top: 0; }
  .row { display: flex; gap: 14px; align-items: flex-start; padding: 14px 2px; }
  .row .vx-av { width: 52px; height: 52px; flex: none; }
  .row .ini { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 1.1rem; color: #1a1a1f; flex: none; }
  .row .body { flex: 1; min-width: 0; }
  .row .l1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .row .l1 b { font-weight: 800; }
  .row .l2 { color: var(--dim); font-size: .92rem; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .row time { color: var(--faint); font-size: .82rem; white-space: nowrap; flex: none; }
  .tag { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 8px; font-size: .78rem; font-weight: 800; background: var(--card2); color: var(--dim); border: 1px solid var(--line); }
  .tag.or { background: rgba(255,106,31,.16); color: #ff8c4d; border-color: rgba(255,106,31,.35); }
  .tag.red { background: rgba(255,90,90,.14); color: #ff8a8a; border-color: rgba(255,90,90,.35); }
  .tag.wh { color: var(--text); border-color: var(--line2); }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .pill { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 14px; border-radius: 12px; background: var(--card2); border: 1px solid var(--line2); font-weight: 700; font-size: .88rem; }
  .pill:hover { border-color: rgba(255,255,255,.3); }
  .pill svg { width: 17px; height: 17px; }
  .empty { color: var(--dim); padding: 22px 0; text-align: center; }
  .ml-bo { margin-top: 14px; } .ml-b .l2 { color: var(--dim); font-size: .85rem; word-break: break-word; } .ml-b .l1 b { word-break: break-all; } .ml-b .btn.ml-back { height: 36px; padding: 0 12px; font-size: .85rem; }
  .ml-ic.red { color: #ff8a8a; }
  /* plans (2026-11-06) */
  .pl-lead { color: var(--dim); margin: 0 0 16px; max-width: 760px; }
  .pl-list { display: flex; flex-direction: column; gap: 12px; max-width: 760px; }
  .pl-sec { margin: 18px 0 4px; font-size: 1.1rem; } .pl-sec.dim { color: var(--faint); }
  .pl-how { margin: 0 0 10px; color: var(--faint); font-size: .86rem; }
  .pl-arch { margin-top: 26px; } .pl-arch > summary { cursor: pointer; color: var(--faint); font-weight: 700; font-size: .92rem; padding: 6px 0; }
  .pl-arch > .pl-list { margin-top: 10px; }
  .pl-card.first { border-color: #ff6a1f; box-shadow: 0 0 0 1px #ff6a1f inset; } .pl-card.past { opacity: .5; } .pl-card.past img { filter: grayscale(1); }
  .pl-start { display: inline-block; margin-bottom: 6px; color: #ff8c4d; font-weight: 800; font-size: .84rem; }
  .pl-card { display: flex; gap: 14px; text-align: start; padding: 12px; border-radius: 18px; border: 1px solid var(--line2); background: var(--card); width: 100%; }
  .pl-card:hover { border-color: rgba(255,255,255,.3); }
  .pl-card img, .pl-noimg { width: 92px; height: 138px; border-radius: 12px; object-fit: cover; object-position: top; flex: none; background: var(--card2); display: grid; place-items: center; color: var(--dim); }
  .pl-noimg svg { width: 32px; height: 32px; }
  .pl-card b { display: block; font-size: 1.08rem; line-height: 1.3; margin: 6px 0 4px; }
  .pl-card p { color: var(--dim); font-size: .9rem; line-height: 1.45; margin: 0; }
  .pl-top { display: flex; align-items: center; gap: 8px; } .pl-top small, .pl-t small { color: var(--faint); font-size: .8rem; }
  .pl-open { display: inline-flex; align-items: center; gap: 5px; margin-top: 8px; color: #ff8c4d; font-weight: 700; font-size: .84rem; } .pl-open svg { width: 15px; height: 15px; }
  .tag.ok { background: rgba(107,214,138,.15); color: #8ee6a6; border-color: rgba(107,214,138,.35); }
  .tag.red { background: rgba(255,90,90,.14); color: #ff8a8a; border-color: rgba(255,90,90,.35); }
  .pl-new { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 999px; background: #ff6a1f; color: #fff; font-size: .72rem; font-weight: 800; }
  .pl-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
  .pl-t { flex: 1; min-width: 220px; } .pl-t b { display: block; font-size: 1.2rem; line-height: 1.3; } .pl-t div { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
  .pl-acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .pl-hint { color: var(--dim); font-size: .88rem; display: flex; align-items: center; gap: 6px; margin: 4px 0 10px; } .pl-hint svg { width: 16px; height: 16px; color: var(--accent); }
  .pl-frame { width: 100%; height: 900px; border: 1px solid var(--line2); border-radius: 18px; background: #0b0b0e; display: block; }
  .pl-cs { margin-top: 16px; }
  .seg.sm { margin: 0; } .seg.sm button { height: 32px; padding: 0 12px; font-size: .85rem; }
  .sim-st .kgrid.sim-k { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); margin: 6px 0 12px; }
  .sim-st .k small { display: block; color: var(--dim); font-size: .78rem; margin-top: 2px; }
  .sim-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0; } .sim-row b { font-size: .88rem; margin-left: 6px; }
  .sim-drop { display: flex; align-items: flex-end; gap: 6px; height: 90px; margin: 6px 0 10px; direction: ltr; }
  .sim-drop > div { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; }
  .sim-drop span { width: 100%; background: var(--accent, #ff6a1f); border-radius: 6px 6px 2px 2px; min-height: 2px; }
  .sim-drop small { font-size: .72rem; color: var(--dim); margin-top: 3px; } .sim-drop em { font-style: normal; font-size: .72rem; position: absolute; top: -2px; }
  .sim-recent { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .sim-recent a { display: flex; gap: 10px; align-items: center; color: inherit; text-decoration: none; padding: 6px; border-radius: 12px; background: var(--card2); }
  .sim-recent img, .sim-recent .ph { width: 44px; height: 66px; border-radius: 8px; object-fit: cover; flex: none; background: var(--line2); }
  .sim-recent span { display: flex; flex-direction: column; min-width: 0; } .sim-recent small { color: var(--dim); font-size: .8rem; }
  .pv { position: fixed; inset: 0; z-index: 200; background: #050507; display: flex; flex-direction: column; }
  .pv-top { display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; }
  .pv-top b { flex: 1; font-size: 1rem; line-height: 1.3; } .pv-top small { color: var(--dim); }
  .pv-x { width: 40px; height: 40px; border-radius: 12px; background: var(--card2); border: 1px solid var(--line2); display: grid; place-items: center; flex: none; } .pv-x svg { width: 20px; height: 20px; }
  .pv-img { flex: 1; overflow: auto; display: flex; justify-content: center; align-items: flex-start; touch-action: pan-y pinch-zoom; }
  .pv-img img { width: 100%; max-width: 720px; height: auto; display: block; }
  @media (min-width: 900px) { .pv-img { align-items: center; } .pv-img img { width: auto; max-width: 100%; max-height: calc(100vh - 150px); } }
  .pv-bot { display: flex; align-items: center; gap: 10px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
  .pv-c { flex: 1; justify-content: center; height: 48px; }
  .pv-nav { width: 48px; height: 48px; border-radius: 14px; background: var(--card2); border: 1px solid var(--line2); display: grid; place-items: center; flex: none; }
  .pv-nav svg { width: 22px; height: 22px; } .pv-nav.nx svg { transform: rotate(180deg); } .pv-nav:disabled { opacity: .3; }
  .pl-c { padding: 10px 0; border-top: 1px solid var(--line); } .pl-c.done { opacity: .55; }
  .pl-c p { margin: 4px 0 0; white-space: pre-wrap; line-height: 1.5; }
  .pl-cm { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; } .pl-cm small { color: var(--faint); font-size: .8rem; }
  .pl-who { font-weight: 800; } .pl-who.cl { color: #9fc3ff; }
  .pl-on { color: var(--accent); font-weight: 700; font-size: .86rem; }
  .pl-dn { margin-inline-start: auto; font-size: .8rem; color: var(--dim); border: 1px solid var(--line2); border-radius: 8px; padding: 2px 9px; }
  .pl-sh { padding: 4px 20px 20px; } .pl-sh h2 { font-size: 1.2rem; margin: 6px 0 10px; }
  .pl-sh textarea { width: 100%; border-radius: 14px; border: 1px solid var(--line2); background: var(--card2); color: var(--text); padding: 12px 14px; font: inherit; resize: vertical; }
  .pl-sh-a { display: flex; gap: 8px; margin-top: 10px; }
  .pl-here { max-height: 34vh; overflow-y: auto; margin-bottom: 10px; }
  @media (max-width: 900px) { .pl-acts .btn { flex: 1; height: 44px; padding: 0 12px; font-size: .9rem; } .pl-list { grid-template-columns: 1fr; } }

  /* inbox / lists */
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-bottom: 16px; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; height: 40px; padding: 0 16px; border-radius: 99px; border: 1px solid var(--line2); background: var(--card); font-weight: 700; font-size: .92rem; color: var(--dim); }
  .chips button.on { background: var(--accent); border-color: transparent; color: #fff; }
  .chips small { margin-inline-start: 6px; opacity: .85; }
  .search { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line2); background: var(--card); min-width: 240px; }
  .search input { flex: 1; background: none; border: 0; outline: 0; color: var(--text); font: inherit; }
  .search svg { width: 18px; height: 18px; color: var(--dim); }
  .msgs { display: flex; flex-direction: column; gap: 12px; }
  .msg { position: relative; display: flex; gap: 14px; padding: 18px 20px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); overflow: hidden; }
  .msg::before { content: ""; position: absolute; inset-inline-start: 0; top: 0; bottom: 0; width: 4px; background: var(--k, var(--line2)); }
  .msg.done { opacity: .5; }
  .msg .ini { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 1.1rem; color: #1a1a1f; flex: none; }
  .msg .body { flex: 1; min-width: 0; }
  .msg .l1 { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .msg .who b { font-size: 1.12rem; font-weight: 800; }
  .msg .who small { display: block; color: var(--faint); font-size: .82rem; }
  .msg p.txt { margin-top: 8px; font-size: 1.02rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg .co { color: var(--dim); font-size: .9rem; margin-top: 4px; }
  .msg .tech { margin-top: 8px; font-family: ui-monospace, Consolas, monospace; font-size: .76rem; color: var(--faint); direction: ltr; text-align: left; word-break: break-all; }
  .msg .tech a { color: #ff9a5c; }
  .check { display: flex; flex-direction: column; align-items: center; gap: 4px; align-self: flex-end; color: var(--dim); font-size: .8rem; font-weight: 700; flex: none; }
  .check span { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line2); background: var(--card2); }
  .check svg { width: 22px; height: 22px; }
  .msg.done .check span { background: rgba(80,200,120,.18); border-color: rgba(80,200,120,.5); color: #7fe3a1; }
  .item { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); }
  .item + .item { margin-top: 10px; }
  .item.off { opacity: .45; }
  .item .vx-av { width: 46px; height: 46px; flex: none; }
  .item .body { flex: 1; min-width: 0; }
  .item b { font-weight: 800; }
  .item small { color: var(--faint); font-size: .82rem; }
  .item p { color: var(--dim); font-size: .95rem; white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }
  .item img.st { width: 76px; height: 76px; object-fit: contain; flex: none; border-radius: 14px; background: var(--card2); }
  .item img.th { width: 50px; height: 88px; object-fit: cover; border-radius: 12px; flex: none; }
  .item .votes { display: inline-flex; align-items: center; gap: 5px; color: var(--accent); font-weight: 800; }
  .item .votes img { width: 18px; }
  .cs-bars { display: grid; gap: 10px; }
  .cs-bar { display: grid; grid-template-columns: minmax(96px, 34%) 1fr auto; gap: 10px; align-items: center; font-size: .92rem; }
  .cs-bar > span:first-child { color: var(--text); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cs-bar i { display: block; height: 10px; border-radius: 6px; background: var(--accent); min-width: 3px; }
  .cs-bar b { font-weight: 800; color: var(--text); white-space: nowrap; }
  .cs-bar small { color: var(--faint); font-weight: 600; }
  .cs-note { color: var(--faint); font-size: .8rem; margin: 10px 0 0; }
  .cs-err { color: #ff8a6e; font-size: .85rem; margin: 0 0 12px; }
  .cs-meter { height: 12px; border-radius: 8px; background: var(--card2); overflow: hidden; margin: 8px 0 4px; } .cs-meter i { display: block; height: 100%; background: var(--accent); }
  .seg { display: inline-flex; padding: 4px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); margin-bottom: 16px; }
  .seg button { height: 38px; padding: 0 18px; border-radius: 10px; color: var(--dim); font-weight: 700; }
  .seg button.on { background: var(--card2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line2); }
  /* story */
  .story { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 22px; align-items: start; }
  .faces { display: flex; flex-wrap: wrap; gap: 10px; max-height: 250px; overflow-y: auto; padding: 4px; }
  .faces button { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 70px; font-size: .76rem; color: var(--dim); line-height: 1.15; text-align: center; }
  .faces .vx-av { width: 54px; height: 54px; }
  .faces .on { color: var(--text); font-weight: 800; }
  .faces .on .vx-av { outline: 3px solid var(--accent); outline-offset: 2px; }
  .lbl { font-weight: 800; margin: 16px 0 8px; display: block; }
  textarea { width: 100%; min-height: 110px; border-radius: 16px; border: 1px solid var(--line2); background: var(--card2); color: var(--text); font: inherit; font-size: 1.05rem; padding: 12px 14px; outline: 0; resize: vertical; }
  textarea:focus { border-color: var(--accent); }
  .file { display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 16px; border-radius: 14px; border: 1px dashed var(--line2); color: var(--dim); cursor: pointer; font-weight: 700; }
  .file input { display: none; }
  .file svg { width: 19px; height: 19px; }
  .toggle { display: inline-flex; align-items: center; gap: 10px; color: var(--dim); font-weight: 600; cursor: pointer; }
  .toggle input { display: none; }

// ---------- the key ----------
const key = (() => {
  const m = location.hash.match(/k=([^&]+)/);
  try { if (m) { localStorage.setItem('owner-key', decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname + location.hash.replace(/[#&]?k=[^&]+/, '')); } return localStorage.getItem('owner-key'); } catch (e) { return null; }
})();
function gate(bad) {

  $('#app').innerHTML = `<div class="gate"><div><img src="/verse/logo-512.png" alt="שלומיוורס"><h1>מאחורי הקלעים</h1>
    <p>${bad ? 'הקוד לא נכון. נסו שוב.' : 'הקוד פעם אחת, והמכשיר הזה יזכור.'}</p>

}
async function api(op, body, isForm) {
  const res = await fetch(`${API}?op=${op}`, { method: body ? 'POST' : 'GET', headers: { authorization: 'Key ' + key, ...(isForm || !body ? {} : { 'content-type': 'application/json' }) }, body: isForm ? body : body ? JSON.stringify(body) : undefined });
  if (res.status === 401) { gate(true); throw new Error('key'); }
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(j.error || 'fail'), { status: res.status, j });
  return j;
}

// ---------- time (Israel) ----------
const ago = (ms) => { if (!ms) return ''; const m = (Date.now() - ms) / 6e4; return m < 1 ? 'עכשיו' : m < 60 ? `לפני ${Math.max(1, Math.round(m))} דק'` : m < 1440 ? `לפני ${Math.round(m / 60)} שע'` : new Date(ms).toLocaleDateString('he-IL', { day: 'numeric', month: 'short' }); };
const fmt = (n) => (n || 0).toLocaleString('he-IL');
const stamp = (ms) => ms ? new Date(ms).toLocaleString('he-IL', { timeZone: 'Asia/Jerusalem', day: 'numeric', month: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';
const hhmm = (ms) => new Date(ms).toLocaleTimeString('he-IL', { timeZone: 'Asia/Jerusalem', hour: '2-digit', minute: '2-digit' });
const dayIL = (ms = Date.now()) => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Jerusalem' }).format(new Date(ms));
const ilOffset = (ms) => { const p = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Jerusalem', timeZoneName: 'shortOffset' }).formatToParts(new Date(ms)).find((x) => x.type === 'timeZoneName')?.value || ''; const m = p.match(/GMT([+-]\d+)/); return (m ? +m[1] : 2) * 3600e3; };
const dayStart = (d) => { const g = Date.parse(d + 'T00:00:00Z'); return g - ilOffset(g); };
const dayBack = (n) => dayIL(Date.now() - n * 864e5);
const dm = (d) => `${+d.slice(8)}.${+d.slice(5, 7)}`;
const dayName = (d) => d === dayIL() ? 'היום' : d === dayBack(1) ? 'אתמול' : new Date(dayStart(d) + 12 * 3600e3).toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'numeric' });
const hi = () => { const h = +new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Jerusalem', hour: 'numeric', hour12: false }).format(new Date()); return h < 5 ? 'לילה טוב' : h < 12 ? 'בוקר טוב' : h < 17 ? 'צהריים טובים' : h < 21 ? 'ערב טוב' : 'לילה טוב'; };

// ---------- faces ----------

async function load() {

async function refresh() { [L, S] = await Promise.all([api('list'), api('stats&days=45')]); draw(); }

let refreshing = false;
async function refreshAll() {
  if (refreshing) return;
  refreshing = true;
  if (tab === 'mail') loadMail();
  if (tab === 'costs') loadCosts(false);
  document.querySelectorAll('[data-refresh]').forEach((x) => x.classList.add('spin'));
  try {
    [L, S] = await Promise.all([api('list'), api('stats&days=45'), loadChats(chRange), api('stars').then((r) => { stars = new Set(r.stars); }).catch(() => {})]);
    PL = await api('plans').catch(() => PL);
    if (planId) PLAN = await api('plan', { id: planId }).catch(() => PLAN);
    await crLoad();
  } catch (e) {}
  refreshing = false;
  const y = scrollY;

// ---------- the frame: sidebar (desktop), tab bar (phone) ----------
const TABS = [['overview', 'סקירה', 'home'], ['plans', 'תוכניות', 'plan'], ['chars', 'דמויות', 'cast'], ['chats', 'שיחות', 'comment'], ['data', 'נתונים', 'stats'], ['people', 'אנשים', 'people'], ['requests', 'פניות', 'inbox'], ['ideas', 'רעיונות', 'idea'], ['content', 'תוכן', 'content'], ['videos', 'סרטונים', 'video'], ['publish', 'פרסום', 'story'], ['mail', 'מיילים', 'mail'], ['tz', 'ציפציפ', 'spark'], ['costs', 'הוצאות', 'dollar']];

const openReq = () => L.requests.filter((r) => !r.done).length;
const newIdeas = () => (L.ideas || []).filter((x) => !x.hidden && x.t && Date.now() - x.t < 7 * 864e5).length;
const unchecked = () => L.comments.filter((c) => c.unchecked && !c.hidden).length;
// the numbers on the menu = what is NEW since he last opened that part (his ask: "can I make the mark disappear?") -
// opening פניות / תוכן clears it; something new brings it back. Kept on this device.
// since 2026-11-06 also on the server (owner/seen): one look clears the mark on the phone, the computer and the home-screen app
const seenHere = (k) => { try { return +localStorage.getItem('bs-seen-' + k) || 0; } catch (e) { return 0; } };
const seen = (k) => Math.max(seenHere(k), (L && L.seen && L.seen[k]) || 0);
const markSeen = (k) => {
  const now = Date.now();
  try { localStorage.setItem('bs-seen-' + k, String(now)); } catch (e) {}
  if (L && (!L.seen || !L.seen[k] || now - L.seen[k] > 60e3)) { L.seen = { ...(L.seen || {}), [k]: now }; api('seen', { k }).catch(() => {}); }
};
const badges = () => ({
  requests: L.requests.filter((r) => !r.done && (r.t || 0) > seen('requests')).length,
  content: L.comments.filter((c) => c.unchecked && !c.hidden && (c.t || 0) > seen('content')).length,
  ideas: (L.ideas || []).filter((x) => !x.hidden && (x.t || 0) > Math.max(seen('ideas'), Date.now() - 7 * 864e5)).length,
  // plans waiting for his OK that he hasn't opened in their latest version - reading one clears it (his ask, 2026-11-07)
  // = exactly the "מחכה לך" list (his note 2026-11-08: the tab said 3, the list 2 - a replaced plan he never opened was counted)
  plans: (PL.plans || []).filter((p) => !planOld(p)).length,
  chars: crBadge(),   // characters with something new for him since he last opened them (a session's answer, a changed field)
});
function draw() {
  // ideas have their own tab (his ask, 2026-11-05: "I need an ideas tab"); the old names open their part straight away
  if (['comments', 'stickers'].includes(tab)) contentSeg = tab;
  if (!TITLE[tab]) tab = { comments: 'content', stickers: 'content', story: 'publish', video: 'publish', stats: 'data' }[tab] || 'overview';
  if (tab === 'requests' || tab === 'content' || tab === 'ideas') markSeen(tab);
  const badge = badges();
  const phoneTab = ['plans', 'chars', 'requests', 'ideas', 'content', 'videos', 'publish', 'mail', 'tz', 'costs'].includes(tab) ? 'more' : tab;
  const moreBadge = badge.requests + badge.ideas + badge.content + badge.plans + badge.chars;
  $('#app').innerHTML = `<div class="app">
    <aside class="side"><div class="brand"><img src="/verse/logo-512.png" alt="שלומיוורס"><b>מאחורי הקלעים</b></div>
      <nav class="nav">${TABS.map(([k, l, i]) => `<button data-tab="${k}" class="${k === tab ? 'on' : ''}">${IC[i]}<span>${l}</span>${badge[k] ? `<em>${badge[k]}</em>` : ''}</button>`).join('')}</nav>
      <nav class="nav foot"><button data-refresh>${IC.refresh}<span>רענון</span></button><a href="/wiki/" target="_blank">${IC.out}<span>לאתר</span></a><a href="/all/" target="_blank">${IC.globe}<span>כל הדפים שלי</span></a></nav></aside>
    <main class="main"><div class="mtop"><img src="/verse/logo-160.png" alt=""><h1>${tab === 'overview' ? 'מאחורי הקלעים' : TITLE[tab]}</h1><button class="rf" data-refresh aria-label="רענון">${IC.refresh}</button><a href="/wiki/" target="_blank" aria-label="לאתר">${IC.out}</a></div><div id="pane"></div></main>
    <nav class="tabbar">${[['overview', 'סקירה', 'home'], ['chats', 'שיחות', 'comment'], ['data', 'נתונים', 'stats'], ['people', 'אנשים', 'people'], ['more', 'עוד', 'more']].map(([k, l, i]) =>
      `<button data-tab="${k}" class="${k === phoneTab ? 'on' : ''}">${IC[i]}<span>${l}</span>${k === 'more' && moreBadge ? `<em>${moreBadge}</em>` : ''}</button>`).join('')}</nav></div>`;
  ({ overview, plans, chars, chats, data, people, requests, ideas, content, videos, publish, mail: mails, tz, costs, more })[tab]();
  history.replaceState(null, '', '#' + tab);
}
const go = (t) => { if (t === 'plans') { planId = null; PLAN = null; window.onmessage = null; } if (t === 'chars') { crId = null; } tab = t; draw(); scrollTo(0, 0); };   // the תוכניות tab always opens the list (his note 2026-11-07)
// the tab marks again without drawing the page (a plan he just opened stops counting)
function reBadge() {
  const b = badges(), more = b.requests + b.ideas + b.content + b.plans + b.chars;
  const set = (btn, n) => { if (!btn) return; let em = btn.querySelector('em'); if (!n) { if (em) em.remove(); return; } if (!em) { em = document.createElement('em'); btn.append(em); } em.textContent = n; };
  document.querySelectorAll('.nav button[data-tab]').forEach((btn) => set(btn, b[btn.dataset.tab]));
  set(document.querySelector('.tabbar button[data-tab="more"]'), more);
}

// a small markdown: **bold**, - bullets, | tables |
function md(t) {
  const lines = esc(t || '').split('\n'), out = [];
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (/^\s*\|/.test(l)) {
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      i--;
      const cells = rows.filter((r) => !/^\s*\|[\s:|-]+\|\s*$/.test(r)).map((r) => r.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim()));
      out.push(`<table>${cells.map((r, k) => `<tr>${r.map((c) => k ? `<td>${c}</td>` : `<th>${c}</th>`).join('')}</tr>`).join('')}</table>`);
    } else if (/^\s*[-•]\s+/.test(l)) out.push(`<ul><li>${l.replace(/^\s*[-•]\s+/, '')}</li></ul>`);
    else out.push(l ? `<div>${l}</div>` : '<div style="height:6px"></div>');
  }
  return out.join('').replace(/<\/ul><ul>/g, '').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
}
// one-series bar chart: today on the left (right to left), hover = the number, click = drill into that day
function bars(el, rows, unit, onPick, on, ghost) {   // ghost: {day: projected total} - drawn pale above the bar
  if (!el) return;
  ghost = ghost || {};
  const W_ = el.clientWidth || 600, H = 190, padB = 22, padT = 10, n = rows.length;
  const max = Math.max(1, ...rows.map((r) => Math.max(r[1], ghost[r[0]] || 0))), step = W_ / n, bw = Math.max(3, Math.min(30, step - 3));
  const y = (v) => H - padB - (v / max) * (H - padB - padT), every = Math.ceil(n / 8);
  const grid = [0, .5, 1].map((f) => { const v = Math.round(max * f), yy = y(v); return `<line x1="0" x2="${W_}" y1="${yy}" y2="${yy}" stroke="rgba(255,255,255,.07)"/><text x="${W_}" y="${yy - 3}" fill="#6f6c77" font-size="10" text-anchor="end">${fmt(v)}</text>`; }).join('');
  const marks = rows.map(([d, v], i) => {
    const x = W_ - (i + 1) * step + (step - bw) / 2, top = y(v), sel = d === on;
    const lbl = i % every === 0 || i === n - 1 ? `<text x="${x + bw / 2}" y="${H - 6}" fill="#6f6c77" font-size="10" text-anchor="middle">${dm(d)}</text>` : '';
    const g = ghost[d] > v ? `<rect x="${x + 1}" y="${y(ghost[d])}" width="${bw - 2}" height="${Math.max(0, top - y(ghost[d]))}" rx="${Math.min(4, bw / 2)}" fill="rgba(255,106,31,.14)" stroke="#ff6a1f" stroke-opacity=".55" stroke-dasharray="3 3"/>` : '';
    return `<g data-d="${d}" data-v="${v}"${ghost[d] ? ` data-g="${Math.round(ghost[d])}"` : ''}><rect x="${W_ - (i + 1) * step}" y="0" width="${step}" height="${H - padB}" fill="transparent"/>${g}${v ? `<rect x="${x}" y="${top}" width="${bw}" height="${H - padB - top}" rx="${Math.min(4, bw / 2)}" fill="${sel ? '#ffb07a' : on ? 'rgba(255,106,31,.45)' : '#ff6a1f'}"/>` : ''}${lbl}</g>`;
  }).reverse().join('');
  el.innerHTML = `<svg viewBox="0 0 ${W_} ${H}" preserveAspectRatio="none">${grid}${marks}</svg><div class="tip"></div>`;
  const tip = el.querySelector('.tip');
  el.querySelectorAll('g[data-d]').forEach((g) => {
    g.onmouseenter = () => { const r = g.getBoundingClientRect(), p = el.getBoundingClientRect(); tip.style.display = 'block'; tip.style.right = (p.right - r.right + r.width / 2) + 'px'; tip.textContent = `${dayName(g.dataset.d)} · ${fmt(+g.dataset.v)} ${unit}${g.dataset.g ? ` · צפי כ-${fmt(+g.dataset.g)}` : ''}`; };
    g.onmouseleave = () => (tip.style.display = 'none');
    if (onPick) g.onclick = () => onPick(g.dataset.d);
  });
}

// ---------- the designer: the story's words as boxes on its stage ----------
// DZ = { boxes (story-art.js boxes), sel (the box being shaped), paint (draws the preview) }
let DZ = null;
const TAILS = [['br', 'זנב ימינה למטה'], ['bl', 'זנב שמאלה למטה'], ['tr', 'זנב ימינה למעלה'], ['tl', 'זנב שמאלה למעלה'], ['none', 'בלי זנב']];
function dzPanel() {
  const d = DZ, b = d.boxes[d.sel];
  const sw = (k, c, cur) => `<button class="sw ${cur === c ? 'on' : ''}" data-dzc="${k}" data-v="${c}" title="${c === 'char' ? 'הצבע של הדמות' : c}" style="background:${c === 'char' ? 'var(--dzchar)' : c}"></button>`;
  $('#dz').innerHTML = `<div class="dz-list">${d.boxes.map((x, i) => `<button data-dzsel="${i}" class="${i === d.sel ? 'on' : ''}">${esc(x.t.slice(0, 22) || 'טקסט חדש')}</button>`).join('')}
      <button data-dzadd class="add">${IC.plus}טקסט</button></div>
    ${!b ? '<p class="hint">אין מילים על הסטורי, רק התמונה. „טקסט" מוסיף קופסה, ואז גוררים אותה בתצוגה למקום פנוי.</p>' : `
    <textarea id="dz-t" rows="3" maxlength="300" placeholder="המילים, בקול של הדמות">${esc(b.t)}</textarea>
    <div class="dz-row">${Object.entries(STYLES).map(([k, v]) => `<button data-dzst="${k}" class="chip ${b.st === k ? 'on' : ''}">${v.label}</button>`).join('')}</div>
    <div class="dz-grid">
      <label>גופן<select id="dz-f">${Object.entries(FONTS).map(([k, v]) => `<option value="${k}"${b.f === k ? ' selected' : ''}>${v[2]}</option>`).join('')}</select></label>
      <label>גודל האותיות<input type="range" id="dz-s" min="3" max="16" step="0.1" value="${b.s}"></label>
      <label>רוחב<input type="range" id="dz-w" min="15" max="100" step="1" value="${b.w}"></label>
      <label>סיבוב<input type="range" id="dz-r" min="-15" max="15" step="0.5" value="${b.r}"></label>
    </div>
    <div class="dz-row"><span>צבע</span>${COLORS.map((c) => sw('c', c, b.c)).join('')}</div>
    ${b.st === 'shadow' ? '' : `<div class="dz-row"><span>${b.st === 'outline' ? 'קו מתאר' : 'רקע'}</span>${COLORS.map((c) => sw('bg', c, b.bg)).join('')}</div>`}
    <div class="dz-row"><span>יישור</span>${[['right', 'ימין'], ['center', 'מרכז'], ['left', 'שמאל']].map(([k, l]) => `<button data-dzal="${k}" class="chip ${b.al === k ? 'on' : ''}">${l}</button>`).join('')}
      ${b.st === 'bubble' ? `<select id="dz-tail">${TAILS.map(([k, l]) => `<option value="${k}"${b.tail === k ? ' selected' : ''}>${l}</option>`).join('')}</select>` : ''}
      <button data-dzdel class="chip del">למחוק את הקופסה</button></div>`}`;
}
function dzInit(boxes, paint) {
  DZ = { boxes: boxes.map(normBox), sel: boxes.length ? 0 : -1, paint };
  const el = $('#dz');
  el.style.setProperty('--dzchar', 'var(--accent)');
  const up = (fn) => { const b = DZ.boxes[DZ.sel]; if (b) { fn(b); DZ.paint(); } };
  el.onclick = (e) => {
    const t = e.target.closest('button');
    if (!t) return;
    e.stopPropagation();
    const ds = t.dataset;
    if (ds.dzsel) DZ.sel = +ds.dzsel;
    else if (ds.dzadd !== undefined) { DZ.boxes.push(normBox({ t: '', st: 'glass', y: 80, w: 84, s: 6 })); DZ.sel = DZ.boxes.length - 1; }
    else if (ds.dzdel !== undefined) { DZ.boxes.splice(DZ.sel, 1); DZ.sel = Math.min(DZ.sel, DZ.boxes.length - 1); }
    else if (ds.dzst) up((b) => { const S = STYLES[ds.dzst]; Object.assign(b, { st: ds.dzst, c: S.c, bg: S.bg || '', ...(S.f ? { f: S.f } : {}), r: S.r || 0, wt: S.wt || 800 }); });
    else if (ds.dzal) up((b) => { b.al = ds.dzal; });
    else if (ds.dzc) up((b) => { b[ds.dzc] = ds.v; });
    else return;
    dzPanel(); DZ.paint();
    if (ds.dzadd !== undefined) $('#dz-t')?.focus();
  };
  el.oninput = (e) => {
    const id = e.target.id, v = e.target.value;
    up((b) => { if (id === 'dz-t') b.t = v; else if (id === 'dz-f') b.f = v; else if (id === 'dz-tail') b.tail = v; else if (id === 'dz-s') b.s = +v; else if (id === 'dz-w') b.w = +v; else if (id === 'dz-r') b.r = +v; });
    if (id === 'dz-t') { const chip = el.querySelector(`[data-dzsel="${DZ.sel}"]`); if (chip) chip.textContent = v.slice(0, 22) || 'טקסט חדש'; }
  };
  dzPanel();
}
// dragging a box in the preview: select it, move it (the stage's % - the same numbers the site draws)
function dzDrag(prev) {
  prev.onpointerdown = (e) => {
    const bx = e.target.closest('[data-box]');
    if (!bx || !DZ) return;
    e.preventDefault();
    const i = +bx.dataset.box, st = prev.querySelector('.sa-stage').getBoundingClientRect(), b = DZ.boxes[i];
    if (DZ.sel !== i) { DZ.sel = i; dzPanel(); }
    prev.querySelectorAll('.sa-b').forEach((x) => x.classList.toggle('dz-on', x === bx));
    const ox = e.clientX, oy = e.clientY, bx0 = b.x, by0 = b.y;
    const move = (m) => {
      b.x = Math.round(Math.min(100, Math.max(0, bx0 + ((m.clientX - ox) / st.width) * 100)) * 10) / 10;
      b.y = Math.round(Math.min(100, Math.max(0, by0 + ((m.clientY - oy) / st.height) * 100)) * 10) / 10;
      bx.style.left = b.x + '%'; bx.style.top = b.y + '%';
    };
    const end = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', end); DZ.paint(); };
    addEventListener('pointermove', move); addEventListener('pointerup', end);
  };
}

      <div class="ml-tags">${mkTag(x.kind, x.meta)}${x.ok ? '' : '<span class="tag red">לא נשלח</span>'}</div>${x.ok ? '' : `<div class="ml-err">${esc(x.error || 'שגיאה')}</div>`}</div><time>${ago(x.t)}</time></button>`;
  el.innerHTML = `<div class="card-h"><h2>מה נשלח</h2><small class="hint">${fmt(all.length)} אחרונים${bad ? ` · <span style="color:#ff8a8a">${fmt(bad)} נכשלו</span>` : ''}</small></div>
    <div class="chips">${ML_GROUPS.map(([k, l]) => { const n = k === 'all' ? all.length : all.filter((x) => mlGroup(x.kind) === k).length; return `<button data-mlk="${k}" class="${k === mlKind ? 'on' : ''}">${l}${n ? `<small>${fmt(n)}</small>` : ''}</button>`; }).join('')}</div>
    <div class="rows">${list.slice(0, mlShown).map(row).join('') || '<div class="empty">עוד לא נשלח כלום כזה.</div>'}</div>
    ${list.length > mlShown ? `<button class="btn more" data-mlmore>עוד ${fmt(list.length - mlShown)}</button>` : ''}`;
}
function mlEvents() {
  const el = $('#ml-ev');
  if (!el) return;
  const head = '<div class="card-h"><h2>מה קרה</h2><small class="hint">מזה נבנים המיילים הבאים</small></div>';
  if (!MST || MST.error) { el.innerHTML = head + mlWait(MST); return; }
  el.innerHTML = head + `<div class="rows">${(MST.events || []).map((e) => {
    const [l, c, ic] = EVK[e.kind] || [e.kind, '', 'spark'], old = Date.now() - e.t > 7 * 864e5;
    return `<div class="row${old ? ' old' : ''}">${e.kind === 'story' && e.char ? face(e.char) : `<span class="ml-ic ${c}">${IC[ic]}</span>`}<div class="body">
      <div class="l1"><b>${esc(evTitle(e))}</b></div><div class="l2"><span class="tag ${c}">${l}</span>${e.kind === 'story' ? (e.everyone ? 'לכל השלומיוורס' : 'לעוקבים') : ''}${old ? '<span>ישן מדי למייל</span>' : ''}</div></div><time>${ago(e.t)}</time></div>`;
  }).join('') || '<div class="empty">עוד לא קרה כלום מאז שהמיילים התחילו.</div>'}</div>`;
}
// one mail, full size, exactly as it goes out (scripts never run: a sandboxed frame)
function mlSheet(id, title, sub, bar) {
  sheet(`<div class="sh-h"><div class="t"><b>${title}</b><small>${sub}</small></div><button class="x" data-close>${IC.x}</button></div>${bar ? `<div class="ml-bar">${bar}</div>` : ''}
    <div class="sh-b"><div class="ml-full"><iframe sandbox="allow-popups allow-popups-to-escape-sandbox" data-id="${esc(id)}" title="${title}"></iframe></div></div>`, 'sh-mail');
  mlFullRO.observe($('.ml-full'));
}
// a mail is laid out at least 520px wide and shrunk to fit a phone, the way a phone's mail app shows it (they don't all fit 390px)
const mlFullRO = new ResizeObserver((es) => es.forEach((x) => { const w = x.contentRect.width, fw = Math.max(w, 520); x.target.style.setProperty('--fw', fw + 'px'); x.target.style.setProperty('--fs', w / fw); }));
function mlFill(id, html) {
  const f = $('.sh-mail iframe');
  if (!f || f.dataset.id !== id) return;
  if (html) f.srcdoc = mlDoc(html);
  else f.replaceWith(Object.assign(document.createElement('div'), { className: 'empty', textContent: 'המייל הזה לא נשמר (גדול מדי, או לפני שהתחלנו לשמור).' }));
}
function mlOpenSample(key) {
  const x = MSM?.samples?.find((s) => s.key === key);
  if (!x) return;
  mlSheet('s:' + key, esc(x.label), `מאת ${esc(x.from)} · ${esc(x.subject)}`, `<button class="btn main" data-mtest="${esc(x.key)}">${IC.mail}לשלוח אליי</button><button class="btn" data-mtest="">לשלוח אליי את כולם</button>`);
  mlFill('s:' + key, x.html);
}
async function mlOpenLog(id) {
  const x = MLG?.log?.find((l) => l.id === id);
  if (!x) return;
  mlSheet(id, esc(x.subject || '(בלי נושא)'), `אל <bdi dir="ltr">${esc(x.to)}</bdi> · מאת ${esc(x.fromName || 'השלומיוורס')} · ${stamp(x.t)}`,
    `${mkTag(x.kind, x.meta)}${x.ok ? '' : `<span class="tag red">לא נשלח</span><span class="ml-err">${esc(x.error || '')}</span>`}`);
  if (mlHtml[id] == null) {
    mlFill(id, '<body style="margin:0;background:#0b0b0f;color:#a6a3ad;font:16px sans-serif;display:grid;place-items:center;height:90vh">טוען…</body>');
    try { mlHtml[id] = (await api('mailView', { id })).html || ''; } catch (e) { mlHtml[id] = ''; }
  }
  mlFill(id, mlHtml[id]);
}
async function mlTest(b) {
  const k = b.dataset.mtest, was = b.innerHTML;
  b.disabled = true; b.textContent = 'שולח…';
  try {
    const r = await api('mailTest', k ? { key: k } : {});
    b.innerHTML = `${IC.check}${k ? 'נשלח אליך' : `נשלחו ${fmt(r.sent)}`}`; b.title = r.to;
    api('mailLog', { limit: 300 }).then((x) => { MLG = x; if (tab === 'mail') mlLog(); }).catch(() => {});
  } catch (x) { b.disabled = false; b.innerHTML = was; alert('לא נשלח: ' + x.message); }
}
addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset?.msample) { e.preventDefault(); mlOpenSample(e.target.dataset.msample); } });

// ---------- clicks ----------
document.addEventListener('click', async (e) => {
  if (e.target.closest('[data-close]')) { closeSheet(); return; }
  if (e.target.closest('[data-refresh]')) { refreshAll(); return; }
  const st = e.target.closest('[data-star]');
  if (st) {   // a star on a conversation (in the list or in the open one) - kept on the server
    e.stopPropagation();
    const k = st.dataset.star, on = !stars.has(k);
    on ? stars.add(k) : stars.delete(k);
    document.querySelectorAll(`[data-star="${CSS.escape(k)}"]`).forEach((x) => x.classList.toggle('on', on));
    api('star', { key: k, on }).catch(() => {});
    return;
  }
  const mc = e.target.closest('[data-msample]');
  if (mc) { mlOpenSample(mc.dataset.msample); return; }
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.person) { openPerson(b.dataset.person); return; }
  if (b.dataset.pchat) { openThread(b.dataset.pchat, window._personChats); return; }
  if (b.dataset.chat) { openThread(b.dataset.chat); return; }
  if (b.dataset.tab) { closeSheet(); go(b.dataset.tab); }
  else if (b.dataset.range) { range = +b.dataset.range; drillDay = null; tab === 'data' ? data() : overview(); }
  else if (b.dataset.metric) { metric = b.dataset.metric; drillDay = null; go('data'); }
  else if (b.dataset.undrill !== undefined) { drillDay = null; data(); }
  else if (b.dataset.ex !== undefined) { $('#ask-q').value = b.textContent; ask(b.textContent); }
  else if (b.dataset.chrange) { b.disabled = true; chShown = 60; await loadChats(b.dataset.chrange).catch(() => {}); chats(); }
  else if (b.dataset.chf) { chFilter = b.dataset.chf; chShown = 60; chats(); }
  else if (b.dataset.chchar !== undefined) { chChar = b.dataset.chchar; chShown = 60; chats(); }
  else if (b.dataset.chmore !== undefined) { chShown += 60; chats(); }
  else if (b.dataset.pf) { pFilter = b.dataset.pf; people(); }
  else if (b.dataset.pday !== undefined) { pDay = null; people(); }
  else if (b.dataset.cseg) { contentSeg = b.dataset.cseg; content(); }
  else if (b.dataset.pseg) { publishSeg = b.dataset.pseg; publish(); }
  else if (b.dataset.pub) { publishSeg = b.dataset.pub; go('publish'); }
  else if (b.dataset.mlog) mlOpenLog(b.dataset.mlog);
  else if (b.dataset.mlk) { mlKind = b.dataset.mlk; mlShown = 40; mlLog(); }
  else if (b.dataset.mlmore !== undefined) { mlShown += 40; mlLog(); }
  else if (b.dataset.mrun !== undefined) mlRun(b);
  else if (b.dataset.mtest !== undefined) mlTest(b);
  else if (b.dataset.rqk) { rqKind = b.dataset.rqk; requests(); }
  else if (b.dataset.pick) { pick = b.dataset.pick; document.querySelectorAll('[data-pick]').forEach((x) => x.classList.toggle('on', x === b)); window._stPrev?.(); }
  else if (b.dataset.staud) { stAud = b.dataset.staud; window._stPrev?.(); }
  else if (b.dataset.storyNew !== undefined) newStory();
  else if (b.dataset.storyOpen) openStory(b.dataset.storyOpen);
  else if (b.dataset.storyEdit) storyWindow(storyById(b.dataset.storyEdit));
  else if (b.dataset.storyStep) openStory(b.dataset.storyStep);
  else if (b.dataset.ststate) { stState = b.dataset.ststate; story(); }
  else if (b.dataset.stchar !== undefined) { stChar = b.dataset.stchar; story(); }
  else if (b.dataset.hide) { if (b.closest('.sheet')) closeSheet(); b.disabled = true; await api('hide', { kind: b.dataset.hide, id: b.dataset.id, hidden: b.dataset.on === '1' }).catch(() => {}); refresh(); }
  else if (b.dataset.ideaStep) await ideaStep(b);
  else if (b.dataset.vcHide) await vcHide(b);
  else if (b.dataset.cropen) crOpenChar(b.dataset.cropen);
  else if (b.dataset.crback !== undefined) { crId = null; chars(); scrollTo(0, 0); }
  else if (b.dataset.crseg) { crSeg = b.dataset.crseg; chars(); }
  else if (b.dataset.crrow) { const a = b.dataset.crrow; crOpenRows.has(a) && !crDraft(crId, a) ? crOpenRows.delete(a) : crOpenRows.add(a); crRedraw(); }
  else if (b.dataset.cclose) { crOpenRows.delete(b.dataset.cclose); crRedraw(); }   // the draft stays for next time
  else if (b.dataset.crscore) await crScore(b);
  else if (b.dataset.crdone) await crMarkDone(b);
  else if (b.dataset.crsort) { crSort = b.dataset.crsort; chars(); }
  else if (b.dataset.csend !== undefined) await crSend(b);
  else if (b.dataset.cdone) { b.disabled = true; const done = b.dataset.v === '1'; await api('charNoteDone', { id: b.dataset.cdone, done }).catch(() => {}); const n = CR.notes.find((x) => x.id === b.dataset.cdone); if (n) n.done = done; crRedraw(); }
  else if (b.dataset.wsOpen) await wishOpen(b);
  else if (b.dataset.ideaReply) {
    const id = b.dataset.ideaReply, text = document.querySelector(`[data-idea-reply-text="${id}"]`).value.trim();
    const x = (L.ideas || []).find((i) => i.id === id);
    if (!text && !x?.reply?.text) return;
    if (!await askBox(text ? `לפרסם את התגובה מתחת לרעיון? ${x?.nick || 'הכותב'} יקבל/ת התראה.` : 'למחוק את התגובה?')) return;
    b.disabled = true;
    await api('ideaReply', { id, text }).catch(() => {});
    refresh();
  }
  // a "can't find a video" request: the video is in the verse now - the sender hears it (bell, push, mail; verse.js requestFound)
  else if (b.dataset.found) {
    const v = (prompt('מזהה הסרטון (מהכתובת /v/...):') || '').trim().replace(/^.*\/v\//, '').replace(/[?#].*$/, '');
    if (!v) return;
    b.disabled = true;
    const r = await api('found', { id: b.dataset.found, videoId: v }).catch((e) => ({ error: e.message }));
    if (r && r.error) { alert('לא נמצא סרטון כזה: ' + v); b.disabled = false; return; }
    refresh();
  }
  else if (b.dataset.done) { b.disabled = true; await api('done', { id: b.dataset.done, done: b.dataset.on === '1' }).catch(() => {}); refresh(); }
  else if (b.dataset.announce) {
    const v = V[b.dataset.announce];
    b.disabled = true; b.textContent = 'שולח…';
    try { const r = await api('announce', { videoId: v.id, video: { title: v.title, cast: v.cast, poster: v.poster }, again: !!b.dataset.again }); L.announced[v.id] = Date.now(); b.outerHTML = `<span class="tag or">נשלח ל-${r.fans} עוקבים</span>`; }
    catch (x) { b.disabled = false; b.textContent = x.message === 'already' ? 'כבר נשלח' : 'לא נשלח'; }
  }
});
</script>
