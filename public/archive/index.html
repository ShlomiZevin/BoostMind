<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0b0e">
<title>הארכיון · שלומיוורס</title>
<!-- הארכיון (his ask, 2026-11-10): his whole Instagram on one page - every post's cover, date, likes, comments and
     caption, and whether it's already in the verse - so he finds old videos fast and marks what to bring in; later open
     to every resident (verseOwner op=wishOpen). The list: gs://shlomiverse-media/insta/list.json + covers insta/t/<id>.jpg,
     made by scripts/insta/gallery.py (no AI). A mark = verse op 'wish' (wishes/<ig>); the insta-to-verse session brings
     the marked reels and the wish closes by itself when ig-<id> is in the verse (verseAutoAnnounce). Design: the
     image-model concept (Nov 10) in the verse's own tokens (verse.css). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="/verse/favicon-32.png">
<link rel="apple-touch-icon" href="/verse/icon-180.png">
<script src="/t.js" data-site="archive" defer></script>
<script src="/verse/site-signin.js" defer></script>
<style>
:root{--bg:#0b0b0e;--card:#16161b;--line:rgba(255,255,255,.12);--text:#f4f4f6;--mute:#9a9aa6;--accent:#ff6a1f;--accent2:#ff8a3d;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Heebo,system-ui,sans-serif}
button{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:18px 14px calc(110px + env(safe-area-inset-bottom))}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
h1{margin:0;font-size:2.1rem;font-weight:900;letter-spacing:-.5px}
.sub{margin:4px 0 0;color:var(--mute);font-size:.98rem}
.back{flex:none;width:42px;height:42px;display:grid;place-items:center;border-radius:50%;color:var(--accent);text-decoration:none}
.back svg{width:26px;height:26px}
.search{position:relative;display:block;margin:16px 0 12px}
.search input{width:100%;height:50px;border-radius:16px;border:1px solid var(--line);background:#121217;color:var(--text);font:inherit;font-size:1rem;padding:0 46px 0 16px;outline:none}
.search input:focus{border-color:rgba(255,106,31,.6)}
.search svg{position:absolute;top:14px;right:15px;width:22px;height:22px;color:var(--mute)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:#121217;color:#d6d6de;font-weight:500;font-size:.95rem;cursor:pointer;white-space:nowrap}
.chip svg{width:18px;height:18px}
.chip.on{border-color:var(--accent);color:var(--accent);background:rgba(255,106,31,.08)}
.count{margin:12px 2px 10px;color:var(--mute);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:640px){.grid{grid-template-columns:repeat(4,1fr);gap:10px}}
@media (min-width:900px){.grid{grid-template-columns:repeat(6,1fr)}}
.tile{position:relative;border-radius:14px;overflow:hidden;background:var(--card);aspect-ratio:9/16;cursor:pointer}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.tile .shade{position:absolute;inset:auto 0 0 0;height:42%;background:linear-gradient(transparent,rgba(0,0,0,.85));pointer-events:none}
.tile .meta{position:absolute;inset:auto 8px 6px 8px;font-size:.78rem;line-height:1.35;pointer-events:none}
.tile .nums{display:flex;gap:9px;font-weight:700}
.tile .nums span{display:inline-flex;align-items:center;gap:3px}
.tile .nums svg{width:13px;height:13px}
.tile .date{color:#c9c9d2;font-weight:400}
.tile.in img{filter:brightness(.55) saturate(.7)}
.badge{position:absolute;top:7px;left:7px;max-width:calc(100% - 14px);padding:2px 9px;border-radius:999px;border:1px solid var(--accent);background:rgba(11,11,14,.75);color:var(--accent2);font-size:.74rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mark{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.9);background:rgba(0,0,0,.35);display:grid;place-items:center;cursor:pointer;padding:0}
.mark svg{width:18px;height:18px;opacity:0}
.mark.on{background:var(--accent);border-color:var(--accent)}
.mark.on svg{opacity:1}
.asked{position:absolute;top:9px;left:7px;padding:2px 8px;border-radius:999px;background:rgba(11,11,14,.78);font-size:.74rem;font-weight:700}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:40px 0}
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:700px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 10px 10px;border-radius:22px;border:1px solid var(--line);background:rgba(18,18,22,.86);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);box-shadow:0 18px 50px rgba(0,0,0,.45);transform:translateY(160%);transition:transform .25s ease}
.bar.show{transform:none}
.bar b{font-size:1.02rem}
.bar small{display:block;color:var(--mute);font-size:.8rem}
.btn{height:46px;padding:0 20px;border:0;border-radius:999px;background:var(--accent);color:#fff;font-weight:800;font-size:1rem;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-140%);padding:10px 18px;border-radius:14px;background:#22222a;border:1px solid var(--line);font-size:.95rem;transition:transform .25s;z-index:9;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.loading{color:var(--mute);text-align:center;padding:60px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>הארכיון</h1>
      <p class="sub" id="sub">כל הסרטונים מהאינסטגרם · סמנו מה להביא לשלומיוורס</p>
    </div>
    <a class="back" href="/" aria-label="חזרה לשלומיוורס"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  </header>
  <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="חיפוש בכיתוב או בשם דמות" autocomplete="off"></label>
  <div class="chips" id="chips">
    <button class="chip on" data-sort="l"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>הכי אהובים</button>
    <button class="chip" data-sort="d"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>הכי חדשים</button>
    <button class="chip" data-sort="c"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.1A8 8 0 1 1 20 12z"/></svg>הכי מדוברים</button>
    <button class="chip" data-sort="o"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16"/></svg>הכי ישנים</button>
    <button class="chip" data-filter="out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16l-6 7.5V19l-4 1.5v-8z"/></svg>עוד לא בשלומיוורס</button>
    <button class="chip" data-filter="mine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.7 2.7L16 9.8"/></svg>מה שסימנתי</button>
  </div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"><div class="loading">טוען את הארכיון…</div></div>
</div>
<div class="bar" id="bar"><div><b id="barN"></b><small>נשמר ונשלח לשלומיוורס</small></div><button class="btn" id="barBtn">הצג את הסימונים</button></div>
<div class="toast" id="toast"></div>
<script>
(() => {
  const LIST = 'https://storage.googleapis.com/shlomiverse-media/insta/list.json';
  const COVER = (id) => 'https://storage.googleapis.com/shlomiverse-media/insta/t/' + id + '.jpg';
  const VERSE = 'https://europe-west1-boostmind-b052c.cloudfunctions.net/verse';
  const IG = (p) => 'https://www.instagram.com/reel/' + p + '/';
  const $ = (s) => document.querySelector(s);
  const HEART = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8-5-8-11.2A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 2.8C20 16 12 21 12 21z"/></svg>';
  const BUBBLE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.1A8 8 0 1 1 20 12z"/></svg>';
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 12.5 4 4L18 8"/></svg>';
  const k = (n) => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1).replace('.0', '') + 'K' : String(n);
  const date = (d) => { const [y, m, dd] = d.split('-'); return +dd + '.' + +m + '.' + y; };
  let items = [], sort = 'l', filter = null, q = '';
  const mine = new Set(), counts = {}, done = {};
  let account = null;

  const toast = (t) => { const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => e.classList.remove('show'), 2600); };
  async function call(op, data) {
    const r = await fetch(VERSE, { method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + account.token }, body: JSON.stringify({ data: { op, ...data } }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || j.error) throw Object.assign(new Error('call'), { code: ((j.error && j.error.message) || 'other').trim() });
    return j.result;
  }
  async function signIn(ask) {
    if (account) return account;
    if (!window.SiteSignIn) return null;
    try { await SiteSignIn.ready; } catch (e) { return null; }
    if (!ask && !SiteSignIn.user()) return null;
    account = await SiteSignIn.ensure('archive');
    return account;
  }
  async function loadWishes() {
    if (!(await signIn(false))) return;
    try {
      const r = await call('wishes', {});
      (r.mine || []).forEach((id) => mine.add(id));
      Object.assign(counts, r.counts || {}); Object.assign(done, r.done || {});
      render();
    } catch (e) {}
  }

  function shown() {
    let L = items;
    if (filter === 'out') L = L.filter((x) => !x.v && !done[x.id]);
    if (filter === 'mine') L = L.filter((x) => mine.has(x.id));
    if (q) { const w = q.toLowerCase(); L = L.filter((x) => (x.cap + ' ' + (x.who || []).join(' ')).toLowerCase().includes(w)); }
    const by = { l: (a, b) => b.l - a.l, c: (a, b) => b.c - a.c, d: (a, b) => b.d.localeCompare(a.d), o: (a, b) => a.d.localeCompare(b.d) }[sort];
    return L.slice().sort(by);
  }
  function tile(x) {
    const vid = x.v || done[x.id];
    const n = counts[x.id] || 0;
    const top = vid ? `<span class="badge">${(x.who && x.who.length ? x.who.join(' · ') : 'בשלומיוורס')}</span>`
      : `<button class="mark${mine.has(x.id) ? ' on' : ''}" data-id="${x.id}" aria-label="סמנו להבאה לשלומיוורס">${CHECK}</button>${n ? `<span class="asked">${n} ביקשו</span>` : ''}`;
    return `<div class="tile${vid ? ' in' : ''}" data-id="${x.id}">` +
      (x.t ? `<img loading="lazy" decoding="async" src="${COVER(x.id)}" alt="">` : '') +
      `<div class="shade"></div>${top}<div class="meta"><div class="nums"><span>${HEART}${k(x.l)}</span><span>${BUBBLE}${k(x.c)}</span></div><div class="date">${date(x.d)}</div></div></div>`;
  }
  function render() {
    const L = shown();
    $('#count').textContent = L.length === items.length ? `${items.length.toLocaleString('he')} פוסטים` : `${L.length.toLocaleString('he')} מתוך ${items.length.toLocaleString('he')}`;
    $('#grid').innerHTML = L.length ? L.map(tile).join('') : `<div class="empty">${filter === 'mine' ? 'עוד לא סימנת סרטונים.' : 'לא נמצא כלום.'}</div>`;
    const m = mine.size;
    $('#barN').textContent = m === 1 ? 'סימנת סרטון אחד' : `סימנת ${m} סרטונים`;
    $('#barBtn').textContent = filter === 'mine' ? 'חזרה לכולם' : 'הצג את הסימונים';
    $('#bar').classList.toggle('show', m > 0);
  }

  $('#grid').addEventListener('click', async (e) => {
    const b = e.target.closest('.mark');
    const t = e.target.closest('.tile');
    if (!t) return;
    const x = items.find((i) => i.id === t.dataset.id);
    if (!b) {   // the cover opens the post (or its page in the verse)
      const vid = x.v || done[x.id];
      window.open(vid ? '/v/' + vid : IG(x.p), '_blank', 'noopener');
      return;
    }
    if (!(await signIn(true))) return;
    const on = !mine.has(x.id);
    on ? mine.add(x.id) : mine.delete(x.id); render();
    try {
      const r = await call('wish', { ig: x.id, on, permalink: IG(x.p) });
      if (r.done) { mine.delete(x.id); done[x.id] = r.videoId; toast('הסרטון הזה כבר בשלומיוורס'); }
      else { counts[x.id] = r.n; r.mine ? mine.add(x.id) : mine.delete(x.id); }
      render();
    } catch (err) {
      on ? mine.delete(x.id) : mine.add(x.id); render();
      toast(err.code === 'closed' ? 'הסימון ייפתח לכולם בקרוב' : err.code === 'slow_down' ? 'רגע, לאט. נסו שוב עוד דקה.' : 'משהו השתבש. נסו שוב.');
    }
  });
  $('#chips').addEventListener('click', (e) => {
    const c = e.target.closest('.chip'); if (!c) return;
    if (c.dataset.sort) { sort = c.dataset.sort; document.querySelectorAll('[data-sort]').forEach((x) => x.classList.toggle('on', x === c)); }
    else { filter = filter === c.dataset.filter ? null : c.dataset.filter; document.querySelectorAll('[data-filter]').forEach((x) => x.classList.toggle('on', x.dataset.filter === filter)); }
    render(); window.scrollTo({ top: 0 });
  });
  $('#barBtn').addEventListener('click', () => { filter = filter === 'mine' ? null : 'mine'; document.querySelectorAll('[data-filter]').forEach((x) => x.classList.toggle('on', x.dataset.filter === filter)); render(); window.scrollTo({ top: 0 }); });
  let qt; $('#q').addEventListener('input', (e) => { clearTimeout(qt); qt = setTimeout(() => { q = e.target.value.trim(); render(); }, 150); });

  fetch(LIST, { cache: 'no-cache' }).then((r) => r.json()).then((d) => {
    items = d.items;
    $('#sub').textContent = `${d.n.toLocaleString('he')} סרטונים מהאינסטגרם · סמנו מה להביא לשלומיוורס`;
    render();
    loadWishes();
  }).catch(() => { $('#grid').innerHTML = '<div class="empty">הארכיון לא נטען. רעננו את הדף.</div>'; });
})();
</script>
</body>
</html>
