<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>מיני כדורגל ⚽</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{height:100%;overflow:hidden;background:#0a0e1a;font-family:'Heebo',sans-serif;color:#fff;overscroll-behavior:none;touch-action:none}
  #game{display:block;position:fixed;inset:0;width:100%;height:100%}
  .hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:center;gap:10px;align-items:center;padding:10px;pointer-events:none;z-index:5}
  .hud .pill{background:rgba(10,14,26,.66);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:7px 14px;font-weight:900;font-size:1rem;backdrop-filter:blur(4px)}
  .hud .sc b{font-size:1.35rem}
  .hud .you b{color:#4d8dff} .hud .opp b{color:#ff5470}
  .hud .time b{color:#2ee6a0;font-size:1.25rem}

  .overlay{position:fixed;inset:0;z-index:10;background:rgba(6,9,18,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px;gap:8px;backdrop-filter:blur(3px)}
  .overlay.hidden{display:none}
  .overlay h1{font-size:2rem;font-weight:900}
  .overlay p{color:#a7b0c9;font-size:1rem;line-height:1.6;max-width:340px;margin:2px 0 8px}
  .overlay .big{font-size:2.8rem;font-weight:900;color:#ffd23f;line-height:1}
  .btn{background:#ffd23f;color:#0a0e1a;border:none;border-radius:16px;font-family:inherit;font-weight:900;font-size:1.3rem;padding:16px 40px;cursor:pointer;box-shadow:0 6px 0 #b8942a;margin-top:8px}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b8942a}
  .hint{display:flex;gap:20px;margin-top:6px;color:#cdd4e6;font-size:.9rem;font-weight:700}
  .hint div{display:flex;flex-direction:column;align-items:center;gap:4px}
  .hint .k{font-size:1.8rem}
  .backlink{position:fixed;top:10px;right:12px;font-size:.75rem;color:#9aa3bd;z-index:5;text-decoration:none;background:rgba(10,14,26,.6);padding:4px 10px;border-radius:8px;pointer-events:auto}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
  <div class="pill sc you">אתה <b id="youScore">0</b></div>
  <div class="pill time">⏱️ <b id="time">60</b></div>
  <div class="pill sc opp">יריב <b id="oppScore">0</b></div>
</div>

<div class="overlay" id="startOv">
  <h1>⚽ מיני כדורגל</h1>
  <p>אתה 🔵 נגד היריבה 🔴. הבקע בשער העליון 🥅 והגן על התחתון!<br>מזיזים עם הג'ויסטיק, בועטים עם הכפתור. מי ינצח ב-60 שניות?</p>
  <div class="hint"><div><span class="k">🕹️</span>תזוזה</div><div><span class="k">👟</span>בעיטה</div><div><span class="k">🥅</span>גול!</div></div>
  <button class="btn" id="startBtn">שחק ▶</button>
</div>

<div class="overlay hidden" id="endOv">
  <h1 id="endTitle">נגמר הזמן!</h1>
  <div class="big" id="endScore">0 : 0</div>
  <p id="endMsg"></p>
  <button class="btn" id="againBtn">שחק שוב 🔁</button>
</div>

<a class="backlink" id="backlink" href="./">‹ חזרה</a>

<script>
(function(){ const g=new URLSearchParams(location.search).get('g'); document.getElementById('backlink').href = g ? ('play.html?g='+encodeURIComponent(g)) : './'; })();
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0,dpr=1;
function resize(){ dpr=Math.min(2,window.devicePixelRatio||1); W=window.innerWidth; H=window.innerHeight; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); layout(); }
window.addEventListener('resize',resize);

/* ---- geometry ---- */
let goalY, goalYbot, goalL, goalR, kTopY, kBotY;
function layout(){ goalY=Math.max(46,H*0.075); goalYbot=H-goalY; goalL=W*0.30; goalR=W*0.70; kTopY=goalY+Math.min(30,H*0.035); kBotY=goalYbot-Math.min(30,H*0.035); }
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

/* ---- entities ---- */
const player={x:0,y:0,r:15,face:{x:0,y:-1}};
const ball={x:0,y:0,vx:0,vy:0,r:9};
const kTop={x:0,y:0,r:16};   // opponent keeper (red), defends top goal
const kBot={x:0,y:0,r:16};   // your keeper (blue), defends bottom goal
let opps=[{x:0,y:0,r:14,face:{x:0,y:1}},{x:0,y:0,r:14,face:{x:0,y:1}}];
let youScore=0, oppScore=0, running=false, tEnd=0, lastKick=0, kickBy=null, goalFlash=0, flashText='', flashCol='#ffd23f';
let parts=[];
let best=localStorage.getItem('football-best')||'';

function kickoff(dir){ // dir: -1 ball drifts to you (bottom), +1 to opp (top), 0 neutral
  player.x=W/2; player.y=H*0.70; player.face={x:0,y:-1};
  ball.x=W/2; ball.y=H/2; ball.vx=0; ball.vy=0;
  opps[0].x=W*0.38; opps[0].y=H*0.40; opps[1].x=W*0.62; opps[1].y=H*0.44;
  kTop.x=W/2; kTop.y=kTopY; kBot.x=W/2; kBot.y=kBotY;
  lastKick=0; kickBy=null;
}
function startGame(){ youScore=oppScore=0; $('youScore').textContent=0; $('oppScore').textContent=0; running=true; tEnd=performance.now()+60000; kickoff(0); $('startOv').classList.add('hidden'); $('endOv').classList.add('hidden'); }
function endGame(){ running=false;
  $('endScore').textContent=youScore+' : '+oppScore;
  $('endTitle').textContent = youScore>oppScore?'ניצחת! 🏆':youScore<oppScore?'הפסדת 😅':'תיקו 🤝';
  $('endMsg').textContent = youScore>oppScore?'כל הכבוד אלוף!':youScore<oppScore?'עוד ניסיון?':'צמוד! עוד סיבוב?';
  $('endOv').classList.remove('hidden');
}
$('startBtn').onclick=startGame; $('againBtn').onclick=startGame;

/* ---- input ---- */
let joy={active:false,id:null,ox:0,oy:0,dx:0,dy:0};
const JMAX=52;
function kickBtnPos(){ return {x:W-72,y:H-96,r:46}; }
const inLeft=x=>x<W*0.5;
function tryKick(){ const d=dist(player,ball); if(d<player.r+ball.r+16){ const f=player.face; ball.vx=f.x*11; ball.vy=f.y*11; lastKick=performance.now(); kickBy='you'; } }
function onStart(id,x,y){ const kb=kickBtnPos();
  if(Math.hypot(x-kb.x,y-kb.y)<kb.r || !inLeft(x)){ tryKick(); return true; }
  if(inLeft(x) && !joy.active){ joy.active=true; joy.id=id; joy.ox=x; joy.oy=y; joy.dx=joy.dy=0; return true; }
  return false;
}
function onMove(id,x,y){ if(joy.active&&joy.id===id){ let dx=x-joy.ox,dy=y-joy.oy; const m=Math.hypot(dx,dy); if(m>JMAX){dx=dx/m*JMAX;dy=dy/m*JMAX;} joy.dx=dx; joy.dy=dy; } }
function onEnd(id){ if(joy.active&&joy.id===id){ joy.active=false; joy.id=null; joy.dx=joy.dy=0; } }
cv.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.changedTouches){const r=cv.getBoundingClientRect();onStart(t.identifier,t.clientX-r.left,t.clientY-r.top);}},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){const r=cv.getBoundingClientRect();onMove(t.identifier,t.clientX-r.left,t.clientY-r.top);}},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();for(const t of e.changedTouches)onEnd(t.identifier);},{passive:false});
cv.addEventListener('touchcancel',e=>{for(const t of e.changedTouches)onEnd(t.identifier);});
let mdown=false;
cv.addEventListener('mousedown',e=>{const r=cv.getBoundingClientRect();mdown=true;onStart('m',e.clientX-r.left,e.clientY-r.top);});
cv.addEventListener('mousemove',e=>{if(mdown){const r=cv.getBoundingClientRect();onMove('m',e.clientX-r.left,e.clientY-r.top);}});
window.addEventListener('mouseup',()=>{mdown=false;onEnd('m');});
const keys={};
window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){e.preventDefault();tryKick();}});
window.addEventListener('keyup',e=>{keys[e.key]=false;});

/* ---- helpers ---- */
function norm(x,y){ const m=Math.hypot(x,y)||1; return {x:x/m,y:y/m}; }
function moveTo(e,tx,ty,sp){ const d=norm(tx-e.x,ty-e.y); e.x+=d.x*sp; e.y+=d.y*sp; e.x=Math.max(e.r,Math.min(W-e.r,e.x)); e.y=Math.max(e.r,Math.min(H-e.r,e.y)); return d; }

/* ---- update ---- */
function step(){
  const now=performance.now();
  // player movement
  let ix=0,iy=0;
  if(joy.active){ ix=joy.dx/JMAX; iy=joy.dy/JMAX; }
  if(keys['ArrowLeft']||keys['a'])ix=-1; if(keys['ArrowRight']||keys['d'])ix=1;
  if(keys['ArrowUp']||keys['w'])iy=-1; if(keys['ArrowDown']||keys['s'])iy=1;
  const im=Math.hypot(ix,iy); const SP=4.3;
  player.x=Math.max(player.r,Math.min(W-player.r,player.x+ix*SP));
  player.y=Math.max(player.r,Math.min(H-player.r,player.y+iy*SP));
  if(im>0.25) player.face={x:ix/im,y:iy/im};

  // possession: player has priority when close; else nearest opponent
  const cool = now-lastKick < 320;
  const CTRLp=player.r+ball.r+18, CTRLo=opps[0].r+ball.r+15;
  let owner=null;
  if(!cool && dist(player,ball)<CTRLp) owner=player;
  else if(!cool){ let od=1e9; for(const o of opps){ const d=dist(o,ball); if(d<CTRLo && d<od){od=d;owner=o;} } }

  // opponent roles: nearest to ball chases, other supports (prevents stacking)
  let chaser=opps[0]; if(dist(opps[1],ball)<dist(opps[0],ball)) chaser=opps[1];

  if(owner===player){
    const tx=player.x+player.face.x*(player.r+ball.r+2), ty=player.y+player.face.y*(player.r+ball.r+2);
    ball.x+=(tx-ball.x)*0.4; ball.y+=(ty-ball.y)*0.4; ball.vx=ix*SP; ball.vy=iy*SP;
  }

  for(let i=0;i<opps.length;i++){
    const o=opps[i];
    if(owner===o){
      // dribble toward YOUR goal (bottom) and shoot when close
      const gx=W/2, gy=goalYbot;
      const d=moveTo(o, gx, gy, 3.4); o.face=d;
      ball.x=o.x+d.x*(o.r+ball.r+1); ball.y=o.y+d.y*(o.r+ball.r+1); ball.vx=d.x*3.4; ball.vy=d.y*3.4;
      if(dist(o,{x:gx,y:gy})<H*0.30){ ball.vx=d.x*10; ball.vy=d.y*10; lastKick=now; kickBy='opp'; }
    } else if(o===chaser){
      moveTo(o, ball.x, ball.y, 3.4);
    } else {
      // support: spread toward bottom goal, offset from ball so they don't collapse
      const off = (i%2===0? -1:1) * Math.max(70, W*0.22);
      moveTo(o, ball.x+off, (ball.y+goalYbot)/2, 3.0);
    }
  }

  // loose ball physics
  if(!owner){ ball.vx*=0.985; ball.vy*=0.985; ball.x+=ball.vx; ball.y+=ball.vy; }
  if(ball.x<ball.r){ball.x=ball.r;ball.vx*=-0.6;} if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx*=-0.6;}

  // keepers track ball x
  kTop.x+=(Math.max(goalL+kTop.r,Math.min(goalR-kTop.r,ball.x))-kTop.x)*0.11;
  kBot.x+=(Math.max(goalL+kBot.r,Math.min(goalR-kBot.r,ball.x))-kBot.x)*0.11;
  // top keeper save (ball going up)
  if(ball.vy<0 && ball.y<kTopY+kTop.r && ball.y>goalY-6 && Math.abs(ball.x-kTop.x)<kTop.r+ball.r){ ball.vy=Math.abs(ball.vy)*0.6+3; ball.vx+=(ball.x-kTop.x)*0.25; lastKick=now; kickBy=null; }
  // bottom keeper save (ball going down)
  if(ball.vy>0 && ball.y>kBotY-kBot.r && ball.y<goalYbot+6 && Math.abs(ball.x-kBot.x)<kBot.r+ball.r){ ball.vy=-(Math.abs(ball.vy)*0.6+3); ball.vx+=(ball.x-kBot.x)*0.25; lastKick=now; kickBy=null; }

  // goals / walls (top & bottom)
  if(ball.y<goalY){ if(ball.x>goalL&&ball.x<goalR){ scoreGoal('you'); } else { ball.y=goalY; ball.vy=Math.abs(ball.vy)*0.6+1; } }
  if(ball.y>goalYbot){ if(ball.x>goalL&&ball.x<goalR){ scoreGoal('opp'); } else { ball.y=goalYbot; ball.vy=-(Math.abs(ball.vy)*0.6+1); } }

  if(goalFlash>0) goalFlash--;
  for(const p of parts){ p.vy+=0.3; p.x+=p.vx; p.y+=p.vy; p.life--; }
  parts=parts.filter(p=>p.life>0);

  if(now>=tEnd){ $('time').textContent='0'; endGame(); } else $('time').textContent=Math.ceil((tEnd-now)/1000);
}
function scoreGoal(who){
  if(who==='you'){ youScore++; $('youScore').textContent=youScore; flashText='GOAL! ⚽'; flashCol='#4d8dff'; }
  else { oppScore++; $('oppScore').textContent=oppScore; flashText='ספגת… 😬'; flashCol='#ff5470'; }
  goalFlash=42;
  const cx=who==='you'?W/2:W/2, cy=who==='you'?goalY+20:goalYbot-20;
  for(let i=0;i<60;i++) parts.push({x:cx,y:cy,vx:(Math.random()-0.5)*10,vy:Math.random()*-8-1,life:45+Math.random()*25,c:['#ffd23f','#2ee6a0','#4d8dff','#ff5470','#fff'][i%5]});
  kickoff(0);
}

/* ---- draw ---- */
function draw(){
  ctx.fillStyle='#1f7a3f'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.05)';
  for(let i=0;i<Math.ceil(H/60);i++){ if(i%2===0) ctx.fillRect(0,i*60,W,60); }
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=2; ctx.strokeRect(6,6,W-12,H-12);
  ctx.beginPath(); ctx.moveTo(6,H/2); ctx.lineTo(W-6,H/2); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2,H/2,44,0,7); ctx.stroke();
  // goals
  ctx.strokeRect(W*0.18,6,W*0.64,goalY+30-6);
  ctx.strokeRect(W*0.18,goalYbot-30,W*0.64,H-6-(goalYbot-30));
  ctx.lineWidth=6; ctx.strokeStyle='#fff';
  ctx.beginPath(); ctx.moveTo(goalL,goalY); ctx.lineTo(goalR,goalY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(goalL,goalYbot); ctx.lineTo(goalR,goalYbot); ctx.stroke();

  drawGuy(kTop.x,kTop.y,kTop.r,'#ff5470','#fff','🧤');
  drawGuy(kBot.x,kBot.y,kBot.r,'#4d8dff','#fff','🧤');
  for(const o of opps) drawGuy(o.x,o.y,o.r,'#ff5470','#fff');
  drawGuy(player.x,player.y,player.r,'#4d8dff','#fff');
  // ball
  ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,7); ctx.fillStyle='#fff'; ctx.fill(); ctx.lineWidth=1.5; ctx.strokeStyle='#333'; ctx.stroke();
  ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r*0.4,0,7); ctx.fill();
  for(const p of parts){ ctx.fillStyle=p.c; ctx.fillRect(p.x,p.y,5,5); }
  if(goalFlash>0){ ctx.fillStyle=hexA(flashCol,goalFlash/60); ctx.font='900 '+Math.min(60,W*0.15)+'px Heebo'; ctx.textAlign='center'; ctx.fillText(flashText,W/2,H*0.46); }
  drawJoystick(); drawKick();
}
function hexA(hex,a){ const n=parseInt(hex.slice(1),16); return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')'; }
function drawGuy(x,y,r,fill,stroke,emoji){
  ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fillStyle=fill; ctx.fill(); ctx.lineWidth=2.5; ctx.strokeStyle=stroke; ctx.stroke();
  if(emoji){ ctx.font=(r*1.1)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(emoji,x,y+1); ctx.textBaseline='alphabetic'; }
}
function drawJoystick(){ const ox=joy.active?joy.ox:82,oy=joy.active?joy.oy:H-96;
  ctx.beginPath(); ctx.arc(ox,oy,JMAX,0,7); ctx.fillStyle='rgba(255,255,255,.10)'; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle='rgba(255,255,255,.30)'; ctx.stroke();
  ctx.beginPath(); ctx.arc(ox+joy.dx,oy+joy.dy,26,0,7); ctx.fillStyle='rgba(255,255,255,.55)'; ctx.fill(); }
function drawKick(){ const kb=kickBtnPos();
  ctx.beginPath(); ctx.arc(kb.x,kb.y,kb.r,0,7); ctx.fillStyle='rgba(255,210,63,.85)'; ctx.fill();
  ctx.fillStyle='#0a0e1a'; ctx.font='900 '+kb.r*0.5+'px Heebo'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('בעט',kb.x,kb.y+2); ctx.textBaseline='alphabetic';
  ctx.font=kb.r*0.7+'px serif'; ctx.fillText('👟',kb.x,kb.y-kb.r*0.55); }

function frame(){ if(running) step(); draw(); requestAnimationFrame(frame); }
resize(); kickoff(0); frame();
</script>
</body>
</html>
