<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1d4f9c">
<title>שקל טוב – המשחקייה של חני</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<script src="/t.js" data-site="hani-games" defer></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<style>
:root{
  --ink:#16305e; --card:#fffaf0; --gold:#ffc94a; --gold2:#ff9f1c; --blue:#1d5fbf; --blue2:#0f3f8a; --green:#2bb673; --red:#e5484d;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#9fd4f5;font-family:Rubik,system-ui,sans-serif;color:var(--ink);touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
#ui button,#ui a,#ui .screen,#ui #tutCard{pointer-events:auto}
button{font-family:inherit;border:0;cursor:pointer}

/* HUD */
#hud{position:absolute;top:calc(var(--safe-t) + 6px);left:8px;right:8px;max-width:600px;margin:0 auto;display:none;flex-direction:column;gap:6px;pointer-events:none}
#hud.on{display:flex}
.hrow{display:flex;align-items:center;gap:8px}
#lives{display:flex;gap:3px;min-width:96px}
#lives svg{width:30px;height:30px;filter:drop-shadow(0 2px 2px #0005);transition:transform .3s,opacity .3s}
#lives svg.gone{opacity:.25;transform:scale(.65);filter:grayscale(1)}
#lives svg.hit{animation:hit .5s}
@keyframes hit{30%{transform:scale(1.4)}}
#total{flex:1;text-align:center;font-weight:900;font-size:30px;color:#fff;direction:ltr;text-shadow:0 2px 0 var(--ink),0 0 10px #0006;line-height:1}
#total.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.15)}}
.ibtn{width:42px;height:42px;border-radius:14px;background:#16305e8c;display:grid;place-items:center;flex:none}
.ibtn svg{width:24px;height:24px;fill:#fff}
#round{font-size:14px;font-weight:900;color:#fff;background:var(--blue);border-radius:12px;padding:5px 9px;white-space:nowrap;box-shadow:0 2px 0 var(--blue2)}
#goal{flex:1;height:26px;border-radius:13px;background:#16305e99;border:2px solid #fff;overflow:hidden;position:relative}
#goalFill{position:absolute;inset:0 0 0 auto;width:0;background:linear-gradient(270deg,#ffe08a,var(--gold),var(--gold2));transition:width .25s}
#goal span{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:14px;color:#fff;text-shadow:0 1px 2px #000c;direction:rtl}
#timer{display:flex;align-items:center;gap:4px;font-weight:900;font-size:17px;color:#fff;background:#16305e99;border-radius:12px;padding:3px 8px;direction:ltr;min-width:66px;justify-content:center}
#timer svg{width:18px;height:18px}
#timer.low{background:var(--red);animation:bump .5s infinite}

/* Hani's own strip at the bottom: she talks here, never over the play area */
#strip{position:absolute;left:0;right:0;bottom:0;height:calc(var(--strip) + var(--safe-b));padding-bottom:var(--safe-b);display:none;align-items:stretch;background:linear-gradient(#fffaf0f2,#fff3dcf7);border-top:3px solid var(--blue);box-shadow:0 -4px 14px #0003;pointer-events:none}
#strip.on{display:flex}
#haniBox{height:100%;width:calc(var(--strip) * 1.25);flex:none;overflow:hidden;position:relative}
/* head and shoulders: the painted pose is cropped so her face fills the strip */
#hani{position:absolute;height:calc(var(--strip) * 2.1);width:auto;max-width:none;top:calc(var(--strip) * -0.36);left:calc(50% - var(--strip) * 0.84);transform-origin:50% 40%}
/* arms up (joy): she rises out of the strip so the raised hands show, cut only at the bottom */
#haniBox.up{overflow:visible;clip-path:inset(-300% -80% 0 -80%);z-index:3}
#haniBox.up #hani{left:calc(50% - var(--strip) * 0.97);translate:calc(var(--strip) * -0.34) 0;scale:.88;transform-origin:50% 100%}
#hani.pop{animation:hpop .3s}
@keyframes hpop{40%{transform:scale(1.06) translateY(-2px)}}
#hani.shake{animation:hshake .35s}
@keyframes hshake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
#sayWrap{flex:1;display:flex;align-items:center;padding:8px 10px 8px 12px;min-width:0}
#strip.up #sayWrap{padding-right:calc(var(--strip) * .62)}
#say{position:relative;z-index:4;background:#fff;border:2px solid #d9e4f5;border-radius:16px;padding:8px 12px;font-size:16px;font-weight:700;line-height:1.3;color:var(--ink);opacity:0;transition:opacity .2s;max-width:100%}
#say.on{opacity:1}
#say:before{content:"";position:absolute;right:-9px;top:50%;margin-top:-8px;border:8px solid transparent;border-right:0;border-left-color:#d9e4f5}
#nameTag{position:absolute;bottom:calc(var(--safe-b) + 4px);right:4px;font-size:11px;font-weight:900;color:#fff;background:var(--blue);padding:1px 7px;border-radius:8px}

/* floating feedback */
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.float{position:absolute;font-weight:900;font-size:22px;color:#fff3b0;text-shadow:0 2px 0 var(--ink),0 0 6px #0008;pointer-events:none;animation:up 1s ease-out forwards;transform:translate(-50%,-50%);white-space:nowrap;direction:ltr}
.float.bad{color:#ffb3b3;direction:rtl}
@keyframes up{to{margin-top:-60px;opacity:0}}
.spark{position:absolute;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:#fff3b0;pointer-events:none;box-shadow:0 0 8px #ffd76a}
.lbl{position:absolute;transform:translate(-50%,0);font-size:13px;font-weight:900;color:#fff;background:#16305ee0;padding:2px 8px;border-radius:10px;white-space:nowrap;direction:rtl}
.nin{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:min(13vw,64px);font-weight:900;white-space:nowrap;color:#ffe27a;text-align:center;line-height:1;
  text-shadow:0 3px 0 #a86a00,0 6px 0 #5a3a00,0 0 30px #ffd76a;pointer-events:none;z-index:7;animation:nin 1.9s ease-out forwards}
.nin small{display:block;font-size:.42em;color:#fff;text-shadow:0 2px 0 var(--ink);margin-top:6px}
.nin.full{color:#fff;text-shadow:0 3px 0 var(--blue),0 6px 0 var(--blue2),0 0 30px #9fd0ff}
.nin.full small{color:#ffe27a}
@keyframes nin{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}15%{transform:translate(-50%,-50%) scale(1.12) rotate(2deg);opacity:1}25%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}
#flash{position:absolute;inset:0;background:#ff5a5a;opacity:0;pointer-events:none;transition:opacity .3s}

/* screens: one layer at a time */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 16px);background:linear-gradient(#16305e00,#16305ebb 40%,#16305eee)}
.screen.on{display:flex}
.titleArt{width:min(86vw,440px);max-height:26vh;object-fit:contain;filter:drop-shadow(0 6px 10px #0008)}
.titleText{display:none;font-size:min(17vw,84px);font-weight:900;color:#ffe27a;line-height:1;text-shadow:0 4px 0 #a86a00,0 8px 0 #5a3a00,0 0 24px #ffd76a88;margin:0}
.titleArt.missing{display:none}
.titleArt.missing + .titleText{display:block}
.sub{color:#fff;font-size:16px;font-weight:700;text-align:center;max-width:330px;line-height:1.35;margin:0;text-shadow:0 1px 3px #0008}
.head{width:min(44vw,200px);aspect-ratio:.8;object-fit:cover;object-position:50% 0;filter:drop-shadow(0 6px 10px #0008)}
.big{min-width:220px;padding:16px 28px;border-radius:30px;font-size:24px;font-weight:900;color:#fff;background:linear-gradient(#3d86f0,var(--blue));box-shadow:0 5px 0 var(--blue2)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--blue2)}
.mid{min-width:200px;padding:12px 22px;border-radius:24px;font-size:18px;font-weight:700;color:var(--ink);background:#fff;box-shadow:0 4px 0 #b4c3dc;text-decoration:none;display:inline-block;text-align:center}
.best{color:#fff;font-size:17px;font-weight:700}
.best b{color:var(--gold);direction:ltr;display:inline-block}
.over-h{font-size:30px;font-weight:900;color:#fff;margin:0;text-align:center}
.over-line{background:var(--card);border-radius:18px;padding:10px 16px;font-weight:700;max-width:340px;text-align:center}
.over-score{font-size:56px;font-weight:900;color:var(--gold);text-shadow:0 3px 0 var(--ink);line-height:1;direction:ltr}
.newrec{font-size:22px;font-weight:900;color:#fff;background:var(--green);padding:4px 14px;border-radius:14px;animation:bump .8s infinite;display:inline-block}

/* tutorial */
#tutDim{position:absolute;inset:0;display:none;pointer-events:none}
#tutDim.on{display:block}
#tutHole{position:absolute;border-radius:24px;box-shadow:0 0 0 200vmax #0d1d3ab3;border:3px solid var(--gold);transition:all .3s;pointer-events:none}
#tutCard{position:absolute;left:10px;right:10px;display:none;background:var(--card);border-radius:20px;padding:12px 14px 10px;box-shadow:0 8px 24px #0009;max-width:460px;margin:0 auto;border:3px solid var(--blue)}
#tutCard.on{display:block}
#tutText{font-size:17px;font-weight:700;line-height:1.35;min-height:46px}
#tutText .ok{color:var(--green)}
#tutBar{height:6px;background:#dde6f3;border-radius:3px;margin:9px 0 7px;overflow:hidden}
#tutBar i{display:block;height:100%;background:var(--blue);width:0;transition:width .3s}
#tutRow{display:flex;align-items:center;gap:10px}
#tutCount{flex:1;font-size:14px;color:#6a7899;font-weight:700}
#tutSkip{background:none;color:#6a7899;font-size:15px;font-weight:700;padding:8px}
#tutNext{padding:10px 26px;border-radius:20px;font-size:18px;font-weight:900;color:#fff;background:var(--blue)}
#tutNext:disabled{background:#c3cddd}
.keyhint{font-size:12px;color:#9aa6bd;font-weight:500}
@media (hover:none){.keyhint{display:none}}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:#fff;font-size:20px;font-weight:700;background:#1d4f9c;z-index:9}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="fx"><div id="flash"></div></div>
  <div id="hud">
    <div class="hrow">
      <div id="lives"></div>
      <div id="total">₪0.00</div>
      <button class="ibtn" id="pauseBtn" aria-label="הפסקה"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
      <button class="ibtn sndBtn" aria-label="צליל"></button>
    </div>
    <div class="hrow">
      <div id="round">סיבוב 1</div>
      <div id="goal"><div id="goalFill"></div><span id="goalTxt"></span></div>
      <div id="timer"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M12 9v4.5l3 2" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><rect x="9.5" y="2" width="5" height="2.6" rx="1" fill="#fff"/></svg><span id="timeTxt">0:30</span></div>
    </div>
  </div>

  <div id="strip">
    <div id="haniBox"><img id="hani" src="assets/pose-calm.png" alt="חני"></div>
    <div id="sayWrap"><div id="say"></div></div>
  </div>

  <div class="screen on" id="start">
    <img class="titleArt" id="titleImg" src="assets/title.png" alt="שקל טוב" onerror="this.classList.add('missing')">
    <p class="titleText">שקל טוב</p>
    <p class="sub">מוסדות ״שקל טוב״ אוספים צדקה! תפסו את המטבעות שהשכנים זורקים מהמרפסות.</p>
    <img class="head" src="assets/pose-joy.png" alt="">
    <button class="big" id="playBtn">שחקו</button>
    <button class="mid" id="howBtn">איך משחקים</button>
    <div class="best" id="bestStart"></div>
    <div style="display:flex;gap:10px;align-items:center">
      <a class="mid" href="../">לכל המשחקים</a>
      <button class="ibtn sndBtn" aria-label="צליל"></button>
    </div>
  </div>

  <div class="screen" id="over">
    <p class="over-h" id="overH">הקופה נאספה!</p>
    <img class="head" src="assets/pose-talk.png" alt="" style="width:min(32vw,150px)">
    <div class="over-line" id="overLine"></div>
    <div class="over-score" id="overScore">₪0.00</div>
    <div id="overRec"></div>
    <div class="best" id="bestOver"></div>
    <button class="big" id="againBtn">עוד סיבוב</button>
    <a class="mid" href="../">לכל המשחקים</a>
  </div>

  <div class="screen" id="paused">
    <p class="over-h">הפסקה קטנה</p>
    <div class="over-line">״רגע, אני רק סופרת את הקופה.״</div>
    <button class="big" id="resumeBtn">ממשיכים</button>
    <button class="mid" id="quitBtn">יציאה לתפריט</button>
  </div>

  <div id="tutDim"><div id="tutHole"></div></div>
  <div id="tutCard">
    <div id="tutText"></div>
    <div id="tutBar"><i></i></div>
    <div id="tutRow">
      <span id="tutCount"></span>
      <button id="tutSkip">דלגו <span class="keyhint">(Esc)</span></button>
      <button id="tutNext">הבא <span class="keyhint">(רווח)</span></button>
    </div>
  </div>
</div>
<div id="loading">רגע, טוען... בסייעתא דשמיא</div>
<script type="module" src="game.js"></script>
</body>
</html>
