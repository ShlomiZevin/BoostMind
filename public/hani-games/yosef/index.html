<style>
:root{
  --ink:#24304a; --paper:#fffdf6; --paper2:#f6efdc; --edge:#e3d6b4; --navy:#24406e; --gold:#f2b632; --gold2:#d9901a; --green:#3aa565; --red:#d9534f;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe3f0;font-family:Rubik,system-ui,sans-serif;color:var(--ink);touch-action:manipulation;overscroll-behavior:none}
body{background:radial-gradient(circle at 50% 0,#e8f2f8,#bcd5e6)}
button{font-family:inherit;border:0;cursor:pointer;color:inherit}
svg{display:block}
[hidden]{display:none!important}

/* the book */
#book{position:fixed;inset:calc(var(--safe-t) + 54px) 8px calc(var(--safe-b) + 76px);display:flex;justify-content:center;align-items:center}
#page{position:relative;width:100%;max-width:560px;max-height:100%;background:var(--paper);border-radius:18px 10px 10px 18px;box-shadow:0 1px 0 var(--edge),0 3px 0 #fff,0 4px 0 var(--edge),0 6px 0 #fff,0 7px 0 var(--edge),0 16px 30px #24406e33;
  display:flex;flex-direction:column;overflow:hidden;transition:transform .35s,opacity .35s}
#page.out{opacity:0;transform:translateX(40px) rotate(1.5deg)}
#page.in{opacity:0;transform:translateX(-40px) rotate(-1.5deg)}
#pic{position:relative;flex:none;aspect-ratio:3/2;background:#eef3f6 center/cover no-repeat;border-bottom:3px solid var(--edge)}
#pic .ph{position:absolute;inset:0;display:grid;place-items:center;color:#9fb0c2;font-weight:700;font-size:15px}
#txt{flex:1;min-height:0;overflow:auto;padding:14px 18px 12px;font-family:'Noto Serif Hebrew',serif;font-weight:500;font-size:clamp(17px,4.6vw,22px);line-height:1.85;text-align:right}
#txt p{margin:0 0 4px}
#txt .aside{font-family:Rubik,sans-serif;font-size:.7em;color:#8a7f66;font-weight:500}
#txt .hl{background:linear-gradient(transparent 60%,#ffe59a 60%)}
#pnum{position:absolute;bottom:6px;left:12px;font-size:13px;color:#a99d80;font-weight:700}
#stamp{position:absolute;top:10px;left:10px;width:64px;height:64px;display:none;transform:rotate(-12deg)}
#stamp.on{display:block;animation:stampIn .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes stampIn{0%{transform:scale(2.4) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(-12deg);opacity:1}}

/* wide screens: a two-page spread - picture on the left page, text on the right */
@media (min-aspect-ratio:5/4) and (min-width:760px){
  #page{max-width:1300px;flex-direction:row-reverse;aspect-ratio:auto;height:auto;max-height:100%}
  /* the picture keeps its 3:2 shape and is always shown whole (no cropping on wide screens) */
  #pic{flex:none;width:min(64%, calc((100vh - var(--safe-t) - var(--safe-b) - 130px) * 1.5));height:auto;aspect-ratio:3/2;background-size:contain;background-color:var(--paper);border-bottom:0;border-right:3px solid var(--edge)}
  #txt{min-width:0}
  #txt{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px 30px;font-size:clamp(20px,1.9vw,27px)}
}

/* top bar */
#top{position:fixed;top:calc(var(--safe-t) + 8px);left:8px;right:8px;display:flex;align-items:center;gap:8px;max-width:1100px;margin:0 auto}
.ibtn{width:42px;height:42px;border-radius:14px;background:#24406ecc;display:grid;place-items:center;flex:none;box-shadow:0 2px 0 #13284a}
.ibtn svg{width:24px;height:24px;fill:#fff}
.ibtn.off{opacity:.55}
#stamps{flex:1;display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
#stamps i{width:16px;height:16px;border-radius:50%;background:#fff9;border:2px solid #24406e55}
#stamps i.done{background:var(--gold);border-color:var(--gold2)}
#stamps i.here{outline:2px solid var(--navy);outline-offset:1px}

/* bottom bar */
#bar{position:fixed;bottom:calc(var(--safe-b) + 10px);left:8px;right:8px;display:flex;align-items:center;justify-content:center;gap:10px}
.nav{width:54px;height:54px;border-radius:50%;background:#fff;box-shadow:0 3px 0 #9fb3c6;display:grid;place-items:center}
.nav svg{width:30px;height:30px;fill:var(--navy)}
.nav:disabled{opacity:.3}
.big{height:58px;padding:0 26px;border-radius:30px;font-size:22px;font-weight:900;color:#fff;background:var(--green);box-shadow:0 4px 0 #23784a;display:flex;align-items:center;gap:10px}
.big svg{width:26px;height:26px;fill:#fff;order:2}
.big.gold{background:var(--gold);color:#4a3000;box-shadow:0 4px 0 var(--gold2)}
.big.gold svg{fill:#4a3000}
.big:active,.nav:active{transform:translateY(2px)}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.big.nudge{animation:nudge 1.1s infinite}
/* after the page's game is won: a quiet "play again", the next-page arrow is the main thing */
.big.again{background:#fff;color:var(--green);box-shadow:0 3px 0 #9fb3c6;font-size:18px;padding:0 18px;height:50px}
.big.again svg{fill:var(--green);width:22px;height:22px}

/* the game panel over the book */
#play{position:fixed;inset:0;background:#18263f;display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--safe-t) + 8px) 8px calc(var(--safe-b) + 8px);z-index:5}
#play.on{display:flex;animation:playIn .45s ease-out}
#play::before{content:"";position:absolute;inset:0;background:var(--pic) center/cover no-repeat;filter:blur(6px) brightness(.45);transform:scale(1.08);z-index:-1}
#play{isolation:isolate}
@keyframes playIn{0%{clip-path:inset(var(--from));opacity:.6}100%{clip-path:inset(0);opacity:1}}
#gc{animation:gcIn .5s ease-out}
@keyframes gcIn{0%{transform:scale(.6);opacity:0}}
#gHead{width:100%;max-width:900px;display:flex;align-items:center;gap:8px;color:#fff;margin-bottom:8px}
#gTitle{flex:1;font-weight:900;font-size:20px;line-height:1.2}
#gTitle small{display:block;font-weight:500;font-size:15px;opacity:.85}
#gWrap{position:relative;width:100%;max-width:900px;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#gc{display:block;background:var(--paper);border-radius:16px;box-shadow:0 10px 30px #0008;touch-action:none}
#gMsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:22px;padding:22px 26px;text-align:center;box-shadow:0 10px 30px #0006;display:none;min-width:260px;max-width:90%}
#gMsg.on{display:block;animation:pop .3s}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.7);opacity:0}}
#gMsg h2{margin:0 0 6px;font-size:28px;font-weight:900}
#gMsg p{margin:0 0 16px;font-size:18px}
#gMsg .big{margin:0 auto}

/* start / tutorial / end cards */
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;z-index:8;background:#18263fcc}
.screen.on{display:flex}
.card{background:var(--paper);border-radius:24px;padding:22px 22px 20px;max-width:440px;width:100%;text-align:center;box-shadow:0 14px 40px #0007}
#start{background:radial-gradient(circle at 50% 30%,#3a5794,#1a2d52);flex-direction:column;gap:14px;padding:calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 16px)}
#coverImg{display:block;max-width:min(100%,900px);max-height:calc(100% - 150px);object-fit:contain;border-radius:20px;box-shadow:0 0 0 6px #fff,0 18px 40px #0008}
#start p{margin:0;color:#fff;font-size:18px;font-weight:700;text-align:center}
#start .small{color:#dfe8f5;margin-top:0}
.card .big{margin:8px auto 0}
.small{background:none;color:#5a6a85;font-size:16px;font-weight:700;margin-top:12px;text-decoration:underline}
#tutCard{position:fixed;left:50%;bottom:calc(var(--safe-b) + 84px);transform:translateX(-50%);width:min(92vw,440px);background:#fff;border-radius:20px;padding:16px 18px 14px;box-shadow:0 10px 30px #0006;z-index:9;display:none;text-align:right}
#tutCard.on{display:block;animation:pop2 .3s}
@keyframes pop2{0%{transform:translateX(-50%) translateY(20px);opacity:0}}
#tutCard h3{margin:0 0 4px;font-size:20px;font-weight:900;color:var(--navy)}
#tutCard p{margin:0 0 10px;font-size:17px;line-height:1.45}
#tutCard .row{display:flex;align-items:center;gap:10px}
#tutCard .dots{flex:1;display:flex;gap:5px}
#tutCard .dots i{width:8px;height:8px;border-radius:50%;background:#d5dce6}
#tutCard .dots i.on{background:var(--navy)}
#tutCard button.next{height:44px;padding:0 20px;border-radius:22px;background:var(--navy);color:#fff;font-weight:900;font-size:17px}
#tutCard .key{font-size:12px;color:#8a95a8}
.glow{position:relative;z-index:10;box-shadow:0 0 0 4px #fff,0 0 0 9px var(--gold),0 0 30px 10px #f2b632aa!important}
#loading{position:fixed;inset:0;background:#24406e;color:#fff;display:grid;place-items:center;font-size:22px;font-weight:900;z-index:20}
</style>
</head>
<body>
<div id="top">
  <button class="ibtn" id="homeBtn" aria-label="לעמוד המשחקים"><svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg></button>
  <div id="stamps"></div>
  <button class="ibtn" id="sndBtn" aria-label="מוזיקה"><svg viewBox="0 0 24 24"><path d="M12 3v10.6A4 4 0 1 0 14 17V7h4V3z"/></svg></button>
  <button class="ibtn" id="readBtn" aria-label="הקראה"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button>
</div>

<div id="book">
  <div id="page">
    <div id="pic"><div class="ph">איור</div>
      <svg id="stamp" viewBox="0 0 64 64"><circle cx="32" cy="32" r="29" fill="#fff8" stroke="#c0392b" stroke-width="4"/><circle cx="32" cy="32" r="23" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="3 3"/><path d="M19 33l9 9 18-20" fill="none" stroke="#c0392b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div id="txt"></div>
    <div id="pnum"></div>
  </div>
</div>

<div id="bar">
  <button class="nav" id="prevBtn" aria-label="העמוד הקודם"><svg viewBox="0 0 24 24"><path d="M8.5 4 6.6 5.9l6.1 6.1-6.1 6.1L8.5 20l8-8z"/></svg></button>
  <button class="big" id="playBtn"><svg viewBox="0 0 24 24"><path d="M17 4v16L4 12z"/></svg><span>שַׂחֲקוּ!</span></button>
  <button class="nav" id="nextBtn" aria-label="העמוד הבא"><svg viewBox="0 0 24 24"><path d="M15.5 4 7.5 12l8 8 1.9-1.9-6.1-6.1 6.1-6.1z"/></svg></button>
</div>

<div id="play">
  <div id="gHead">
    <div id="gTitle"></div>
    <button class="ibtn" id="gClose" aria-label="חזרה לסיפור"><svg viewBox="0 0 24 24"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6z"/></svg></button>
  </div>
  <div id="gWrap"><canvas id="gc"></canvas>
    <div id="gMsg"><h2></h2><p></p><button class="big"></button></div>
  </div>
</div>

<div class="screen on" id="start">
  <img id="coverImg" src="assets/cover.jpg?v=4" alt="יוֹסֵף מוֹקִיר שַׁבָּת">
  <p>סֵפֶר מֻקְרָא – עִם מִשְׂחָקִים קְטַנִּים בַּדֶּרֶךְ</p>
  <button class="big gold" id="goBtn"><svg viewBox="0 0 24 24"><path d="M17 4v16L4 12z"/></svg><span>פּוֹתְחִים אֶת הַסֵּפֶר</span></button>
  <button class="small" id="restartBtn" style="display:none">מַתְחִילִים מֵהַהַתְחָלָה</button>
</div>

<div id="tutCard"><h3></h3><p></p><div class="row"><div class="dots"></div><span class="key">רווח = הבא</span><button class="next">הַבָּא</button></div></div>
<div id="loading">טוֹעֵן...</div>
<script type="module" src="game.js?v=10"></script>
</body>
