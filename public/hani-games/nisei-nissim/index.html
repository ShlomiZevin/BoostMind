<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2a1640">
<title>ניסי ניסים! – המשחקייה של חני</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<script src="/t.js" data-site="hani-games" defer></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<style>
:root{
  --ink:#2a1640; --card:#fffaf2; --gold:#ffc94a; --gold2:#ff9f1c; --pink:#e83e8c; --green:#2bb673; --red:#e5484d;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#2a1640;font-family:Rubik,system-ui,sans-serif;color:var(--ink);touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
#ui *{pointer-events:auto}
#ui #tutDim,#ui #tutDim *,#ui #say,#ui .float,#ui .spark,#ui .ghost,#ui .ghost *,#ui .tgt,#ui .path,#ui .nin,#ui .bub *{pointer-events:none}
#ui .bub{pointer-events:auto}
button{font-family:inherit;border:0;cursor:pointer}

/* HUD */
#hud{position:absolute;top:calc(var(--safe-t) + 8px);left:8px;right:8px;display:flex;align-items:center;gap:8px;pointer-events:none}
#hud>*{pointer-events:auto}
#lives{display:flex;gap:2px}
#lives img{width:38px;height:38px;object-fit:contain;filter:drop-shadow(0 2px 2px #0006);transition:transform .3s,opacity .3s}
#lives img.gone{opacity:.18;transform:scale(.6) rotate(-30deg);filter:grayscale(1)}
#score{flex:1;text-align:center;font-weight:900;font-size:30px;color:#fff;text-shadow:0 2px 0 var(--ink),0 0 10px #0008}
#combo{display:block;font-size:14px;color:var(--gold);min-height:16px;line-height:1}
.ibtn{width:44px;height:44px;border-radius:14px;background:#fff3;backdrop-filter:blur(4px);display:grid;place-items:center}
.ibtn svg{width:26px;height:26px;fill:#fff}

#meterWrap{position:absolute;left:12px;right:12px;bottom:calc(var(--safe-b) + 12px);display:flex;align-items:center;gap:10px}
#meter{flex:1;height:26px;border-radius:13px;background:#0006;border:2px solid #fff8;overflow:hidden;position:relative}
#meterFill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#ffe08a,var(--gold),var(--gold2));transition:width .25s}
#meter span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;text-shadow:0 1px 2px #000a}
#miracle{width:96px;height:58px;border-radius:29px;font-weight:900;font-size:17px;line-height:1;color:#7a4a00;background:linear-gradient(#fff0b8,var(--gold) 50%,var(--gold2));box-shadow:0 0 0 3px #fff,0 4px 0 #a86a00;opacity:.4;filter:grayscale(.7);transition:opacity .2s}
#miracle.ready{opacity:1;filter:none;animation:glow 0.9s infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 3px #fff,0 4px 0 #a86a00,0 0 26px 8px #ffd76a}}

/* event bubbles */
.bub{position:absolute;width:74px;height:74px;margin:-37px 0 0 -37px;touch-action:none}
.bub .ring{position:absolute;inset:0}
.bub .face{position:absolute;inset:7px;border-radius:50%;background:#fff;box-shadow:0 3px 8px #0006;display:grid;place-items:center;overflow:hidden}
.bub.bonus .face{background:radial-gradient(#fff8d6,#ffd76a)}
.bub img{width:82%;height:82%;object-fit:contain;pointer-events:none}
.bub .prog{position:absolute;inset:7px;border-radius:50%;pointer-events:none;background:conic-gradient(#2bb67388 var(--p,0%),transparent 0)}
.bub .tag{position:absolute;top:-24px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:3px;white-space:nowrap;padding:2px 9px 2px 7px;border-radius:12px;background:#ffd34a;color:var(--ink);font-size:13px;font-weight:900;box-shadow:0 2px 5px #0007;pointer-events:none;z-index:2}
.bub .tag svg{width:16px;height:16px;fill:var(--ink);flex:none}
.bub .tag svg [stroke]{stroke:var(--ink)}
.bub .tag svg [fill="none"]{fill:none}
.bub .hand{position:absolute;left:30px;top:44px;width:26px;pointer-events:none;transform-origin:13px 0;filter:drop-shadow(0 2px 3px #0008);z-index:3}
.bub .hand svg{display:block}
.bub.touched .hand{display:none}
.hand.tap{animation:htap .9s ease-in-out infinite}
.hand.hold{animation:hhold 1.6s ease-in-out infinite}
.hand.rub{animation:hrub .7s ease-in-out infinite}
.hand.circle{animation:hcirc 1.1s linear infinite}
.hand.drag{animation:hdrag 1.8s ease-in-out infinite}
@keyframes htap{0%,100%{transform:translateY(10px)}50%{transform:translateY(0) scale(.88)}}
@keyframes hhold{0%{transform:translateY(10px)}20%,85%{transform:translateY(0) scale(.88)}100%{transform:translateY(10px)}}
@keyframes hrub{0%,100%{transform:translateX(-18px)}50%{transform:translateX(18px)}}
@keyframes hcirc{from{transform:rotate(0) translateX(20px) rotate(0)}to{transform:rotate(360deg) translateX(20px) rotate(-360deg)}}
@keyframes hdrag{0%{transform:translate(0,0);opacity:0}12%{transform:translate(0,0);opacity:1}75%{transform:translate(var(--dx),var(--dy));opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
.path{position:absolute;height:0;border-top:4px dashed #ffffffd0;transform-origin:0 0;margin-top:-2px;pointer-events:none;filter:drop-shadow(0 1px 2px #0008)}
.bub .lbl{position:absolute;top:76px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:13px;font-weight:700;color:#fff;background:#2a1640d9;padding:2px 8px;border-radius:10px;pointer-events:none}
.bub.urgent .face{animation:shake .25s infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.bub.pop{animation:popin .25s ease-out}
@keyframes popin{from{transform:scale(.2)}to{transform:scale(1)}}
.tgt{position:absolute;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;border:4px dashed #fff;background:#2bb67333;pointer-events:none;opacity:.55;animation:pulse 1s infinite}
.tgt.hot{opacity:1;border-color:var(--gold);background:#ffc94a44}
@keyframes pulse{50%{transform:scale(1.12)}}
.ghost{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:#fff;box-shadow:0 6px 14px #0008;display:grid;place-items:center;pointer-events:none;z-index:5}
.ghost img{width:82%;height:82%;object-fit:contain}
.float{position:absolute;font-weight:900;font-size:22px;color:var(--gold);text-shadow:0 2px 0 var(--ink);pointer-events:none;animation:up 1s ease-out forwards;transform:translate(-50%,-50%)}
.float.bad{color:#ff8a8a}
@keyframes up{to{margin-top:-60px;opacity:0}}
.spark{position:absolute;width:10px;height:10px;margin:-5px;border-radius:50%;background:var(--gold);pointer-events:none;box-shadow:0 0 8px #ffd76a}

/* Hani's speech */
#say{position:absolute;max-width:min(78vw,340px);background:var(--card);border-radius:18px;padding:9px 14px;font-size:16px;font-weight:700;line-height:1.3;box-shadow:0 4px 12px #0006;transform:translate(-50%,-100%);opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
#say.on{opacity:1}
.nin{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:min(13vw,64px);font-weight:900;white-space:nowrap;color:#ffe27a;text-align:center;line-height:1;
  text-shadow:0 3px 0 #a86a00,0 6px 0 #5a3a00,0 0 30px #ffd76a;pointer-events:none;z-index:7;animation:nin 1.7s ease-out forwards}
.nin small{display:block;font-size:.45em;color:#fff;text-shadow:0 2px 0 var(--ink)}
@keyframes nin{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}15%{transform:translate(-50%,-50%) scale(1.12) rotate(2deg);opacity:1}25%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}
#quiz{position:absolute;left:50%;bottom:calc(var(--safe-b) + 78px);transform:translateX(-50%);width:min(94vw,440px);background:var(--card);border-radius:20px;padding:10px 12px 12px;box-shadow:0 8px 24px #000a;border:3px solid var(--gold);display:none;z-index:8;text-align:center}
#quiz.on{display:block;animation:popin .2s ease-out}
#quiz .qh{font-size:13px;font-weight:700;color:#6a7899}
#quiz .qq{font-size:18px;font-weight:900;margin:4px 0 10px;line-height:1.3}
#quiz .qa{display:flex;flex-direction:column;gap:8px}
#quiz button{padding:10px 12px;border-radius:14px;font-size:16px;font-weight:700;color:var(--ink);background:#eef2fb;box-shadow:0 3px 0 #b9c4e0;line-height:1.25}
#quiz button:active{transform:translateY(2px);box-shadow:0 1px 0 #b9c4e0}
#say.low{font-size:15px;max-width:calc(100vw - 24px)}
#say.call{background:#dff0ff;--card:#dff0ff;font-weight:500;font-size:15px}
#say.side:not(.low):after{display:none}
#say.low{transform:translate(-50%,0)}
#say.low:after{top:-10px;bottom:auto;border-top:0;border-bottom:10px solid var(--card)}
#say:after{content:"";position:absolute;bottom:-10px;left:50%;margin-left:-10px;border:10px solid transparent;border-bottom:0;border-top-color:var(--card)}

/* screens: one layer at a time */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 16px);background:linear-gradient(#2a164000,#2a1640cc 45%,#2a1640ee)}
.screen.on{display:flex}
.screen .titleArt{width:min(88vw,460px);max-height:30vh;object-fit:contain;filter:drop-shadow(0 6px 10px #0009)}
.screen .head{width:min(52vw,240px);filter:drop-shadow(0 6px 10px #0008)}
.big{min-width:220px;padding:16px 28px;border-radius:30px;font-size:24px;font-weight:900;color:#fff;background:linear-gradient(#ff6fae,var(--pink));box-shadow:0 5px 0 #a3195a}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #a3195a}
.mid{min-width:200px;padding:12px 22px;border-radius:24px;font-size:18px;font-weight:700;color:var(--ink);background:#fff;box-shadow:0 4px 0 #b9a9c9}
.best{color:#fff;font-size:17px;font-weight:700}
.best b{color:var(--gold)}
.over-h{font-size:30px;font-weight:900;color:#fff;margin:0;text-align:center}
.over-line{background:var(--card);border-radius:18px;padding:10px 16px;font-weight:700;max-width:340px;text-align:center}
.over-score{font-size:56px;font-weight:900;color:var(--gold);text-shadow:0 3px 0 var(--ink);line-height:1}
.newrec{font-size:22px;font-weight:900;color:#fff;background:var(--green);padding:4px 14px;border-radius:14px;animation:pulse .8s infinite}

/* tutorial */
#tutDim{position:absolute;inset:0;display:none;pointer-events:none}
#tutDim.on{display:block}
#tutHole{position:absolute;border-radius:50%;box-shadow:0 0 0 200vmax #1a0d2ccc;border:3px solid var(--gold);transition:all .3s;pointer-events:none}
#tutCard{position:absolute;left:12px;right:12px;display:none;background:var(--card);border-radius:20px;padding:14px 16px 12px;box-shadow:0 8px 24px #000a;max-width:460px;margin:0 auto}
#tutCard.on{display:block}
#tutText{font-size:18px;font-weight:700;line-height:1.35;min-height:48px}
#tutText .ok{color:var(--green)}
#tutBar{height:6px;background:#e7ddf0;border-radius:3px;margin:10px 0 8px;overflow:hidden}
#tutBar i{display:block;height:100%;background:var(--pink);width:0;transition:width .3s}
#tutRow{display:flex;align-items:center;gap:10px}
#tutCount{flex:1;font-size:14px;color:#7a6a8a;font-weight:700}
#tutSkip{background:none;color:#7a6a8a;font-size:15px;font-weight:700;padding:8px}
#tutNext{padding:10px 26px;border-radius:20px;font-size:18px;font-weight:900;color:#fff;background:var(--pink)}
#tutNext:disabled{background:#cbbfd8}
.keyhint{font-size:12px;color:#9a8aab;font-weight:500}
@media (hover:none){.keyhint{display:none}}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:#fff;font-size:20px;font-weight:700;background:#2a1640;z-index:9}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="bubs"></div>
  <div id="say"></div>
  <div id="quiz"></div>
  <div id="hud" style="display:none">
    <div id="lives"></div>
    <div id="score">0<span id="combo"></span></div>
    <button class="ibtn" id="pauseBtn" aria-label="הפסקה"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
    <button class="ibtn sndBtn" aria-label="צליל"></button>
  </div>
  <div id="meterWrap" style="display:none">
    <div id="meter"><div id="meterFill"></div><span>מד סייעתא דשמיא</span></div>
    <button id="miracle">ניסי<br>ניסים!</button>
  </div>

  <div class="screen on" id="start">
    <img class="titleArt" src="assets/title.png" alt="ניסי ניסים!">
    <img class="head" src="assets/pose-chin.png" alt="">
    <button class="big" id="playBtn">שחקו</button>
    <button class="mid" id="howBtn">איך משחקים</button>
    <div class="best" id="bestStart"></div>
    <div style="display:flex;gap:10px;align-items:center">
      <a class="mid" href="/hani-games/" style="text-decoration:none;display:inline-block;text-align:center">לכל המשחקים</a>
      <button class="ibtn sndBtn" aria-label="צליל"></button>
    </div>
  </div>

  <div class="screen" id="over">
    <p class="over-h">הכאוס ניצח הפעם</p>
    <img class="head" src="assets/pose-talk.png" alt="" style="width:min(38vw,170px)">
    <div class="over-line" id="overLine"></div>
    <div class="over-score" id="overScore">0</div>
    <div id="overRec"></div>
    <div class="best" id="bestOver"></div>
    <button class="big" id="againBtn">עוד סיבוב</button>
    <a class="mid" href="/hani-games/" style="text-decoration:none;display:inline-block;text-align:center">לכל המשחקים</a>
  </div>

  <div class="screen" id="paused">
    <p class="over-h">הפסקה קטנה</p>
    <div class="over-line">"רגע, אני רק מסיימת פרק תהילים"</div>
    <button class="big" id="resumeBtn">ממשיכים</button>
    <button class="mid" id="quitBtn">יציאה לתפריט</button>
  </div>

  <div id="tutDim"><div id="tutHole"></div></div>
  <div id="tutCard">
    <div id="tutText"></div>
    <div id="tutBar"><i></i></div>
    <div id="tutRow">
      <span id="tutCount"></span>
      <button id="tutSkip">דלגו <span class="keyhint">(Esc)</span></button>
      <button id="tutNext">הבא</button>
    </div>
  </div>
</div>
<div id="loading">רגע, טוען... בסייעתא דשמיא</div>
<script type="module" src="game.js"></script>
</body>
</html>
