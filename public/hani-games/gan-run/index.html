<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1d2a4a">
<title>4:20 רצים לגן – המשחקייה של חני</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<script src="/t.js" data-site="hani-games" defer></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<style>
:root{
  --ink:#1d2a4a; --card:#fffaf2; --gold:#ffc94a; --orange:#ff8a1f; --pink:#e83e8c; --green:#2bb673; --red:#e5484d; --blue:#2f6fd1;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#1d2a4a;font-family:Rubik,system-ui,sans-serif;color:var(--ink);touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
#ui .screen,#ui .screen *,#ui #hud button,#ui #tutCard,#ui #tutCard *{pointer-events:auto}
button{font-family:inherit;border:0;cursor:pointer}

/* HUD */
#hud{position:absolute;top:calc(var(--safe-t) + 8px);left:8px;right:8px;display:flex;align-items:flex-start;gap:8px}
.ibtn{width:44px;height:44px;border-radius:14px;background:#fff3;backdrop-filter:blur(4px);display:grid;place-items:center;flex:none}
.ibtn svg{width:26px;height:26px;fill:#fff}
#clockBox{flex:1;text-align:center;color:#fff;line-height:1}
#clock{font-size:38px;font-weight:900;letter-spacing:1px;text-shadow:0 2px 0 #0008;direction:ltr;display:inline-block;padding:2px 12px;border-radius:12px;background:#0005}
#clock.late{color:#ffb3b3}
#clock.ff{color:var(--gold)}
#deadline{font-size:13px;font-weight:700;margin-top:4px;text-shadow:0 1px 2px #000a}
#side{width:92px;text-align:center;color:#fff;font-weight:900;text-shadow:0 2px 0 #0008;flex:none}
#day{font-size:15px}
#score{font-size:24px;color:var(--gold)}
#chips{position:absolute;top:calc(var(--safe-t) + 74px);left:8px;right:8px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.chip{display:flex;align-items:center;gap:5px;padding:4px 10px 4px 8px;border-radius:14px;background:#fffaf2ee;font-size:14px;font-weight:700;box-shadow:0 2px 6px #0006;white-space:nowrap}
.chip svg{width:18px;height:18px;flex:none}
.chip.bad{background:#ffe1e1}
.chip.good{background:#dff7e9}
.chip b{font-weight:900}

/* Hani's speech: its own strip at the bottom */
#say{position:absolute;left:50%;bottom:calc(var(--safe-b) + 10px);transform:translateX(-50%);width:min(94vw,460px);min-height:48px;display:flex;align-items:center;justify-content:center;background:var(--card);border-radius:16px;padding:7px 14px;font-size:16px;font-weight:700;line-height:1.3;box-shadow:0 4px 12px #0006;text-align:center;opacity:0;transition:opacity .2s}
#say.on{opacity:1}
#say.call{background:#dff0ff;font-weight:500}
.float{position:absolute;font-weight:900;font-size:22px;color:#fff;text-shadow:0 2px 0 var(--ink),0 0 8px #000;pointer-events:none;animation:up 1.1s ease-out forwards;transform:translate(-50%,-50%);white-space:nowrap}
.float.bad{color:#ffb3b3}
@keyframes up{to{margin-top:-60px;opacity:0}}
.nin{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:min(13vw,64px);font-weight:900;white-space:nowrap;color:#ffe27a;text-align:center;line-height:1;
  text-shadow:0 3px 0 #a86a00,0 6px 0 #5a3a00,0 0 30px #ffd76a;pointer-events:none;z-index:7;animation:nin 1.9s ease-out forwards}
.nin small{display:block;font-size:.42em;color:#fff;text-shadow:0 2px 0 var(--ink)}
@keyframes nin{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}15%{transform:translate(-50%,-50%) scale(1.12) rotate(2deg);opacity:1}25%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}
#ride{position:absolute;left:50%;top:calc(var(--safe-t) + 92px);transform:translateX(-50%);width:94vw;text-align:center;color:#fff;display:none}
#ride.on{display:block}
#ride .rh{font-size:26px;font-weight:900;text-shadow:0 2px 0 #000a}
#ride .rs{font-size:17px;font-weight:700;margin-top:6px;text-shadow:0 1px 3px #000}
#ride .rs.bad{color:#ffd0d0}

/* screens */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 16px);background:linear-gradient(#1d2a4a00,#1d2a4acc 40%,#1d2a4aee)}
.screen.on{display:flex}
.titleArt{width:min(88vw,440px);max-height:28vh;object-fit:contain;filter:drop-shadow(0 6px 10px #0009)}
.titleTxt{display:none;font-size:44px;font-weight:900;color:#fff;text-align:center;line-height:1.05}
.titleTxt small{display:block;font-size:.55em;color:var(--gold)}
.hani{height:min(30vh,240px);filter:drop-shadow(0 6px 10px #0008)}
.big{min-width:220px;padding:16px 28px;border-radius:30px;font-size:24px;font-weight:900;color:#fff;background:linear-gradient(#ffa64d,var(--orange));box-shadow:0 5px 0 #b35500}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #b35500}
.mid{min-width:200px;padding:12px 22px;border-radius:24px;font-size:18px;font-weight:700;color:var(--ink);background:#fff;box-shadow:0 4px 0 #a9b4c9;text-decoration:none;display:inline-block;text-align:center}
.best{color:#fff;font-size:17px;font-weight:700}
.best b{color:var(--gold)}
.h{font-size:30px;font-weight:900;color:#fff;margin:0;text-align:center}
.line{background:var(--card);border-radius:18px;padding:10px 16px;font-weight:700;max-width:360px;text-align:center;line-height:1.35}
.bigNum{font-size:56px;font-weight:900;color:var(--gold);text-shadow:0 3px 0 var(--ink);line-height:1}
.newrec{font-size:22px;font-weight:900;color:#fff;background:var(--green);padding:4px 14px;border-radius:14px}
#dayChips{display:flex;flex-direction:column;gap:8px;align-items:stretch;width:min(92vw,360px)}
#dayChips .chip{font-size:16px;padding:8px 12px;white-space:normal;justify-content:flex-start}
#dayChips .chip svg{width:24px;height:24px}

/* tutorial */
#tutDim{position:absolute;inset:0;display:none}
#tutDim.on{display:block}
#tutHole{position:absolute;border-radius:50%;box-shadow:0 0 0 200vmax #0d1428bb;border:3px solid var(--gold);transition:all .3s}
#tutCard{position:absolute;left:12px;right:12px;bottom:calc(var(--safe-b) + 12px);display:none;background:var(--card);border-radius:20px;padding:14px 16px 12px;box-shadow:0 8px 24px #000a;max-width:460px;margin:0 auto}
#tutCard.on{display:block}
#tutText{font-size:18px;font-weight:700;line-height:1.35;min-height:48px}
#tutBar{height:6px;background:#dde3ee;border-radius:3px;margin:10px 0 8px;overflow:hidden}
#tutBar i{display:block;height:100%;background:var(--orange);width:0;transition:width .3s}
#tutRow{display:flex;align-items:center;gap:10px}
#tutCount{flex:1;font-size:14px;color:#6a7899;font-weight:700}
#tutSkip{background:none;color:#6a7899;font-size:15px;font-weight:700;padding:8px}
#tutNext{padding:10px 26px;border-radius:20px;font-size:18px;font-weight:900;color:#fff;background:var(--orange)}
#tutNext:disabled{background:#c9cfdb}
.keyhint{font-size:12px;color:#8a97b3;font-weight:500}
@media (hover:none){.keyhint{display:none}}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:#fff;font-size:20px;font-weight:700;background:#1d2a4a;z-index:9}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hud" style="display:none">
    <button class="ibtn" id="pauseBtn" aria-label="הפסקה"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
    <button class="ibtn sndBtn" aria-label="צליל"></button>
    <div id="clockBox"><div id="clock">4:20</div><div id="deadline">הגן נסגר ב־4:45</div></div>
    <div id="side"><div id="day">יום 1</div><div id="score">0</div></div>
  </div>
  <div id="chips"></div>
  <div id="ride"><div class="rh" id="rideH"></div><div class="rs" id="rideS"></div></div>
  <div id="fx"></div>
  <div id="say"></div>

  <div class="screen on" id="start">
    <img class="titleArt" src="assets/title.png" alt="4:20 רצים לגן!" onerror="this.style.display='none';document.getElementById('titleTxt').style.display='block'">
    <div class="titleTxt" id="titleTxt">4:20<small>רצים לגן!</small></div>
    <img class="hani" src="assets/hani-walk.png" alt="">
    <button class="big" id="playBtn">יוצאים!</button>
    <button class="mid" id="howBtn">איך משחקים</button>
    <div class="best" id="bestStart"></div>
    <div style="display:flex;gap:10px;align-items:center">
      <a class="mid" href="/hani-games/">לכל המשחקים</a>
      <button class="ibtn sndBtn" aria-label="צליל"></button>
    </div>
  </div>

  <div class="screen" id="dayCard">
    <p class="h" id="dayH">יום 1</p>
    <div class="line" id="dayLine">השעה 4:20. מלכי מחכה בגן בבני ברק.</div>
    <div id="dayChips"></div>
    <button class="big" id="goBtn">יוצאים מהמשרד</button>
  </div>

  <div class="screen" id="arrived">
    <p class="h" id="arrH">הגענו!</p>
    <img class="hani" src="assets/hani-joy.png" alt="">
    <div class="line" id="arrLine"></div>
    <div class="bigNum" id="arrPts">+0</div>
    <button class="big" id="nextBtn">ליום הבא</button>
  </div>

  <div class="screen" id="over">
    <p class="h">אחרנו הפעם</p>
    <img class="hani" src="assets/hani-oops.png" alt="" style="height:min(24vh,190px)">
    <div class="line" id="overLine"></div>
    <div class="bigNum" id="overScore">0</div>
    <div id="overRec"></div>
    <div class="best" id="bestOver"></div>
    <button class="big" id="againBtn">מתחילים מחדש</button>
    <a class="mid" href="/hani-games/">לכל המשחקים</a>
  </div>

  <div class="screen" id="paused">
    <p class="h">הפסקה קטנה</p>
    <div class="line">השעון עומד. מלכי מחכה בסבלנות.</div>
    <button class="big" id="resumeBtn">ממשיכים</button>
    <button class="mid" id="quitBtn">יציאה לתפריט</button>
  </div>

  <div id="tutDim"><div id="tutHole"></div></div>
  <div id="tutCard">
    <div id="tutText"></div>
    <div id="tutBar"><i></i></div>
    <div id="tutRow">
      <span id="tutCount"></span>
      <button id="tutSkip">דלגו <span class="keyhint">(Esc)</span></button>
      <button id="tutNext">הבא <span class="keyhint">(רווח)</span></button>
    </div>
  </div>
</div>
<div id="loading">רגע, טוען... בסייעתא דשמיא</div>
<script type="module" src="game.js"></script>
</body>
</html>
