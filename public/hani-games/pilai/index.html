<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1d4f9c">
<title>פילאי פלואים – המשחקייה של חני</title>
<meta name="description" content="איך צרה קטנה הופכת לנס? סדרו את הסיפור ותראו את הפילאי פלואים! משחק חדש במשחקייה של חני.">
<meta property="og:type" content="website">
<meta property="og:locale" content="he_IL">
<meta property="og:title" content="פילאי פלואים – המשחקייה של חני">
<meta property="og:description" content="איך צרה קטנה הופכת לנס? סדרו את הסיפור ותראו את הפילאי פלואים! משחק חדש במשחקייה של חני.">
<meta property="og:url" content="https://boostmind-b052c.web.app/hani-games/pilai/">
<meta property="og:image" content="https://boostmind-b052c.web.app/hani-games/pilai/assets/share.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<script src="/t.js" data-site="hani-games" defer></script>
<style>
:root{
  --ink:#16305e; --card:#fffaf0; --gold:#ffc94a; --gold2:#ff9f1c; --blue:#1d5fbf; --blue2:#0f3f8a; --green:#2bb673; --red:#e5484d;
  --safe-t:calc(env(safe-area-inset-top,0px) + var(--verse-top,0px)); --safe-b:env(safe-area-inset-bottom,0px); --strip:86px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:Rubik,system-ui,sans-serif;color:var(--ink);overscroll-behavior:none}
body{background:radial-gradient(ellipse at 50% 35%,#2f5296,#16305e 75%)}
[hidden]{display:none!important}
button{font-family:inherit;border:0;cursor:pointer}

/* HUD */
#hud{position:fixed;top:calc(var(--safe-t) + 6px);left:8px;right:8px;max-width:640px;margin:0 auto;display:none;align-items:center;gap:8px;z-index:3}
#hud.on{display:flex}
.ibtn{width:42px;height:42px;border-radius:14px;background:#16305e8c;display:grid;place-items:center;flex:none}
.ibtn svg{width:24px;height:24px;fill:#fff}
#prog{flex:1;display:flex;justify-content:center;gap:6px}
#prog i{width:16px;height:16px;border-radius:50%;border:3px solid #fff;background:#16305e99;transition:all .3s}
#prog i.on{background:var(--gold);border-color:#fff3b0}
#prog i.now{transform:scale(1.25);border-color:var(--gold)}
#stars{display:flex;align-items:center;gap:4px;font-weight:900;font-size:22px;color:#fff;direction:ltr;text-shadow:0 2px 0 var(--ink)}
#stars svg{width:24px;height:24px}

/* the table */
#table{position:fixed;left:0;right:0;top:calc(var(--safe-t) + 58px);bottom:calc(var(--strip) + var(--safe-b));display:none;flex-direction:column;align-items:center;justify-content:center;gap:var(--gap,clamp(10px,3vh,30px));padding:0 10px}
#table.on{display:flex}
#ask{color:#fff;font-weight:900;font-size:clamp(17px,2.6vw,24px);text-align:center;text-shadow:0 2px 4px #0008;margin:0}
#chain{display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
.arrow{color:#ffe27a;font-weight:900;font-size:26px;flex:none;line-height:1}
.slot,.card{width:var(--cw);flex:none;border-radius:16px;position:relative}
.slot{aspect-ratio:var(--slotar);border:4px dashed #ffffff77;display:grid;place-items:center;color:#ffffffaa;font-size:40px;font-weight:900;transition:border-color .3s,background .3s}
.slot.next{border-color:var(--gold);background:#ffc94a22;animation:pulse 1.2s infinite}
@keyframes pulse{50%{background:#ffc94a44}}
.card{background:var(--card);padding:6px;box-shadow:0 6px 14px #0007;border:4px solid #fff;text-align:center;transition:transform .15s,border-color .3s,box-shadow .3s}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;background:#e8e2d4}
.card p{margin:6px 2px 2px;font-weight:700;font-size:var(--fs);line-height:1.22;min-height:2.44em;display:flex;align-items:center;justify-content:center}
.card.start{border-color:#9aa6bd}
.card.end{border-color:var(--gold);box-shadow:0 0 18px #ffd76a,0 6px 14px #0007}
.card.end.win{animation:win 1s ease-in-out 2}
@keyframes win{50%{transform:scale(1.08);box-shadow:0 0 40px #ffe27a,0 6px 14px #0007}}
.card.lit{border-color:var(--green)}
.tag{position:absolute;top:-13px;right:50%;transform:translateX(50%);background:var(--ink);color:#fff;font-size:12px;font-weight:900;padding:2px 9px;border-radius:9px;white-space:nowrap;z-index:1}
.card.end .tag{background:var(--gold2)}
#hand{display:flex;justify-content:center;gap:clamp(10px,2vw,22px);min-height:calc(var(--hw) * 1.3)}
#hand .card{width:var(--hw);cursor:pointer}
#hand .card:hover{transform:translateY(-6px) rotate(0)!important}
#hand .card:active{transform:scale(.96)!important}
.card.shake{animation:shake .45s}
@keyframes shake{20%,60%{translate:-9px 0}40%,80%{translate:9px 0}}
#nextBtn{align-self:center}
/* an upright phone: the chain runs top to bottom, each card a short row */
body.tall #chain{flex-direction:column;gap:3px}
body.tall .arrow{font-size:14px;line-height:14px;height:14px;transform:rotate(-90deg)}
body.tall #chain .card,body.tall #chain .slot{width:min(100%,420px);aspect-ratio:auto;height:var(--rowh)}
body.tall #chain .card{display:flex;align-items:center;gap:8px;padding:4px;text-align:right}
body.tall #chain .card img{width:auto;height:100%;flex:none}
body.tall #chain .card p{min-height:0;justify-content:flex-start;margin:0;font-size:15px}
body.tall .tag{right:auto;left:8px;transform:none;top:-11px}
body.tall .slot{font-size:22px}
body.tiny .arrow{display:none}
body.tiny #chain{gap:4px}
body.tiny #ask{font-size:15px}
body.tiny #say{font-size:14px;padding:6px 10px}
/* a phone on its side */
#turn{display:none;position:fixed;inset:0;z-index:20;background:#16305e;color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:900;font-size:22px;text-align:center;padding:16px}
#turn svg{width:64px;height:64px;animation:turn 1.6s ease-in-out infinite}
@keyframes turn{50%{transform:rotate(-90deg)}}
body.turn #turn{display:flex}

/* Hani's own strip at the bottom */
#strip{position:fixed;left:0;right:0;bottom:0;height:calc(var(--strip) + var(--safe-b));padding-bottom:var(--safe-b);display:none;align-items:stretch;background:linear-gradient(#fffaf0f2,#fff3dcf7);border-top:3px solid var(--blue);box-shadow:0 -4px 14px #0003;z-index:2}
#strip.on{display:flex}
#haniBox{height:100%;width:calc(var(--strip) * 1.25);flex:none;overflow:hidden;position:relative}
#hani{position:absolute;height:calc(var(--strip) * 2.1);width:auto;max-width:none;top:calc(var(--strip) * -0.36);left:calc(50% - var(--strip) * 0.84)}
#hani.pop{animation:hpop .3s}
@keyframes hpop{40%{transform:scale(1.06) translateY(-2px)}}
#sayWrap{flex:1;display:flex;align-items:center;padding:8px 10px 8px 12px;min-width:0}
#say{position:relative;background:#fff;border:2px solid #d9e4f5;border-radius:16px;padding:8px 12px;font-size:17px;font-weight:700;line-height:1.3;opacity:0;transition:opacity .2s;max-width:100%}
#say.on{opacity:1}
#say:before{content:"";position:absolute;right:-9px;top:50%;margin-top:-8px;border:8px solid transparent;border-right:0;border-left-color:#d9e4f5}

/* effects */
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:6}
.spark{position:absolute;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:#fff3b0;box-shadow:0 0 8px #ffd76a}
.nin{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:min(14vw,72px);font-weight:900;white-space:nowrap;color:#ffe27a;text-align:center;line-height:1;
  text-shadow:0 3px 0 #a86a00,0 6px 0 #5a3a00,0 0 30px #ffd76a;animation:nin 2.2s ease-out forwards}
.nin small{display:block;font-size:.4em;color:#fff;text-shadow:0 2px 0 var(--ink);margin-top:8px}
@keyframes nin{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}15%{transform:translate(-50%,-50%) scale(1.12) rotate(2deg);opacity:1}25%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}
.flycard{position:fixed;z-index:5;pointer-events:none;transition:all .45s cubic-bezier(.3,1.3,.5,1)}

/* screens */
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 16px);background:linear-gradient(#16305e88,#16305ee6 45%,#16305ef7);z-index:4}
.screen.on{display:flex}
.titleText{font-size:min(16vw,80px);font-weight:900;color:#ffe27a;line-height:1;text-shadow:0 4px 0 #a86a00,0 8px 0 #5a3a00,0 0 24px #ffd76a88;margin:0;text-align:center}
.brand{color:#fff;font-weight:900;font-size:15px;opacity:.9;margin:0}
.sub{color:#fff;font-size:17px;font-weight:700;text-align:center;max-width:360px;line-height:1.35;margin:0;text-shadow:0 1px 3px #0008}
.head{width:min(38vw,170px);aspect-ratio:.8;object-fit:cover;object-position:50% 0;filter:drop-shadow(0 6px 10px #0008)}
.big{min-width:220px;padding:16px 28px;border-radius:30px;font-size:24px;font-weight:900;color:#fff;background:linear-gradient(#3d86f0,var(--blue));box-shadow:0 5px 0 var(--blue2)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--blue2)}
.big.gold{background:linear-gradient(#ffd75e,var(--gold2));box-shadow:0 5px 0 #b86a00;color:#4a2a00}
.mid{min-width:200px;padding:12px 22px;border-radius:24px;font-size:18px;font-weight:700;color:var(--ink);background:#fff;box-shadow:0 4px 0 #b4c3dc;text-decoration:none;display:inline-block;text-align:center}
.best{color:#fff;font-size:16px;font-weight:700;text-align:center;line-height:1.5}
.best b{color:var(--gold);direction:ltr;display:inline-block}
.over-h{font-size:30px;font-weight:900;color:#fff;margin:0;text-align:center}
.over-line{background:var(--card);border-radius:18px;padding:10px 16px;font-weight:700;max-width:340px;text-align:center}
.over-score{font-size:52px;font-weight:900;color:var(--gold);text-shadow:0 3px 0 var(--ink);line-height:1;direction:ltr}
.newrec{font-size:20px;font-weight:900;color:#fff;background:var(--green);padding:4px 14px;border-radius:14px;display:inline-block}

/* the home screen: the cover is the hero, one big button */
#start{background:radial-gradient(ellipse at 50% 30%,#2f5296,#16305e 75%);gap:clamp(10px,2.2vh,20px)}
#start .hero{width:min(94vw,680px,calc((100vh - 300px) * 1.5));aspect-ratio:3/2;border-radius:22px;box-shadow:0 0 0 4px #ffe27a55,0 14px 40px #000a;object-fit:cover}
#start .sub{font-size:clamp(15px,2.4vw,19px)}
.startBtns{display:flex;flex-direction:column;align-items:center;gap:10px}
#playBtn{display:flex;align-items:center;justify-content:center;gap:10px;min-width:250px;font-size:28px;padding:16px 34px;animation:breathe 2.4s ease-in-out infinite}
#playBtn svg{width:24px;height:24px;fill:#4a2a00}
@keyframes breathe{50%{transform:scale(1.04)}}
#howBtn{min-width:0;padding:9px 22px;font-size:16px;background:#ffffff1f;color:#fff;box-shadow:none;border:2px solid #ffffff55}
.foot{display:flex;align-items:center;gap:14px}
.back{color:#cfe0ff;font-weight:700;font-size:15px;text-decoration:none}
@media (min-width:700px) and (min-height:600px){.startBtns{flex-direction:row-reverse;gap:16px}}

/* tutorial */
#tutDim{position:fixed;inset:0;display:none;pointer-events:none;z-index:7}
#tutDim.on{display:block}
#tutHole{position:absolute;border-radius:20px;box-shadow:0 0 0 200vmax #0d1d3aa6;border:3px solid var(--gold);transition:all .3s}
#tutCard{position:fixed;left:10px;right:10px;display:none;background:var(--card);border-radius:20px;padding:12px 14px 10px;box-shadow:0 8px 24px #0009;max-width:460px;margin:0 auto;border:3px solid var(--blue);z-index:8}
#tutCard.on{display:block}
#tutText{font-size:17px;font-weight:700;line-height:1.35;min-height:46px}
#tutText .ok{color:var(--green)}
#tutBar{height:6px;background:#dde6f3;border-radius:3px;margin:9px 0 7px;overflow:hidden}
#tutBar i{display:block;height:100%;background:var(--blue);width:0;transition:width .3s}
#tutRow{display:flex;align-items:center;gap:10px}
#tutCount{flex:1;font-size:14px;color:#6a7899;font-weight:700}
#tutSkip{background:none;color:#6a7899;font-size:15px;font-weight:700;padding:8px}
#tutNext{padding:10px 26px;border-radius:20px;font-size:18px;font-weight:900;color:#fff;background:var(--blue)}
#tutNext:disabled{background:#c3cddd}
.keyhint{font-size:12px;color:#9aa6bd;font-weight:500}
@media (hover:none){.keyhint{display:none}}
</style>
<script src="/verse/game-frame.js"></script>
</head>
<body>
<div id="hud">
  <button class="ibtn" id="pauseBtn" aria-label="הפסקה"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
  <div id="stars"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 20.9l1.6-7L2 9.2l7.1-.6z" fill="#ffc94a" stroke="#a86a00" stroke-width="1.2"/></svg><span id="starTxt">0</span></div>
  <div id="prog"></div>
  <button class="ibtn sndBtn" aria-label="צליל"></button>
</div>

<div id="table">
  <p id="ask">מה קרה אחר כך?</p>
  <div id="chain"></div>
  <div id="hand"></div>
  <button class="big gold" id="nextBtn" hidden>לסיפור הבא</button>
</div>

<div id="strip">
  <div id="haniBox"><img id="hani" src="assets/pose-calm.png" alt="חני"></div>
  <div id="sayWrap"><div id="say"></div></div>
</div>
<div id="fx"></div>
<div id="turn"><svg viewBox="0 0 24 24" fill="none" stroke="#ffe27a" stroke-width="2" stroke-linecap="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>סובבו את הטלפון לאורך<br><small style="font-size:15px;font-weight:700;opacity:.8">ככה רואים את כל הסיפור</small></div>

<div class="screen on" id="start">
  <img class="hero" src="assets/hero.jpg" alt="פילאי פלואים – המשחקייה של חני">
  <p class="sub">איך צרה קטנה הופכת לנס?<br>סדרו את הסיפור&nbsp;– ותראו את הפילאי פלואים!</p>
  <div class="startBtns">
    <button class="big gold" id="playBtn"><svg viewBox="0 0 24 24"><path d="M17 4v16L4 12z"/></svg>שחקו</button>
    <button class="mid" id="howBtn">איך משחקים</button>
  </div>
  <div class="best" id="bestStart"></div>
  <div class="foot">
    <a class="back" href="../" target="_top">לכל המשחקים ←</a>
    <button class="ibtn sndBtn" aria-label="צליל"></button>
  </div>
</div>

<div class="screen" id="over">
  <p class="over-h">כל הסיפורים נגמרו בנס!</p>
  <img class="head" src="assets/pose-talk.png" alt="" style="width:min(30vw,140px)">
  <div class="over-line" id="overLine"></div>
  <div class="over-score" id="overScore">0 / 18</div>
  <div id="overRec"></div>
  <div class="best" id="bestOver"></div>
  <button class="big" id="againBtn">עוד פעם</button>
  <a class="mid" href="../" target="_top">לכל המשחקים</a>
</div>

<div class="screen" id="paused">
  <p class="over-h">הפסקה קטנה</p>
  <div class="over-line">״רגע, אני רק עונה לברכי.״</div>
  <button class="big" id="resumeBtn">ממשיכים</button>
  <button class="mid" id="quitBtn">יציאה לתפריט</button>
</div>

<div id="tutDim"><div id="tutHole"></div></div>
<div id="tutCard">
  <div id="tutText"></div>
  <div id="tutBar"><i></i></div>
  <div id="tutRow">
    <span id="tutCount"></span>
    <button id="tutSkip">דלגו <span class="keyhint">(Esc)</span></button>
    <button id="tutNext">הבא <span class="keyhint">(רווח)</span></button>
  </div>
</div>
<script src="game.js?v=6"></script>
</body>
</html>
