<!doctype html>
<html lang="he" dir="rtl" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b1220" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="קורפו" />

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏖️</text></svg>" />
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏖️</text></svg>" />
<title>קורפו · מדריך הטיול</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1220; --surface:#121c2e; --surface-2:#18253b; --border:rgba(255,255,255,.08);
    --text:#e8eef7; --muted:#90a3bd; --accent:#38bdf8; --accent-ink:#04293f;
    --sunset:#f5a524; --good:#34d399; --warn:#f87171; --radius:16px;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  html:not(.dark){
    --bg:#eef2f7; --surface:#ffffff; --surface-2:#f4f7fb; --border:rgba(15,30,55,.10);
    --text:#0d1a2b; --muted:#5d6f86; --accent:#0284c7; --accent-ink:#ffffff;
    --sunset:#d97706; --good:#059669; --warn:#dc2626;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:'Heebo',system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--text);
    -webkit-font-smoothing:antialiased; line-height:1.5;
    overscroll-behavior-y:none;
  }
  #root{max-width:680px;margin:0 auto;min-height:100vh}
  button{font-family:inherit;cursor:pointer}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--accent);color:var(--accent-ink)}

  /* header */
  .topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 85%,transparent);
    backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:12px 16px;
    padding-top:calc(12px + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand h1{font-size:18px;font-weight:800;margin:0;letter-spacing:-.3px}
  .brand .sub{font-size:12px;color:var(--muted);font-weight:500}
  .iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);display:grid;place-items:center;font-size:18px;flex:none}
  .iconbtn:active{transform:scale(.94)}

  /* layout */
  .view{padding:16px 16px 110px}
  .hero{padding:18px 16px 6px}
  .hero h2{font-size:26px;font-weight:800;margin:0 0 2px;letter-spacing:-.5px}
  .hero p{color:var(--muted);margin:0;font-size:14px}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .card.tap{transition:transform .12s ease,border-color .15s}
  .card.tap:active{transform:scale(.99);border-color:var(--accent)}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;
    padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted)}
  .pill.accent{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
  .pill.sunset{color:var(--sunset);border-color:color-mix(in srgb,var(--sunset) 40%,transparent)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  /* chips nav */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--border);
    background:var(--surface);color:var(--muted);font-weight:600;font-size:13px}
  .chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

  /* day */
  .dayhead{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
  .dayhead .dnum{width:38px;height:38px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
  .dayhead h3{margin:0;font-size:17px;font-weight:800}
  .dayhead .meta{font-size:12.5px;color:var(--muted)}
  .progress{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:12px}
  .progress > i{display:block;height:100%;background:var(--good);border-radius:999px;transition:width .3s}

  .timeline{margin-top:14px;position:relative}
  .ti{display:flex;gap:12px;padding:3px 0}
  .ti .tcol{flex:none;width:50px;text-align:left;font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;color:var(--muted);padding-top:2px}
  .ti .body{flex:1;min-width:0;padding-bottom:14px;border-right:2px solid var(--border);padding-right:14px;margin-right:-1px;position:relative}
  .ti .dot{position:absolute;right:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
  .ti.done .dot{background:var(--good);border-color:var(--good)}
  .ti.warn .dot{border-color:var(--sunset);background:var(--sunset)}
  .ti .title{font-weight:600;font-size:15px}
  .ti.done .title{text-decoration:line-through;color:var(--muted)}
  .ti .note{font-size:13px;color:var(--muted);margin-top:1px}
  .ti .linkrow{margin-top:7px}
  .ti .chk{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);display:grid;place-items:center;font-size:14px;color:var(--good)}
  .ti.done .chk{background:var(--good);border-color:var(--good);color:#062e22}
  .tlink{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:5px 10px;border-radius:9px}

  /* place card */
  .pcard .ph{height:84px;border-radius:12px;display:flex;align-items:flex-end;padding:10px;margin-bottom:10px;
    background:var(--surface-2);position:relative;overflow:hidden}
  .pcard .ph .emoji{font-size:40px;line-height:1}
  .pcard h3{margin:0;font-size:17px;font-weight:800}
  .pcard .en{font-size:12px;color:var(--muted);font-weight:500}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:430px){.grid{grid-template-columns:1fr}}

  /* detail overlay */
  .overlay{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;animation:slideup .25s ease}
  @keyframes slideup{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
  .ovbar{position:sticky;top:0;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));
    display:flex;align-items:center;gap:12px;z-index:5}
  .ovbar h2{font-size:18px;font-weight:800;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ovhero{height:140px;display:grid;place-items:center;font-size:72px;background:var(--surface-2)}
  .ovbody{padding:18px 16px 120px;max-width:680px;margin:0 auto}
  .sec{margin:18px 0}
  .sec h4{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 8px;font-weight:700}
  .kv{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14.5px}
  .kv .k{flex:none;width:120px;color:var(--muted);font-weight:600}
  .kv .v{flex:1}
  .tips li{margin-bottom:7px;font-size:14.5px}
  .body-text{font-size:15px;line-height:1.65}

  /* action buttons */
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
  .actions.three{grid-template-columns:1fr 1fr 1fr}
  .abtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:13px;
    border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:700;font-size:12.5px}
  .abtn .ic{font-size:20px}
  .abtn:active{transform:scale(.96)}
  .abtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .abtn.wa{background:#25d366;color:#04210f;border-color:#25d366}

  .bignav{display:block;width:100%;text-align:center;background:var(--accent);color:var(--accent-ink);
    font-weight:800;font-size:15px;padding:15px;border-radius:14px;border:none;margin-bottom:10px}
  .bignav:active{transform:scale(.99)}

  /* checklist */
  .clitem{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);font-size:15px}
  .clitem:last-child{border-bottom:none}
  .clitem .cb{flex:none;width:24px;height:24px;border-radius:7px;border:1.6px solid var(--border);display:grid;place-items:center;font-size:13px;color:var(--good)}
  .clitem.on .cb{background:var(--good);border-color:var(--good);color:#062e22}
  .clitem.on span{text-decoration:line-through;color:var(--muted)}
  .clcat{font-size:13px;font-weight:800;color:var(--accent);margin:18px 0 4px;letter-spacing:.3px}

  /* bottom nav */
  .bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);
    backdrop-filter:blur(16px);border-top:1px solid var(--border);display:flex;
    padding:8px 6px calc(8px + var(--safe-b));max-width:680px;margin:0 auto}
  .nav-i{flex:1;background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;font-weight:600;font-size:11px}
  .nav-i .ic{font-size:21px;line-height:1}
  .nav-i.on{color:var(--accent)}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .divider{height:1px;background:var(--border);margin:16px 0}
  .warnbox{background:color-mix(in srgb,var(--sunset) 13%,transparent);border:1px solid color-mix(in srgb,var(--sunset) 35%,transparent);
    border-radius:12px;padding:11px 13px;font-size:13.5px;font-weight:600;color:var(--text);display:flex;gap:8px;align-items:flex-start}
  .notebox{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:14px}
</style>
</head>

/* ---------------- persistence ---------------- */
function useStore(key, init){
  const [v,setV]=useState(()=>{ try{const s=localStorage.getItem(key);return s?JSON.parse(s):init;}catch(e){return init;} });
  useEffect(()=>{ try{localStorage.setItem(key,JSON.stringify(v));}catch(e){} },[key,v]);
  return [v,setV];
}

function ItineraryView({open, done, toggle}){
  const [expanded,setExpanded]=useState(1); // default open day shlishi (highlight)

        const dkeybase='d'+di+'_';
        const doneCount=checkable.reduce((a,_,ii)=>a+(done[dkeybase+ii]?1:0),0);
        const pct=Math.round(doneCount/checkable.length*100);
        const isOpen=expanded===di;
        return (
          <div className="card" key={di}>
            <div className="dayhead" onClick={()=>setExpanded(isOpen?-1:di)}>

                <span style={{color:'var(--muted)',fontSize:18}}>{isOpen?'▾':'▸'}</span>

            {isOpen &&
              <div className="timeline">
                {day.items.map((it,ii)=>{
                  const k=dkeybase+ii; const isDone=!!done[k];
                  return (
                    <div className={"ti"+(isDone?' done':'')+(it.boat?' warn':'')} key={ii}>
                      <div className="tcol">{it.t}</div>

      })}

  return (
    <div className="view">
      <div className="hero" style={{padding:'4px 0 14px'}}>
        <h2>מה נשאר</h2>
        <p>{remaining} מתוך {total} עדיין לא סומנו · כל מה שאין עליו צ׳ק</p>
      </div>
      {remaining===0 &&
        <div className="card" style={{textAlign:'center',padding:'44px 16px'}}>
          <div style={{fontSize:54}}>🎉</div>
          <h3 style={{margin:'12px 0 4px'}}>עשיתם הכל!</h3>
          <div className="small muted">כל הפעילויות סומנו. תיהנו 🏖️</div>
        </div>
      }
      {DAYS.map((day,di)=>{
        const items=day.items.map((it,ii)=>({it,k:'d'+di+'_'+ii})).filter(o=>!done[o.k]);
        if(!items.length) return null;
        return (
          <div className="card" key={di}>
            <div className="row" style={{justifyContent:'space-between',marginBottom:4}}>
              <h3 style={{margin:0,fontSize:16}}>יום {day.d} <span className="en">· {day.label}</span></h3>
              <span className="pill">{items.length}</span>
            </div>
            {items.map(({it,k},idx)=>(
              <div className={"clitem"} key={k} onClick={()=>toggle(k)} style={{borderBottom:idx===items.length-1?'none':'1px solid var(--border)'}}>
                <div className="cb"></div>
                <div style={{flex:1,minWidth:0}}>
                  <span>{it.t?it.t+' · ':''}{it.x}</span>
                  {it.n && <div className="small muted" style={{textDecoration:'none'}}>{it.n}</div>}
                </div>
                {it.place && <button className="tlink" style={{flex:'none'}} onClick={e=>{e.stopPropagation();open.place(it.place);}}>{PLACES[it.place].emoji}</button>}
                {it.rest && <button className="tlink" style={{flex:'none'}} onClick={e=>{e.stopPropagation();open.rest(it.rest);}}>{RESTAURANTS[it.rest].emoji}</button>}
              </div>
            ))}
          </div>
        );
      })}
    </div>
  );
}

/* ---------------- app ---------------- */
function App(){
  const [tab,setTab]=useState('itin');
  const [dark,setDark]=useStore('corfu_dark',true);
  const [done,setDone]=useStore('corfu_done',{});
  const [packed,setPacked]=useStore('corfu_packed',{});
  const [place,setPlace]=useState(null);
  const [rest,setRest]=useState(null);

  useEffect(()=>{
    document.documentElement.classList.toggle('dark',dark);
    const m=document.querySelector('meta[name=theme-color]');
    if(m) m.setAttribute('content',dark?'#0b1220':'#eef2f7');
  },[dark]);

  const toggleDone=k=>setDone(d=>({...d,[k]:!d[k]}));
  const togglePack=k=>setPacked(p=>({...p,[k]:!p[k]}));
  const open={ place:setPlace, rest:setRest, tab:setTab };

  const tabs=[
    ['itin','🗓️','לו״ז'],['left','📋','נשאר'],['places','🏖️','מקומות'],['food','🍽️','אוכל'],['boat','🚤','סירה'],['info','🎒','מידע']
  ];

  return (
    <div>
      <div className="topbar">
        <div className="brand">
          <span style={{fontSize:24}}>🏖️</span>
          <div>
            <h1>קורפו</h1>
            <div className="sub">טיול זוגי · 5 ימים</div>
          </div>
        </div>
        <button className="iconbtn" onClick={()=>setDark(!dark)}>{dark?'☀️':'🌙'}</button>
      </div>

      {tab==='itin' && <ItineraryView open={open} done={done} toggle={toggleDone} />}
      {tab==='left' && <LeftView done={done} toggle={toggleDone} open={open} />}
      {tab==='places' && <PlacesView openPlace={setPlace} />}
      {tab==='food' && <FoodView openRest={setRest} />}
      {tab==='boat' && <BoatView />}
      {tab==='info' && <InfoView packed={packed} togglePack={togglePack} />}

      {place && <PlaceDetail p={PLACES[place]} onClose={()=>setPlace(null)} />}
      {rest && <RestaurantDetail r={RESTAURANTS[rest]} onClose={()=>setRest(null)} />}

      <div className="bottomnav">
        {tabs.map(([k,ic,l])=>(
          <button key={k} className={"nav-i"+(tab===k?' on':'')} onClick={()=>{setTab(k);window.scrollTo(0,0);}}>
            <span className="ic">{ic}</span>{l}
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
