<head>

<meta property="og:type" content="website">

<meta property="og:description" content="המשחקים של יניב אזולאי, איש הסיקיוריטי השבור מטקי-טק. כואב לו הכל – ואתם משחקים.">
<meta property="og:url" content="https://shlomiverse.com/yaniv-games/">
<meta property="og:image" content="https://shlomiverse.com/yaniv-games/millimeters/assets/share.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<script src="/t.js" data-site="yaniv-games" defer></script>
<style>
:root{--ink:#10284a;--bg:#123a63;--bg2:#0b2442;--card:#fbfdff;--green:#22c55e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Rubik,system-ui,sans-serif;color:#fff;background:radial-gradient(ellipse at 50% 0,#1d5590,var(--bg) 45%,var(--bg2));
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 32px) max(16px,env(safe-area-inset-left,0px))}
main{max-width:860px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:22px}
header{display:flex;align-items:center;gap:16px}
header img{width:84px;height:84px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:#d8ecff;border:4px solid #fff;box-shadow:0 6px 16px #0008}
h1{margin:0;font-size:clamp(28px,7vw,42px);font-weight:900;line-height:1.05}
.who{margin:4px 0 0;color:#9fc3ef;font-weight:700;font-size:15px}
.quote{margin:0;max-width:520px;text-align:center;font-weight:700;font-size:17px;color:#d8ecff}
.grid{width:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.game{display:flex;flex-direction:column;background:var(--card);color:var(--ink);border-radius:20px;overflow:hidden;text-decoration:none;box-shadow:0 10px 26px #0008;transition:transform .15s}
.game:hover{transform:translateY(-4px)}
.game img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#1d4e80}
.game div{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.game b{font-size:22px;font-weight:900}
.game p{margin:0;font-size:15px;line-height:1.35;color:#3a4f70}
.game span{align-self:flex-start;margin-top:4px;background:var(--green);color:#fff;font-weight:900;padding:6px 16px;border-radius:16px}
footer a{color:#cfe0ff;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main>
  <header>
    <img src="millimeters/assets/poses/serious.webp" alt="יניב">
    <div><h1>המשחקים של יניב</h1><p class="who">יניב אזולאי · אבטחת מידע, טקי-טק</p></div>
  </header>
  <p class="quote">״מה אתה צוחק? אני רציני איתך.״</p>
  <div class="grid">
    <a class="game" href="millimeters/">
      <img src="millimeters/cover.jpg" alt="מילימטרים">
      <div><b>מילימטרים</b><p>פיזיותרפיה ליניב: יש לו טווח תנועה של מילימטרים – עוד קצת והוא צועק. כמה טיפולים תשרדו?</p><span>לשחק</span></div>
    </a>
  </div>
  <footer><a href="/wiki/#/c/yaniv">→ יניב בשלומיוורס</a></footer>
</main>
</body>
</html>
