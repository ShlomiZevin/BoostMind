<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b2a4a">
<title>אתה לא בורג – המשחק של אסנת</title>
<meta name="description" content="אסנת, Head of People בטקי-טק, מגייסת גן זי. כל מועמד שולח לה בהודעה את הדרישות שלו – כלב, רינג לייט, מאצ׳ה, שבוע של ארבעה ימים – והיא רצה להביא הכול לפני שהסוללה נגמרת והוא עושה לה גוסטינג.">
<meta property="og:type" content="website">
<meta property="og:locale" content="he_IL">
<meta property="og:title" content="אתה לא בורג – המשחק של אסנת">
<meta property="og:description" content="אסנת מגייסת גן זי: תביאו לכל מועמד את מה שהוא דורש לפני שהוא עושה לה גוסטינג.">
<meta property="og:url" content="https://shlomiverse.com/osnat-games/not-a-cog/">
<meta property="og:image" content="https://shlomiverse.com/osnat-games/not-a-cog/assets/share.jpg?v=1">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<script src="/t.js" data-site="osnat-games" defer></script>
<script src="/verse/game-frame.js"></script>
<style>
:root{
  --ink:#1b2a4a; --card:#fff8fb; --pink:#ff8fb1; --pinkd:#d9467a; --red:#ef4444; --green:#22c55e;
  --safe-t:calc(env(safe-area-inset-top,0px) + var(--verse-top,0px)); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:Rubik,system-ui,sans-serif;color:var(--ink);overscroll-behavior:none;touch-action:none}
body{background:#dfe7ef}
[hidden]{display:none!important}
button{font-family:inherit;border:0;cursor:pointer}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

/* HUD */
#hud{position:fixed;top:calc(var(--safe-t) + 8px);left:8px;right:8px;max-width:600px;margin:0 auto;display:none;align-items:center;gap:6px;z-index:3}
#hud.on{display:flex}
.ibtn{width:42px;height:42px;border-radius:14px;background:#1b2a4acc;display:grid;place-items:center;flex:none}
.ibtn svg{width:24px;height:24px;fill:#fff}
.box{height:42px;border-radius:14px;background:#1b2a4acc;color:#fff;display:flex;align-items:center;gap:4px;padding:0 8px;flex:none;font-weight:900;font-size:16px;white-space:nowrap}
.box small{font-size:12px;opacity:.85;font-weight:700}
#scoreBox{flex:1;justify-content:center;font-size:19px;min-width:52px}
#ghosts{font-size:14px;letter-spacing:0;padding:0 6px}
@media (max-width:370px){#hud .sndBtn{display:none}.ibtn{width:36px}.box{padding:0 6px;font-size:14px}#ghosts{font-size:12px}#scoreBox{font-size:16px}}
#ghosts i{font-style:normal;opacity:.28;filter:grayscale(1)}
#ghosts i.on{opacity:1;filter:none}
#ghosts.hit{animation:hit .4s}
@keyframes hit{30%{transform:scale(1.15);background:#b91c1ccc}}

/* Osnat's words / what to do now - one strip under the HUD */
#strip{position:fixed;top:calc(var(--safe-t) + 58px);left:10px;right:10px;max-width:560px;margin:0 auto;display:none;justify-content:center;z-index:2;pointer-events:none}
#strip.on{display:flex}
#say{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--pink);border-radius:18px;padding:4px 12px 4px 6px;font-size:16px;font-weight:900;line-height:1.25;text-align:right;box-shadow:0 4px 0 #1b2a4a33;max-width:100%;min-height:40px}
#say img{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:50% 8%;background:#ffe3ec;flex:none}
#say.hint{border-color:#1b2a4a33;background:#ffffffe6;font-weight:700;color:#334}
#say.hint img{display:none}
#say em{font-style:normal;background:#ffd84d;padding:1px 8px;border-radius:10px}
#say.loud{background:#fff1f1;border-color:var(--red);color:#991b1b}

/* the kitchenette: a painted counter, the perks stand on it; Osnat walks behind it to take them */
#bar{--cw:min(100vw,660px);--ch:calc(var(--cw) / 4.62);position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:var(--cw);height:calc(var(--ch) + var(--safe-b));padding:0 3.5% var(--safe-b);display:none;justify-content:center;gap:2px;z-index:3;background:url(assets/counter.webp) top center/100% var(--ch) no-repeat,linear-gradient(transparent var(--ch),#4b6a91 var(--ch))}
#bar.on{display:flex}
.st{flex:1;max-width:86px;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:0;position:relative;background:none}
.st img{height:calc(var(--ch) * .56);width:auto;max-width:96%;object-fit:contain;margin-top:calc(var(--ch) * -.36);pointer-events:none;filter:drop-shadow(0 3px 2px #0004);transition:transform .12s}
.st span{margin-top:calc(var(--ch) * .14);font-size:11px;font-weight:900;white-space:nowrap;max-width:100%;overflow:hidden;color:var(--ink);background:#fffffff0;border-radius:8px;padding:1px 5px;box-shadow:0 2px 0 #0003;pointer-events:none}
.st:active img{transform:translateY(-4px) scale(1.06)}
.st.new::after{content:'חדש!';position:absolute;top:calc(var(--ch) * .58);left:50%;transform:translateX(-50%);background:var(--pinkd);color:#fff;font-size:10px;font-weight:900;padding:1px 6px;border-radius:8px}
.st.tap img{animation:tap .3s}
@keyframes tap{50%{transform:translateY(-8px) scale(1.12)}}
#laughBtn{position:fixed;left:10px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb3cc,#ff6f9f);box-shadow:0 4px 0 var(--pinkd),0 6px 16px #0004;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:3;color:#fff;font-weight:900;font-size:12px;line-height:1.05;text-shadow:0 1px 2px #0005;overflow:hidden}
#laughBtn.on{display:flex}
#laughBtn b{font-size:28px;line-height:1;text-shadow:none}
#laughBtn i{position:absolute;inset:auto 0 0 0;background:#1b2a4a88;pointer-events:none}
#laughBtn.cool{filter:saturate(.4)}

/* effects */
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:6}
.pop{position:absolute;font-weight:900;font-size:24px;color:#fff;text-shadow:0 3px 0 #9d174d,0 0 12px #ff6f9f;white-space:nowrap;animation:pop .9s ease-out forwards}
.pop.good{text-shadow:0 3px 0 #15803d,0 0 12px #22c55e}
.pop.bad{text-shadow:0 3px 0 #991b1b,0 0 12px #ef4444}
.pop.small{font-size:16px}
@keyframes pop{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{transform:translate(-50%,-10px) scale(1.1);opacity:1}100%{transform:translate(-50%,-55px) scale(1);opacity:0}}
.banner{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;color:#fff;font-weight:900;font-size:min(10vw,46px);line-height:1.1;text-shadow:0 3px 0 var(--pinkd),0 0 24px #000a;white-space:nowrap;animation:ban 1.8s ease-out forwards}
.banner small{display:block;font-size:.45em}
@keyframes ban{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}15%{transform:translate(-50%,-50%) scale(1.08);opacity:1}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
#turn{display:none;position:fixed;inset:0;z-index:20;background:var(--ink);color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:900;font-size:22px;text-align:center;padding:16px}
#turn svg{width:64px;height:64px;animation:turn 1.6s ease-in-out infinite}
@keyframes turn{50%{transform:rotate(-90deg)}}
body.turn #turn{display:flex}

/* screens */
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 16px);background:linear-gradient(#1b2a4acc,#141f38f2 50%,#141f38fa);z-index:4;text-align:center}
.screen.on{display:flex}
.sub{text-wrap:balance;color:#fff;font-size:17px;font-weight:700;max-width:390px;line-height:1.35;margin:0;text-shadow:0 1px 3px #0008}
.big{min-width:220px;padding:16px 28px;border-radius:30px;font-size:24px;font-weight:900;color:#fff;background:linear-gradient(#ffa3c2,#ff6f9f);box-shadow:0 5px 0 var(--pinkd);text-shadow:0 1px 2px #0004}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pinkd)}
.mid{min-width:200px;padding:12px 22px;border-radius:24px;font-size:18px;font-weight:700;color:var(--ink);background:#fff;box-shadow:0 4px 0 #b4c3dc;text-decoration:none;display:inline-block}
.best{color:#fff;font-size:16px;font-weight:700;line-height:1.5}
.best b{color:#ffd84d}
.over-h{font-size:28px;font-weight:900;color:#fff;margin:0}
.over-line{text-wrap:balance;background:var(--card);border-radius:18px;padding:10px 16px;font-weight:700;max-width:340px;font-size:17px}
.over-score{font-size:56px;font-weight:900;color:#ffd84d;text-shadow:0 3px 0 var(--ink);line-height:1}
.over-score small{display:block;font-size:16px;color:#fff;text-shadow:none;margin-top:6px}
.newrec{font-size:20px;font-weight:900;color:#fff;background:var(--green);padding:4px 14px;border-radius:14px;display:inline-block}
.who-img{height:min(24vh,190px);filter:drop-shadow(0 8px 16px #0008)}
.links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.links a{color:#ffd1e0;font-weight:700;font-size:15px;text-decoration:none}

#start{gap:clamp(10px,2.2vh,20px)}
#start .hero{width:min(92vw,560px,calc((100vh - 300px) * 1.905));aspect-ratio:1200/630;border-radius:22px;box-shadow:0 0 0 4px #ffffff33,0 14px 40px #000a;object-fit:cover;background:#2a3b60}
.startBtns{display:flex;flex-direction:column;align-items:center;gap:10px}
#playBtn{display:flex;align-items:center;justify-content:center;gap:10px;min-width:250px;font-size:28px;padding:16px 34px;animation:breathe 2.4s ease-in-out infinite}
#playBtn svg{width:24px;height:24px;fill:#fff}
@keyframes breathe{50%{transform:scale(1.04)}}
#howBtn{min-width:0;padding:9px 22px;font-size:16px;background:#ffffff1f;color:#fff;box-shadow:none;border:2px solid #ffffff55}
.foot{display:flex;align-items:center;gap:14px}
.who{color:#c9b3d6;font-size:13px;font-weight:700;margin:0}
@media (min-width:700px) and (min-height:600px){.startBtns{flex-direction:row-reverse;gap:16px}}
@media (max-height:620px){.who{display:none}#start .sub{font-size:14px}#playBtn{font-size:24px;padding:12px 28px}#start{gap:8px}}

/* tutorial */
#tutDim{position:fixed;inset:0;display:none;pointer-events:none;z-index:7}
#tutDim.on{display:block}
#tutHole{position:absolute;border-radius:20px;box-shadow:0 0 0 200vmax #141f38b0;border:3px solid #ffd84d;transition:all .3s}
#tutCard{position:fixed;left:10px;right:10px;display:none;background:var(--card);border-radius:20px;padding:12px 14px 10px;box-shadow:0 8px 24px #0009;max-width:460px;margin:0 auto;border:3px solid var(--pink);z-index:8}
#tutCard.on{display:block}
#tutText{font-size:17px;font-weight:700;line-height:1.35;min-height:46px}
#tutText .ok{color:#16a34a}
#tutBar{height:6px;background:#f3dde6;border-radius:3px;margin:9px 0 7px;overflow:hidden}
#tutBar i{display:block;height:100%;background:var(--pink);width:0;transition:width .3s}
#tutRow{display:flex;align-items:center;gap:10px}
#tutCount{flex:1;font-size:14px;color:#7a6a89;font-weight:700}
#tutSkip{background:none;color:#7a6a89;font-size:15px;font-weight:700;padding:8px}
#tutNext{padding:10px 26px;border-radius:20px;font-size:18px;font-weight:900;color:var(--ink);background:#ffd84d}
#tutNext:disabled{background:#d6cfdc;color:#7a6a89}
.keyhint{font-size:12px;color:#9a8fab;font-weight:500}
@media (hover:none){.keyhint{display:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <button class="ibtn" id="pauseBtn" aria-label="הפסקה"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
  <div class="box" id="dayBox"><small>יום</small><span id="dayTxt">1</span></div>
  <div class="box" id="hiresBox">🤝 <span id="hiresTxt">0/5</span></div>
  <div class="box" id="scoreBox"><span id="scoreTxt">0</span></div>
  <div class="box" id="ghosts" title="גוסטינג"><i>👻</i><i>👻</i><i>👻</i></div>
  <button class="ibtn sndBtn" aria-label="צליל"></button>
</div>
<div id="strip"><div id="say"><img src="assets/osnat-idle.webp" alt=""><span id="sayTxt"></span></div></div>
<div id="bar"></div>
<button id="laughBtn" aria-label="צחוק מזויף"><b>😆</b>צחוק<br>מזויף<i></i></button>
<div id="fx"></div>
<div id="turn"><svg viewBox="0 0 24 24" fill="none" stroke="#ff8fb1" stroke-width="2" stroke-linecap="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>סובבו את הטלפון לאורך<br><small style="font-size:15px;font-weight:700;opacity:.8">״לרוחב זה לא ככה ה-Vibe שלנו.״</small></div>

<div class="screen on" id="start">
  <img class="hero" src="assets/hero.jpg?v=1" alt="אתה לא בורג – המשחק של אסנת">
  <p class="sub">אסנת מגייסת גן זי.<br>תביאו לכל מועמד את מה שהוא דורש – לפני שהוא עושה לה גוסטינג.</p>
  <div class="startBtns">
    <button class="big" id="playBtn"><svg viewBox="0 0 24 24"><path d="M17 4v16L4 12z"/></svg>שחקו</button>
    <button class="mid" id="howBtn">איך משחקים</button>
  </div>
  <div class="best" id="bestStart"></div>
  <div class="foot">
    <a class="links verse-hide" href="/c/osnat" target="_top" style="color:#ffd1e0;font-weight:700;font-size:15px;text-decoration:none">אסנת בשלומיוורס ←</a>
    <button class="ibtn sndBtn" aria-label="צליל"></button>
  </div>
  <p class="who">אסנת ברגר · Head of People, טקי-טק</p>
</div>

<div class="screen" id="over">
  <p class="over-h" id="overH">אסנת קיבלה גוסטינג.</p>
  <img class="who-img" src="assets/osnat-sad.webp" alt="">
  <div class="over-line" id="overLine"></div>
  <div class="over-score" id="overScore">0<small>נקודות</small></div>
  <div id="overRec"></div>
  <div class="best" id="bestOver"></div>
  <button class="big" id="againBtn">עוד יום גיוס</button>
  <div class="links"><a href="/c/osnat" target="_top">אסנת בשלומיוורס ←</a></div>
</div>

<div class="screen" id="paused">
  <p class="over-h">הפסקה</p>
  <div class="over-line">״אני משתדלת לא לגעת...״ <span style="opacity:.6">*ביס*</span></div>
  <button class="big" id="resumeBtn">ממשיכים</button>
  <button class="mid" id="quitBtn">יציאה לתפריט</button>
  <button class="ibtn sndBtn" aria-label="צליל"></button>
</div>

<div id="tutDim"><div id="tutHole"></div></div>
<div id="tutCard">
  <div id="tutText"></div>
  <div id="tutBar"><i></i></div>
  <div id="tutRow">
    <span id="tutCount"></span>
    <button id="tutSkip">דלגו <span class="keyhint">(Esc)</span></button>
    <button id="tutNext">הבא <span class="keyhint">(רווח)</span></button>
  </div>
</div>
<script src="game.js?v=2"></script>
</body>
</html>
